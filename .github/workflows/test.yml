name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Content classification
        run: npm run verify:content-classification
      - name: Article images
        run: npm run verify:article-images
      - run: npm run test:homepage
      - run: npm run test:blog-landing
      - run: npm run test:asset-performance
      - run: npm run test:analytics
      - run: npm run test:inquiry
      - run: npm run test:insights
      - run: npm run test:blog
      - run: npm run test:seo-audit
      - run: npm run test:equipment
      - run: npm run test:components
      - run: npm run test:categories
      - run: npm run test:ui
      - run: npm run test:guides
      - run: npm run test:news
      - run: npm run test:brands
      - run: npm run test:lead
