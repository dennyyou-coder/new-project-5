<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SUPOR and Groupe SEB ownership structure</title><desc id="desc">The relationship between the SUPOR brand, Zhejiang Supor, SEB INTERNATIONALE and SEB S.A.</desc><rect width="1600" height="900" fill="#f7f5f2"/>
  <text x="100" y="125" font-family="Arial,sans-serif" font-size="50" font-weight="700" fill="#263747">SUPOR: four connected identity layers</text><text x="100" y="175" font-family="Arial,sans-serif" font-size="24" fill="#63717b">Corporate control does not identify every product-level responsible party</text>
  <g font-family="Arial,sans-serif"><rect x="180" y="255" width="1240" height="110" rx="24" fill="#7d1f2c"/><text x="800" y="302" text-anchor="middle" font-size="22" fill="#f7dce0">ULTIMATE PARENT</text><text x="800" y="342" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">SEB S.A. · listed head of Groupe SEB</text>
  <path d="M800 365V415" stroke="#b88d75" stroke-width="6"/><rect x="260" y="415" width="1080" height="105" rx="24" fill="#ac3a43"/><text x="800" y="457" text-anchor="middle" font-size="22" fill="#fde7e9">DIRECT PARENT</text><text x="800" y="496" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">SEB INTERNATIONALE S.A.S.</text>
  <path d="M800 520V570" stroke="#b88d75" stroke-width="6"/><rect x="340" y="570" width="920" height="105" rx="24" fill="#e8e2da" stroke="#bda78c" stroke-width="3"/><text x="800" y="612" text-anchor="middle" font-size="22" fill="#6e5540">LISTED OPERATING COMPANY</text><text x="800" y="651" text-anchor="middle" font-size="32" font-weight="700" fill="#263747">Zhejiang Supor Co., Ltd.</text>
  <path d="M800 675V725" stroke="#b88d75" stroke-width="6"/><rect x="500" y="725" width="600" height="95" rx="48" fill="#263747"/><text x="800" y="784" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">SUPOR consumer brand</text></g>
</svg>
