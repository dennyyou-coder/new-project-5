<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mac Tools ownership and franchise distribution map</title>
  <desc id="desc">Stanley Black and Decker owns Mac Tools, while independent franchisees operate mobile stores serving professional customers.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1119"/><stop offset="1" stop-color="#192532"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".22"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1400" cy="80" r="260" fill="#a9252d" opacity=".16"/>
  <text x="100" y="105" fill="#f8fafc" font-family="Arial, sans-serif" font-size="48" font-weight="700">Mac Tools: ownership is not distribution</text>
  <text x="100" y="155" fill="#aeb9c5" font-family="Arial, sans-serif" font-size="24">Four roles to keep separate in a product record</text>
  <g filter="url(#s)"><rect x="100" y="240" width="380" height="210" rx="28" fill="#253241" stroke="#46586a" stroke-width="2"/><text x="140" y="300" fill="#d7e0e8" font-family="Arial" font-size="22">CORPORATE OWNER</text><text x="140" y="360" fill="white" font-family="Arial" font-size="28" font-weight="700">Stanley Black &amp; Decker</text><text x="140" y="405" fill="#aeb9c5" font-family="Arial" font-size="21">Owns the Mac Tools brand</text></g>
  <path d="M480 345H610" stroke="#d6555c" stroke-width="8"/><path d="M600 328l30 17-30 17" fill="#d6555c"/>
  <g filter="url(#s)"><rect x="630" y="240" width="340" height="210" rx="28" fill="#a9252d"/><text x="670" y="300" fill="#ffdfe1" font-family="Arial" font-size="22">PROFESSIONAL BRAND</text><text x="670" y="360" fill="white" font-family="Arial" font-size="42" font-weight="700">Mac Tools</text><text x="670" y="405" fill="#ffe7e8" font-family="Arial" font-size="21">Tools, storage and equipment</text></g>
  <path d="M970 345h130" stroke="#d6555c" stroke-width="8"/><path d="M1090 328l30 17-30 17" fill="#d6555c"/>
  <g filter="url(#s)"><rect x="1120" y="240" width="380" height="210" rx="28" fill="#253241" stroke="#46586a" stroke-width="2"/><text x="1160" y="300" fill="#d7e0e8" font-family="Arial" font-size="22">DISTRIBUTION</text><text x="1160" y="360" fill="white" font-family="Arial" font-size="34" font-weight="700">Independent franchisees</text><text x="1160" y="405" fill="#aeb9c5" font-family="Arial" font-size="21">Operate mobile stores and routes</text></g>
  <path d="M1310 450v105" stroke="#d6555c" stroke-width="8"/><path d="M1293 545l17 30 17-30" fill="#d6555c"/>
  <g filter="url(#s)"><rect x="1020" y="575" width="480" height="170" rx="28" fill="#f1f4f7"/><text x="1060" y="635" fill="#5d6670" font-family="Arial" font-size="22">CUSTOMER RELATIONSHIP</text><text x="1060" y="690" fill="#18222d" font-family="Arial" font-size="27" font-weight="700">Technicians and repair shops</text></g>
  <g><rect x="100" y="560" width="770" height="185" rx="28" fill="#111a24" stroke="#435364" stroke-width="2"/><text x="145" y="620" fill="#ffbdc1" font-family="Arial" font-size="24" font-weight="700">KEY BOUNDARY</text><text x="145" y="670" fill="white" font-family="Arial" font-size="28">A franchisee owns the local route business—</text><text x="145" y="710" fill="white" font-family="Arial" font-size="28">not the global Mac Tools brand.</text></g>
  <text x="100" y="835" fill="#8492a0" font-family="Arial" font-size="20">Source framework: Stanley Black &amp; Decker portfolio and Mac Tools franchise materials</text>
</svg>
