<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Midea acquisition of Teka Group</title><desc id="desc">Midea Group acquired Teka Group in April 2025, excluding Teka Rus LLC.</desc><rect width="1600" height="900" fill="#f5f7fb"/><text x="100" y="110" font-family="Arial" font-size="48" font-weight="700" fill="#102a43">Teka ownership after April 2025</text><text x="100" y="165" font-family="Arial" font-size="25" fill="#486581">The completed acquisition included Teka Group but excluded Teka Rus LLC</text><g font-family="Arial"><rect x="160" y="300" width="420" height="250" rx="26" fill="#163b65"/><text x="370" y="370" text-anchor="middle" font-size="24" fill="#cde2f2">CORPORATE OWNER</text><text x="370" y="440" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">Midea Group</text><text x="370" y="495" text-anchor="middle" font-size="22" fill="#cde2f2">Acquisition completed 30 Apr 2025</text><path d="M580 425H720" stroke="#7895ad" stroke-width="5"/><polygon points="720,425 692,408 692,442" fill="#7895ad"/><rect x="720" y="300" width="420" height="250" rx="26" fill="#2f6f9f"/><text x="930" y="370" text-anchor="middle" font-size="24" fill="#d9eaf7">ACQUIRED BUSINESS</text><text x="930" y="440" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">Teka Group</text><text x="930" y="495" text-anchor="middle" font-size="22" fill="#d9eaf7">Teka and other portfolio brands</text><rect x="1190" y="300" width="300" height="250" rx="26" fill="#fff3f2" stroke="#c94b45" stroke-width="4" stroke-dasharray="14 10"/><text x="1340" y="370" text-anchor="middle" font-size="24" fill="#9b2c2c">EXCLUDED</text><text x="1340" y="435" text-anchor="middle" font-size="34" font-weight="700" fill="#9b2c2c">Teka Rus LLC</text><text x="1340" y="488" text-anchor="middle" font-size="21" fill="#9b2c2c">Separate verification required</text><rect x="300" y="670" width="1000" height="100" rx="22" fill="#fff" stroke="#9fb3c8" stroke-width="3"/><text x="800" y="710" text-anchor="middle" font-size="24" font-weight="700" fill="#102a43">Ownership does not assign every Teka model to a Midea factory</text><text x="800" y="744" text-anchor="middle" font-size="21" fill="#486581">Factory, origin, seller and warranty remain model- and market-specific</text></g></svg>
