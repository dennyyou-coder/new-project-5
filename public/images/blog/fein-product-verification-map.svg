<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>FEIN product verification map</title><rect width="1600" height="900" fill="#19242c"/><g font-family="Arial,sans-serif"><text x="100" y="115" fill="white" font-size="54" font-weight="700">Verify the complete FEIN system</text><text x="100" y="168" fill="#bdcbd2" font-size="27">Model, interface and market all matter</text><g fill="white"><rect x="100" y="260" width="420" height="330" rx="36"/><rect x="590" y="260" width="420" height="330" rx="36"/><rect x="1080" y="260" width="420" height="330" rx="36"/></g><text x="145" y="335" fill="#ad6b2d" font-size="24" font-weight="700">MODEL EVIDENCE</text><text x="145" y="405" fill="#18242c" font-size="40" font-weight="700">Origin + manual</text><text x="145" y="465" fill="#5c6870" font-size="26">rating plate</text><text x="145" y="505" fill="#5c6870" font-size="26">conformity declaration</text><text x="635" y="335" fill="#376b80" font-size="24" font-weight="700">18V INTERFACE</text><text x="635" y="405" fill="#18242c" font-size="40" font-weight="700">AMPShare</text><text x="635" y="465" fill="#5c6870" font-size="26">documented tools only</text><text x="635" y="505" fill="#5c6870" font-size="26">battery + charger match</text><text x="1125" y="335" fill="#7d5925" font-size="24" font-weight="700">LOCAL TERMS</text><text x="1125" y="405" fill="#18242c" font-size="40" font-weight="700">Warranty</text><text x="1125" y="465" fill="#5c6870" font-size="26">registration deadline</text><text x="1125" y="505" fill="#5c6870" font-size="26">product exclusions</text><rect x="270" y="690" width="1060" height="95" rx="28" fill="#294452"/><text x="800" y="750" text-anchor="middle" fill="white" font-size="29" font-weight="700">Battery partnership does not equal Bosch ownership.</text></g></svg>
