<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Rowenta ownership and operating responsibility</title><desc id="desc">Rowenta is a Groupe SEB brand with model and market responsibilities distributed among operating entities.</desc><rect width="1600" height="900" fill="#f5f7fb"/><text x="100" y="110" font-family="Arial" font-size="48" font-weight="700" fill="#102a43">Rowenta: brand ownership and operating roles</text><text x="100" y="165" font-family="Arial" font-size="25" fill="#486581">Groupe ownership does not make every legal entity interchangeable</text><rect x="570" y="220" width="460" height="130" rx="25" fill="#163b65"/><text x="800" y="272" text-anchor="middle" font-family="Arial" font-size="24" fill="#cde2f2">Listed group head</text><text x="800" y="317" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#fff">SEB S.A. / Groupe SEB</text><path d="M800 350V455" stroke="#7895ad" stroke-width="5"/><rect x="570" y="455" width="460" height="130" rx="25" fill="#2f6f9f"/><text x="800" y="508" text-anchor="middle" font-family="Arial" font-size="23" fill="#d9eaf7">Consumer brand acquired in 1988</text><text x="800" y="553" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#fff">Rowenta</text><path d="M800 585V665M245 665H1355" stroke="#7895ad" stroke-width="4"/><g font-family="Arial" text-anchor="middle"><rect x="90" y="665" width="310" height="135" rx="22" fill="#fff" stroke="#517b9b" stroke-width="3"/><text x="245" y="718" font-size="26" font-weight="700" fill="#102a43">Product entity</text><text x="245" y="758" font-size="20" fill="#486581">Selected declarations</text><rect x="445" y="665" width="310" height="135" rx="22" fill="#fff" stroke="#517b9b" stroke-width="3"/><text x="600" y="718" font-size="26" font-weight="700" fill="#102a43">Factory / source</text><text x="600" y="758" font-size="20" fill="#486581">Model-specific evidence</text><rect x="800" y="665" width="310" height="135" rx="22" fill="#fff" stroke="#517b9b" stroke-width="3"/><text x="955" y="718" font-size="26" font-weight="700" fill="#102a43">Regional seller</text><text x="955" y="758" font-size="20" fill="#486581">Country-specific entity</text><rect x="1155" y="665" width="310" height="135" rx="22" fill="#fff" stroke="#517b9b" stroke-width="3"/><text x="1310" y="718" font-size="26" font-weight="700" fill="#102a43">Service network</text><text x="1310" y="758" font-size="20" fill="#486581">Local warranty terms</text></g></svg>
