<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Hamilton Beach sourcing verification</title><desc id="desc">The verification chain moves from model to contract factory, origin, importer, seller and warranty.</desc><rect width="1600" height="900" fill="#f5f7fb"/><text x="100" y="110" font-family="Arial" font-size="48" font-weight="700" fill="#102a43">From brand name to sourcing evidence</text><text x="100" y="165" font-family="Arial" font-size="25" fill="#486581">A global sourcing base requires exact-SKU checks</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#517b9b" stroke-width="3"><rect x="90" y="310" width="220" height="210" rx="24"/><rect x="330" y="310" width="220" height="210" rx="24"/><rect x="570" y="310" width="220" height="210" rx="24"/><rect x="810" y="310" width="220" height="210" rx="24"/><rect x="1050" y="310" width="220" height="210" rx="24"/><rect x="1290" y="310" width="220" height="210" rx="24"/></g><g fill="#2f6f9f" font-size="22" font-weight="700"><text x="200" y="365">MODEL</text><text x="440" y="365">FACTORY</text><text x="680" y="365">ORIGIN</text><text x="920" y="365">IMPORTER</text><text x="1160" y="365">SELLER</text><text x="1400" y="365">WARRANTY</text></g><g fill="#102a43" font-size="24" font-weight="700"><text x="200" y="425">Full code</text><text x="200" y="460">and suffix</text><text x="440" y="425">Current</text><text x="440" y="460">supplier</text><text x="680" y="425">Label and</text><text x="680" y="460">customs proof</text><text x="920" y="425">Responsible</text><text x="920" y="460">entity</text><text x="1160" y="425">Authorized</text><text x="1160" y="460">channel</text><text x="1400" y="425">Use, parts</text><text x="1400" y="460">and service</text></g><path d="M310 415H330M550 415H570M790 415H810M1030 415H1050M1270 415H1290" stroke="#7895ad" stroke-width="4"/></g><rect x="220" y="650" width="1160" height="105" rx="22" fill="#fff8e8" stroke="#c98b20" stroke-width="3"/><text x="800" y="695" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#7a4b00">US brand origin does not prove US production</text><text x="800" y="730" text-anchor="middle" font-family="Arial" font-size="21" fill="#7a4b00">Company disclosures discuss China imports and sourcing diversification</text></svg>
