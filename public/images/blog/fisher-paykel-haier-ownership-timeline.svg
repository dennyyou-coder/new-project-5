<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Fisher and Paykel ownership timeline from New Zealand company to Haier Smart Home portfolio brand</title>
  <desc id="desc">The company began in 1934, Haier acquired 20 percent in 2009, crossed 90 percent in 2012 and now holds Fisher and Paykel in the Haier Smart Home portfolio.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b1d"/><stop offset="1" stop-color="#25383a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="110" fill="#fffaf2" font-family="Arial, sans-serif" font-size="51" font-weight="700">Fisher &amp; Paykel ownership timeline</text>
  <text x="90" y="160" fill="#b9cfca" font-family="Arial, sans-serif" font-size="24">Ownership changed; the premium operating identity remained distinct</text>
  <line x1="175" y1="450" x2="1425" y2="450" stroke="#bd8b5b" stroke-width="8"/>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <circle cx="210" cy="450" r="22" fill="#e6b87b"/><rect x="95" y="250" width="330" height="150" rx="22" fill="#f7f1e8"/>
    <text x="135" y="308" fill="#243b3d" font-size="46" font-weight="800">1934</text><text x="135" y="350" fill="#243b3d" font-size="26" font-weight="700">New Zealand origin</text><text x="135" y="380" fill="#5b7272" font-size="17">Appliance company established</text>
    <circle cx="600" cy="450" r="22" fill="#e6b87b"/><rect x="435" y="505" width="360" height="165" rx="22" fill="#f7f1e8"/>
    <text x="475" y="565" fill="#243b3d" font-size="46" font-weight="800">2009</text><text x="475" y="607" fill="#243b3d" font-size="26" font-weight="700">Haier takes 20%</text><text x="475" y="640" fill="#5b7272" font-size="17">Strategic and supply-chain cooperation</text>
    <circle cx="990" cy="450" r="22" fill="#e6b87b"/><rect x="815" y="250" width="370" height="165" rx="22" fill="#f7f1e8"/>
    <text x="855" y="310" fill="#243b3d" font-size="46" font-weight="800">2012</text><text x="855" y="352" fill="#243b3d" font-size="26" font-weight="700">Control passes 90%</text><text x="855" y="385" fill="#5b7272" font-size="19">Compulsory acquisition follows</text>
    <circle cx="1380" cy="450" r="22" fill="#e6b87b"/><rect x="1195" y="505" width="310" height="165" rx="22" fill="#d9eee8"/>
    <text x="1235" y="565" fill="#243b3d" font-size="40" font-weight="800">TODAY</text><text x="1235" y="607" fill="#243b3d" font-size="25" font-weight="700">Haier Smart Home</text><text x="1235" y="640" fill="#5b7272" font-size="17">Distinct premium portfolio brand</text>
  </g>
  <rect x="275" y="755" width="1050" height="78" rx="18" fill="#3b5353"/>
  <text x="800" y="805" text-anchor="middle" fill="#f7f1e8" font-family="Arial, sans-serif" font-size="24" font-weight="700">Parent-company ownership does not replace the local seller, factory or warranty entity</text>
</svg>
