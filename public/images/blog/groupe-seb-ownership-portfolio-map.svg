<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Groupe SEB ownership and brand portfolio</title><desc id="desc">SEB S.A. is listed, influenced by founder-family shareholders and operates consumer, premium and professional brands including SUPOR.</desc>
  <rect width="1600" height="900" fill="#f5f7fb"/><text x="100" y="105" font-family="Arial" font-size="48" font-weight="700" fill="#102a43">Groupe SEB: ownership and portfolio</text><text x="100" y="158" font-family="Arial" font-size="24" fill="#486581">Corporate control, consumer brands and product responsibility are separate layers</text>
  <rect x="110" y="230" width="390" height="130" rx="24" fill="#e8eef5" stroke="#517b9b" stroke-width="3"/><text x="305" y="280" text-anchor="middle" font-family="Arial" font-size="23" fill="#486581">Long-term influence</text><text x="305" y="321" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#102a43">Founder-family concert</text>
  <path d="M500 295H600" stroke="#517b9b" stroke-width="5"/><rect x="600" y="215" width="400" height="160" rx="26" fill="#163b65"/><text x="800" y="274" text-anchor="middle" font-family="Arial" font-size="24" fill="#cde2f2">Listed group head</text><text x="800" y="326" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#fff">SEB S.A.</text>
  <rect x="1100" y="230" width="390" height="130" rx="24" fill="#e8eef5" stroke="#517b9b" stroke-width="3"/><text x="1295" y="280" text-anchor="middle" font-family="Arial" font-size="23" fill="#486581">Other ownership</text><text x="1295" y="321" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#102a43">Public shareholders</text><path d="M1100 295H1000" stroke="#517b9b" stroke-width="5"/>
  <text x="800" y="455" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#486581">SELECTED PORTFOLIO BRANDS</text><path d="M800 375V500M220 500H1380" stroke="#7895ad" stroke-width="4"/><g font-family="Arial" text-anchor="middle"><rect x="100" y="500" width="260" height="165" rx="22" fill="#fff" stroke="#2f6f9f" stroke-width="3"/><text x="230" y="563" font-size="31" font-weight="700" fill="#102a43">Tefal</text><text x="230" y="610" font-size="21" fill="#486581">Cooking &amp; appliances</text><rect x="385" y="500" width="260" height="165" rx="22" fill="#fff" stroke="#2f6f9f" stroke-width="3"/><text x="515" y="563" font-size="31" font-weight="700" fill="#102a43">Rowenta</text><text x="515" y="610" font-size="21" fill="#486581">Floorcare &amp; home care</text><rect x="670" y="500" width="260" height="165" rx="22" fill="#fff" stroke="#2f6f9f" stroke-width="3"/><text x="800" y="563" font-size="31" font-weight="700" fill="#102a43">WMF</text><text x="800" y="610" font-size="21" fill="#486581">Premium equipment</text><rect x="955" y="500" width="260" height="165" rx="22" fill="#fff" stroke="#2f6f9f" stroke-width="3"/><text x="1085" y="563" font-size="31" font-weight="700" fill="#102a43">Moulinex</text><text x="1085" y="610" font-size="21" fill="#486581">Food preparation</text><rect x="1240" y="500" width="260" height="165" rx="22" fill="#fff8e8" stroke="#c98b20" stroke-width="3"/><text x="1370" y="563" font-size="31" font-weight="700" fill="#7a4b00">SUPOR</text><text x="1370" y="604" font-size="20" fill="#7a4b00">Listed Chinese business</text><text x="1370" y="634" font-size="18" fill="#8d6a2f">Ultimately controlled by SEB</text></g>
  <rect x="100" y="750" width="1400" height="82" rx="18" fill="#dfeaf3"/><text x="800" y="802" text-anchor="middle" font-family="Arial" font-size="25" fill="#334e68">A portfolio relationship does not identify the factory, seller or warrantor for a specific SKU</text>
</svg>
