<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SUPOR product and supply verification workflow</title><desc id="desc">A supply-chain workflow separating product, manufacturer, factory, exporter, importer and warranty.</desc><rect width="1600" height="900" fill="#f7f5f2"/>
  <text x="100" y="125" font-family="Arial,sans-serif" font-size="50" font-weight="700" fill="#263747">From SUPOR brand to exact-SKU evidence</text><text x="100" y="175" font-family="Arial,sans-serif" font-size="24" fill="#66737c">Verify each responsibility instead of inferring it from group ownership</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><path d="M205 420H1395" stroke="#d3b6a5" stroke-width="8"/>
  <g><circle cx="205" cy="420" r="76" fill="#812431"/><circle cx="443" cy="420" r="76" fill="#92343e"/><circle cx="681" cy="420" r="76" fill="#a84b50"/><circle cx="919" cy="420" r="76" fill="#526979"/><circle cx="1157" cy="420" r="76" fill="#405a6b"/><circle cx="1395" cy="420" r="76" fill="#263f52"/></g>
  <g fill="#fff" font-size="32" font-weight="700"><text x="205" y="431">SKU</text><text x="443" y="431">Maker</text><text x="681" y="431">Site</text><text x="919" y="431">Export</text><text x="1157" y="431">Import</text><text x="1395" y="431">Service</text></g>
  <g fill="#263747" font-size="23" font-weight="700"><text x="205" y="545">Model and</text><text x="205" y="575">market</text><text x="443" y="545">Legal</text><text x="443" y="575">manufacturer</text><text x="681" y="545">Factory and</text><text x="681" y="575">origin</text><text x="919" y="545">Exporter and</text><text x="919" y="575">documents</text><text x="1157" y="545">Importer and</text><text x="1157" y="575">compliance</text><text x="1395" y="545">Warranty and</text><text x="1395" y="575">parts</text></g></g>
  <rect x="175" y="690" width="1250" height="90" rx="28" fill="#fff" stroke="#dbcabe" stroke-width="3"/><text x="800" y="729" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263747">A group factory list is not a current model-to-factory allocation</text><text x="800" y="761" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#66737c">Retain the declaration, product label, audit, shipping evidence and written warranty</text>
</svg>
