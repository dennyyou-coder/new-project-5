<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">STIHL family ownership and governance map</title><desc id="desc">Four Stihl family shareholders own the private holding company. Family-represented boards oversee strategy while a non-family management board runs daily operations.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172018"/><stop offset="1" stop-color="#202225"/></linearGradient><linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f38a22"/><stop offset="1" stop-color="#bf4d0e"/></linearGradient><filter id="s"><feDropShadow dy="12" stdDeviation="14" flood-opacity=".3"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="100" y="92" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700">STIHL: FAMILY OWNERSHIP, PROFESSIONAL MANAGEMENT</text><text x="100" y="138" fill="#cbd2c9" font-family="Arial, sans-serif" font-size="23">Ownership, oversight and day-to-day management are distinct roles.</text>
  <g filter="url(#s)"><rect x="100" y="185" width="1400" height="145" rx="24" fill="#f3f2ec"/><text x="145" y="230" fill="#a9440d" font-family="Arial, sans-serif" font-size="22" font-weight="700">FOUR FAMILY SHAREHOLDERS</text><text x="145" y="273" fill="#1b271e" font-family="Arial, sans-serif" font-size="27" font-weight="700">Hans Peter Stihl • Gerhild Schetter • Dr. Rüdiger Stihl • Eva Mayr-Stihl</text><text x="145" y="307" fill="#516056" font-family="Arial, sans-serif" font-size="20">Private family ownership • not stock-exchange listed</text></g>
  <path d="M800 330v45" stroke="#7f8d82" stroke-width="5"/>
  <g filter="url(#s)"><rect x="100" y="375" width="1400" height="112" rx="24" fill="url(#orange)"/><text x="145" y="420" fill="#fff4e9" font-family="Arial, sans-serif" font-size="22" font-weight="700">OWNERSHIP VEHICLE</text><text x="145" y="461" fill="#fff" font-family="Arial, sans-serif" font-size="32" font-weight="700">STIHL Holding AG &amp; Co. KG</text></g>
  <path d="M440 487v58M1160 487v58" stroke="#7f8d82" stroke-width="5"/>
  <g filter="url(#s)"><rect x="100" y="545" width="680" height="155" rx="24" fill="#263028" stroke="#6c7c6f" stroke-width="2"/><text x="145" y="592" fill="#f49a45" font-family="Arial, sans-serif" font-size="22" font-weight="700">STRATEGIC OVERSIGHT</text><text x="145" y="637" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Advisory + Supervisory Boards</text><text x="145" y="673" fill="#cbd4cc" font-family="Arial, sans-serif" font-size="20">Family representation • long-term direction</text><rect x="820" y="545" width="680" height="155" rx="24" fill="#263028" stroke="#6c7c6f" stroke-width="2"/><text x="865" y="592" fill="#f49a45" font-family="Arial, sans-serif" font-size="22" font-weight="700">DAILY OPERATIONS</text><text x="865" y="637" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Non-family Board of Management</text><text x="865" y="673" fill="#cbd4cc" font-family="Arial, sans-serif" font-size="20">Professional management since 2002</text></g>
  <path d="M800 700v46" stroke="#7f8d82" stroke-width="5"/>
  <g filter="url(#s)"><rect x="100" y="746" width="1400" height="106" rx="24" fill="#1e442d" stroke="#45845b" stroke-width="2"/><text x="145" y="791" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Operating companies • 8-country production network • 50,000+ dealers</text><text x="145" y="828" fill="#d7e8dc" font-family="Arial, sans-serif" font-size="21">Dealers sell and service STIHL products; they do not own the group.</text></g>
</svg>
