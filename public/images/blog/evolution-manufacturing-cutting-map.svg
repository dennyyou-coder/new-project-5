<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Evolution manufacturing evidence and multi-material cutting limits</title>
  <desc id="desc">Company responsibility, physical factory, saw model, blade and material limits must each be verified separately.</desc>
  <rect width="1600" height="900" fill="#f3eee8"/>
  <text x="100" y="105" fill="#252525" font-family="Arial, sans-serif" font-size="52" font-weight="700">Two claims, two evidence chains</text>
  <text x="100" y="158" fill="#6c6863" font-family="Arial, sans-serif" font-size="27">Do not turn company identity into a factory claim—or marketing into unlimited capability</text>
  <g font-family="Arial, sans-serif">
    <rect x="100" y="235" width="670" height="500" rx="36" fill="#242628"/>
    <text x="155" y="305" fill="#f18a43" font-size="25" font-weight="700">WHERE IS IT MADE?</text>
    <text x="155" y="370" fill="#fff" font-size="34" font-weight="700">Model + revision</text><path d="M155 400h500" stroke="#595d60" stroke-width="3"/>
    <text x="155" y="455" fill="#fff" font-size="34" font-weight="700">Origin label</text><path d="M155 485h500" stroke="#595d60" stroke-width="3"/>
    <text x="155" y="540" fill="#fff" font-size="34" font-weight="700">Manual + declaration</text><path d="M155 570h500" stroke="#595d60" stroke-width="3"/>
    <text x="155" y="625" fill="#fff" font-size="34" font-weight="700">Responsible party</text>
    <text x="155" y="690" fill="#b8bcbe" font-size="23">Historical facility ≠ every current SKU</text>
    <rect x="830" y="235" width="670" height="500" rx="36" fill="#fff" stroke="#ddd2c6" stroke-width="4"/>
    <text x="885" y="305" fill="#c45e23" font-size="25" font-weight="700">WHAT CAN IT CUT?</text>
    <text x="885" y="370" fill="#252525" font-size="34" font-weight="700">Saw model</text><path d="M885 400h500" stroke="#ddd2c6" stroke-width="3"/>
    <text x="885" y="455" fill="#252525" font-size="34" font-weight="700">Blade part number</text><path d="M885 485h500" stroke="#ddd2c6" stroke-width="3"/>
    <text x="885" y="540" fill="#252525" font-size="34" font-weight="700">Material + section size</text><path d="M885 570h500" stroke="#ddd2c6" stroke-width="3"/>
    <text x="885" y="625" fill="#252525" font-size="34" font-weight="700">Manual limits + PPE</text>
    <text x="885" y="690" fill="#6c6863" font-size="23">Multi-material ≠ every material</text>
    <rect x="280" y="790" width="1040" height="65" rx="22" fill="#e3d4c6"/>
    <text x="800" y="832" text-anchor="middle" fill="#4b382d" font-size="26" font-weight="700">The exact SKU and its current documents control both answers.</text>
  </g>
</svg>
