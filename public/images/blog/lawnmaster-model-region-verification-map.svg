<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LawnMaster model and regional verification flow</title><desc id="desc">A six-step model-level workflow from exact model to warranty and support.</desc><rect width="1600" height="900" fill="#f3f8f6"/>
  <text x="100" y="125" font-family="Arial,sans-serif" font-size="50" font-weight="700" fill="#12374a">Verify a LawnMaster product by model and market</text><text x="100" y="175" font-family="Arial,sans-serif" font-size="24" fill="#4b6570">The brand name alone cannot answer factory, compatibility or service questions</text>
  <path d="M210 430H1390" stroke="#8cb8aa" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#123f54"><circle cx="210" cy="430" r="72"/><circle cx="446" cy="430" r="72"/><circle cx="682" cy="430" r="72"/><circle cx="918" cy="430" r="72"/><circle cx="1154" cy="430" r="72"/><circle cx="1390" cy="430" r="72"/></g>
  <g fill="#fff" font-size="34" font-weight="700"><text x="210" y="442">1</text><text x="446" y="442">2</text><text x="682" y="442">3</text><text x="918" y="442">4</text><text x="1154" y="442">5</text><text x="1390" y="442">6</text></g>
  <g fill="#163747" font-size="24" font-weight="700"><text x="210" y="550">Exact model</text><text x="446" y="550">Battery /</text><text x="446" y="580">navigation</text><text x="682" y="550">Manufacturer</text><text x="918" y="550">Factory and</text><text x="918" y="580">origin</text><text x="1154" y="550">Seller and</text><text x="1154" y="580">importer</text><text x="1390" y="550">Warranty and</text><text x="1390" y="580">parts</text></g></g>
  <rect x="160" y="690" width="1280" height="90" rx="28" fill="#fff" stroke="#c9dcd6" stroke-width="3"/><text x="800" y="728" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#12374a">Do not assume cross-region battery compatibility or universal warranty coverage</text><text x="800" y="760" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#4b6570">Use the product label, declaration, manual, invoice and written terms</text>
</svg>
