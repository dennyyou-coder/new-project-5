<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Snap-on manufacturing and model verification map</title><desc id="desc">Snap-on reports 15 U.S. and 21 non-U.S. manufacturing facilities, alongside qualified suppliers and multiple channels. Exact origin and warranty require model evidence.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#191f25"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9343d"/><stop offset="1" stop-color="#821722"/></linearGradient><filter id="s"><feDropShadow dy="12" stdDeviation="14" flood-opacity=".3"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="100" y="92" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700">SNAP-ON: FROM GROUP FOOTPRINT TO ONE SKU</text><text x="100" y="138" fill="#c4ced7" font-family="Arial, sans-serif" font-size="23">The global plant count is context—not proof of origin for a specific product.</text>
  <g filter="url(#s)"><rect x="100" y="190" width="680" height="160" rx="24" fill="url(#red)"/><text x="145" y="239" fill="#ffe9ea" font-family="Arial, sans-serif" font-size="22" font-weight="700">COMPANY MANUFACTURING</text><text x="145" y="289" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700">15 U.S. facilities</text><text x="145" y="325" fill="#ffe1e4" font-family="Arial, sans-serif" font-size="23">21 facilities outside the U.S.</text><rect x="820" y="190" width="680" height="160" rx="24" fill="#23303c" stroke="#566b7c" stroke-width="2"/><text x="865" y="239" fill="#f05a61" font-family="Arial, sans-serif" font-size="22" font-weight="700">OTHER QUALIFIED ROUTES</text><text x="865" y="289" fill="#fff" font-family="Arial, sans-serif" font-size="31" font-weight="700">Selected suppliers &amp; components</text><text x="865" y="325" fill="#cbd4dc" font-family="Arial, sans-serif" font-size="22">Product-specific; not one universal factory</text></g>
  <path d="M440 350v58M1160 350v58" stroke="#738494" stroke-width="5"/><path d="M440 408h720" stroke="#738494" stroke-width="5"/><path d="M800 408v48" stroke="#738494" stroke-width="5"/>
  <g filter="url(#s)"><rect x="100" y="456" width="1400" height="118" rx="24" fill="#eef2f5"/><text x="145" y="503" fill="#8a1b26" font-family="Arial, sans-serif" font-size="22" font-weight="700">SALES AND SUPPORT CHANNELS</text><text x="145" y="546" fill="#182430" font-family="Arial, sans-serif" font-size="29" font-weight="700">Franchise vans • direct sales • distributors • regional service entities</text></g>
  <path d="M800 574v52" stroke="#738494" stroke-width="5"/>
  <g filter="url(#s)"><rect x="100" y="626" width="1400" height="180" rx="24" fill="#21161a" stroke="#7c3039" stroke-width="2"/><text x="145" y="674" fill="#f05a61" font-family="Arial, sans-serif" font-size="22" font-weight="700">VERIFY THE EXACT SKU</text><text x="145" y="721" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Origin label • stock number • manual • responsible entity</text><text x="145" y="765" fill="#f1dfe1" font-family="Arial, sans-serif" font-size="24">Battery + charger • authorized seller • warranty code • destination market</text></g>
  <text x="100" y="855" fill="#aebbc6" font-family="Arial, sans-serif" font-size="21">Group-level fact: 36 facilities total. Model-level answer: read the product evidence.</text>
</svg>
