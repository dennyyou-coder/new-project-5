<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Einhell public listing and voting control</title><desc id="desc">Einhell Germany AG is publicly listed while Thannhuber AG holds more than 75 percent of voting rights. Ordinary and preference shares have different governance roles.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151b22"/><stop offset="1" stop-color="#211414"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e43b36"/><stop offset="1" stop-color="#971d1a"/></linearGradient><filter id="s"><feDropShadow dy="12" stdDeviation="14" flood-opacity=".3"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="100" y="92" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700">EINHELL: PUBLICLY LISTED, CONTROLLED VOTING</text><text x="100" y="138" fill="#c9d0d8" font-family="Arial, sans-serif" font-size="23">A stock-market listing and concentrated shareholder control can coexist.</text>
  <g filter="url(#s)"><rect x="100" y="190" width="680" height="174" rx="24" fill="url(#red)"/><text x="145" y="239" fill="#ffe9e7" font-family="Arial, sans-serif" font-size="22" font-weight="700">CONTROLLING VOTE</text><text x="145" y="289" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Thannhuber AG</text><text x="145" y="329" fill="#ffe2e0" font-family="Arial, sans-serif" font-size="27" font-weight="700">More than 75% of voting rights</text><rect x="820" y="190" width="680" height="174" rx="24" fill="#eef1f3"/><text x="865" y="239" fill="#a0211d" font-family="Arial, sans-serif" font-size="22" font-weight="700">PUBLIC MARKET</text><text x="865" y="289" fill="#18232e" font-family="Arial, sans-serif" font-size="31" font-weight="700">Outside shareholders</text><text x="865" y="329" fill="#52616e" font-family="Arial, sans-serif" font-size="23">Listed economic participation</text></g>
  <path d="M440 364v58M1160 364v58" stroke="#788794" stroke-width="5"/><path d="M440 422h720" stroke="#788794" stroke-width="5"/><path d="M800 422v48" stroke="#788794" stroke-width="5"/>
  <g filter="url(#s)"><rect x="100" y="470" width="1400" height="120" rx="24" fill="#25303a" stroke="#617180" stroke-width="2"/><text x="145" y="518" fill="#ef5953" font-family="Arial, sans-serif" font-size="22" font-weight="700">LISTED PARENT COMPANY</text><text x="145" y="561" fill="#fff" font-family="Arial, sans-serif" font-size="32" font-weight="700">Einhell Germany AG • Landau an der Isar, Germany</text></g>
  <path d="M440 590v52M1160 590v52" stroke="#788794" stroke-width="5"/>
  <g filter="url(#s)"><rect x="100" y="642" width="680" height="145" rx="24" fill="#eef1f3"/><text x="145" y="691" fill="#a0211d" font-family="Arial, sans-serif" font-size="22" font-weight="700">ORDINARY SHARES</text><text x="145" y="736" fill="#18232e" font-family="Arial, sans-serif" font-size="27" font-weight="700">Voting control layer</text><rect x="820" y="642" width="680" height="145" rx="24" fill="#eef1f3"/><text x="865" y="691" fill="#a0211d" font-family="Arial, sans-serif" font-size="22" font-weight="700">PREFERENCE SHARES</text><text x="865" y="736" fill="#18232e" font-family="Arial, sans-serif" font-size="27" font-weight="700">Publicly traded economic interest</text></g>
  <text x="100" y="842" fill="#cbd3da" font-family="Arial, sans-serif" font-size="23">Accurate description: public company + controlling Thannhuber voting position.</text>
</svg>
