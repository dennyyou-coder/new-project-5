<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Toro Company ownership and brand portfolio</title><desc id="desc">Public shareholders own The Toro Company, which operates Toro and several distinct specialist brands through varied channels.</desc>
  <rect width="1600" height="900" fill="#180b0c"/><text x="90" y="120" fill="#fff" font-family="Arial,sans-serif" font-size="58" font-weight="700">THE TORO COMPANY — PUBLIC PARENT</text><text x="90" y="180" fill="#e5bfc1" font-family="Arial,sans-serif" font-size="31">Ownership, product identity and distribution are separate layers</text>
  <g font-family="Arial,sans-serif">
    <rect x="110" y="280" width="390" height="330" rx="30" fill="#3a1418" stroke="#ef6b72" stroke-width="4"/><text x="150" y="365" fill="#ff949a" font-size="34" font-weight="700">OWNERSHIP</text><text x="150" y="450" fill="#fff" font-size="49" font-weight="700">NYSE: TTC</text><text x="150" y="515" fill="#f3d7d9" font-size="31">Public shareholders</text><text x="150" y="560" fill="#f3d7d9" font-size="31">own the listed parent</text>
    <rect x="605" y="280" width="390" height="330" rx="30" fill="#42171b" stroke="#ef6b72" stroke-width="4"/><text x="645" y="365" fill="#ff949a" font-size="31" font-weight="700">BRAND PORTFOLIO</text><text x="645" y="435" fill="#fff" font-size="33" font-weight="700">TORO · EXMARK</text><text x="645" y="490" fill="#fff" font-size="33" font-weight="700">DITCH WITCH · BOSS</text><text x="645" y="545" fill="#fff" font-size="33" font-weight="700">VENTRAC · LAWN-BOY</text>
    <rect x="1100" y="280" width="390" height="330" rx="30" fill="#3a1418" stroke="#ef6b72" stroke-width="4"/><text x="1140" y="365" fill="#ff949a" font-size="30" font-weight="700">MARKET CHANNELS</text><text x="1140" y="445" fill="#fff" font-size="32" font-weight="700">Dealers · Distributors</text><text x="1140" y="500" fill="#fff" font-size="32" font-weight="700">Retailers · Online</text><text x="1140" y="565" fill="#f3d7d9" font-size="24">Channel partners do not own Toro</text>
    <text x="525" y="480" fill="#ef6b72" font-size="72">→</text><text x="1020" y="480" fill="#ef6b72" font-size="72">→</text>
    <rect x="180" y="710" width="1240" height="95" rx="24" fill="#270f12"/><text x="265" y="772" fill="#fff" font-size="38" font-weight="700">Shared ownership does not merge parts or warranties.</text>
  </g>
</svg>
