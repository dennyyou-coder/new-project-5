<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Einhell Power X-Change and manufacturing map</title><desc id="desc">Power X-Change spans more than 350 products and generated 54 percent of 2025 group revenue. Most products are made in China while Hungary produced more than 500000 batteries.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#131a21"/><stop offset="1" stop-color="#241313"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e43b36"/><stop offset="1" stop-color="#951c19"/></linearGradient><filter id="s"><feDropShadow dy="12" stdDeviation="14" flood-opacity=".3"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="100" y="92" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700">EINHELL: POWER X-CHANGE + SUPPLY NETWORK</text><text x="100" y="138" fill="#c9d0d8" font-family="Arial, sans-serif" font-size="23">One battery platform connects categories; it does not identify one universal factory.</text>
  <g filter="url(#s)"><rect x="100" y="190" width="1400" height="140" rx="24" fill="url(#red)"/><text x="145" y="238" fill="#ffe9e7" font-family="Arial, sans-serif" font-size="22" font-weight="700">POWER X-CHANGE • 18V PLATFORM</text><text x="145" y="286" fill="#fff" font-family="Arial, sans-serif" font-size="32" font-weight="700">350+ products • 54% of 2025 group revenue • Twin-Pack for higher demand</text></g>
  <path d="M315 330v52M800 330v52M1285 330v52" stroke="#788794" stroke-width="5"/>
  <g filter="url(#s)"><rect x="100" y="382" width="430" height="145" rx="24" fill="#eef1f3"/><text x="140" y="431" fill="#a0211d" font-family="Arial, sans-serif" font-size="22" font-weight="700">WORKSHOP</text><text x="140" y="476" fill="#18232e" font-family="Arial, sans-serif" font-size="26" font-weight="700">Tools • equipment</text><rect x="585" y="382" width="430" height="145" rx="24" fill="#eef1f3"/><text x="625" y="431" fill="#a0211d" font-family="Arial, sans-serif" font-size="22" font-weight="700">GARDEN + HOME</text><text x="625" y="476" fill="#18232e" font-family="Arial, sans-serif" font-size="26" font-weight="700">Mowers • pumps • leisure</text><rect x="1070" y="382" width="430" height="145" rx="24" fill="#eef1f3"/><text x="1110" y="431" fill="#a0211d" font-family="Arial, sans-serif" font-size="22" font-weight="700">CLEANING</text><text x="1110" y="476" fill="#18232e" font-family="Arial, sans-serif" font-size="26" font-weight="700">Vacuums • floor care</text></g>
  <path d="M440 527v55M1160 527v55" stroke="#788794" stroke-width="5"/>
  <g filter="url(#s)"><rect x="100" y="582" width="680" height="163" rx="24" fill="#26313a" stroke="#647481" stroke-width="2"/><text x="145" y="631" fill="#ee5b55" font-family="Arial, sans-serif" font-size="22" font-weight="700">TOOL PRODUCTION</text><text x="145" y="679" fill="#fff" font-family="Arial, sans-serif" font-size="29" font-weight="700">Most of range: China</text><text x="145" y="716" fill="#cbd4db" font-family="Arial, sans-serif" font-size="21">Second-source diversification underway</text><rect x="820" y="582" width="680" height="163" rx="24" fill="#26313a" stroke="#647481" stroke-width="2"/><text x="865" y="631" fill="#ee5b55" font-family="Arial, sans-serif" font-size="22" font-weight="700">BATTERY PRODUCTION</text><text x="865" y="679" fill="#fff" font-family="Arial, sans-serif" font-size="29" font-weight="700">Hungary: 500,000+ in 2025</text><text x="865" y="716" fill="#cbd4db" font-family="Arial, sans-serif" font-size="21">Not proof for every battery pack</text></g>
  <g filter="url(#s)"><rect x="100" y="789" width="1400" height="72" rx="20" fill="#451817"/><text x="145" y="835" fill="#fff" font-family="Arial, sans-serif" font-size="23">Verify SKU • origin label • battery label • responsible entity • warranty market</text></g>
</svg>
