<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chervon ownership and brand portfolio</title><desc id="desc">Chervon Holdings is publicly listed, Pan Longquan is the dated controlling shareholder, and EGO, FLEX and SKIL are distinct group brands.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08151b"/><stop offset="1" stop-color="#17303a"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/>
  <text x="100" y="105" fill="white" font-family="Arial" font-size="48" font-weight="700">Chervon: public parent, controlling shareholder, distinct brands</text><text x="100" y="150" fill="#a8bec7" font-family="Arial" font-size="23">Ownership disclosure dated March 20, 2026</text>
  <rect x="100" y="230" width="420" height="210" rx="30" fill="#183947" stroke="#2a5c6e" stroke-width="2"/><text x="145" y="290" fill="#a8d8e8" font-family="Arial" font-size="21">CONTROLLING SHAREHOLDER</text><text x="145" y="350" fill="white" font-family="Arial" font-size="38" font-weight="700">Pan Longquan</text><text x="145" y="395" fill="#c2d7df" font-family="Arial" font-size="23">50.92% voting shares*</text>
  <path d="M520 335h160" stroke="#58b9d1" stroke-width="8"/><path d="M660 318l30 17-30 17" fill="#58b9d1"/>
  <rect x="690" y="210" width="500" height="250" rx="32" fill="#f1f6f7"/><text x="740" y="280" fill="#5c6f77" font-family="Arial" font-size="22">LISTED PARENT</text><text x="740" y="345" fill="#12242c" font-family="Arial" font-size="34" font-weight="700">Chervon Holdings Limited</text><text x="740" y="400" fill="#52656d" font-family="Arial" font-size="24">HKEX 2285 · public shareholders</text>
  <path d="M940 460v95" stroke="#58b9d1" stroke-width="8"/><path d="M923 535l17 30 17-30" fill="#58b9d1"/>
  <text x="100" y="590" fill="#b9ccd3" font-family="Arial" font-size="22">DISTINCT GROUP BRANDS</text>
  <g font-family="Arial"><rect x="100" y="625" width="300" height="145" rx="25" fill="#255b4c"/><text x="250" y="715" text-anchor="middle" fill="white" font-size="38" font-weight="700">EGO</text><rect x="440" y="625" width="300" height="145" rx="25" fill="#65463a"/><text x="590" y="715" text-anchor="middle" fill="white" font-size="38" font-weight="700">FLEX</text><rect x="780" y="625" width="300" height="145" rx="25" fill="#315581"/><text x="930" y="715" text-anchor="middle" fill="white" font-size="38" font-weight="700">SKIL</text><rect x="1120" y="625" width="380" height="145" rx="25" fill="#263b47"/><text x="1310" y="695" text-anchor="middle" fill="white" font-size="32" font-weight="700">Other group brands</text><text x="1310" y="735" text-anchor="middle" fill="#bed0d7" font-size="21">Portfolio changes over time</text></g>
