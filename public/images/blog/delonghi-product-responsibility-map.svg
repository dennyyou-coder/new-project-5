<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How to verify a De’Longhi Group appliance</title><desc id="desc">A three-step map for checking brand, model responsibility, and market-specific service.</desc>
  <rect width="1600" height="900" fill="#f7f9fc"/><text x="100" y="115" font-family="Arial" font-size="48" font-weight="700" fill="#102a43">Who is responsible for a specific appliance?</text><text x="100" y="170" font-family="Arial" font-size="25" fill="#486581">Do not infer warranty or manufacturing from the group name alone</text>
  <g font-family="Arial"><rect x="100" y="260" width="400" height="390" rx="28" fill="#163b65"/><text x="145" y="325" font-size="23" fill="#a9c8df">STEP 1</text><text x="145" y="378" font-size="34" font-weight="700" fill="#fff">Identify the brand</text><text x="145" y="435" font-size="24" fill="#d9eaf7">Read the rating plate,</text><text x="145" y="471" font-size="24" fill="#d9eaf7">model number and market.</text><text x="145" y="545" font-size="22" fill="#a9c8df">Brand ownership ≠ exact</text><text x="145" y="579" font-size="22" fill="#a9c8df">factory or seller identity.</text>
  <rect x="600" y="260" width="400" height="390" rx="28" fill="#2f6f9f"/><text x="645" y="325" font-size="23" fill="#d9eaf7">STEP 2</text><text x="645" y="378" font-size="34" font-weight="700" fill="#fff">Check the local entity</text><text x="645" y="435" font-size="24" fill="#eaf4fb">Use the official country site,</text><text x="645" y="471" font-size="24" fill="#eaf4fb">manual and warranty terms.</text><text x="645" y="545" font-size="22" fill="#d9eaf7">Licensing and distribution</text><text x="645" y="579" font-size="22" fill="#d9eaf7">can vary by market.</text>
  <rect x="1100" y="260" width="400" height="390" rx="28" fill="#dfeaf3"/><text x="1145" y="325" font-size="23" fill="#486581">STEP 3</text><text x="1145" y="378" font-size="34" font-weight="700" fill="#102a43">Verify service scope</text><text x="1145" y="435" font-size="24" fill="#334e68">Confirm seller, importer,</text><text x="1145" y="471" font-size="24" fill="#334e68">parts and support channel.</text><text x="1145" y="545" font-size="22" fill="#486581">The answer follows the</text><text x="1145" y="579" font-size="22" fill="#486581">model and purchase market.</text></g>
  <path d="M500 455H585M1000 455H1085" stroke="#7895ad" stroke-width="6"/><text x="800" y="760" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#102a43">Brand → Model → Market → Service terms</text>
</svg>
