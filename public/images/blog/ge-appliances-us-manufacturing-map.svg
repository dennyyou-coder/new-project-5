<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GE Appliances United States manufacturing network and model-level origin check</title>
  <desc id="desc">GE Appliances reports nine manufacturing plants across five states, while origin remains specific to each model.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8fb"/><stop offset="1" stop-color="#dceaf3"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".14"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="92" y="105" fill="#102c46" font-family="Arial, sans-serif" font-size="50" font-weight="700">U.S. manufacturing is substantial—not universal</text>
  <text x="92" y="155" fill="#557087" font-family="Arial, sans-serif" font-size="24">Nine plants across five states, with product assignments that must be checked by model</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="95" y="235" width="430" height="470" rx="26" fill="#0d3150"/>
    <text x="145" y="300" fill="#87d9ef" font-size="19" font-weight="700">COMPANY-REPORTED FOOTPRINT</text>
    <text x="145" y="405" fill="#ffffff" font-size="108" font-weight="800">9</text>
    <text x="280" y="385" fill="#ffffff" font-size="31" font-weight="700">manufacturing</text>
    <text x="280" y="423" fill="#ffffff" font-size="31" font-weight="700">plants</text>
    <text x="145" y="505" fill="#ffffff" font-size="108" font-weight="800">5</text>
    <text x="280" y="505" fill="#ffffff" font-size="38" font-weight="700">U.S. states</text>
    <line x1="145" y1="555" x2="470" y2="555" stroke="#47718d" stroke-width="2"/>
    <text x="145" y="610" fill="#d5e6f1" font-size="20">Nearly 16,000 U.S. team members</text>
    <text x="145" y="650" fill="#d5e6f1" font-size="19">More than $2B invested since 2016</text>
    <rect x="585" y="235" width="920" height="470" rx="26" fill="#ffffff"/>
    <text x="640" y="300" fill="#102c46" font-size="26" font-weight="700">VERIFIED OPERATING EXAMPLES</text>
    <g fill="#e8f4f8" stroke="#9bc6d8" stroke-width="2">
      <rect x="640" y="345" width="365" height="120" rx="18"/><rect x="1080" y="345" width="365" height="120" rx="18"/>
      <rect x="640" y="505" width="365" height="120" rx="18"/><rect x="1080" y="505" width="365" height="120" rx="18"/>
    </g>
    <text x="680" y="393" fill="#173b56" font-size="30" font-weight="700">Louisville, Kentucky</text><text x="680" y="430" fill="#557087" font-size="22">Headquarters and Appliance Park</text>
    <text x="1120" y="393" fill="#173b56" font-size="30" font-weight="700">LaFayette, Georgia</text><text x="1120" y="430" fill="#557087" font-size="22">Roper cooking operation</text>
    <text x="680" y="553" fill="#173b56" font-size="30" font-weight="700">Camden, South Carolina</text><text x="680" y="590" fill="#557087" font-size="22">Water-heater production</text>
    <text x="1120" y="553" fill="#173b56" font-size="30" font-weight="700">Selmer, Tennessee</text><text x="1120" y="590" fill="#557087" font-size="22">Selected refrigeration and PTAC</text>
  </g>
  <rect x="275" y="755" width="1050" height="78" rx="18" fill="#ffe9d1"/>
  <text x="800" y="805" text-anchor="middle" fill="#6c3a12" font-family="Arial, sans-serif" font-size="28" font-weight="700">A U.S. factory list does not prove the origin of every GE Appliances SKU</text>
</svg>
