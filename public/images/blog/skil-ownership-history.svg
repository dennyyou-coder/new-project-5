<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SKIL ownership history and current manufacturing boundaries</title>
  <desc id="desc">A timeline from the 1924 saw business to Bosch ownership in 1996 and Chervon ownership in 2017, with separate current manufacturing, battery-platform and model-responsibility layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190d0d"/><stop offset="0.5" stop-color="#361313"/><stop offset="1" stop-color="#0e151b"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e43b32"/><stop offset="1" stop-color="#941d1a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.38"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#f06b62"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.09" stroke="#ffaaa4"><path d="M0 140H1600M0 310H1600M0 480H1600M0 650H1600M0 820H1600"/><path d="M160 0V900M400 0V900M640 0V900M880 0V900M1120 0V900M1360 0V900"/></g>
  <text x="800" y="76" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">SKIL Ownership: History and Current Responsibility</text>
  <text x="800" y="118" text-anchor="middle" fill="#e8bdb9" font-family="Arial, Helvetica, sans-serif" font-size="23">A former owner, current parent and individual product documents answer different questions</text>
  <path d="M265 280H1330" stroke="#f06b62" stroke-width="6" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="105" y="175" width="360" height="220" rx="24" fill="#24191a" stroke="#b6504a" stroke-width="2"/>
    <circle cx="285" cy="280" r="15" fill="#f06b62"/>
    <text x="285" y="224" text-anchor="middle" fill="#ffb4ad" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">1924</text>
    <text x="285" y="326" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">SAW BUSINESS BEGINS</text>
    <text x="285" y="362" text-anchor="middle" fill="#dcc5c2" font-family="Arial, Helvetica, sans-serif" font-size="20">Michel and Sullivan era</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="175" width="360" height="220" rx="24" fill="#24191a" stroke="#b6504a" stroke-width="2"/>
    <circle cx="800" cy="280" r="15" fill="#f06b62"/>
    <text x="800" y="224" text-anchor="middle" fill="#ffb4ad" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">1996</text>
    <text x="800" y="326" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">BOSCH OWNERSHIP</text>
    <text x="800" y="362" text-anchor="middle" fill="#dcc5c2" font-family="Arial, Helvetica, sans-serif" font-size="20">Former parent company</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1135" y="175" width="360" height="220" rx="24" fill="url(#red)" stroke="#ff9f97" stroke-width="2"/>
    <circle cx="1315" cy="280" r="15" fill="#fff"/>
    <text x="1315" y="224" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">2017</text>
    <text x="1315" y="326" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">CHERVON</text>
    <text x="1315" y="362" text-anchor="middle" fill="#ffe6e3" font-family="Arial, Helvetica, sans-serif" font-size="20">Current owner and operator</text>
  </g>
  <path d="M1315 395V455H800V492" fill="none" stroke="#f06b62" stroke-width="6" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="145" y="525" width="410" height="190" rx="22" fill="#17232c" stroke="#8f4b48" stroke-width="2"/>
    <text x="350" y="580" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">MANUFACTURING GROUP</text>
    <text x="350" y="625" text-anchor="middle" fill="#d1dce4" font-family="Arial, Helvetica, sans-serif" font-size="21">Nanjing, China · Ho Chi Minh, Vietnam</text>
    <text x="350" y="670" text-anchor="middle" fill="#f48b83" font-family="Arial, Helvetica, sans-serif" font-size="19">No universal model-to-factory claim</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="595" y="525" width="410" height="190" rx="22" fill="#17232c" stroke="#8f4b48" stroke-width="2"/>
    <text x="800" y="580" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">PWRCORE PLATFORMS</text>
    <text x="800" y="625" text-anchor="middle" fill="#d1dce4" font-family="Arial, Helvetica, sans-serif" font-size="22">12V · 20V · 40V</text>
    <text x="800" y="670" text-anchor="middle" fill="#f48b83" font-family="Arial, Helvetica, sans-serif" font-size="19">Not Bosch, EGO or FLEX compatibility</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1045" y="525" width="410" height="190" rx="22" fill="#17232c" stroke="#8f4b48" stroke-width="2"/>
    <text x="1250" y="580" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">MODEL RESPONSIBILITY</text>
    <text x="1250" y="625" text-anchor="middle" fill="#d1dce4" font-family="Arial, Helvetica, sans-serif" font-size="21">Origin · importer · warranty · recall</text>
    <text x="1250" y="670" text-anchor="middle" fill="#f48b83" font-family="Arial, Helvetica, sans-serif" font-size="19">Verify the exact SKU and date code</text>
  </g>
  <path d="M350 505H1250M350 505V525M800 505V525M1250 505V525" fill="none" stroke="#8f4b48" stroke-width="3"/>
  <text x="800" y="816" text-anchor="middle" fill="#ddb7b3" font-family="Arial, Helvetica, sans-serif" font-size="23">SKIL and SKILSAW share history and Chervon ownership, but remain distinct current brand propositions.</text>
  <text x="800" y="854" text-anchor="middle" fill="#9fb0bc" font-family="Arial, Helvetica, sans-serif" font-size="19">Brand ownership does not replace the label, manual, compliance file or market-specific warranty.</text>
</svg>
