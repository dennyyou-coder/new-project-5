<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dremel ownership, rotary-tool ecosystem and cleaning adjacency</title>
  <desc id="desc">Bosch Group and Bosch Power Tools ownership are separated from the U.S. operator, international manufacturing, rotary accessories, cordless products and Dremel Versa cleaning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a172b"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#168ed1"/><stop offset="1" stop-color="#15509c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="280" fill="#168ed1" opacity=".08"/>
  <text x="100" y="92" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">DREMEL: OWNERSHIP, TOOL AND APPLICATION LAYERS</text>
  <text x="100" y="138" fill="#bdcbd9" font-family="Arial, Helvetica, sans-serif" font-size="23">The Bosch relationship does not replace model, accessory, origin or warranty checks.</text>
  <g filter="url(#shadow)">
    <rect x="100" y="190" width="1400" height="120" rx="24" fill="url(#blue)"/>
    <text x="145" y="238" fill="#e8f6ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">ULTIMATE OWNERSHIP</text>
    <text x="145" y="282" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700">Bosch Group • Bosch Power Tools • acquired in 1993</text>
  </g>
  <path d="M800 310v48" stroke="#6f8ca6" stroke-width="5"/>
  <g filter="url(#shadow)">
    <rect x="100" y="358" width="680" height="168" rx="24" fill="#142a43" stroke="#315e84" stroke-width="2"/>
    <text x="145" y="408" fill="#4eb5ed" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">U.S. OPERATING ROUTE</text>
    <text x="145" y="452" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Robert Bosch Tool Corporation</text>
    <text x="145" y="492" fill="#c6d5e1" font-family="Arial, Helvetica, sans-serif" font-size="20">Website • market support • warranty scope</text>
    <rect x="820" y="358" width="680" height="168" rx="24" fill="#142a43" stroke="#315e84" stroke-width="2"/>
    <text x="865" y="408" fill="#4eb5ed" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">PRODUCT AND SUPPLY</text>
    <text x="865" y="452" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">International manufacturing</text>
    <text x="865" y="492" fill="#c6d5e1" font-family="Arial, Helvetica, sans-serif" font-size="20">Tool • accessory • charger • model origin</text>
  </g>
  <path d="M440 526v55M1160 526v55" stroke="#6f8ca6" stroke-width="5"/>
  <g filter="url(#shadow)">
    <rect x="100" y="581" width="430" height="145" rx="24" fill="#eff5f8"/>
    <text x="140" y="629" fill="#175b92" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">ROTARY SYSTEM</text>
    <text x="140" y="671" fill="#142a43" font-family="Arial, Helvetica, sans-serif" font-size="22">Tool • collet • shank • speed</text>
    <rect x="585" y="581" width="430" height="145" rx="24" fill="#eff5f8"/>
    <text x="625" y="629" fill="#175b92" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">CORDLESS SYSTEM</text>
    <text x="625" y="671" fill="#142a43" font-family="Arial, Helvetica, sans-serif" font-size="22">Battery • charger • generation</text>
    <rect x="1070" y="581" width="430" height="145" rx="24" fill="#eff5f8"/>
    <text x="1110" y="629" fill="#175b92" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">CLEANING ADJACENCY</text>
    <text x="1110" y="671" fill="#142a43" font-family="Arial, Helvetica, sans-serif" font-size="22">Versa • pad • surface • hygiene</text>
  </g>
  <path d="M800 726v35" stroke="#6f8ca6" stroke-width="5"/>
  <g filter="url(#shadow)">
    <rect x="100" y="761" width="1400" height="92" rx="24" fill="#0e3152" stroke="#2677ad" stroke-width="2"/>
    <text x="145" y="816" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="23">Verify model • origin • accessory speed • battery • material hazard • seller • local warranty</text>
  </g>
</svg>
