<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LawnMaster ownership and regional operating structure</title><desc id="desc">Cleva group relationship to the LawnMaster brand, reviewed United States trademark evidence and regional operators.</desc>
  <rect width="1600" height="900" fill="#f4f8f7"/><rect x="80" y="65" width="1440" height="770" rx="36" fill="#fff" stroke="#d5e2df" stroke-width="3"/>
  <text x="140" y="145" font-family="Arial,sans-serif" font-size="50" font-weight="700" fill="#102d3e">LawnMaster: ownership is not one legal entity</text>
  <text x="140" y="192" font-family="Arial,sans-serif" font-size="24" fill="#496270">Brand, trademark evidence and market operators must be separated</text>
  <rect x="560" y="245" width="480" height="130" rx="24" fill="#123a50"/><text x="800" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#bfe8dc">CLEVA GROUP CONTEXT</text><text x="800" y="342" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">LawnMaster brand</text>
  <path d="M800 375V455M800 455H340V515M800 455H800V515M800 455H1260V515" fill="none" stroke="#65a493" stroke-width="6"/>
  <rect x="140" y="515" width="400" height="180" rx="22" fill="#e8f4f0" stroke="#89b9ac" stroke-width="3"/><text x="340" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#143c4f">TRADEMARK EVIDENCE</text><text x="340" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#143c4f">Suzhou Cleva</text><text x="340" y="651" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#496270">Reviewed US LAWNMASTER record</text>
  <rect x="600" y="515" width="400" height="180" rx="22" fill="#eef3fb" stroke="#9cb2d2" stroke-width="3"/><text x="800" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#143c4f">NORTH AMERICA</text><text x="800" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#143c4f">Cleva North America</text><text x="800" y="651" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#496270">Sales, support and regional terms</text>
  <rect x="1060" y="515" width="400" height="180" rx="22" fill="#fff5e8" stroke="#d7b37c" stroke-width="3"/><text x="1260" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#143c4f">UK AND EUROPE</text><text x="1260" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#143c4f">Cleva Europe</text><text x="1260" y="651" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#496270">Market-specific range and service</text>
  <rect x="270" y="745" width="1060" height="52" rx="26" fill="#f0f4f5"/><text x="800" y="779" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#314d5a">Verify the exact contract, seller, importer, manufacturer and warranty entity</text>
</svg>
