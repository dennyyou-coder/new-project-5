<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Matco manufacturing verification</title><rect width="1600" height="900" fill="#20252a"/><g font-family="Arial,sans-serif"><text x="100" y="115" fill="white" font-size="54" font-weight="700">Do not assign one origin to the whole catalogue</text><text x="100" y="168" fill="#c8cdd1" font-size="27">Manufacturing and warranty evidence is model-specific</text><rect x="100" y="260" width="650" height="350" rx="40" fill="white"/><text x="155" y="335" fill="#a12934" font-size="24" font-weight="700">DOCUMENTED IN-HOUSE PRODUCTION</text><text x="155" y="410" fill="#1d262c" font-size="45" font-weight="700">Tool storage</text><text x="155" y="470" fill="#5f696f" font-size="27">Jamestown, New York</text><text x="155" y="515" fill="#5f696f" font-size="27">Matco facility + robotic welding</text><rect x="850" y="260" width="650" height="350" rx="40" fill="#e6eaec"/><text x="905" y="335" fill="#485d68" font-size="24" font-weight="700">BROADER CATALOGUE</text><text x="905" y="410" fill="#1d262c" font-size="45" font-weight="700">Product-specific</text><text x="905" y="470" fill="#5f696f" font-size="27">manual + origin label</text><text x="905" y="515" fill="#5f696f" font-size="27">supplier + warranty document</text><rect x="250" y="700" width="1100" height="90" rx="28" fill="#4d2227"/><text x="800" y="757" text-anchor="middle" fill="white" font-size="29" font-weight="700">Jamestown evidence does not cover every Matco SKU.</text></g></svg>
