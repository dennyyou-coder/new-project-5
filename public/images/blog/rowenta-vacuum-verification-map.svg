<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Rowenta vacuum verification checklist</title><desc id="desc">A three-part evidence checklist for a Rowenta vacuum cleaner.</desc><rect width="1600" height="900" fill="#f7f9fc"/><text x="100" y="115" font-family="Arial" font-size="48" font-weight="700" fill="#102a43">Who made and supports this Rowenta vacuum?</text><text x="100" y="170" font-family="Arial" font-size="25" fill="#486581">Historical factory evidence cannot replace current model documents</text><g font-family="Arial"><rect x="100" y="260" width="400" height="390" rx="28" fill="#163b65"/><text x="145" y="325" font-size="23" fill="#a9c8df">MODEL</text><text x="145" y="380" font-size="34" font-weight="700" fill="#fff">Identify the SKU</text><text x="145" y="435" font-size="24" fill="#d9eaf7">Full reference, suffix,</text><text x="145" y="472" font-size="24" fill="#d9eaf7">battery and accessories</text><rect x="600" y="260" width="400" height="390" rx="28" fill="#2f6f9f"/><text x="645" y="325" font-size="23" fill="#d9eaf7">PRODUCTION</text><text x="645" y="380" font-size="34" font-weight="700" fill="#fff">Match documents</text><text x="645" y="435" font-size="24" fill="#eaf4fb">Declaration, factory,</text><text x="645" y="472" font-size="24" fill="#eaf4fb">origin and legal maker</text><rect x="1100" y="260" width="400" height="390" rx="28" fill="#dfeaf3"/><text x="1145" y="325" font-size="23" fill="#486581">MARKET</text><text x="1145" y="380" font-size="34" font-weight="700" fill="#102a43">Confirm support</text><text x="1145" y="435" font-size="24" fill="#334e68">Authorized seller, parts,</text><text x="1145" y="472" font-size="24" fill="#334e68">repair and warranty</text></g><path d="M500 455H585M1000 455H1085" stroke="#7895ad" stroke-width="6"/><text x="800" y="760" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#102a43">German brand origin ≠ current country of manufacture</text></svg>
