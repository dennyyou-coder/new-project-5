<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nilfisk product and service verification map</title><desc id="desc">Professional buyers verify model, factory, technology, dealer and lifecycle support as distinct responsibilities.</desc>
  <rect width="1600" height="900" fill="#091720"/><g font-family="Arial,sans-serif"><text x="90" y="116" fill="#fff" font-size="50" font-weight="700">PROFESSIONAL EQUIPMENT — FIVE RESPONSIBILITIES</text><text x="90" y="176" fill="#a9dbe9" font-size="30">Ownership alone does not define fleet uptime</text>
  <g font-size="27" font-weight="700"><rect x="90" y="295" width="250" height="225" rx="25" fill="#14323f" stroke="#58bed7" stroke-width="4"/><text x="128" y="372" fill="#7fd7e9">MODEL</text><text x="128" y="430" fill="#fff">Serial + spec</text><text x="128" y="475" fill="#fff">Certification</text><rect x="385" y="295" width="250" height="225" rx="25" fill="#14323f" stroke="#58bed7" stroke-width="4"/><text x="423" y="372" fill="#7fd7e9">FACTORY</text><text x="423" y="430" fill="#fff">Origin + parts</text><text x="423" y="475" fill="#fff">Components</text><rect x="680" y="295" width="250" height="225" rx="25" fill="#14323f" stroke="#58bed7" stroke-width="4"/><text x="718" y="372" fill="#7fd7e9">TECHNOLOGY</text><text x="718" y="430" fill="#fff">Autonomy</text><text x="718" y="475" fill="#fff">Software + data</text><rect x="975" y="295" width="250" height="225" rx="25" fill="#14323f" stroke="#58bed7" stroke-width="4"/><text x="1013" y="372" fill="#7fd7e9">CHANNEL</text><text x="1013" y="430" fill="#fff">Dealer</text><text x="1013" y="475" fill="#fff">Commissioning</text><rect x="1270" y="295" width="250" height="225" rx="25" fill="#14323f" stroke="#58bed7" stroke-width="4"/><text x="1308" y="372" fill="#7fd7e9">LIFECYCLE</text><text x="1308" y="430" fill="#fff">Parts + service</text><text x="1308" y="475" fill="#fff">Warranty</text></g>
  <g fill="#58bed7" font-size="54"><text x="344" y="430">→</text><text x="639" y="430">→</text><text x="934" y="430">→</text><text x="1229" y="430">→</text></g><rect x="210" y="650" width="1180" height="110" rx="25" fill="#0e2935"/><text x="290" y="721" fill="#fff" font-size="35" font-weight="700">For autonomous fleets, define hardware and software support separately.</text></g>
</svg>
