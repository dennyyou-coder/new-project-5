<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Hamilton Beach company structure</title><desc id="desc">Public shareholders own shares in Hamilton Beach Brands Holding Company, which controls Hamilton Beach Brands Incorporated and the consumer brand business.</desc><rect width="1600" height="900" fill="#f5f7fb"/><text x="100" y="110" font-family="Arial" font-size="48" font-weight="700" fill="#102a43">Hamilton Beach: three distinct layers</text><text x="100" y="165" font-family="Arial" font-size="25" fill="#486581">Share ownership, operating responsibility and the consumer brand are not the same</text><g font-family="Arial"><rect x="190" y="260" width="380" height="300" rx="26" fill="#163b65"/><text x="380" y="330" text-anchor="middle" font-size="23" fill="#cde2f2">LISTED PARENT</text><text x="380" y="390" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">Hamilton Beach Brands</text><text x="380" y="432" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">Holding Company</text><text x="380" y="495" text-anchor="middle" font-size="23" fill="#cde2f2">NYSE: HBB</text><path d="M570 410H700" stroke="#7895ad" stroke-width="5"/><polygon points="700,410 675,395 675,425" fill="#7895ad"/><rect x="700" y="260" width="380" height="300" rx="26" fill="#2f6f9f"/><text x="890" y="330" text-anchor="middle" font-size="23" fill="#d9eaf7">OPERATING SUBSIDIARY</text><text x="890" y="390" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">Hamilton Beach</text><text x="890" y="432" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">Brands, Inc.</text><text x="890" y="495" text-anchor="middle" font-size="22" fill="#d9eaf7">Designs, markets, distributes</text><path d="M1080 410H1210" stroke="#7895ad" stroke-width="5"/><polygon points="1210,410 1185,395 1185,425" fill="#7895ad"/><rect x="1210" y="260" width="280" height="300" rx="26" fill="#fff8e8" stroke="#c98b20" stroke-width="3"/><text x="1350" y="330" text-anchor="middle" font-size="23" fill="#7a4b00">CONSUMER BRAND</text><text x="1350" y="410" text-anchor="middle" font-size="34" font-weight="700" fill="#7a4b00">Hamilton</text><text x="1350" y="455" text-anchor="middle" font-size="34" font-weight="700" fill="#7a4b00">Beach</text><rect x="370" y="660" width="860" height="105" rx="22" fill="#fff" stroke="#9fb3c8" stroke-width="3"/><text x="800" y="705" text-anchor="middle" font-size="25" font-weight="700" fill="#102a43">A product can also involve a contract factory, importer, retailer and warrantor</text><text x="800" y="740" text-anchor="middle" font-size="21" fill="#486581">Check the exact model and market documents</text></g></svg>
