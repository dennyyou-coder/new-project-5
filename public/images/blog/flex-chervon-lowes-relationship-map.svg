<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FLEX ownership, manufacturing and Lowe's distribution map</title>
  <desc id="desc">A layered diagram separates Chervon ownership, the German FLEX company, Chervon manufacturing, Lowe's distribution, the 24V platform and model-level responsibility.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111c2d"/><stop offset="1" stop-color="#180909"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef3c35"/><stop offset="1" stop-color="#9e1414"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="280" fill="#ed3b35" opacity=".08"/>
  <text x="100" y="92" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">FLEX: OWNER, FACTORY AND RETAILER ARE NOT THE SAME</text>
  <text x="100" y="138" fill="#c6d0dc" font-family="Arial, Helvetica, sans-serif" font-size="23">The exact model connects these layers, but one layer cannot prove another.</text>
  <g filter="url(#shadow)">
    <rect x="100" y="190" width="1400" height="120" rx="24" fill="url(#red)"/>
    <text x="145" y="238" fill="#ffe9e7" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">CURRENT OWNER</text>
    <text x="145" y="281" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700">Chervon • acquired FLEX in 2013</text>
  </g>
  <path d="M800 310v46" stroke="#7890a5" stroke-width="5"/>
  <g filter="url(#shadow)">
    <rect x="100" y="356" width="440" height="180" rx="24" fill="#172b40" stroke="#526d85" stroke-width="2"/>
    <text x="140" y="406" fill="#ff6860" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">GERMAN OPERATIONS</text>
    <text x="140" y="451" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">FLEX-Elektrowerkzeuge</text>
    <text x="140" y="495" fill="#c6d4df" font-family="Arial, Helvetica, sans-serif" font-size="20">Steinheim • engineering • production</text>
    <rect x="580" y="356" width="440" height="180" rx="24" fill="#172b40" stroke="#526d85" stroke-width="2"/>
    <text x="620" y="406" fill="#ff6860" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">GROUP MANUFACTURING</text>
    <text x="620" y="451" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">China • Vietnam</text>
    <text x="620" y="495" fill="#c6d4df" font-family="Arial, Helvetica, sans-serif" font-size="20">Exact allocation requires SKU evidence</text>
    <rect x="1060" y="356" width="440" height="180" rx="24" fill="#172b40" stroke="#526d85" stroke-width="2"/>
    <text x="1100" y="406" fill="#ff6860" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">U.S. DISTRIBUTION</text>
    <text x="1100" y="451" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Lowe's and channels</text>
    <text x="1100" y="495" fill="#c6d4df" font-family="Arial, Helvetica, sans-serif" font-size="20">Retail relationship, not ownership</text>
  </g>
  <path d="M320 536v58M800 536v58M1280 536v58" stroke="#7890a5" stroke-width="5"/>
  <g filter="url(#shadow)">
    <rect x="100" y="594" width="1400" height="115" rx="24" fill="#f4f5f7"/>
    <text x="145" y="639" fill="#af1c1c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">NORTH AMERICAN PRODUCT SYSTEM</text>
    <text x="145" y="680" fill="#172b40" font-family="Arial, Helvetica, sans-serif" font-size="24">FLEX 24V tool + approved battery + charger + authorized seller + Chervon North America warranty</text>
  </g>
  <path d="M800 709v47" stroke="#7890a5" stroke-width="5"/>
  <g filter="url(#shadow)">
    <rect x="100" y="756" width="1400" height="96" rx="24" fill="#3b1111" stroke="#b52a27" stroke-width="2"/>
    <text x="145" y="813" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="23">Verify model • origin • importer • 24V vs 18V • retailer authorization • warranty registration</text>
  </g>
</svg>
