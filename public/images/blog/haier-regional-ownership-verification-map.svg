<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Haier portfolio regional ownership and responsibility map</title>
  <desc id="desc">GE Appliances uses a licensed trademark, Fisher and Paykel retains a distinct operation, and Hoover ownership is split between Candy in Europe and TTI in the Americas.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061729"/><stop offset="1" stop-color="#073c59"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#000" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#43cffb"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="100" y="100" fill="#f3fbff" font-family="Arial, sans-serif" font-size="48" font-weight="700">One portfolio, different responsibility routes</text>
  <text x="100" y="145" fill="#a7d9eb" font-family="Arial, sans-serif" font-size="24">Ownership, trademark rights, factory and warranty must be checked separately</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="530" y="195" width="540" height="110" rx="24" fill="#075173" stroke="#43cffb" stroke-width="3"/><text x="800" y="242" text-anchor="middle" fill="#fff" font-size="32" font-weight="700">Haier Smart Home portfolio</text><text x="800" y="278" text-anchor="middle" fill="#c4f0ff" font-size="21">Company ownership layer</text>
    <path d="M650 305L340 390" stroke="#43cffb" stroke-width="3" marker-end="url(#arrow)"/><path d="M800 305V390" stroke="#43cffb" stroke-width="3" marker-end="url(#arrow)"/><path d="M950 305L1260 390" stroke="#43cffb" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="115" y="405" width="450" height="190" rx="23" fill="#0a344c" stroke="#258daf" stroke-width="2"/><text x="340" y="453" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">GE Appliances</text><text x="155" y="496" fill="#b9e8f7" font-size="20">• Haier-owned U.S. company</text><text x="155" y="531" fill="#b9e8f7" font-size="20">• GE trademark used under license</text><text x="155" y="566" fill="#b9e8f7" font-size="20">• U.S. plants and service route</text>
    <rect x="575" y="405" width="450" height="190" rx="23" fill="#0a344c" stroke="#258daf" stroke-width="2"/><text x="800" y="453" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">Fisher &amp; Paykel</text><text x="615" y="496" fill="#b9e8f7" font-size="20">• Haier-owned premium business</text><text x="615" y="531" fill="#b9e8f7" font-size="20">• Distinct brand and operations</text><text x="615" y="566" fill="#b9e8f7" font-size="20">• Multi-country production network</text>
    <rect x="1035" y="405" width="450" height="190" rx="23" fill="#0a344c" stroke="#258daf" stroke-width="2"/><text x="1260" y="453" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">Hoover regional split</text><text x="1075" y="496" fill="#b9e8f7" font-size="20">• Europe: Candy / Haier</text><text x="1075" y="531" fill="#b9e8f7" font-size="20">• Americas: TTI</text><text x="1075" y="566" fill="#b9e8f7" font-size="20">• Country decides the owner</text>
    <rect x="245" y="680" width="1110" height="100" rx="22" fill="#082b40" stroke="#258daf" stroke-width="2"/><text x="800" y="721" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">Product-level answer</text><text x="800" y="756" text-anchor="middle" fill="#98def4" font-size="20">Brand + country + model + factory + importer + local warranty provider</text>
  </g>
  <text x="100" y="840" fill="#83b8ca" font-family="Arial, sans-serif" font-size="20">A parent-company chart is the start of due diligence, not the end.</text>
</svg>
