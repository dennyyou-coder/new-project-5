<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Breville and Sage product verification flow</title><desc id="desc">A six-step flow for checking destination mark, model, electrical specification, factory and origin, regional seller and warranty.</desc><rect width="1600" height="900" fill="#f7f6f3"/><text x="100" y="105" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#273548">Verify before moving Breville or Sage across regions</text><text x="100" y="150" font-family="Arial,sans-serif" font-size="23" fill="#667287">A similar-looking appliance may have different legal and electrical specifications</text><g font-family="Arial,sans-serif"><g fill="white" stroke="#caa66f" stroke-width="3"><rect x="90" y="285" width="220" height="250" rx="24"/><rect x="330" y="285" width="220" height="250" rx="24"/><rect x="570" y="285" width="220" height="250" rx="24"/><rect x="810" y="285" width="220" height="250" rx="24"/><rect x="1050" y="285" width="220" height="250" rx="24"/><rect x="1290" y="285" width="220" height="250" rx="24"/></g><g fill="#b18448"><circle cx="200" cy="345" r="34"/><circle cx="440" cy="345" r="34"/><circle cx="680" cy="345" r="34"/><circle cx="920" cy="345" r="34"/><circle cx="1160" cy="345" r="34"/><circle cx="1400" cy="345" r="34"/></g><g fill="white" font-size="23" font-weight="700" text-anchor="middle"><text x="200" y="353">1</text><text x="440" y="353">2</text><text x="680" y="353">3</text><text x="920" y="353">4</text><text x="1160" y="353">5</text><text x="1400" y="353">6</text></g><g fill="#273548" font-size="21" font-weight="700" text-anchor="middle"><text x="200" y="420">Destination mark</text><text x="440" y="420">Exact model</text><text x="680" y="420">Voltage &amp; plug</text><text x="920" y="420">Factory &amp; origin</text><text x="1160" y="420">Seller &amp; importer</text><text x="1400" y="420">Warranty &amp; use</text></g><g fill="#667287" font-size="17" text-anchor="middle"><text x="200" y="465">Breville or Sage</text><text x="440" y="465">Regional suffix</text><text x="680" y="465">Local compliance</text><text x="920" y="465">Current evidence</text><text x="1160" y="465">Invoice chain</text><text x="1400" y="465">Domestic/commercial</text></g><rect x="250" y="650" width="1100" height="120" rx="22" fill="#efe5d5"/><text x="800" y="704" text-anchor="middle" font-size="24" font-weight="700" fill="#6f512d">Do not relabel or distribute across territories without written rights</text><text x="800" y="744" text-anchor="middle" font-size="20" fill="#6f512d">Trademark permission, certification and service obligations are separate checks</text></g></svg>
