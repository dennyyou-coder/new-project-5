<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chervon integrated manufacturing and product verification</title><desc id="desc">Chervon's value chain connects research, sourcing, manufacturing, testing and distribution, while exact model origin requires product evidence.</desc>
  <rect width="1600" height="900" fill="#0c1820"/><text x="100" y="105" fill="white" font-family="Arial" font-size="48" font-weight="700">Integrated group capability ≠ one origin for every model</text><text x="100" y="150" fill="#a8bbc4" font-family="Arial" font-size="23">Chervon's value chain and the product-level boundary</text>
  <g font-family="Arial"><rect x="100" y="245" width="240" height="140" rx="24" fill="#214c5b"/><text x="220" y="325" text-anchor="middle" fill="white" font-size="29" font-weight="700">R&amp;D</text><rect x="390" y="245" width="240" height="140" rx="24" fill="#214c5b"/><text x="510" y="325" text-anchor="middle" fill="white" font-size="29" font-weight="700">Sourcing</text><rect x="680" y="245" width="240" height="140" rx="24" fill="#327186"/><text x="800" y="325" text-anchor="middle" fill="white" font-size="29" font-weight="700">Manufacturing</text><rect x="970" y="245" width="240" height="140" rx="24" fill="#214c5b"/><text x="1090" y="325" text-anchor="middle" fill="white" font-size="29" font-weight="700">Testing</text><rect x="1260" y="245" width="240" height="140" rx="24" fill="#214c5b"/><text x="1380" y="325" text-anchor="middle" fill="white" font-size="29" font-weight="700">Distribution</text></g>
  <g stroke="#55b6cd" stroke-width="7"><path d="M340 315h50"/><path d="M630 315h50"/><path d="M920 315h50"/><path d="M1210 315h50"/></g>
  <text x="100" y="500" fill="white" font-family="Arial" font-size="30" font-weight="700">Documented production network</text><rect x="100" y="540" width="470" height="145" rx="25" fill="#182a34" stroke="#315462" stroke-width="2"/><text x="145" y="600" fill="#acd3df" font-family="Arial" font-size="21">CHINA</text><text x="145" y="650" fill="white" font-family="Arial" font-size="32" font-weight="700">Nanjing operations</text><rect x="610" y="540" width="470" height="145" rx="25" fill="#182a34" stroke="#315462" stroke-width="2"/><text x="655" y="600" fill="#acd3df" font-family="Arial" font-size="21">VIETNAM</text><text x="655" y="650" fill="white" font-family="Arial" font-size="32" font-weight="700">Ho Chi Minh City campuses</text>
  <rect x="1120" y="520" width="380" height="185" rx="27" fill="#e9f0f2"/><text x="1160" y="575" fill="#53666e" font-family="Arial" font-size="20">EXACT PRODUCT</text><text x="1160" y="625" fill="#14242b" font-family="Arial" font-size="29" font-weight="700">Label + declaration</text><text x="1160" y="665" fill="#14242b" font-family="Arial" font-size="29" font-weight="700">+ shipment evidence</text>
  <rect x="100" y="755" width="1400" height="70" rx="18" fill="#162730"/><text x="800" y="800" text-anchor="middle" fill="#d9e8ed" font-family="Arial" font-size="24" font-weight="700">Verify brand, model, revision, factory, origin, importer and warranty separately.</text>
</svg>
