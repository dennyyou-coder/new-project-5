<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hotpoint regional ownership split</title><desc id="desc">GE Appliances owns Hotpoint in the Americas while Beko Europe operates Hotpoint in the UK and Europe.</desc>
  <rect width="1600" height="900" fill="#081425"/><text x="90" y="120" fill="#fff" font-family="Arial,sans-serif" font-size="62" font-weight="700">ONE BRAND NAME — TWO REGIONAL PATHS</text><text x="90" y="180" fill="#b8cbe8" font-family="Arial,sans-serif" font-size="31">Start the Hotpoint ownership answer with the country of sale</text>
  <g font-family="Arial,sans-serif">
    <rect x="90" y="270" width="680" height="420" rx="34" fill="#112d55" stroke="#68a9ff" stroke-width="4"/><text x="140" y="350" fill="#8fc2ff" font-size="37" font-weight="700">THE AMERICAS</text><text x="140" y="445" fill="#fff" font-size="62" font-weight="700">GE APPLIANCES</text><text x="140" y="515" fill="#d9e7fb" font-size="34">Owns and sells Hotpoint</text><text x="140" y="565" fill="#d9e7fb" font-size="34">Haier-owned operating platform</text><text x="140" y="635" fill="#8fc2ff" font-size="30">USA · Canada · Central &amp; Latin America</text>
    <rect x="830" y="270" width="680" height="420" rx="34" fill="#4a2817" stroke="#ffad69" stroke-width="4"/><text x="880" y="350" fill="#ffc28f" font-size="37" font-weight="700">UK &amp; EUROPE</text><text x="880" y="445" fill="#fff" font-size="62" font-weight="700">BEKO EUROPE</text><text x="880" y="515" fill="#f8e1d0" font-size="34">Current regional operator</text><text x="880" y="565" fill="#f8e1d0" font-size="34">Beko B.V. owns 100%</text><text x="880" y="635" fill="#ffc28f" font-size="30">Regional rights and entities must be checked</text>
    <rect x="240" y="750" width="1120" height="92" rx="22" fill="#0d1c31"/><text x="330" y="810" fill="#fff" font-size="39" font-weight="700">One brand name does not create one global warranty.</text>
  </g>
</svg>
