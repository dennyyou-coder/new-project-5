<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Braun appliance responsibility by product category</title><desc id="desc">Braun Household appliances follow the De’Longhi license while grooming and oral care follow separate P and G categories.</desc><rect width="1600" height="900" fill="#f7f7f5"/><text x="100" y="115" font-family="Arial" font-size="48" font-weight="700" fill="#202322">Which Braun business are you looking at?</text><text x="100" y="168" font-family="Arial" font-size="24" fill="#5c6460">Start with the product category, then verify the model and market</text>
  <g font-family="Arial"><rect x="100" y="255" width="650" height="420" rx="28" fill="#242827"/><text x="150" y="330" font-size="25" fill="#cdd3d0">BRAUN HOUSEHOLD</text><text x="150" y="392" font-size="38" font-weight="700" fill="#fff">De’Longhi licensed scope</text><text x="150" y="462" font-size="25" fill="#e4e8e6">• Hand blenders and food preparation</text><text x="150" y="510" font-size="25" fill="#e4e8e6">• Kettles, coffee makers and toasters</text><text x="150" y="558" font-size="25" fill="#e4e8e6">• Irons and selected household products</text><text x="150" y="625" font-size="22" fill="#bfc6c2">Check the local Braun Household site.</text>
  <rect x="850" y="255" width="650" height="420" rx="28" fill="#fff" stroke="#8b918e" stroke-width="3"/><text x="900" y="330" font-size="25" fill="#5c6460">OTHER BRAUN CATEGORIES</text><text x="900" y="392" font-size="38" font-weight="700" fill="#202322">Separate P&amp;G businesses</text><text x="900" y="462" font-size="25" fill="#4d5551">• Electric shavers and grooming</text><text x="900" y="510" font-size="25" fill="#4d5551">• Personal-care devices</text><text x="900" y="558" font-size="25" fill="#4d5551">• Oral-B dental-care products</text><text x="900" y="625" font-size="22" fill="#6d7471">Do not use household support channels.</text></g>
  <rect x="270" y="750" width="1060" height="80" rx="18" fill="#eceeea"/><text x="800" y="801" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#333836">Product category → Model → Country site → Warranty entity</text>
</svg>
