<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Midea Group public company, Smart Home business and appliance brand portfolio</title>
  <desc id="desc">Midea Group is listed in Shenzhen and Hong Kong, with the Smart Home business containing several distinct appliance brands.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a24"/><stop offset="1" stop-color="#163d49"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".25"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L10,6 L0,12 Z" fill="#4fd2e0"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="92" y="105" fill="#ffffff" font-family="Arial, sans-serif" font-size="50" font-weight="700">Midea is a listed group—not a single factory</text>
  <text x="92" y="155" fill="#a9ced6" font-family="Arial, sans-serif" font-size="24">Group, business unit, brand, regional company and factory are different layers</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="110" y="245" width="420" height="170" rx="24" fill="#ffffff"/>
    <text x="155" y="305" fill="#143641" font-size="24" font-weight="700">PUBLIC COMPANY</text>
    <text x="155" y="355" fill="#143641" font-size="31" font-weight="800">Midea Group Co., Ltd.</text>
    <text x="155" y="392" fill="#577682" font-size="21">Shenzhen 000333 · Hong Kong 0300</text>
    <rect x="920" y="245" width="560" height="170" rx="24" fill="#dff6f7"/>
    <text x="970" y="305" fill="#143641" font-size="24" font-weight="700">CORE CONSUMER-APPLIANCE OPERATOR</text>
    <text x="970" y="360" fill="#143641" font-size="39" font-weight="800">Smart Home Business</text>
    <line x1="530" y1="330" x2="900" y2="330" stroke="#4fd2e0" stroke-width="7" marker-end="url(#arrow)"/>
    <text x="650" y="305" fill="#bfeaf0" font-size="22">contains</text>
    <rect x="110" y="525" width="1370" height="220" rx="26" fill="#ffffff"/>
    <text x="155" y="582" fill="#143641" font-size="25" font-weight="700">SELECTED APPLIANCE BRANDS AND IDENTITIES</text>
    <g fill="#e9f4f5" stroke="#9ecbd0" stroke-width="2">
      <rect x="155" y="625" width="140" height="68" rx="14"/><rect x="320" y="625" width="165" height="68" rx="14"/><rect x="510" y="625" width="140" height="68" rx="14"/><rect x="675" y="625" width="135" height="68" rx="14"/>
      <rect x="835" y="625" width="130" height="68" rx="14"/><rect x="990" y="625" width="135" height="68" rx="14"/><rect x="1150" y="625" width="120" height="68" rx="14"/><rect x="1295" y="625" width="135" height="68" rx="14"/>
    </g>
    <g fill="#1b4651" font-size="23" font-weight="700" text-anchor="middle">
      <text x="225" y="668">Midea</text><text x="402" y="668">Little Swan</text><text x="580" y="668">Toshiba</text><text x="742" y="668">COLMO</text>
      <text x="900" y="668">WAHIN</text><text x="1057" y="668">Comfee</text><text x="1210" y="668">Eureka</text><text x="1362" y="668">Teka</text>
    </g>
  </g>
  <text x="800" y="825" text-anchor="middle" fill="#b8d7dd" font-family="Arial, sans-serif" font-size="25">A group brand list does not prove one seller, warranty provider or manufacturing site</text>
</svg>
