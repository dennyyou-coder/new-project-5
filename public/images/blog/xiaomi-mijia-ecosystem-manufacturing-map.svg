<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Xiaomi and Mijia ecosystem manufacturing map</title><desc id="desc">Xiaomi brand and platform roles connect to different ecosystem, product and manufacturing relationships.</desc>
  <rect width="1600" height="900" fill="#18130d"/><g font-family="Arial,sans-serif"><text x="90" y="116" fill="#fff" font-size="56" font-weight="700">XIAOMI / MIJIA — AN ECOSYSTEM, NOT ONE FACTORY</text><text x="90" y="176" fill="#ffd098" font-size="30">Ownership, cooperation, software and manufacturing are separate roles</text>
  <circle cx="800" cy="435" r="155" fill="#4a2b12" stroke="#ff9a3d" stroke-width="6"/><text x="690" y="410" fill="#fff" font-size="39" font-weight="700">BRAND +</text><text x="660" y="465" fill="#fff" font-size="39" font-weight="700">SMART-HOME</text><text x="700" y="520" fill="#ffd098" font-size="29">PLATFORM</text>
  <g font-size="27"><rect x="95" y="260" width="390" height="180" rx="25" fill="#382411" stroke="#ff9a3d" stroke-width="4"/><text x="135" y="325" fill="#ffb56e" font-weight="700">EQUITY RELATIONSHIP</text><text x="135" y="378" fill="#fff">May be minority or indirect</text><rect x="1115" y="260" width="390" height="180" rx="25" fill="#382411" stroke="#ff9a3d" stroke-width="4"/><text x="1155" y="325" fill="#ffb56e" font-weight="700">PRODUCT COOPERATION</text><text x="1155" y="378" fill="#fff">Design · quality · channel</text><rect x="95" y="560" width="390" height="180" rx="25" fill="#382411" stroke="#ff9a3d" stroke-width="4"/><text x="135" y="625" fill="#ffb56e" font-weight="700">APP INTEGRATION</text><text x="135" y="678" fill="#fff">Does not prove ownership</text><rect x="1115" y="560" width="390" height="180" rx="25" fill="#382411" stroke="#ff9a3d" stroke-width="4"/><text x="1155" y="625" fill="#ffb56e" font-weight="700">MANUFACTURING</text><text x="1155" y="678" fill="#fff">Factory varies by model</text></g>
  <g stroke="#ff9a3d" stroke-width="6"><path d="M485 350L650 405"/><path d="M1115 350L950 405"/><path d="M485 650L650 510"/><path d="M1115 650L950 510"/></g></g>
</svg>
