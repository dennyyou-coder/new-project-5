<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GE Appliances ownership and brand relationship map</title>
  <desc id="desc">Haier Group connects to Haier Smart Home and Haier US Appliance Solutions doing business as GE Appliances, while the GE name is used under a long-term trademark license.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#12374a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#62d0dd"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="100" y="95" fill="#f5fbff" font-family="Arial, sans-serif" font-size="44" font-weight="700">GE Appliances: ownership is not the same as trademark ownership</text>
  <text x="100" y="145" fill="#a9c7d5" font-family="Arial, sans-serif" font-size="25">Corporate control, operating identity and brand rights sit at different levels.</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="100" y="220" width="390" height="145" rx="24" fill="#123f55" stroke="#62d0dd" stroke-width="2"/>
    <text x="135" y="275" fill="#91e4ec" font-size="22" font-weight="700">WIDER GROUP</text>
    <text x="135" y="325" fill="#fff" font-size="38" font-weight="700">Haier Group</text>

    <rect x="605" y="220" width="390" height="145" rx="24" fill="#123f55" stroke="#62d0dd" stroke-width="2"/>
    <text x="640" y="275" fill="#91e4ec" font-size="22" font-weight="700">LISTED APPLIANCE PLATFORM</text>
    <text x="640" y="325" fill="#fff" font-size="36" font-weight="700">Haier Smart Home</text>

    <rect x="1110" y="220" width="390" height="145" rx="24" fill="#e8f3f6"/>
    <text x="1145" y="270" fill="#315a6b" font-size="22" font-weight="700">U.S. OPERATING COMPANY</text>
    <text x="1145" y="312" fill="#092232" font-size="24" font-weight="700">Haier US Appliance Solutions</text>
    <text x="1145" y="344" fill="#315a6b" font-size="23">dba GE Appliances</text>
  </g>

  <path d="M490 292H590" stroke="#62d0dd" stroke-width="7" marker-end="url(#arrow)"/>
  <path d="M995 292H1095" stroke="#62d0dd" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="515" y="270" fill="#a9c7d5" font-family="Arial, sans-serif" font-size="19">controls</text>
  <text x="1012" y="270" fill="#a9c7d5" font-family="Arial, sans-serif" font-size="19">owns</text>

  <rect x="100" y="445" width="520" height="285" rx="26" fill="#f2f7f9" filter="url(#shadow)"/>
  <text x="140" y="500" fill="#092232" font-family="Arial, sans-serif" font-size="29" font-weight="700">Licensed identity</text>
  <rect x="140" y="545" width="160" height="80" rx="16" fill="#c74942"/>
  <text x="220" y="595" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">GE name</text>
  <path d="M320 585H365" stroke="#c74942" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="390" y="575" fill="#092232" font-family="Arial, sans-serif" font-size="21" font-weight="700">Long-term license</text>
  <text x="390" y="608" fill="#315a6b" font-family="Arial, sans-serif" font-size="17">announced with 2016 acquisition</text>
  <text x="140" y="680" fill="#496878" font-family="Arial, sans-serif" font-size="21">The appliance company is Haier-owned.</text>
  <text x="140" y="710" fill="#496878" font-family="Arial, sans-serif" font-size="21">The wider GE corporate identity is not.</text>

  <rect x="680" y="445" width="820" height="285" rx="26" fill="#f2f7f9" filter="url(#shadow)"/>
  <text x="720" y="500" fill="#092232" font-family="Arial, sans-serif" font-size="29" font-weight="700">GE Appliances U.S. brand portfolio</text>
  <g font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    <rect x="720" y="545" width="220" height="70" rx="16" fill="#d9e9ee"/><text x="830" y="589" fill="#173b4e">Monogram</text>
    <rect x="970" y="545" width="220" height="70" rx="16" fill="#d9e9ee"/><text x="1080" y="589" fill="#173b4e">Cafe</text>
    <rect x="1220" y="545" width="240" height="70" rx="16" fill="#d9e9ee"/><text x="1340" y="589" fill="#173b4e">GE Profile</text>
    <rect x="720" y="640" width="220" height="70" rx="16" fill="#d9e9ee"/><text x="830" y="684" fill="#173b4e">GE</text>
    <rect x="970" y="640" width="220" height="70" rx="16" fill="#d9e9ee"/><text x="1080" y="684" fill="#173b4e">Haier</text>
    <rect x="1220" y="640" width="240" height="70" rx="16" fill="#d9e9ee"/><text x="1340" y="684" fill="#173b4e">Hotpoint</text>
  </g>

  <rect x="100" y="790" width="1400" height="62" rx="18" fill="#0b2637" stroke="#315a6b"/>
  <text x="800" y="830" text-anchor="middle" fill="#d9edf3" font-family="Arial, sans-serif" font-size="23">For contracts, use the exact legal seller, brand, territory and product model—not the best-known parent name.</text>
</svg>
