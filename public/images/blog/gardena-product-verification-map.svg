<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GARDENA product verification map</title><desc id="desc">Checks for product system, battery compatibility, manufacturing origin and local service.</desc><rect width="1600" height="900" fill="#f7faf9"/><text x="100" y="115" font-family="Arial" font-size="48" font-weight="700" fill="#12372a">Before buying a GARDENA product</text><text x="100" y="168" font-family="Arial" font-size="24" fill="#456b5a">Four checks matter more than the group name</text>
  <g font-family="Arial"><rect x="90" y="260" width="330" height="410" rx="25" fill="#183f32"/><text x="130" y="325" font-size="23" fill="#bfe3d3">01 · PRODUCT SYSTEM</text><text x="130" y="385" font-size="32" font-weight="700" fill="#fff">Match the task</text><text x="130" y="445" font-size="23" fill="#d8f2e7">Watering, tools,</text><text x="130" y="480" font-size="23" fill="#d8f2e7">robotic mowing or</text><text x="130" y="515" font-size="23" fill="#d8f2e7">smart control?</text>
  <rect x="455" y="260" width="330" height="410" rx="25" fill="#2b8063"/><text x="495" y="325" font-size="23" fill="#d8f2e7">02 · BATTERY</text><text x="495" y="385" font-size="32" font-weight="700" fill="#fff">Verify the badge</text><text x="495" y="445" font-size="23" fill="#e7f7f0">POWER FOR ALL is</text><text x="495" y="480" font-size="23" fill="#e7f7f0">an alliance, not a</text><text x="495" y="515" font-size="23" fill="#e7f7f0">blanket guarantee.</text>
  <rect x="820" y="260" width="330" height="410" rx="25" fill="#dfeee8"/><text x="860" y="325" font-size="23" fill="#456b5a">03 · ORIGIN</text><text x="860" y="385" font-size="32" font-weight="700" fill="#12372a">Check the model</text><text x="860" y="445" font-size="23" fill="#365f4f">Group factories and</text><text x="860" y="480" font-size="23" fill="#365f4f">external suppliers</text><text x="860" y="515" font-size="23" fill="#365f4f">both play a role.</text>
  <rect x="1185" y="260" width="330" height="410" rx="25" fill="#fff" stroke="#5a927c" stroke-width="3"/><text x="1225" y="325" font-size="23" fill="#456b5a">04 · SUPPORT</text><text x="1225" y="385" font-size="32" font-weight="700" fill="#12372a">Use local terms</text><text x="1225" y="445" font-size="23" fill="#365f4f">Warranty, installation</text><text x="1225" y="480" font-size="23" fill="#365f4f">and app support vary</text><text x="1225" y="515" font-size="23" fill="#365f4f">by product and market.</text></g><text x="800" y="775" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#12372a">System → Compatibility → Model origin → Local support</text>
</svg>
