<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hisense ownership relationship with Gorenje and ASKO</title><desc id="desc">Hisense Group Holdings leads the wider group. Hisense Home Appliances is a listed appliance platform. Gorenje was acquired in 2018 and includes premium brand ASKO.</desc>
  <rect width="1600" height="900" fill="#f4f7fb"/><text x="110" y="100" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#10284d">Hisense appliance ownership map</text><text x="110" y="145" font-family="Arial,sans-serif" font-size="23" fill="#56708f">Group control does not identify every model's factory, seller or warranty provider</text>
  <rect x="470" y="205" width="660" height="125" rx="22" fill="#123b6d"/><text x="800" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="white">Hisense Group Holdings Co., Ltd.</text><text x="800" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#d9e9ff">Wider corporate group</text>
  <path d="M800 330V405M800 405H375M800 405H1225M375 405V465M1225 405V465" stroke="#2c6fc0" stroke-width="8" fill="none"/>
  <rect x="120" y="465" width="510" height="150" rx="22" fill="white" stroke="#77a4d8" stroke-width="3"/><text x="375" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#123b6d">Hisense Home Appliances Group</text><text x="375" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#52677f">Listed appliance platform</text><text x="375" y="592" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#52677f">Multiple subsidiaries and product categories</text>
  <rect x="970" y="465" width="510" height="150" rx="22" fill="white" stroke="#77a4d8" stroke-width="3"/><text x="1225" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#123b6d">Gorenje</text><text x="1225" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#52677f">Acquired by Hisense in 2018</text><text x="1225" y="592" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#52677f">European appliance operations</text>
  <path d="M1225 615V690" stroke="#2c6fc0" stroke-width="8"/><rect x="970" y="690" width="510" height="120" rx="22" fill="#e4eefb" stroke="#77a4d8" stroke-width="3"/><text x="1225" y="742" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#123b6d">ASKO</text><text x="1225" y="780" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#52677f">Premium kitchen and laundry brand</text>
  <rect x="120" y="685" width="510" height="125" rx="22" fill="#fff4df"/><text x="375" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#7b5200">Model-level check still required</text><text x="375" y="772" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#6a5a3b">Factory · origin · importer · warranty</text>
</svg>
