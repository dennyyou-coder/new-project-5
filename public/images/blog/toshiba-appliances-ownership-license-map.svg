<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Toshiba appliances ownership and brand license map</title><desc id="desc">Toshiba Corporation licenses its home-appliance trademark while Midea controls Toshiba Lifestyle, the operating appliance company.</desc>
  <rect width="1600" height="900" fill="#081527"/><g font-family="Arial,sans-serif"><text x="90" y="115" fill="#fff" font-size="58" font-weight="700">TOSHIBA APPLIANCES — TWO LEGAL LAYERS</text><text x="90" y="176" fill="#9fc8f5" font-size="30">Trademark ownership is not the same as operating-company control</text>
  <rect x="90" y="275" width="430" height="330" rx="28" fill="#102946" stroke="#5da9ff" stroke-width="4"/><text x="130" y="350" fill="#8ec5ff" font-size="31" font-weight="700">TRADEMARK OWNER</text><text x="130" y="430" fill="#fff" font-size="38" font-weight="700">Toshiba Corporation</text><text x="130" y="495" fill="#d8eaff" font-size="29">40-year worldwide license</text><text x="130" y="540" fill="#d8eaff" font-size="29">for home appliances</text>
  <rect x="585" y="275" width="430" height="330" rx="28" fill="#123255" stroke="#5da9ff" stroke-width="4"/><text x="625" y="350" fill="#8ec5ff" font-size="31" font-weight="700">CONTROLLING GROUP</text><text x="625" y="430" fill="#fff" font-size="48" font-weight="700">Midea Group</text><text x="625" y="495" fill="#d8eaff" font-size="29">Acquired 80.1% in 2016</text><text x="625" y="540" fill="#d8eaff" font-size="29">of the appliance company</text>
  <rect x="1080" y="275" width="430" height="330" rx="28" fill="#102946" stroke="#5da9ff" stroke-width="4"/><text x="1120" y="350" fill="#8ec5ff" font-size="31" font-weight="700">OPERATING COMPANY</text><text x="1120" y="425" fill="#fff" font-size="39" font-weight="700">Toshiba Lifestyle</text><text x="1120" y="480" fill="#fff" font-size="39" font-weight="700">Products &amp; Services</text><text x="1120" y="540" fill="#d8eaff" font-size="27">Develops · makes · sells</text>
  <path d="M520 438H575" stroke="#5da9ff" stroke-width="8"/><path d="M562 422l24 16-24 16" fill="#5da9ff"/><path d="M1015 438H1070" stroke="#5da9ff" stroke-width="8"/><path d="M1057 422l24 16-24 16" fill="#5da9ff"/>
  <rect x="175" y="700" width="1250" height="100" rx="24" fill="#0d223b"/><text x="260" y="766" fill="#fff" font-size="36" font-weight="700">This transaction did not sell Toshiba Corporation to Midea.</text></g>
</svg>
