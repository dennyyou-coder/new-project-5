<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AEG trademark owner and power-tool license</title><desc id="desc">AB Electrolux owns the AEG trademark and licenses the power-tool operation to Techtronic Industries.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11100f"/><stop offset="1" stop-color="#29231d"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/>
  <text x="100" y="105" fill="white" font-family="Arial" font-size="48" font-weight="700">AEG Power Tools: two layers of “ownership”</text><text x="100" y="150" fill="#c1b6a9" font-family="Arial" font-size="23">Trademark rights and operating control are not the same</text>
  <rect x="100" y="245" width="490" height="250" rx="32" fill="#f2eee8"/><text x="150" y="315" fill="#6b6259" font-family="Arial" font-size="22">TRADEMARK OWNER</text><text x="150" y="385" fill="#211d19" font-family="Arial" font-size="42" font-weight="700">AB Electrolux (publ)</text><text x="150" y="440" fill="#675f57" font-family="Arial" font-size="23">Owns the registered AEG mark</text>
  <path d="M590 370h390" stroke="#ef8734" stroke-width="10"/><path d="M950 350l35 20-35 20" fill="#ef8734"/><text x="785" y="335" text-anchor="middle" fill="#ffc18c" font-family="Arial" font-size="24" font-weight="700">LICENSE</text>
  <rect x="985" y="245" width="515" height="250" rx="32" fill="#b95216"/><text x="1035" y="315" fill="#ffe1cc" font-family="Arial" font-size="22">POWER-TOOL OPERATOR</text><text x="1035" y="385" fill="white" font-family="Arial" font-size="39" font-weight="700">Techtronic Industries</text><text x="1035" y="440" fill="#ffdfc7" font-family="Arial" font-size="23">Operates AEG tools and accessories</text>
  <path d="M1240 495v95" stroke="#ef8734" stroke-width="8"/><path d="M1223 570l17 30 17-30" fill="#ef8734"/>
  <rect x="985" y="600" width="515" height="155" rx="28" fill="#252321" stroke="#66574b" stroke-width="2"/><text x="1035" y="660" fill="#ffc18c" font-family="Arial" font-size="21">LICENSED CATEGORY</text><text x="1035" y="710" fill="white" font-family="Arial" font-size="34" font-weight="700">AEG Power Tools</text>
  <rect x="100" y="585" width="720" height="170" rx="28" fill="#1b1918" stroke="#53483f" stroke-width="2"/><text x="145" y="640" fill="#ffc18c" font-family="Arial" font-size="23" font-weight="700">IMPORTANT</text><text x="145" y="690" fill="white" font-family="Arial" font-size="28">AEG appliances and AEG power tools use the</text><text x="145" y="730" fill="white" font-family="Arial" font-size="28">same mark in different operating structures.</text>
  <text x="100" y="835" fill="#958b82" font-family="Arial" font-size="20">Current TTI and AEG pages state that the AEG trademark is used under license from AB Electrolux.</text>
</svg>
