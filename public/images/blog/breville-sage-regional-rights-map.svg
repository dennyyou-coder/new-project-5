<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Breville and Sage regional brand rights</title><desc id="desc">Breville Group Limited operates premium appliances under Breville in many markets and Sage in the UK and Europe.</desc><rect width="1600" height="900" fill="#f7f6f3"/><text x="100" y="105" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#273548">Breville and Sage: one group, regional marks</text><text x="100" y="150" font-family="Arial,sans-serif" font-size="23" fill="#667287">The name on the product follows trademark rights in the destination market</text><rect x="440" y="210" width="720" height="125" rx="24" fill="#273548"/><text x="800" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="white">Breville Group Limited</text><text x="800" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e7ebf0">ASX-listed global premium appliance group</text><path d="M800 335V430M800 430H400M800 430H1200M400 430V500M1200 430V500" stroke="#b18448" stroke-width="9" fill="none"/><rect x="120" y="500" width="560" height="210" rx="24" fill="white" stroke="#caa66f" stroke-width="3"/><text x="400" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#273548">Breville</text><text x="400" y="611" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#667287">North America and other rights markets</text><text x="400" y="653" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#7b6546">Regional seller and warranty entity apply</text><rect x="920" y="500" width="560" height="210" rx="24" fill="white" stroke="#caa66f" stroke-width="3"/><text x="1200" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#273548">Sage</text><text x="1200" y="611" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#667287">United Kingdom and Europe</text><text x="1200" y="653" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#7b6546">BRG does not own or operate Breville there</text><rect x="270" y="760" width="1060" height="75" rx="18" fill="#efe5d5"/><text x="800" y="807" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#6f512d">Aligned product families can still differ by model, voltage, accessories and warranty</text></svg>
