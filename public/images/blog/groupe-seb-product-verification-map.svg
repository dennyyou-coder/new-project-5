<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Groupe SEB product verification flow</title><desc id="desc">A four-stage model, factory, market and service evidence flow.</desc><rect width="1600" height="900" fill="#f7f9fc"/><text x="100" y="115" font-family="Arial" font-size="48" font-weight="700" fill="#102a43">Verify the product—not only the parent group</text><text x="100" y="170" font-family="Arial" font-size="25" fill="#486581">Groupe SEB combines internal production and external sourcing</text><g font-family="Arial"><rect x="90" y="270" width="330" height="360" rx="28" fill="#163b65"/><text x="130" y="330" font-size="22" fill="#a9c8df">01 · BRAND</text><text x="130" y="385" font-size="33" font-weight="700" fill="#fff">Exact reference</text><text x="130" y="440" font-size="23" fill="#d9eaf7">Brand, model suffix</text><text x="130" y="476" font-size="23" fill="#d9eaf7">and destination market</text><rect x="455" y="270" width="330" height="360" rx="28" fill="#2f6f9f"/><text x="495" y="330" font-size="22" fill="#d9eaf7">02 · PRODUCTION</text><text x="495" y="385" font-size="33" font-weight="700" fill="#fff">Factory evidence</text><text x="495" y="440" font-size="23" fill="#eaf4fb">Legal manufacturer,</text><text x="495" y="476" font-size="23" fill="#eaf4fb">site and origin</text><rect x="820" y="270" width="330" height="360" rx="28" fill="#3f789f"/><text x="860" y="330" font-size="22" fill="#d9eaf7">03 · MARKET</text><text x="860" y="385" font-size="33" font-weight="700" fill="#fff">Local operator</text><text x="860" y="440" font-size="23" fill="#eaf4fb">Importer, seller and</text><text x="860" y="476" font-size="23" fill="#eaf4fb">conformity documents</text><rect x="1185" y="270" width="330" height="360" rx="28" fill="#dfeaf3"/><text x="1225" y="330" font-size="22" fill="#486581">04 · SUPPORT</text><text x="1225" y="385" font-size="33" font-weight="700" fill="#102a43">Service terms</text><text x="1225" y="440" font-size="23" fill="#334e68">Parts, repair and</text><text x="1225" y="476" font-size="23" fill="#334e68">warranty provider</text></g><path d="M420 450H445M785 450H810M1150 450H1175" stroke="#7895ad" stroke-width="6"/><text x="800" y="760" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#102a43">Group → Brand → Model → Factory → Market responsibility</text></svg>
