<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Midea appliance business and acquired brand relationship map</title>
  <desc id="desc">Midea Group and Smart Home Business connect to the Midea brand and three different acquisition structures involving Toshiba Lifestyle, Eureka and Teka Group.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061827"/><stop offset="1" stop-color="#123e4d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="11" stdDeviation="13" flood-opacity=".24"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47c9c2"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="88" fill="#f6fbff" font-family="Arial, sans-serif" font-size="49" font-weight="700">Midea's appliance portfolio uses different ownership structures</text>
  <text x="90" y="138" fill="#a9c8d2" font-family="Arial, sans-serif" font-size="24">A parent-company chart does not erase license, asset or territorial boundaries.</text>

  <g font-family="Arial, sans-serif" filter="url(#s)">
    <rect x="90" y="210" width="400" height="140" rx="24" fill="#124054" stroke="#47c9c2" stroke-width="2"/>
    <text x="130" y="262" fill="#82e0dc" font-size="21" font-weight="700">PUBLICLY LISTED GROUP</text><text x="130" y="315" fill="#fff" font-size="40" font-weight="700">Midea Group</text>
    <rect x="600" y="210" width="400" height="140" rx="24" fill="#124054" stroke="#47c9c2" stroke-width="2"/>
    <text x="640" y="262" fill="#82e0dc" font-size="21" font-weight="700">CONSUMER APPLIANCE PLATFORM</text><text x="640" y="315" fill="#fff" font-size="36" font-weight="700">Smart Home Business</text>
    <rect x="1110" y="210" width="400" height="140" rx="24" fill="#e9f3f5"/>
    <text x="1150" y="262" fill="#456b79" font-size="21" font-weight="700">CORE FULL-CATEGORY BRAND</text><text x="1150" y="315" fill="#0c2c3a" font-size="40" font-weight="700">Midea</text>
  </g>
  <path d="M490 280H585" stroke="#47c9c2" stroke-width="7" marker-end="url(#a)"/><path d="M1000 280H1095" stroke="#47c9c2" stroke-width="7" marker-end="url(#a)"/>

  <text x="90" y="425" fill="#fff" font-family="Arial, sans-serif" font-size="31" font-weight="700">Three acquisitions, three boundaries</text>
  <g font-family="Arial, sans-serif" filter="url(#s)">
    <rect x="90" y="470" width="440" height="250" rx="26" fill="#f1f6f7"/>
    <text x="130" y="523" fill="#0e3443" font-size="31" font-weight="700">Toshiba Lifestyle</text>
    <text x="130" y="570" fill="#ef7c55" font-size="24" font-weight="700">2016: 80.1% acquired</text>
    <text x="130" y="610" fill="#416775" font-size="21">40-year Toshiba brand license</text>
    <text x="130" y="648" fill="#416775" font-size="21">for the covered appliance business</text>
    <text x="130" y="686" fill="#6c858e" font-size="19">Not every Toshiba business</text>

    <rect x="580" y="470" width="440" height="250" rx="26" fill="#f1f6f7"/>
    <text x="620" y="523" fill="#0e3443" font-size="31" font-weight="700">Eureka</text>
    <text x="620" y="570" fill="#ef7c55" font-size="24" font-weight="700">2016: vacuum brand assets</text>
    <text x="620" y="610" fill="#416775" font-size="21">North American business from Electrolux</text>
    <text x="620" y="648" fill="#416775" font-size="21">Separate cleaning-appliance identity</text>
    <text x="620" y="686" fill="#6c858e" font-size="19">Not Sanitaire or Eureka Forbes</text>

    <rect x="1070" y="470" width="440" height="250" rx="26" fill="#f1f6f7"/>
    <text x="1110" y="523" fill="#0e3443" font-size="31" font-weight="700">Teka Group</text>
    <text x="1110" y="570" fill="#ef7c55" font-size="24" font-weight="700">2025: acquisition completed</text>
    <text x="1110" y="610" fill="#416775" font-size="21">Teka, Kuppersbusch and Intra</text>
    <text x="1110" y="648" fill="#416775" font-size="21">Kitchen and home solutions</text>
    <text x="1110" y="686" fill="#6c858e" font-size="19">Teka Rus LLC explicitly excluded</text>
  </g>

  <rect x="90" y="790" width="1420" height="62" rx="18" fill="#0c2d3a" stroke="#345d6b"/>
  <text x="800" y="830" text-anchor="middle" fill="#e3f4f6" font-family="Arial, sans-serif" font-size="23">Check the covered company, trademark, product class and territory before using the parent name.</text>
</svg>
