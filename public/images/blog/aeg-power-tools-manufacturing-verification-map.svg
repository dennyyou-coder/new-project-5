<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AEG Power Tools manufacturing, platform and warranty verification</title><desc id="desc">A checklist separates the AEG trademark and TTI group from the exact product model, origin, PRO18V compatibility and regional warranty.</desc>
  <rect width="1600" height="900" fill="#131312"/><text x="100" y="105" fill="white" font-family="Arial" font-size="48" font-weight="700">Verify the AEG product—not just the licensed brand</text><text x="100" y="150" fill="#bdb7af" font-family="Arial" font-size="23">Four evidence layers for procurement and service</text>
  <g font-family="Arial"><rect x="100" y="235" width="325" height="245" rx="28" fill="#302b27"/><text x="145" y="295" fill="#ffae70" font-size="21">01 · MODEL</text><text x="145" y="350" fill="white" font-size="31" font-weight="700">Exact SKU</text><text x="145" y="395" fill="#d1c9c1" font-size="21">Revision · serial date</text><text x="145" y="430" fill="#d1c9c1" font-size="21">Market specification</text><rect x="458" y="235" width="325" height="245" rx="28" fill="#302b27"/><text x="503" y="295" fill="#ffae70" font-size="21">02 · ORIGIN</text><text x="503" y="350" fill="white" font-size="31" font-weight="700">Maker + factory</text><text x="503" y="395" fill="#d1c9c1" font-size="21">Label · declaration</text><text x="503" y="430" fill="#d1c9c1" font-size="21">Shipment evidence</text><rect x="816" y="235" width="325" height="245" rx="28" fill="#9f4313"/><text x="861" y="295" fill="#ffe0c8" font-size="21">03 · PLATFORM</text><text x="861" y="350" fill="white" font-size="31" font-weight="700">PRO18V scope</text><text x="861" y="395" fill="#ffe0c8" font-size="21">Tool · battery · charger</text><text x="861" y="430" fill="#ffe0c8" font-size="21">No cross-brand assumption</text><rect x="1174" y="235" width="326" height="245" rx="28" fill="#302b27"/><text x="1219" y="295" fill="#ffae70" font-size="21">04 · WARRANTY</text><text x="1219" y="350" fill="white" font-size="31" font-weight="700">Regional terms</text><text x="1219" y="395" fill="#d1c9c1" font-size="21">Registration deadline</text><text x="1219" y="430" fill="#d1c9c1" font-size="21">Tool vs battery coverage</text></g>
  <path d="M100 560h1400" stroke="#5a5047" stroke-width="3"/>
  <rect x="100" y="625" width="650" height="135" rx="25" fill="#f0ece7"/><text x="145" y="680" fill="#6c6259" font-family="Arial" font-size="20">CORPORATE EVIDENCE CAN SHOW</text><text x="145" y="725" fill="#211e1b" font-family="Arial" font-size="28" font-weight="700">License, portfolio and group capability</text>
  <rect x="850" y="625" width="650" height="135" rx="25" fill="#b95216"/><text x="895" y="680" fill="#ffe0ca" font-family="Arial" font-size="20">PRODUCT EVIDENCE MUST SHOW</text><text x="895" y="725" fill="white" font-family="Arial" font-size="28" font-weight="700">Origin, compatibility and claim route</text>
  <text x="800" y="835" text-anchor="middle" fill="#9f968e" font-family="Arial" font-size="20">The Electrolux trademark notice proves the license boundary—not the physical place of manufacture.</text>
</svg>
