<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>FEIN ownership and manufacturing structure</title><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#15212b"/><stop offset="1" stop-color="#31414b"/></linearGradient></defs><rect width="1600" height="900" fill="url(#b)"/><g font-family="Arial,sans-serif"><text x="100" y="115" fill="white" font-size="54" font-weight="700">Independent ownership, substantial in-house production</text><text x="100" y="168" fill="#bdcbd2" font-size="27">Company structure and operating footprint</text><rect x="100" y="250" width="590" height="350" rx="40" fill="white"/><text x="155" y="325" fill="#8a6825" font-size="24" font-weight="700">OWNERSHIP</text><text x="155" y="405" fill="#18242c" font-size="46" font-weight="700">Family-run company</text><text x="155" y="465" fill="#5c6870" font-size="27">Independent C. &amp; E. Fein GmbH</text><text x="155" y="510" fill="#5c6870" font-size="27">Founded 1867</text><rect x="780" y="250" width="720" height="350" rx="40" fill="#e9eef0"/><text x="835" y="325" fill="#376b80" font-size="24" font-weight="700">MANUFACTURING</text><text x="835" y="405" fill="#18242c" font-size="64" font-weight="700">More than 90%</text><text x="835" y="463" fill="#5c6870" font-size="27">of products manufactured in-house</text><text x="835" y="515" fill="#5c6870" font-size="25">Largest site: Germany</text><text x="835" y="555" fill="#5c6870" font-size="25">Additional sites: Asia and North America</text><rect x="265" y="690" width="1070" height="95" rx="28" fill="#5b4721" stroke="#aa8840" stroke-width="3"/><text x="800" y="750" text-anchor="middle" fill="white" font-size="29" font-weight="700">In-house does not mean every model is made in Germany.</text></g></svg>
