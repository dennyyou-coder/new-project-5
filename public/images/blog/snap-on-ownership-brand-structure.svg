<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Snap-on ownership, brands and franchise channel</title>
  <desc id="desc">Public shareholders own Snap-on Incorporated. The parent controls brands and operating entities, while independent franchisees form a sales and service channel.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121820"/><stop offset="1" stop-color="#241116"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2383f"/><stop offset="1" stop-color="#8d1623"/></linearGradient><filter id="s"><feDropShadow dy="12" stdDeviation="14" flood-opacity=".3"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="100" y="92" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700">SNAP-ON: WHO OWNS WHAT?</text>
  <text x="100" y="138" fill="#c7d0d9" font-family="Arial, sans-serif" font-size="23">Corporate ownership, brand identity and the mobile channel are separate layers.</text>
  <g filter="url(#s)"><rect x="100" y="185" width="1400" height="112" rx="24" fill="#f2f4f6"/><text x="145" y="231" fill="#8d1623" font-family="Arial, sans-serif" font-size="22" font-weight="700">COLLECTIVE OWNERS</text><text x="145" y="270" fill="#182331" font-family="Arial, sans-serif" font-size="32" font-weight="700">Public shareholders • NYSE: SNA</text></g>
  <path d="M800 297v45" stroke="#768696" stroke-width="5"/>
  <g filter="url(#s)"><rect x="100" y="342" width="1400" height="118" rx="24" fill="url(#red)"/><text x="145" y="389" fill="#ffe9ea" font-family="Arial, sans-serif" font-size="22" font-weight="700">PUBLIC PARENT COMPANY</text><text x="145" y="431" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Snap-on Incorporated • Kenosha, Wisconsin</text></g>
  <path d="M315 460v48M800 460v48M1285 460v48" stroke="#768696" stroke-width="5"/>
  <g filter="url(#s)">
    <rect x="100" y="508" width="430" height="178" rx="24" fill="#1b2a39" stroke="#4c6477" stroke-width="2"/><text x="140" y="555" fill="#f0585d" font-family="Arial, sans-serif" font-size="22" font-weight="700">BRANDS</text><text x="140" y="600" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Snap-on • Bahco • Sioux</text><text x="140" y="640" fill="#c8d2dc" font-family="Arial, sans-serif" font-size="20">Williams • Blue-Point • others</text>
    <rect x="585" y="508" width="430" height="178" rx="24" fill="#1b2a39" stroke="#4c6477" stroke-width="2"/><text x="625" y="555" fill="#f0585d" font-family="Arial, sans-serif" font-size="22" font-weight="700">OPERATING ENTITIES</text><text x="625" y="600" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Sales • factories • warranty</text><text x="625" y="640" fill="#c8d2dc" font-family="Arial, sans-serif" font-size="20">Responsibility varies by market</text>
    <rect x="1070" y="508" width="430" height="178" rx="24" fill="#1b2a39" stroke="#4c6477" stroke-width="2"/><text x="1110" y="555" fill="#f0585d" font-family="Arial, sans-serif" font-size="22" font-weight="700">FRANCHISE CHANNEL</text><text x="1110" y="600" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">4,700+ mobile stores</text><text x="1110" y="640" fill="#c8d2dc" font-family="Arial, sans-serif" font-size="20">Sales and service — not owner</text>
  </g>
  <path d="M800 686v55" stroke="#768696" stroke-width="5"/>
  <g filter="url(#s)"><rect x="100" y="741" width="1400" height="112" rx="24" fill="#3a171d" stroke="#9e2a36" stroke-width="2"/><text x="145" y="788" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">DO NOT INFER</text><text x="145" y="827" fill="#f4dfe2" font-family="Arial, sans-serif" font-size="22">Parent company ≠ factory • franchisee ≠ owner • group brand ≠ battery compatibility</text></g>
</svg>
