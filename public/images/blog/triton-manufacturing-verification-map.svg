<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Triton manufacturing and buying evidence chain</title>
  <desc id="desc">Ownership, regional distribution and physical manufacturing are separate layers, and factory origin requires model-level evidence.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18242c"/><stop offset="1" stop-color="#39281e"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="17" flood-opacity=".28"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="100" y="110" fill="#fff" font-family="Arial, sans-serif" font-size="53" font-weight="700">Three layers, three different questions</text>
  <text x="100" y="165" fill="#d7c7b8" font-family="Arial, sans-serif" font-size="27">Do not use brand ownership as a factory-origin shortcut</text>
  <g font-family="Arial, sans-serif" filter="url(#s)">
    <rect x="100" y="250" width="420" height="330" rx="35" fill="#fff"/>
    <text x="145" y="320" fill="#b45f2b" font-size="23" font-weight="700">1 — BRAND CONTROL</text><text x="145" y="390" fill="#1e282e" font-size="40" font-weight="700">Timbecon</text><text x="145" y="442" fill="#5d676d" font-size="25">Ownership</text><text x="145" y="480" fill="#5d676d" font-size="25">product direction</text><text x="145" y="518" fill="#5d676d" font-size="25">global brand management</text>
    <rect x="590" y="250" width="420" height="330" rx="35" fill="#eee2d6"/>
    <text x="635" y="320" fill="#8d532d" font-size="23" font-weight="700">2 — MARKET CHANNEL</text><text x="635" y="390" fill="#1e282e" font-size="40" font-weight="700">Distributors</text><text x="635" y="442" fill="#5d676d" font-size="25">local inventory</text><text x="635" y="480" fill="#5d676d" font-size="25">dealer support</text><text x="635" y="518" fill="#5d676d" font-size="25">regional service route</text>
    <rect x="1080" y="250" width="420" height="330" rx="35" fill="#d9e2e6"/>
    <text x="1125" y="320" fill="#3e6d7c" font-size="23" font-weight="700">3 — PHYSICAL ORIGIN</text><text x="1125" y="390" fill="#1e282e" font-size="40" font-weight="700">Model-specific</text><text x="1125" y="442" fill="#5d676d" font-size="25">rating plate</text><text x="1125" y="480" fill="#5d676d" font-size="25">carton and manual</text><text x="1125" y="518" fill="#5d676d" font-size="25">compliance documents</text>
  </g>
  <rect x="235" y="680" width="1130" height="100" rx="28" fill="#553520" stroke="#b76b36" stroke-width="3"/>
  <text x="800" y="742" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="29" font-weight="700">Australian-owned does not mean every Triton tool is made in Australia.</text>
</svg>
