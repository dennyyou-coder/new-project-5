<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GE Appliances ownership, operating company and trademark license</title>
  <desc id="desc">Haier Smart Home owns Haier US Appliance Solutions, which does business as GE Appliances, while General Electric licenses the GE brand.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a32"/><stop offset="1" stop-color="#123a5b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".24"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L10,6 L0,12 Z" fill="#56c7e8"/></marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L10,6 L0,12 Z" fill="#f2a45f"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="96" y="105" fill="#f7fbff" font-family="Arial, sans-serif" font-size="52" font-weight="700">Who controls GE Appliances?</text>
  <text x="96" y="157" fill="#a9c7dc" font-family="Arial, sans-serif" font-size="25">Company ownership and trademark rights are separate questions</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="100" y="255" width="360" height="160" rx="24" fill="#ffffff"/>
    <text x="140" y="315" fill="#0d2942" font-size="24" font-weight="700">LISTED OWNER</text>
    <text x="140" y="365" fill="#0d2942" font-size="31" font-weight="700">Haier Smart Home</text>
    <text x="140" y="399" fill="#527087" font-size="20">Global appliance platform</text>
    <rect x="620" y="255" width="410" height="160" rx="24" fill="#ffffff"/>
    <text x="660" y="315" fill="#0d2942" font-size="24" font-weight="700">LEGAL OPERATING COMPANY</text>
    <text x="660" y="360" fill="#0d2942" font-size="31" font-weight="700">Haier US Appliance</text>
    <text x="660" y="399" fill="#527087" font-size="25">Solutions, Inc.</text>
    <rect x="1170" y="255" width="330" height="160" rx="24" fill="#dff5fb"/>
    <text x="1210" y="315" fill="#0d2942" font-size="24" font-weight="700">BUSINESS NAME</text>
    <text x="1210" y="370" fill="#0d2942" font-size="37" font-weight="700">GE Appliances</text>
    <line x1="460" y1="335" x2="605" y2="335" stroke="#56c7e8" stroke-width="7" marker-end="url(#arrow)"/>
    <text x="495" y="315" fill="#a9e3f2" font-size="20">owns</text>
    <line x1="1030" y1="335" x2="1155" y2="335" stroke="#56c7e8" stroke-width="7" marker-end="url(#arrow)"/>
    <text x="1045" y="300" fill="#a9e3f2" font-size="17">does business as</text>
    <rect x="320" y="565" width="430" height="180" rx="24" fill="#fff3e6"/>
    <text x="365" y="625" fill="#6b3212" font-size="24" font-weight="700">TRADEMARK LICENSOR</text>
    <text x="365" y="680" fill="#6b3212" font-size="36" font-weight="700">General Electric</text>
    <text x="365" y="718" fill="#8c5a3b" font-size="21">GE brand retained under a long-term license</text>
    <rect x="900" y="565" width="420" height="180" rx="24" fill="#e6f6ef"/>
    <text x="945" y="625" fill="#174b39" font-size="24" font-weight="700">LOCAL RESPONSIBILITY</text>
    <text x="945" y="675" fill="#174b39" font-size="31" font-weight="700">Model, seller, warranty</text>
    <text x="945" y="716" fill="#42745f" font-size="21">Check the exact product and market</text>
    <path d="M750 655 C865 655, 900 455, 1160 430" fill="none" stroke="#f2a45f" stroke-width="6" stroke-dasharray="14 12" marker-end="url(#arrowOrange)"/>
  </g>
  <text x="96" y="842" fill="#a9c7dc" font-family="Arial, sans-serif" font-size="20">Sources: GE Appliances corporate disclosures; General Electric sale and trademark-license statements</text>
</svg>
