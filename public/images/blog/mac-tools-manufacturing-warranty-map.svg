<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mac Tools manufacturing and warranty verification map</title><desc id="desc">Product-level checks separate Mac or group manufacturing from supplier manufacturing and connect each product to its applicable warranty.</desc>
  <defs><linearGradient id="bg" x2="1"><stop stop-color="#111821"/><stop offset="1" stop-color="#222d39"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/>
  <text x="100" y="105" fill="white" font-family="Arial" font-size="48" font-weight="700">Who made it? Follow the exact Mac SKU</text><text x="100" y="150" fill="#aab7c4" font-family="Arial" font-size="23">Brand ownership cannot replace product evidence</text>
  <rect x="100" y="225" width="410" height="205" rx="26" fill="#a9252d"/><text x="145" y="285" fill="#ffdfe1" font-family="Arial" font-size="22">PATH A</text><text x="145" y="340" fill="white" font-family="Arial" font-size="27" font-weight="700">Mac or group-made product</text><text x="145" y="385" fill="#ffe9ea" font-family="Arial" font-size="21">Use the applicable Mac limited warranty</text>
  <rect x="1090" y="225" width="410" height="205" rx="26" fill="#334354"/><text x="1135" y="285" fill="#d2dce6" font-family="Arial" font-size="22">PATH B</text><text x="1135" y="340" fill="white" font-family="Arial" font-size="32" font-weight="700">Supplier-made product</text><text x="1135" y="385" fill="#d2dce6" font-family="Arial" font-size="21">Use the manufacturing supplier's terms</text>
  <rect x="595" y="210" width="410" height="235" rx="30" fill="#f4f6f8"/><text x="640" y="280" fill="#6b737d" font-family="Arial" font-size="22">START WITH</text><text x="640" y="345" fill="#16202b" font-family="Arial" font-size="31" font-weight="700">Exact model + revision</text><text x="640" y="395" fill="#56616c" font-family="Arial" font-size="22">Not the parent-company name alone</text>
  <path d="M595 325H510" stroke="#df5d63" stroke-width="8"/><path d="M530 308l-30 17 30 17" fill="#df5d63"/><path d="M1005 325h85" stroke="#8ea0b2" stroke-width="8"/><path d="M1070 308l30 17-30 17" fill="#8ea0b2"/>
  <text x="100" y="540" fill="white" font-family="Arial" font-size="30" font-weight="700">Evidence checklist</text>
  <g font-family="Arial"><rect x="100" y="585" width="260" height="120" rx="22" fill="#293746"/><text x="130" y="635" fill="#bfcad5" font-size="20">01</text><text x="130" y="675" fill="white" font-size="24" font-weight="700">Origin label</text><rect x="390" y="585" width="260" height="120" rx="22" fill="#293746"/><text x="420" y="635" fill="#bfcad5" font-size="20">02</text><text x="420" y="675" fill="white" font-size="24" font-weight="700">Manual + maker</text><rect x="680" y="585" width="260" height="120" rx="22" fill="#293746"/><text x="710" y="635" fill="#bfcad5" font-size="20">03</text><text x="710" y="675" fill="white" font-size="24" font-weight="700">Seller + importer</text><rect x="970" y="585" width="260" height="120" rx="22" fill="#293746"/><text x="1000" y="635" fill="#bfcad5" font-size="20">04</text><text x="1000" y="675" fill="white" font-size="24" font-weight="700">Warranty period</text><rect x="1260" y="585" width="240" height="120" rx="22" fill="#293746"/><text x="1290" y="635" fill="#bfcad5" font-size="20">05</text><text x="1290" y="675" fill="white" font-size="24" font-weight="700">Service route</text></g>
  <rect x="100" y="760" width="1400" height="70" rx="18" fill="#0c1219"/><text x="800" y="805" text-anchor="middle" fill="#ffccd0" font-family="Arial" font-size="25" font-weight="700">No universal factory, country of origin or warranty applies to the full catalogue.</text>
</svg>
