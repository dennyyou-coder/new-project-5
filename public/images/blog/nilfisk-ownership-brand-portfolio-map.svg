<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nilfisk ownership and professional brand portfolio map</title><desc id="desc">Freudenberg owns Nilfisk, which continues to operate distinct professional cleaning brands and channels.</desc>
  <rect width="1600" height="900" fill="#0b1720"/><g font-family="Arial,sans-serif"><text x="90" y="116" fill="#fff" font-size="52" font-weight="700">NILFISK — PRIVATE OWNERSHIP, DISTINCT BRAND</text><text x="90" y="176" fill="#a8d8e8" font-size="30">The 2026 takeover changed the parent, not the product identity</text>
  <rect x="100" y="285" width="410" height="320" rx="28" fill="#15313e" stroke="#55b9d5" stroke-width="4"/><text x="140" y="365" fill="#7bd6ec" font-size="31" font-weight="700">PRIVATE PARENT</text><text x="140" y="445" fill="#fff" font-size="44" font-weight="700">Freudenberg</text><text x="140" y="505" fill="#d5eff6" font-size="28">Takeover completed</text><text x="140" y="550" fill="#d5eff6" font-size="28">April 2026</text>
  <rect x="595" y="285" width="410" height="320" rx="28" fill="#183a49" stroke="#55b9d5" stroke-width="4"/><text x="635" y="365" fill="#7bd6ec" font-size="31" font-weight="700">OPERATING GROUP</text><text x="635" y="445" fill="#fff" font-size="52" font-weight="700">NILFISK</text><text x="635" y="505" fill="#d5eff6" font-size="28">Professional cleaning</text><text x="635" y="550" fill="#d5eff6" font-size="28">equipment + services</text>
  <rect x="1090" y="285" width="410" height="320" rx="28" fill="#15313e" stroke="#55b9d5" stroke-width="4"/><text x="1130" y="365" fill="#7bd6ec" font-size="31" font-weight="700">PORTFOLIO NAMES</text><text x="1130" y="445" fill="#fff" font-size="38" font-weight="700">NILFISK · ADVANCE</text><text x="1130" y="505" fill="#fff" font-size="38" font-weight="700">VIPER</text><text x="1130" y="555" fill="#d5eff6" font-size="25">Markets and channels vary</text>
  <g fill="#55b9d5" font-size="70"><text x="520" y="475">→</text><text x="1015" y="475">→</text></g><rect x="180" y="700" width="1240" height="100" rx="24" fill="#102936"/><text x="245" y="766" fill="#fff" font-size="36" font-weight="700">Shared ownership does not merge parts, dealers or warranties.</text></g>
</svg>
