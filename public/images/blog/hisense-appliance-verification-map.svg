<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Hisense appliance verification flow</title><desc id="desc">A five-step workflow from exact model to factory and origin, responsible operator, seller and importer, and warranty route.</desc><rect width="1600" height="900" fill="#f4f7fb"/><text x="100" y="105" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#10284d">From brand name to a verifiable appliance</text><text x="100" y="150" font-family="Arial,sans-serif" font-size="23" fill="#56708f">Use the product's own documents—not the group chart—to answer sourcing questions</text><g font-family="Arial,sans-serif"><path d="M275 450H1325" stroke="#8fb3dc" stroke-width="12"/><g fill="#123b6d"><circle cx="275" cy="450" r="58"/><circle cx="538" cy="450" r="58"/><circle cx="800" cy="450" r="58"/><circle cx="1062" cy="450" r="58"/><circle cx="1325" cy="450" r="58"/></g><g fill="white" font-size="32" font-weight="700" text-anchor="middle"><text x="275" y="461">1</text><text x="538" y="461">2</text><text x="800" y="461">3</text><text x="1062" y="461">4</text><text x="1325" y="461">5</text></g><g fill="#10284d" font-size="24" font-weight="700" text-anchor="middle"><text x="275" y="325">Exact model</text><text x="538" y="325">Factory &amp; origin</text><text x="800" y="325">Responsible operator</text><text x="1062" y="325">Seller &amp; importer</text><text x="1325" y="325">Warranty &amp; service</text></g><g fill="#52677f" font-size="19" text-anchor="middle"><text x="275" y="570">Full code and suffix</text><text x="538" y="570">Label and declaration</text><text x="800" y="570">Named market entity</text><text x="1062" y="570">Invoice and customs chain</text><text x="1325" y="570">Written local terms</text></g><rect x="185" y="680" width="1230" height="95" rx="20" fill="#fff4df"/><text x="800" y="738" text-anchor="middle" font-size="24" font-weight="700" fill="#7b5200">Shared ownership among Hisense, Gorenje and ASKO does not prove model or parts interchangeability</text></g></svg>
