<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RIDGID power-tool brand, license, operator and retail map</title>
  <desc id="desc">Emerson and Ridge Tool provide the RIDGID trademark system, TTI and OWT operate the licensed power-tool category, and Home Depot is a retail channel.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11100f"/><stop offset="1" stop-color="#2d2119"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="100" y="105" fill="#ffffff" font-family="Arial" font-size="48" font-weight="700">RIDGID power tools: ownership is not manufacturing</text>
  <text x="100" y="150" fill="#c7bbb2" font-family="Arial" font-size="23">Separate the trademark, licensed product operator and retail channel</text>
  <rect x="100" y="235" width="430" height="270" rx="30" fill="#f2eee9"/>
  <text x="145" y="300" fill="#6a6058" font-family="Arial" font-size="21">BRAND SYSTEM</text>
  <text x="145" y="360" fill="#211d1a" font-family="Arial" font-size="35" font-weight="700">Emerson + Ridge Tool</text>
  <text x="145" y="415" fill="#655b54" font-family="Arial" font-size="22">RIDGID trademark and</text><text x="145" y="450" fill="#655b54" font-family="Arial" font-size="22">corporate ownership context</text>
  <path d="M530 370h235" stroke="#f18435" stroke-width="9"/><path d="M735 349l36 21-36 21" fill="#f18435"/>
  <text x="650" y="335" text-anchor="middle" fill="#ffc18e" font-family="Arial" font-size="23" font-weight="700">LICENSED CATEGORY</text>
  <rect x="770" y="235" width="430" height="270" rx="30" fill="#aa4717"/>
  <text x="815" y="300" fill="#ffe0ca" font-family="Arial" font-size="21">POWER-TOOL OPERATOR</text>
  <text x="815" y="360" fill="#ffffff" font-family="Arial" font-size="37" font-weight="700">TTI power-tool system</text>
  <text x="815" y="415" fill="#ffe1cc" font-family="Arial" font-size="22">OWT Industries + TTI Consumer</text><text x="815" y="450" fill="#ffe1cc" font-family="Arial" font-size="22">Power Tools in product records</text>
  <path d="M1200 370h145" stroke="#f18435" stroke-width="9"/><path d="M1315 349l36 21-36 21" fill="#f18435"/>
  <rect x="1350" y="235" width="150" height="270" rx="30" fill="#302a26" stroke="#695548" stroke-width="2"/>
  <text x="1425" y="315" text-anchor="middle" fill="#ffc18e" font-family="Arial" font-size="19">RETAIL</text>
  <text x="1425" y="375" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="26" font-weight="700">Home</text><text x="1425" y="410" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="26" font-weight="700">Depot</text>
  <text x="1425" y="462" text-anchor="middle" fill="#cfc3bb" font-family="Arial" font-size="18">Not owner</text>
  <rect x="100" y="595" width="1400" height="170" rx="28" fill="#1b1918" stroke="#594b42" stroke-width="2"/>
  <text x="145" y="650" fill="#ffc18e" font-family="Arial" font-size="22" font-weight="700">CATEGORY BOUNDARY</text>
  <text x="145" y="700" fill="#ffffff" font-family="Arial" font-size="29">This map applies to licensed RIDGID power tools—not wet/dry vacuums, plumbing tools,</text>
  <text x="145" y="740" fill="#ffffff" font-family="Arial" font-size="29">pumps or every product carrying the RIDGID trademark.</text>
  <text x="100" y="835" fill="#9e9289" font-family="Arial" font-size="20">Exact legal manufacturer, factory and origin still require model-level evidence.</text>
</svg>
