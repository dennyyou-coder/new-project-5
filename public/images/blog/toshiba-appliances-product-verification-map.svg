<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Toshiba appliance product verification workflow</title><desc id="desc">A model-level workflow separates brand, manufacturer, factory, importer and warranty responsibility.</desc>
  <rect width="1600" height="900" fill="#071522"/><g font-family="Arial,sans-serif"><text x="90" y="118" fill="#fff" font-size="56" font-weight="700">ONE LOGO DOES NOT IDENTIFY ONE FACTORY</text><text x="90" y="178" fill="#8fc7e8" font-size="30">Use the exact product documents to build the responsibility chain</text>
  <g font-size="27" font-weight="700"><rect x="90" y="300" width="250" height="190" rx="24" fill="#11304a" stroke="#55b8e8" stroke-width="4"/><text x="128" y="380" fill="#77d0fb">01 MODEL</text><text x="128" y="435" fill="#fff">Code + serial</text><rect x="385" y="300" width="250" height="190" rx="24" fill="#11304a" stroke="#55b8e8" stroke-width="4"/><text x="423" y="380" fill="#77d0fb">02 LABEL</text><text x="423" y="435" fill="#fff">Maker + origin</text><rect x="680" y="300" width="250" height="190" rx="24" fill="#11304a" stroke="#55b8e8" stroke-width="4"/><text x="718" y="380" fill="#77d0fb">03 DOCS</text><text x="718" y="435" fill="#fff">Manual + DoC</text><rect x="975" y="300" width="250" height="190" rx="24" fill="#11304a" stroke="#55b8e8" stroke-width="4"/><text x="1013" y="380" fill="#77d0fb">04 MARKET</text><text x="1013" y="435" fill="#fff">Importer + seller</text><rect x="1270" y="300" width="250" height="190" rx="24" fill="#11304a" stroke="#55b8e8" stroke-width="4"/><text x="1308" y="380" fill="#77d0fb">05 SUPPORT</text><text x="1308" y="430" fill="#fff" font-size="24">Warranty</text><text x="1308" y="468" fill="#fff" font-size="24">Parts</text></g>
  <g fill="#55b8e8" font-size="54"><text x="344" y="422">→</text><text x="639" y="422">→</text><text x="934" y="422">→</text><text x="1229" y="422">→</text></g><rect x="220" y="650" width="1160" height="105" rx="25" fill="#0d263b"/><text x="300" y="719" fill="#fff" font-size="35" font-weight="700">Factory, importer and warranty can all be different entities.</text></g>
</svg>
