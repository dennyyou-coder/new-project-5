<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Braun trademark and household appliance license</title><desc id="desc">P and G owns Braun while De’Longhi holds a perpetual license for defined household appliance categories.</desc><rect width="1600" height="900" fill="#f7f7f5"/><text x="100" y="115" font-family="Arial" font-size="48" font-weight="700" fill="#202322">Braun: trademark owner vs household licensee</text><text x="100" y="168" font-family="Arial" font-size="24" fill="#5c6460">One name, different product responsibilities</text>
  <rect x="110" y="260" width="550" height="350" rx="30" fill="#242827"/><text x="165" y="330" font-family="Arial" font-size="24" fill="#cdd3d0">TRADEMARK OWNER</text><text x="165" y="395" font-family="Arial" font-size="42" font-weight="700" fill="#fff">Procter &amp; Gamble</text><text x="165" y="465" font-family="Arial" font-size="25" fill="#e4e8e6">Owns the Braun brand</text><text x="165" y="505" font-family="Arial" font-size="25" fill="#e4e8e6">and controls uses outside</text><text x="165" y="545" font-family="Arial" font-size="25" fill="#e4e8e6">the licensed household scope.</text>
  <path d="M670 435H930" stroke="#b3832d" stroke-width="8"/><text x="800" y="405" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#805a16">PERPETUAL LICENSE</text><path d="M920 415L955 435L920 455Z" fill="#b3832d"/>
  <rect x="940" y="260" width="550" height="350" rx="30" fill="#fff" stroke="#b3832d" stroke-width="4"/><text x="995" y="330" font-family="Arial" font-size="24" fill="#805a16">HOUSEHOLD APPLIANCE LICENSEE</text><text x="995" y="395" font-family="Arial" font-size="42" font-weight="700" fill="#202322">De’Longhi Group</text><text x="995" y="465" font-family="Arial" font-size="25" fill="#4d5551">Develops and markets defined</text><text x="995" y="505" font-family="Arial" font-size="25" fill="#4d5551">small kitchen, ironing and</text><text x="995" y="545" font-family="Arial" font-size="25" fill="#4d5551">selected household categories.</text>
  <rect x="110" y="700" width="1380" height="90" rx="20" fill="#eceeea"/><text x="800" y="757" text-anchor="middle" font-family="Arial" font-size="26" fill="#3f4643">A license transfers operating rights for a scope — not ownership of the Braun trademark</text>
</svg>
