<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Metabo, Metabo HPT and HiKOKI brand relationship map</title>
  <desc id="desc">Koki Holdings owns three related but distinct brand routes, with Metabo and CAS separated from HiKOKI and North American Metabo HPT MultiVolt products.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b2d"/><stop offset="1" stop-color="#06130f"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fc26b"/><stop offset="1" stop-color="#167743"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1460" cy="100" r="280" fill="#44b969" opacity=".08"/>
  <text x="95" y="92" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">ONE OWNER, THREE BRAND ROUTES</text>
  <text x="95" y="138" fill="#b9cad3" font-family="Arial, Helvetica, sans-serif" font-size="23">Similar names and colors do not make the cordless systems interchangeable.</text>
  <g filter="url(#shadow)">
    <rect x="95" y="188" width="1410" height="120" rx="24" fill="url(#green)"/>
    <text x="140" y="237" fill="#eaffef" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">PARENT COMPANY</text>
    <text x="140" y="281" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Koki Holdings Co., Ltd. • Japan</text>
    <text x="1130" y="260" fill="#eaffef" font-family="Arial, Helvetica, sans-serif" font-size="21">Not Hitachi-owned today</text>
  </g>
  <path d="M800 308v50" stroke="#7692a0" stroke-width="5"/>
  <g filter="url(#shadow)">
    <rect x="95" y="358" width="440" height="210" rx="24" fill="#142b3b" stroke="#38715a" stroke-width="2"/>
    <text x="140" y="410" fill="#6ed681" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">METABO</text>
    <text x="140" y="455" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">German-origin brand</text>
    <text x="140" y="496" fill="#c8d7dd" font-family="Arial, Helvetica, sans-serif" font-size="20">Acquired in 2016</text>
    <text x="140" y="532" fill="#c8d7dd" font-family="Arial, Helvetica, sans-serif" font-size="20">18V • CAS ecosystem</text>
    <rect x="580" y="358" width="440" height="210" rx="24" fill="#142b3b" stroke="#38715a" stroke-width="2"/>
    <text x="625" y="410" fill="#6ed681" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">HiKOKI</text>
    <text x="625" y="455" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">International brand</text>
    <text x="625" y="496" fill="#c8d7dd" font-family="Arial, Helvetica, sans-serif" font-size="20">Former Hitachi Power Tools</text>
    <text x="625" y="532" fill="#c8d7dd" font-family="Arial, Helvetica, sans-serif" font-size="20">18V / 36V MultiVolt</text>
    <rect x="1065" y="358" width="440" height="210" rx="24" fill="#142b3b" stroke="#38715a" stroke-width="2"/>
    <text x="1110" y="410" fill="#6ed681" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">METABO HPT</text>
    <text x="1110" y="455" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">North America</text>
    <text x="1110" y="496" fill="#c8d7dd" font-family="Arial, Helvetica, sans-serif" font-size="20">Regional HiKOKI route</text>
    <text x="1110" y="532" fill="#c8d7dd" font-family="Arial, Helvetica, sans-serif" font-size="20">MultiVolt ecosystem</text>
  </g>
  <path d="M315 568v56M800 568v56M1285 568v56" stroke="#7692a0" stroke-width="5"/>
  <g filter="url(#shadow)">
    <rect x="95" y="624" width="1410" height="104" rx="24" fill="#f1f5f3"/>
    <text x="140" y="667" fill="#17683c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">NORTH AMERICA 2025–2026</text>
    <text x="140" y="704" fill="#13283a" font-family="Arial, Helvetica, sans-serif" font-size="22">Metabo branding transitions to Metabo HPT; legacy Metabo batteries and service remain a separate installed-base obligation.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="95" y="760" width="1410" height="92" rx="24" fill="#193327" stroke="#3f9561" stroke-width="2"/>
    <text x="140" y="814" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="23">Verify: market • model • brand at sale • CAS vs MultiVolt • origin • warranty • parts</text>
  </g>
</svg>
