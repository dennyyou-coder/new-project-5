<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ASKO product verification flow</title><desc id="desc">A six-step model-level process separates brand ownership from factory, origin, seller and warranty.</desc><rect width="1600" height="900" fill="#f5f7fb"/><text x="100" y="110" font-family="Arial" font-size="48" font-weight="700" fill="#102a43">Verify the exact ASKO model</text><text x="100" y="165" font-family="Arial" font-size="25" fill="#486581">Velenje laundry evidence does not map every appliance to one factory</text><g font-family="Arial"><g fill="#fff" stroke="#517b9b" stroke-width="3"><rect x="100" y="240" width="400" height="190" rx="24"/><rect x="600" y="240" width="400" height="190" rx="24"/><rect x="1100" y="240" width="400" height="190" rx="24"/><rect x="100" y="540" width="400" height="190" rx="24"/><rect x="600" y="540" width="400" height="190" rx="24"/><rect x="1100" y="540" width="400" height="190" rx="24"/></g><g fill="#2f6f9f" font-size="24" font-weight="700"><text x="140" y="292">01 MODEL</text><text x="640" y="292">02 DOCUMENTS</text><text x="1140" y="292">03 FACTORY</text><text x="140" y="592">04 MARKET</text><text x="640" y="592">05 SELLER</text><text x="1140" y="592">06 SUPPORT</text></g><g fill="#102a43" font-size="29" font-weight="700"><text x="140" y="350">Full code and suffix</text><text x="640" y="350">Manufacturer and</text><text x="640" y="385">declaration</text><text x="1140" y="350">Plant and origin</text><text x="140" y="650">Importer or operator</text><text x="640" y="650">Authorization and</text><text x="640" y="685">invoice</text><text x="1140" y="650">Warranty, parts</text><text x="1140" y="685">and service</text></g></g></svg>
