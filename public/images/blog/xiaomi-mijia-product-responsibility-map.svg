<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Xiaomi and Mijia product responsibility workflow</title><desc id="desc">A verification path identifies the legal manufacturer, importer, app operator and warranty issuer for a specific model.</desc>
  <rect width="1600" height="900" fill="#15120e"/><g font-family="Arial,sans-serif"><text x="90" y="116" fill="#fff" font-size="57" font-weight="700">HOW TO FIND WHO MADE A SPECIFIC MODEL</text><text x="90" y="176" fill="#ffd39f" font-size="30">Start with the product code, not the ecosystem label</text>
  <g font-size="24"><rect x="60" y="300" width="260" height="230" rx="26" fill="#3c2815" stroke="#f59b42" stroke-width="4"/><text x="95" y="372" fill="#ffbd7b" font-weight="700">MODEL LABEL</text><text x="95" y="430" fill="#fff">Legal maker</text><text x="95" y="475" fill="#fff">Origin</text><rect x="365" y="300" width="260" height="230" rx="26" fill="#3c2815" stroke="#f59b42" stroke-width="4"/><text x="400" y="372" fill="#ffbd7b" font-weight="700">REGULATORY</text><text x="400" y="430" fill="#fff">Manual · DoC</text><text x="400" y="475" fill="#fff">Certification</text><rect x="670" y="300" width="260" height="230" rx="26" fill="#3c2815" stroke="#f59b42" stroke-width="4"/><text x="705" y="372" fill="#ffbd7b" font-weight="700">MARKET ROLE</text><text x="705" y="430" fill="#fff">Importer</text><text x="705" y="475" fill="#fff">Local seller</text><rect x="975" y="300" width="260" height="230" rx="26" fill="#3c2815" stroke="#f59b42" stroke-width="4"/><text x="1010" y="372" fill="#ffbd7b" font-weight="700">DIGITAL ROLE</text><text x="1010" y="430" fill="#fff">App · cloud</text><text x="1010" y="475" fill="#fff">Data terms</text><rect x="1280" y="300" width="260" height="230" rx="26" fill="#563116" stroke="#f59b42" stroke-width="4"/><text x="1315" y="372" fill="#ffbd7b" font-weight="700">SERVICE</text><text x="1315" y="430" fill="#fff">Parts</text><text x="1315" y="475" fill="#fff">Warranty</text></g>
  <g fill="#f59b42" font-size="48"><text x="323" y="435">→</text><text x="628" y="435">→</text><text x="933" y="435">→</text><text x="1238" y="435">→</text></g><rect x="230" y="655" width="1140" height="105" rx="25" fill="#2c2013"/><text x="325" y="724" fill="#fff" font-size="35" font-weight="700">Mi Home compatibility answers only the digital-platform question.</text></g>
</svg>
