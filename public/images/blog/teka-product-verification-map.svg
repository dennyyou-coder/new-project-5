<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Teka product verification flow</title><desc id="desc">The Teka product check separates model, category compliance, factory, market, seller and support.</desc><rect width="1600" height="900" fill="#f5f7fb"/><text x="100" y="110" font-family="Arial" font-size="48" font-weight="700" fill="#102a43">Verify each Teka product after the acquisition</text><text x="100" y="165" font-family="Arial" font-size="25" fill="#486581">A group factory count is not a current model-to-plant map</text><g font-family="Arial"><g fill="#fff" stroke="#517b9b" stroke-width="3"><rect x="100" y="240" width="400" height="190" rx="24"/><rect x="600" y="240" width="400" height="190" rx="24"/><rect x="1100" y="240" width="400" height="190" rx="24"/><rect x="100" y="540" width="400" height="190" rx="24"/><rect x="600" y="540" width="400" height="190" rx="24"/><rect x="1100" y="540" width="400" height="190" rx="24"/></g><g fill="#2f6f9f" font-size="24" font-weight="700"><text x="140" y="292">01 MODEL</text><text x="640" y="292">02 CATEGORY</text><text x="1140" y="292">03 FACTORY</text><text x="140" y="592">04 MARKET</text><text x="640" y="592">05 SELLER</text><text x="1140" y="592">06 SUPPORT</text></g><g fill="#102a43" font-size="28" font-weight="700"><text x="140" y="350">Full code and suffix</text><text x="640" y="350">Electrical, gas or</text><text x="640" y="385">plumbing evidence</text><text x="1140" y="350">Plant and origin</text><text x="140" y="650">Local operator and</text><text x="140" y="685">Teka Rus boundary</text><text x="640" y="650">Authorization and</text><text x="640" y="685">invoice</text><text x="1140" y="650">Installation, parts</text><text x="1140" y="685">and warranty</text></g></g></svg>
