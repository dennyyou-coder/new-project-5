<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Panasonic model verification workflow</title><desc id="desc">A workflow separating group ownership, business division, model documents, factory and origin, and regional sales and service.</desc><rect width="1600" height="900" fill="#f4f7fb"/><text x="100" y="105" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#10284d">Five layers behind a Panasonic appliance</text><text x="100" y="150" font-family="Arial,sans-serif" font-size="23" fill="#56708f">Each layer answers a different buyer question</text><g font-family="Arial,sans-serif"><g><rect x="110" y="255" width="270" height="390" rx="24" fill="#123b6d"/><rect x="390" y="295" width="270" height="350" rx="24" fill="#22558d"/><rect x="670" y="335" width="270" height="310" rx="24" fill="#3f76ad"/><rect x="950" y="375" width="270" height="270" rx="24" fill="#73a0cb"/><rect x="1230" y="415" width="270" height="230" rx="24" fill="#dce9f7"/></g><g font-size="24" font-weight="700" text-anchor="middle"><text x="245" y="330" fill="white">1. Group owner</text><text x="525" y="370" fill="white">2. Business division</text><text x="805" y="410" fill="white">3. Exact model</text><text x="1085" y="450" fill="white">4. Factory &amp; origin</text><text x="1365" y="490" fill="#123b6d">5. Local channel</text></g><g font-size="19" text-anchor="middle"><text x="245" y="385" fill="#d9e9ff">Panasonic Holdings</text><text x="525" y="425" fill="#e5f0ff">Major or Small</text><text x="805" y="465" fill="#eef6ff">Code · suffix · label</text><text x="1085" y="505" fill="#10284d">Current documents</text><text x="1365" y="545" fill="#52677f">Seller · importer</text><text x="1365" y="578" fill="#52677f">Warranty · service</text></g><rect x="225" y="720" width="1150" height="90" rx="20" fill="#fff4df"/><text x="800" y="775" text-anchor="middle" font-size="23" font-weight="700" fill="#7b5200">Japanese ownership is not proof that every model is manufactured in Japan</text></g></svg>
