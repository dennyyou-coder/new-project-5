<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">STIHL production, battery systems and ALLPRO timing</title><desc id="desc">STIHL manufactures in eight countries and operates separate AS, AK and AP battery systems. AP technology connects to the ALLPRO alliance with dated STIHL and Karcher launches.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162018"/><stop offset="1" stop-color="#1f2321"/></linearGradient><linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f48b22"/><stop offset="1" stop-color="#b84a0d"/></linearGradient><filter id="s"><feDropShadow dy="12" stdDeviation="14" flood-opacity=".3"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="100" y="92" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700">STIHL: PRODUCTION + BATTERY STRATEGY</text><text x="100" y="138" fill="#cbd2c9" font-family="Arial, sans-serif" font-size="23">Corporate footprint, system compatibility and alliance timing need separate checks.</text>
  <g filter="url(#s)"><rect x="100" y="190" width="1400" height="122" rx="24" fill="url(#orange)"/><text x="145" y="238" fill="#fff2e7" font-family="Arial, sans-serif" font-size="22" font-weight="700">MANUFACTURING NETWORK</text><text x="145" y="281" fill="#fff" font-family="Arial, sans-serif" font-size="31" font-weight="700">8 countries • model origin still verified on label + documentation</text></g>
  <path d="M315 312v55M800 312v55M1285 312v55" stroke="#849087" stroke-width="5"/>
  <g filter="url(#s)"><rect x="100" y="367" width="430" height="146" rx="24" fill="#f1f1e9"/><text x="140" y="415" fill="#a9430d" font-family="Arial, sans-serif" font-size="22" font-weight="700">AS SYSTEM</text><text x="140" y="459" fill="#1d2a20" font-family="Arial, sans-serif" font-size="27" font-weight="700">Compact tools</text><rect x="585" y="367" width="430" height="146" rx="24" fill="#f1f1e9"/><text x="625" y="415" fill="#a9430d" font-family="Arial, sans-serif" font-size="22" font-weight="700">AK SYSTEM</text><text x="625" y="459" fill="#1d2a20" font-family="Arial, sans-serif" font-size="27" font-weight="700">Home + garden</text><rect x="1070" y="367" width="430" height="146" rx="24" fill="#f1f1e9"/><text x="1110" y="415" fill="#a9430d" font-family="Arial, sans-serif" font-size="22" font-weight="700">AP / AR SYSTEM</text><text x="1110" y="459" fill="#1d2a20" font-family="Arial, sans-serif" font-size="27" font-weight="700">Professional platform</text></g>
  <path d="M1285 513v50H800v38" stroke="#849087" stroke-width="5" fill="none"/>
  <g filter="url(#s)"><rect x="100" y="601" width="1400" height="155" rx="24" fill="#26322a" stroke="#77877b" stroke-width="2"/><text x="145" y="649" fill="#f59a43" font-family="Arial, sans-serif" font-size="22" font-weight="700">ALLPRO PROFESSIONAL ALLIANCE • AP-COMPATIBLE TECHNOLOGY</text><text x="145" y="696" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Aug 1, 2026: new STIHL batteries through STIHL dealers</text><text x="145" y="735" fill="#d4ddd6" font-family="Arial, sans-serif" font-size="23">Jan 1, 2027: compatible Kärcher equipment scheduled</text></g>
  <g filter="url(#s)"><rect x="100" y="793" width="1400" height="68" rx="20" fill="#452313"/><text x="145" y="837" fill="#fff" font-family="Arial, sans-serif" font-size="23">Alliance ≠ merger • STIHL and Kärcher remain independent companies</text></g>
</svg>
