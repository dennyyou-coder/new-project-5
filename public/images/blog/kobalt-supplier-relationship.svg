<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Kobalt ownership, supplier and 24V platform relationship map</title>
  <desc id="desc">Lowe's controls the Kobalt private brand and retail channel, while product-specific suppliers manufacture individual tools. The 24V platform connects products but does not identify one manufacturer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071523"/><stop offset="0.56" stop-color="#0d2f54"/><stop offset="1" stop-color="#08131f"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1688e8"/><stop offset="1" stop-color="#07539e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.34"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#70bfff"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.1" stroke="#93cfff" fill="none"><path d="M0 136H1600M0 306H1600M0 476H1600M0 646H1600M0 816H1600"/><path d="M160 0V900M400 0V900M640 0V900M880 0V900M1120 0V900M1360 0V900"/></g>
  <text x="800" y="78" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Kobalt: Brand Control Is Not One-Factory Manufacturing</text>
  <text x="800" y="120" text-anchor="middle" fill="#b7d9f5" font-family="Arial, Helvetica, sans-serif" font-size="23">Separate the retailer, private brand, supplier, battery platform and model-level responsibility</text>
  <g filter="url(#shadow)"><rect x="590" y="165" width="420" height="152" rx="24" fill="url(#blue)" stroke="#8ed0ff" stroke-width="2"/><text x="800" y="220" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">LOWE'S</text><text x="800" y="262" text-anchor="middle" fill="#e7f5ff" font-family="Arial, Helvetica, sans-serif" font-size="24">Private-brand control</text><text x="800" y="294" text-anchor="middle" fill="#d5ebfc" font-family="Arial, Helvetica, sans-serif" font-size="20">Primary retail channel</text></g>
  <path d="M800 317V375" stroke="#70bfff" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="535" y="390" width="530" height="137" rx="22" fill="#102b43" stroke="#70bfff" stroke-width="3"/><text x="800" y="444" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">KOBALT</text><text x="800" y="485" text-anchor="middle" fill="#bfe3ff" font-family="Arial, Helvetica, sans-serif" font-size="23">Tools · outdoor equipment · storage · cleanup</text></g>
  <path d="M645 527L360 625" stroke="#70bfff" stroke-width="5" marker-end="url(#arrow)"/><path d="M800 527V625" stroke="#70bfff" stroke-width="5" marker-end="url(#arrow)"/><path d="M955 527L1240 625" stroke="#70bfff" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="100" y="642" width="470" height="164" rx="22" fill="#132535" stroke="#4d88b7" stroke-width="2"/><text x="335" y="692" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">PRODUCT-SPECIFIC SUPPLIERS</text><text x="335" y="733" text-anchor="middle" fill="#b8d8ef" font-family="Arial, Helvetica, sans-serif" font-size="21">Manufacturer varies by model and period</text><text x="335" y="771" text-anchor="middle" fill="#7fc5fa" font-family="Arial, Helvetica, sans-serif" font-size="19">Greenworks / Globe documented for some OPE</text></g>
  <g filter="url(#shadow)"><rect x="600" y="642" width="400" height="164" rx="22" fill="#163653" stroke="#63b9fa" stroke-width="2"/><text x="800" y="692" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">24V MAX PLATFORM</text><text x="800" y="733" text-anchor="middle" fill="#c7e7ff" font-family="Arial, Helvetica, sans-serif" font-size="21">More than 75 current tools</text><text x="800" y="771" text-anchor="middle" fill="#7fc5fa" font-family="Arial, Helvetica, sans-serif" font-size="19">Compatibility system, not a manufacturer</text></g>
  <g filter="url(#shadow)"><rect x="1030" y="642" width="470" height="164" rx="22" fill="#132535" stroke="#4d88b7" stroke-width="2"/><text x="1265" y="692" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">MODEL-LEVEL RESPONSIBILITY</text><text x="1265" y="733" text-anchor="middle" fill="#b8d8ef" font-family="Arial, Helvetica, sans-serif" font-size="21">Origin · importer · warranty · recall</text><text x="1265" y="771" text-anchor="middle" fill="#7fc5fa" font-family="Arial, Helvetica, sans-serif" font-size="19">Verify the exact SKU and battery</text></g>
  <text x="800" y="858" text-anchor="middle" fill="#9bcbed" font-family="Arial, Helvetica, sans-serif" font-size="20">A private-brand logo does not identify one factory, country or service company.</text>
</svg>
