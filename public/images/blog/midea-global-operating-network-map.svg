<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Midea Group 2025 global operating network and product-level verification chain</title>
  <desc id="desc">Midea reported 43 major overseas manufacturing bases, 29 research and development centers, and localized operations in 50 major countries, while product responsibility remains model specific.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f7f8"/><stop offset="1" stop-color="#d9e8eb"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".15"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="92" y="105" fill="#143641" font-family="Arial, sans-serif" font-size="50" font-weight="700">Global scale sets the context—not the SKU answer</text>
  <text x="92" y="155" fill="#577682" font-family="Arial, sans-serif" font-size="24">Midea Group 2025 disclosures and the document chain buyers still need</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="95" y="235" width="420" height="220" rx="26" fill="#123c49"/>
    <text x="145" y="300" fill="#9feaf0" font-size="23" font-weight="700">MAJOR OVERSEAS</text>
    <text x="145" y="390" fill="#ffffff" font-size="112" font-weight="800">43</text>
    <text x="300" y="380" fill="#ffffff" font-size="30" font-weight="700">manufacturing</text><text x="300" y="420" fill="#ffffff" font-size="30" font-weight="700">bases</text>
    <rect x="590" y="235" width="420" height="220" rx="26" fill="#126173"/>
    <text x="640" y="300" fill="#b8f2f5" font-size="23" font-weight="700">GLOBAL R&amp;D</text>
    <text x="640" y="390" fill="#ffffff" font-size="112" font-weight="800">29</text>
    <text x="815" y="400" fill="#ffffff" font-size="36" font-weight="700">centers</text>
    <rect x="1085" y="235" width="420" height="220" rx="26" fill="#c76f2c"/>
    <text x="1135" y="300" fill="#fff0de" font-size="23" font-weight="700">LOCALIZED SELF-OPERATED</text>
    <text x="1135" y="390" fill="#ffffff" font-size="112" font-weight="800">50</text>
    <text x="1310" y="380" fill="#ffffff" font-size="30" font-weight="700">major</text><text x="1310" y="420" fill="#ffffff" font-size="30" font-weight="700">countries</text>
    <rect x="95" y="540" width="1410" height="220" rx="26" fill="#ffffff"/>
    <text x="145" y="600" fill="#143641" font-size="25" font-weight="700">FOR THE EXACT PRODUCT, FOLLOW THE RESPONSIBILITY CHAIN</text>
    <g fill="#e7f2f4" stroke="#a4cbd0" stroke-width="2">
      <rect x="145" y="640" width="220" height="70" rx="14"/><rect x="415" y="640" width="220" height="70" rx="14"/><rect x="685" y="640" width="220" height="70" rx="14"/><rect x="955" y="640" width="220" height="70" rx="14"/><rect x="1225" y="640" width="220" height="70" rx="14"/>
    </g>
    <g fill="#1b4651" font-size="23" font-weight="700" text-anchor="middle">
      <text x="255" y="683">Model label</text><text x="525" y="683">Legal maker</text><text x="795" y="683">Factory &amp; origin</text><text x="1065" y="683">Local seller</text><text x="1335" y="683">Warranty</text>
    </g>
  </g>
  <text x="800" y="834" text-anchor="middle" fill="#577682" font-family="Arial, sans-serif" font-size="22">Source: Midea Group 2025 annual-report investor disclosures</text>
</svg>
