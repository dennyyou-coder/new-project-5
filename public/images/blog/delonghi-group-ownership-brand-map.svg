<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">De’Longhi Group ownership and brand portfolio map</title>
  <desc id="desc">A map separating the listed group, controlling shareholder, owned appliance brands, and the licensed Braun household business.</desc>
  <rect width="1600" height="900" fill="#f5f7fb"/>
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#102a43">De’Longhi Group: ownership and brand portfolio</text>
  <text x="100" y="158" font-family="Arial, sans-serif" font-size="24" fill="#486581">Ownership, brand control and licensing are different relationships</text>
  <rect x="555" y="210" width="490" height="120" rx="24" fill="#163b65"/>
  <text x="800" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#d9eaf7">Listed operating group</text>
  <text x="800" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#fff">De’ Longhi S.p.A.</text>
  <rect x="100" y="220" width="350" height="100" rx="20" fill="#e4eff7" stroke="#2f6f9f" stroke-width="3"/>
  <text x="275" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#486581">Controlling shareholder</text>
  <text x="275" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#102a43">De Longhi Industrial S.A.</text>
  <path d="M450 270H555" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="800" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#486581">GROUP PORTFOLIO AND OPERATING RESPONSIBILITY</text>
  <path d="M800 330V450M300 450H1300" stroke="#7895ad" stroke-width="4" fill="none"/>
  <path d="M300 450V505M635 450V505M965 450V505M1300 450V505" stroke="#7895ad" stroke-width="4"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="120" y="505" width="360" height="180" rx="24" fill="#fff" stroke="#2f6f9f" stroke-width="3"/>
    <text x="300" y="563" font-size="30" font-weight="700" fill="#102a43">De’Longhi</text><text x="300" y="606" font-size="22" fill="#486581">Owned flagship brand</text><text x="300" y="641" font-size="20" fill="#627d98">Coffee and home appliances</text>
    <rect x="505" y="505" width="260" height="180" rx="24" fill="#fff" stroke="#2f6f9f" stroke-width="3"/>
    <text x="635" y="563" font-size="30" font-weight="700" fill="#102a43">Kenwood</text><text x="635" y="606" font-size="22" fill="#486581">Owned brand</text><text x="635" y="641" font-size="20" fill="#627d98">Food preparation</text>
    <rect x="835" y="505" width="260" height="180" rx="24" fill="#fff" stroke="#2f6f9f" stroke-width="3"/>
    <text x="965" y="563" font-size="30" font-weight="700" fill="#102a43">Ariete</text><text x="965" y="606" font-size="22" fill="#486581">Owned brand</text><text x="965" y="641" font-size="20" fill="#627d98">Small appliances</text>
    <rect x="1120" y="505" width="360" height="180" rx="24" fill="#fff8e8" stroke="#c98b20" stroke-width="3"/>
    <text x="1300" y="563" font-size="30" font-weight="700" fill="#7a4b00">Braun Household</text><text x="1300" y="606" font-size="22" fill="#7a4b00">Perpetual licensed business</text><text x="1300" y="641" font-size="20" fill="#8d6a2f">Trademark remains with P&amp;G</text>
  </g>
  <rect x="100" y="750" width="1400" height="78" rx="18" fill="#e8eef5"/>
  <text x="800" y="799" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#334e68">Also in the portfolio: Nutribullet, Magic Bullet and professional coffee brands</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f6f9f"/></marker></defs>
</svg>
