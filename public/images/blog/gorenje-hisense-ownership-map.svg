<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Gorenje ownership within Hisense Group</title><desc id="desc">Hisense Group owns Gorenje, with Hisense Europe operating the Hisense, Gorenje and ASKO brands in Europe.</desc><rect width="1600" height="900" fill="#f5f7fb"/><text x="100" y="110" font-family="Arial" font-size="48" font-weight="700" fill="#102a43">Gorenje within Hisense Group</text><text x="100" y="165" font-family="Arial" font-size="25" fill="#486581">Ownership, regional operations and product responsibility are separate</text><rect x="570" y="215" width="460" height="125" rx="24" fill="#163b65"/><text x="800" y="270" text-anchor="middle" font-family="Arial" font-size="25" fill="#cde2f2">Corporate owner</text><text x="800" y="312" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#fff">Hisense Group</text><path d="M800 340V440" stroke="#7895ad" stroke-width="5"/><rect x="570" y="440" width="460" height="125" rx="24" fill="#2f6f9f"/><text x="800" y="490" text-anchor="middle" font-family="Arial" font-size="23" fill="#d9eaf7">Integrated European business since 2018</text><text x="800" y="535" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#fff">Hisense Europe</text><path d="M800 565V650M300 650H1300" stroke="#7895ad" stroke-width="4"/><g font-family="Arial" text-anchor="middle"><rect x="120" y="650" width="360" height="150" rx="23" fill="#fff" stroke="#517b9b" stroke-width="3"/><text x="300" y="710" font-size="32" font-weight="700" fill="#102a43">Hisense</text><text x="300" y="754" font-size="21" fill="#486581">Global electronics &amp; appliances</text><rect x="620" y="650" width="360" height="150" rx="23" fill="#fff8e8" stroke="#c98b20" stroke-width="3"/><text x="800" y="710" font-size="32" font-weight="700" fill="#7a4b00">Gorenje</text><text x="800" y="754" font-size="21" fill="#7a4b00">Slovenian-origin appliance brand</text><rect x="1120" y="650" width="360" height="150" rx="23" fill="#fff" stroke="#517b9b" stroke-width="3"/><text x="1300" y="710" font-size="32" font-weight="700" fill="#102a43">ASKO</text><text x="1300" y="754" font-size="21" fill="#486581">Premium appliance brand</text></g></svg>
