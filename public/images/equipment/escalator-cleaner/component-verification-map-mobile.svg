<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1600" role="img" aria-labelledby="title desc"><title id="title">Escalator cleaner mobile verification map</title><desc id="desc">Five stacked escalator cleaning verification zones.</desc><rect width="800" height="1600" rx="36" fill="#eef1f2"/><text x="55" y="92" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#173b40">Verify machine + escalator</text><text x="55" y="140" font-family="Arial,sans-serif" font-size="21" fill="#50656a">Procedure, fit, cleaning, moisture, handover.</text><g font-family="Arial,sans-serif"><g transform="translate(55 205)"><rect width="690" height="205" rx="24" fill="#173b40"/><text x="28" y="58" font-size="27" font-weight="700" fill="#fff">01 Site control</text><text x="28" y="105" font-size="21" fill="#e1ecee">Owner procedure · barriers</text><text x="28" y="145" font-size="21" fill="#e1ecee">Direction · state · supervision</text></g><g transform="translate(55 435)"><rect width="690" height="205" rx="24" fill="#34727a"/><text x="28" y="58" font-size="27" font-weight="700" fill="#fff">02 Step fit</text><text x="28" y="105" font-size="21" fill="#edf6f7">Tread · riser · grooves</text><text x="28" y="145" font-size="21" fill="#edf6f7">Guides · combs · clearance</text></g><g transform="translate(55 665)"><rect width="690" height="205" rx="24" fill="#d5aa4b"/><text x="28" y="58" font-size="27" font-weight="700" fill="#173b40">03 Cleaning system</text><text x="28" y="105" font-size="21" fill="#29464a">Brush · speed · pressure</text><text x="28" y="145" font-size="21" fill="#29464a">Dry/wet cycle · surface scope</text></g><g transform="translate(55 895)"><rect width="690" height="205" rx="24" fill="#4e7a67"/><text x="28" y="58" font-size="27" font-weight="700" fill="#fff">04 Moisture control</text><text x="28" y="105" font-size="21" fill="#eff6f2">Chemical · flow · recovery</text><text x="28" y="145" font-size="21" fill="#eff6f2">Inspect leakage and the pit</text></g><g transform="translate(55 1125)"><rect width="690" height="205" rx="24" fill="#69576c"/><text x="28" y="58" font-size="27" font-weight="700" fill="#fff">05 Handover</text><text x="28" y="105" font-size="21" fill="#f4eef5">Dryness · surface checklist</text><text x="28" y="145" font-size="21" fill="#f4eef5">Authorized return to service</text></g></g><text x="400" y="1460" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#173b40">Buyer gate: witness the exact-site trial.</text><text x="400" y="1535" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#6b7d7f">Family labels do not establish cross-model compatibility</text></svg>
