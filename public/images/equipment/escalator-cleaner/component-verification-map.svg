<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Escalator cleaner verification map</title><desc id="desc">Five verification zones from site control to return to service.</desc><rect width="1600" height="1000" rx="40" fill="#eef1f2"/><text x="90" y="105" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#173b40">Verify machine, conveyance and procedure</text><text x="90" y="160" font-family="Arial,sans-serif" font-size="25" fill="#50656a">Tread, riser, direction, moisture and owner authorization are separate gates.</text><g font-family="Arial,sans-serif"><g transform="translate(90 245)"><rect width="260" height="420" rx="26" fill="#173b40"/><text x="28" y="65" font-size="27" font-weight="700" fill="#fff">01 Site control</text><text x="28" y="125" font-size="22" fill="#e1ecee">Owner procedure</text><text x="28" y="166" font-size="22" fill="#e1ecee">Barriers</text><text x="28" y="207" font-size="22" fill="#e1ecee">Direction + state</text><text x="28" y="248" font-size="22" fill="#e1ecee">Supervision</text></g><g transform="translate(380 245)"><rect width="260" height="420" rx="26" fill="#34727a"/><text x="28" y="65" font-size="27" font-weight="700" fill="#fff">02 Step fit</text><text x="28" y="125" font-size="22" fill="#edf6f7">Tread + riser</text><text x="28" y="166" font-size="22" fill="#edf6f7">Groove geometry</text><text x="28" y="207" font-size="22" fill="#edf6f7">Guides + combs</text><text x="28" y="248" font-size="22" fill="#edf6f7">Edge clearance</text></g><g transform="translate(670 245)"><rect width="260" height="420" rx="26" fill="#d5aa4b"/><text x="28" y="65" font-size="27" font-weight="700" fill="#173b40">03 Cleaning</text><text x="28" y="125" font-size="22" fill="#29464a">Brush code</text><text x="28" y="166" font-size="22" fill="#29464a">Speed + pressure</text><text x="28" y="207" font-size="22" fill="#29464a">Dry or wet cycle</text><text x="28" y="248" font-size="22" fill="#29464a">Surface scope</text></g><g transform="translate(960 245)"><rect width="260" height="420" rx="26" fill="#4e7a67"/><text x="28" y="65" font-size="27" font-weight="700" fill="#fff">04 Moisture</text><text x="28" y="125" font-size="22" fill="#eff6f2">Approved chemical</text><text x="28" y="166" font-size="22" fill="#eff6f2">Flow + foam</text><text x="28" y="207" font-size="22" fill="#eff6f2">Recovery seal</text><text x="28" y="248" font-size="22" fill="#eff6f2">Leak inspection</text></g><g transform="translate(1250 245)"><rect width="260" height="420" rx="26" fill="#69576c"/><text x="28" y="65" font-size="27" font-weight="700" fill="#fff">05 Handover</text><text x="28" y="125" font-size="22" fill="#f4eef5">Residual moisture</text><text x="28" y="166" font-size="22" fill="#f4eef5">Pit + comb plate</text><text x="28" y="207" font-size="22" fill="#f4eef5">Surface checklist</text><text x="28" y="248" font-size="22" fill="#f4eef5">Release authority</text></g><path d="M350 455h30M640 455h30M930 455h30M1220 455h30" stroke="#8da0a4" stroke-width="9"/></g><rect x="90" y="735" width="1420" height="165" rx="28" fill="#fff" stroke="#cad5d7" stroke-width="3"/><text x="130" y="800" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#173b40">Buyer gate</text><text x="130" y="850" font-family="Arial,sans-serif" font-size="25" fill="#50656a">Require a witnessed demonstration on the exact escalator before acceptance.</text><text x="800" y="945" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#6b7d7f">Family labels do not establish cross-model compatibility</text></svg>
