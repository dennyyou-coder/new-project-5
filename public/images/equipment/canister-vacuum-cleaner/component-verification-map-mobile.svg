<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1600" viewBox="0 0 800 1600" role="img" aria-labelledby="t"><title id="t">Canister vacuum verification map mobile</title><rect width="800" height="1600" fill="#f4f7fb"/><text x="60" y="95" font-family="Arial" font-size="42" font-weight="700" fill="#13233a">Two paths, one system</text><text x="60" y="150" font-family="Arial" font-size="22" fill="#52657d">Match body, hose, wand and nozzle</text><g font-family="Arial" font-size="27" font-weight="700" fill="#13233a"><g fill="#fff" stroke="#5b7c99" stroke-width="4"><rect x="80" y="245" width="640" height="170" rx="24"/><rect x="80" y="465" width="640" height="170" rx="24"/><rect x="80" y="685" width="640" height="170" rx="24"/><rect x="80" y="905" width="640" height="170" rx="24"/></g><text x="120" y="340">1 · Nozzle + wand</text><text x="120" y="560">2 · Hose + seals</text><text x="120" y="780">3 · Bag or bin</text><text x="120" y="1000">4 · Motor + filters + exhaust</text></g><rect x="80" y="1190" width="640" height="290" rx="28" fill="#13233a"/><text x="120" y="1270" font-family="Arial" font-size="28" font-weight="700" fill="#fff">Verify matched test conditions</text><text x="120" y="1340" font-family="Arial" font-size="22" fill="#dbe7f2">Nozzle · surface · sound method · spares</text><text x="120" y="1410" font-family="Arial" font-size="21" font-weight="700" fill="#ffbd8e">Family labels do not establish</text><text x="120" y="1440" font-family="Arial" font-size="21" font-weight="700" fill="#ffbd8e">cross-model compatibility</text></svg>
