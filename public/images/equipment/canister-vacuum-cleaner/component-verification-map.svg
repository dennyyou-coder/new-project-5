<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t"><title id="t">Canister vacuum verification map</title><rect width="1600" height="1000" fill="#f4f7fb"/><text x="100" y="105" font-family="Arial" font-size="52" font-weight="700" fill="#13233a">Canister vacuum: two paths, one system</text><text x="100" y="165" font-family="Arial" font-size="25" fill="#52657d">Airflow performance and physical reach depend on the delivered body, hose, wand and nozzle.</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#5b7c99" stroke-width="4"><rect x="100" y="285" width="260" height="180" rx="28"/><rect x="425" y="285" width="260" height="180" rx="28"/><rect x="750" y="285" width="260" height="180" rx="28"/><rect x="1075" y="285" width="425" height="180" rx="28"/></g><g fill="#13233a" font-size="28" font-weight="700"><text x="230" y="350">Nozzle + wand</text><text x="555" y="350">Hose + seals</text><text x="880" y="350">Bag or bin</text><text x="1288" y="350">Motor + filters + exhaust</text></g><g fill="#52657d" font-size="21"><text x="230" y="405">surface · pickup</text><text x="555" y="405">reach · leakage</text><text x="880" y="405">capacity · code</text><text x="1288" y="405">airflow · noise · emissions</text></g></g><g stroke="#e56b3f" stroke-width="8"><path d="M360 375h65"/><path d="M685 375h65"/><path d="M1010 375h65"/></g><rect x="100" y="590" width="1400" height="245" rx="32" fill="#13233a"/><text x="150" y="665" font-family="Arial" font-size="30" font-weight="700" fill="#fff">Buyer evidence pack</text><text x="150" y="720" font-family="Arial" font-size="25" fill="#dbe7f2">Matched nozzle test · dust containment · reach · sound method · bag/filter codes · regional circuit</text><text x="150" y="790" font-family="Arial" font-size="24" font-weight="700" fill="#ffbd8e">Family labels do not establish cross-model compatibility</text></svg>
