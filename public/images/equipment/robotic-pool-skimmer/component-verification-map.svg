<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc"><title id="title">Robotic pool skimmer component verification map</title><desc id="desc">Buyer checks from charging and propulsion through sensing, debris capture, software and retrieval.</desc><rect width="1440" height="720" rx="32" fill="#eaf3f2"/><text x="72" y="82" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#123b36">Robotic pool-skimmer verification chain</text><text x="72" y="124" font-family="Arial,sans-serif" font-size="20" fill="#45625e">Verify the actual pool, sunlight, obstacles, debris and service path.</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#8fa9a5" stroke-width="2"><rect x="55" y="220" width="200" height="170" rx="22"/><rect x="275" y="220" width="200" height="170" rx="22"/><rect x="495" y="220" width="200" height="170" rx="22"/><rect x="715" y="220" width="200" height="170" rx="22"/><rect x="935" y="220" width="200" height="170" rx="22"/><rect x="1155" y="220" width="230" height="170" rx="22"/></g><g fill="#173f3a" font-size="21" font-weight="700"><text x="155" y="272">Power</text><text x="375" y="272">Propulsion</text><text x="595" y="272">Sensing</text><text x="815" y="272">Inlet &amp; basket</text><text x="1035" y="272">App &amp; firmware</text><text x="1270" y="272">Retrieval &amp; storage</text></g><g fill="#536e69" font-size="16"><text x="155" y="316">solar · battery</text><text x="155" y="344">charger · temperature</text><text x="375" y="316">motor · paddle</text><text x="375" y="344">edge behavior</text><text x="595" y="316">obstacles · shade</text><text x="595" y="344">cleaning · trial</text><text x="815" y="316">filter · capacity</text><text x="815" y="344">non-return flap</text><text x="1035" y="316">offline mode</text><text x="1035" y="344">updates · privacy</text><text x="1270" y="316">wet weight</text><text x="1270" y="344">rinse · dry · codes</text></g></g><rect x="72" y="514" width="1296" height="112" rx="18" fill="#163f39"/><text x="720" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">Family labels do not establish cross-model compatibility</text><text x="720" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#d4e6df">Record model, firmware, charger, basket, filter and replacement-part codes.</text></svg>
