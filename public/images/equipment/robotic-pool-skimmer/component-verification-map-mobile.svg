<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1360" viewBox="0 0 760 1360" role="img" aria-labelledby="title desc"><title id="title">Robotic pool skimmer component verification map</title><desc id="desc">Mobile verification chain.</desc><rect width="760" height="1360" rx="28" fill="#eaf3f2"/><text x="48" y="74" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#123b36">Pool-skimmer chain</text><text x="48" y="112" font-family="Arial,sans-serif" font-size="18" fill="#45625e">Verify actual pool and model.</text><g font-family="Arial,sans-serif"><g fill="#fff" stroke="#8fa9a5" stroke-width="2"><rect x="48" y="160" width="664" height="130" rx="20"/><rect x="48" y="315" width="664" height="130" rx="20"/><rect x="48" y="470" width="664" height="130" rx="20"/><rect x="48" y="625" width="664" height="130" rx="20"/><rect x="48" y="780" width="664" height="130" rx="20"/><rect x="48" y="935" width="664" height="130" rx="20"/></g><g fill="#173f3a" font-size="22" font-weight="700"><text x="78" y="208">1 · Power</text><text x="78" y="363">2 · Propulsion</text><text x="78" y="518">3 · Sensing</text><text x="78" y="673">4 · Inlet &amp; basket</text><text x="78" y="828">5 · App &amp; firmware</text><text x="78" y="983">6 · Retrieval &amp; storage</text></g><g fill="#536e69" font-size="17"><text x="78" y="250">solar · battery · charger · temperature</text><text x="78" y="405">motor · paddle · edge behavior</text><text x="78" y="560">obstacles · shade · cleaning · trial</text><text x="78" y="715">filter · capacity · non-return flap</text><text x="78" y="870">offline mode · updates · privacy</text><text x="78" y="1025">wet weight · rinse · dry · part codes</text></g></g><rect x="48" y="1120" width="664" height="165" rx="20" fill="#163f39"/><text x="380" y="1172" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Family labels do not establish</text><text x="380" y="1202" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">cross-model compatibility</text><text x="380" y="1250" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d4e6df">Record firmware, charger, basket and filter codes.</text></svg>
