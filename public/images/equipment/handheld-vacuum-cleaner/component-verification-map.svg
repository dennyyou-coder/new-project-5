<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Handheld vacuum verification map</title><desc id="desc">Buyer checks across energy, air path, collection and tools.</desc><rect width="1600" height="1000" fill="#eef2f5"/><text x="100" y="115" font-family="Arial" font-size="56" font-weight="700" fill="#223746">Verify the complete handheld air path</text><g font-family="Arial" fill="#223746"><rect x="100" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="140" y="285" font-size="34" font-weight="700">01 Energy</text><text x="140" y="350" font-size="25">Battery code</text><text x="140" y="400" font-size="25">Charger region</text><text x="140" y="450" font-size="25">Task runtime</text><rect x="465" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="505" y="285" font-size="34" font-weight="700">02 Air path</text><text x="505" y="350" font-size="25">Inlet geometry</text><text x="505" y="400" font-size="25">Motor and mode</text><text x="505" y="450" font-size="25">Seal condition</text><rect x="830" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="870" y="285" font-size="34" font-weight="700">03 Collection</text><text x="870" y="350" font-size="25">Bin and latch</text><text x="870" y="400" font-size="25">Separator</text><text x="870" y="450" font-size="25">Filter code</text><rect x="1195" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="1235" y="285" font-size="34" font-weight="700">04 Task tool</text><text x="1235" y="350" font-size="25">Crevice reach</text><text x="1235" y="400" font-size="25">Surface approval</text><text x="1235" y="450" font-size="25">Brush service</text></g><path d="M400 425h65m300 0h65m300 0h65" stroke="#e06039" stroke-width="14"/><text x="100" y="805" font-family="Arial" font-size="30" font-weight="700" fill="#223746">Buyer gate: trial the exact debris, nozzle, filter state, user and emptying cycle.</text><text x="100" y="875" font-family="Arial" font-size="25" fill="#526a78">Family labels do not establish cross-model compatibility</text></svg>
