<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc"><title id="title">Electric pressure washer component verification map</title><desc id="desc">Buyer checks from circuit and water inlet through motor, pump, hose and nozzle.</desc><rect width="1440" height="720" rx="32" fill="#eef2eb"/><text x="72" y="82" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#123b36">Electric pressure-washer verification chain</text><text x="72" y="124" font-family="Arial,sans-serif" font-size="20" fill="#45625e">Keep electrical, hydraulic and spray-equipment ratings tied to the exact model.</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#99aaa6" stroke-width="2"><rect x="55" y="220" width="200" height="170" rx="22"/><rect x="275" y="220" width="200" height="170" rx="22"/><rect x="495" y="220" width="200" height="170" rx="22"/><rect x="715" y="220" width="200" height="170" rx="22"/><rect x="935" y="220" width="200" height="170" rx="22"/><rect x="1155" y="220" width="230" height="170" rx="22"/></g><g fill="#173f3a" font-size="21" font-weight="700"><text x="155" y="272">Circuit</text><text x="375" y="272">Water inlet</text><text x="595" y="272">Motor &amp; pump</text><text x="815" y="272">HP hose</text><text x="1035" y="272">Gun &amp; lance</text><text x="1270" y="272">Nozzle &amp; surface</text></g><g fill="#536e69" font-size="16"><text x="155" y="316">voltage · GFCI</text><text x="155" y="344">cord condition</text><text x="375" y="316">flow · pressure</text><text x="375" y="344">temperature · filter</text><text x="595" y="316">rated point</text><text x="595" y="344">shutdown · storage</text><text x="815" y="316">rating · code</text><text x="815" y="344">abrasion · coupling</text><text x="1035" y="316">trigger lock</text><text x="1035" y="344">pressure release</text><text x="1270" y="316">angle · distance</text><text x="1270" y="344">hidden-area trial</text></g></g><rect x="72" y="514" width="1296" height="112" rx="18" fill="#163f39"/><text x="720" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">Family labels do not establish cross-model compatibility</text><text x="720" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#d4e6df">Verify every pressure-containing part, connector, nozzle and circuit requirement.</text></svg>
