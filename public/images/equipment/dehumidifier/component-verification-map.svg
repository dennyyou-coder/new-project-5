<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Portable dehumidifier verification map</title><desc id="d">Buyer checks from room conditions through airflow, refrigeration and drainage.</desc><rect width="1600" height="1000" fill="#eef2f5"/><text x="100" y="115" font-family="Arial" font-size="56" font-weight="700" fill="#223746">Verify the complete moisture-removal system</text><g font-family="Arial" fill="#223746"><rect x="100" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="140" y="285" font-size="34" font-weight="700">01 Define</text><text x="140" y="350" font-size="25">Temperature and RH</text><text x="140" y="400" font-size="25">Moisture source</text><text x="140" y="450" font-size="25">Rating method</text><rect x="465" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="505" y="285" font-size="34" font-weight="700">02 Move</text><text x="505" y="350" font-size="25">Filter and inlet</text><text x="505" y="400" font-size="25">Fan and clearance</text><text x="505" y="450" font-size="25">Humidity sensing</text><rect x="830" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="870" y="285" font-size="34" font-weight="700">03 Condense</text><text x="870" y="350" font-size="25">Refrigerant label</text><text x="870" y="400" font-size="25">Coils and compressor</text><text x="870" y="450" font-size="25">Defrost control</text><rect x="1195" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="1235" y="285" font-size="34" font-weight="700">04 Drain</text><text x="1235" y="350" font-size="25">Bucket and float</text><text x="1235" y="400" font-size="25">Gravity or pump</text><text x="1235" y="450" font-size="25">Exact hose route</text></g><path d="M400 425h65m300 0h65m300 0h65" stroke="#e06039" stroke-width="14"/><text x="100" y="805" font-family="Arial" font-size="30" font-weight="700" fill="#223746">Buyer gate: compare extraction at matched temperature and humidity.</text><text x="100" y="875" font-family="Arial" font-size="25" fill="#526a78">Family labels do not establish cross-model compatibility</text></svg>
