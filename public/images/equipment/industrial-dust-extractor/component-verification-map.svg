<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Industrial dust extractor verification map</title><desc id="desc">Verification zones from source capture through controlled disposal.</desc><rect width="1600" height="1000" rx="40" fill="#eef2f3"/><text x="90" y="105" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#143a3d">Verify the complete dust-control system</text><text x="90" y="160" font-family="Arial,sans-serif" font-size="25" fill="#496367">Model claims stop at the exact tool, hose, filter, dust and jurisdiction.</text><g font-family="Arial,sans-serif"><g transform="translate(90 245)"><rect width="260" height="420" rx="26" fill="#143a3d"/><text x="28" y="65" font-size="27" font-weight="700" fill="#fff">01 Source capture</text><text x="28" y="125" font-size="22" fill="#d7e8e5">Tool + shroud</text><text x="28" y="166" font-size="22" fill="#d7e8e5">Required airflow</text><text x="28" y="207" font-size="22" fill="#d7e8e5">Task approval</text><text x="28" y="248" font-size="22" fill="#d7e8e5">Seal at source</text></g><g transform="translate(380 245)"><rect width="260" height="420" rx="26" fill="#2f6e70"/><text x="28" y="65" font-size="27" font-weight="700" fill="#fff">02 Transport</text><text x="28" y="125" font-size="22" fill="#e8f5f2">Hose diameter</text><text x="28" y="166" font-size="22" fill="#e8f5f2">Length + cuffs</text><text x="28" y="207" font-size="22" fill="#e8f5f2">Conductivity</text><text x="28" y="248" font-size="22" fill="#e8f5f2">Leak inspection</text></g><g transform="translate(670 245)"><rect width="260" height="420" rx="26" fill="#d7a84a"/><text x="28" y="65" font-size="27" font-weight="700" fill="#152f32">03 Collection</text><text x="28" y="125" font-size="22" fill="#243f42">Bag material</text><text x="28" y="166" font-size="22" fill="#243f42">Usable capacity</text><text x="28" y="207" font-size="22" fill="#243f42">Closure method</text><text x="28" y="248" font-size="22" fill="#243f42">Waste route</text></g><g transform="translate(960 245)"><rect width="260" height="420" rx="26" fill="#457d68"/><text x="28" y="65" font-size="27" font-weight="700" fill="#fff">04 Filtration</text><text x="28" y="125" font-size="22" fill="#eff8f4">Exact filter code</text><text x="28" y="166" font-size="22" fill="#eff8f4">Machine class</text><text x="28" y="207" font-size="22" fill="#eff8f4">Cleaning cycle</text><text x="28" y="248" font-size="22" fill="#eff8f4">Change containment</text></g><g transform="translate(1250 245)"><rect width="260" height="420" rx="26" fill="#6d596e"/><text x="28" y="65" font-size="27" font-weight="700" fill="#fff">05 Air + alarm</text><text x="28" y="125" font-size="22" fill="#f4ebf4">Loaded airflow</text><text x="28" y="166" font-size="22" fill="#f4ebf4">Alarm threshold</text><text x="28" y="207" font-size="22" fill="#f4ebf4">Tool socket load</text><text x="28" y="248" font-size="22" fill="#f4ebf4">Regional voltage</text></g><path d="M350 455h30M640 455h30M930 455h30M1220 455h30" stroke="#8ca1a3" stroke-width="9"/></g><rect x="90" y="735" width="1420" height="165" rx="28" fill="#fff" stroke="#c8d5d6" stroke-width="3"/><text x="130" y="800" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#143a3d">Buyer gate</text><text x="130" y="850" font-family="Arial,sans-serif" font-size="25" fill="#496367">Verify the configured system under the intended dust loading and disposal cycle.</text><text x="800" y="945" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#6b7d7f">Family labels do not establish cross-model compatibility</text></svg>
