<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1600" role="img" aria-labelledby="title desc"><title id="title">Industrial dust extractor mobile verification map</title><desc id="desc">Five stacked dust-control verification zones.</desc><rect width="800" height="1600" rx="36" fill="#eef2f3"/><text x="55" y="92" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#143a3d">Verify the full system</text><text x="55" y="140" font-family="Arial,sans-serif" font-size="21" fill="#496367">Tool, hose, collection, filter, airflow.</text><g font-family="Arial,sans-serif"><g transform="translate(55 205)"><rect width="690" height="205" rx="24" fill="#143a3d"/><text x="28" y="58" font-size="27" font-weight="700" fill="#fff">01 Source capture</text><text x="28" y="105" font-size="21" fill="#d7e8e5">Tool + shroud · required airflow</text><text x="28" y="145" font-size="21" fill="#d7e8e5">Task approval · seal at source</text></g><g transform="translate(55 435)"><rect width="690" height="205" rx="24" fill="#2f6e70"/><text x="28" y="58" font-size="27" font-weight="700" fill="#fff">02 Transport</text><text x="28" y="105" font-size="21" fill="#e8f5f2">Diameter · length · cuffs</text><text x="28" y="145" font-size="21" fill="#e8f5f2">Conductivity · leak inspection</text></g><g transform="translate(55 665)"><rect width="690" height="205" rx="24" fill="#d7a84a"/><text x="28" y="58" font-size="27" font-weight="700" fill="#152f32">03 Collection</text><text x="28" y="105" font-size="21" fill="#243f42">Bag · usable capacity · closure</text><text x="28" y="145" font-size="21" fill="#243f42">Material-specific waste route</text></g><g transform="translate(55 895)"><rect width="690" height="205" rx="24" fill="#457d68"/><text x="28" y="58" font-size="27" font-weight="700" fill="#fff">04 Filtration</text><text x="28" y="105" font-size="21" fill="#eff8f4">Exact code · machine class</text><text x="28" y="145" font-size="21" fill="#eff8f4">Cleaning · contained change</text></g><g transform="translate(55 1125)"><rect width="690" height="205" rx="24" fill="#6d596e"/><text x="28" y="58" font-size="27" font-weight="700" fill="#fff">05 Airflow + warning</text><text x="28" y="105" font-size="21" fill="#f4ebf4">Loaded flow · alarm threshold</text><text x="28" y="145" font-size="21" fill="#f4ebf4">Socket load · regional voltage</text></g></g><text x="400" y="1460" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#143a3d">Buyer gate: verify under real dust loading.</text><text x="400" y="1535" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#6b7d7f">Family labels do not establish cross-model compatibility</text></svg>
