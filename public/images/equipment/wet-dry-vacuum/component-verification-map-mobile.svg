<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1600" viewBox="0 0 800 1600" role="img" aria-labelledby="title desc"><title id="title">Mobile Wet &amp; dry vacuum verification</title><desc id="desc">Four stacked model-specific verification zones. Family labels do not establish cross-model compatibility.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2930"/><stop offset="1" stop-color="#123f43"/></linearGradient></defs><rect width="800" height="1600" rx="30" fill="#eff6f4"/><rect width="800" height="220" rx="30" fill="url(#bg)"/><rect y="190" width="800" height="30" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="50" y="58" fill="#7fe0cf" font-size="22" font-weight="700" letter-spacing="3">WCB TECHNICAL DIAGRAM</text><text x="50" y="112" fill="#fff" font-size="34" font-weight="800">Wet &amp; dry vacuum verification</text><text x="50" y="166" fill="#c7dcda" font-size="21">Confirm identifiers before decisions.</text><g><rect x="50" y="260" width="700" height="250" rx="24" fill="#fff" stroke="#c7dbd7" stroke-width="2"/><circle cx="104" cy="322" r="32" fill="#0d766e"/><text x="104" y="332" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">01</text><text x="156" y="312" fill="#123846" font-size="29" font-weight="800">Pickup interface</text><text x="156" y="350" fill="#557076" font-size="21">tool + hose + coupling</text><line x1="86" y1="386" x2="714" y2="386" stroke="#d5e1df" stroke-width="2"/><text x="86" y="434" fill="#183b40" font-size="21" font-weight="700">VERIFY</text><text x="184" y="434" fill="#365960" font-size="21">task approval · diameter · seal</text><text x="86" y="478" fill="#557076" font-size="19">Exact model · configuration · market · serial range</text></g>
<g><rect x="50" y="550" width="700" height="250" rx="24" fill="#fff" stroke="#c7dbd7" stroke-width="2"/><circle cx="104" cy="612" r="32" fill="#0d766e"/><text x="104" y="622" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">02</text><text x="156" y="602" fill="#123846" font-size="29" font-weight="800">Mode configuration</text><text x="156" y="640" fill="#557076" font-size="21">filter + bag + float</text><line x1="86" y1="676" x2="714" y2="676" stroke="#d5e1df" stroke-width="2"/><text x="86" y="724" fill="#183b40" font-size="21" font-weight="700">VERIFY</text><text x="184" y="724" fill="#365960" font-size="21">wet / dry setup · part number</text><text x="86" y="768" fill="#557076" font-size="19">Exact model · configuration · market · serial range</text></g>
