<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Commercial pressure washer component verification map</title><desc id="desc">Four rated-system verification zones from inlet to jet and site.</desc><rect width="1600" height="1000" fill="#f3f6f8"/><rect x="70" y="65" width="1460" height="870" rx="34" fill="#fff" stroke="#cbd5df" stroke-width="3"/><text x="130" y="155" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#102a43">Pressure washer: verify every rated interface</text><text x="130" y="205" font-family="Arial,sans-serif" font-size="25" fill="#486581">Working pressure, flow and nozzle must match the complete water and spray system.</text>
  <g font-family="Arial,sans-serif" font-size="23" fill="#243b53"><g transform="translate(130 285)"><rect width="300" height="350" rx="25" fill="#e8f3f1" stroke="#2f7d73" stroke-width="3"/><text x="28" y="64" font-size="28" font-weight="700" fill="#145f57">1 · INLET</text><text x="28" y="115"><tspan x="28">Supply flow / pressure</tspan><tspan x="28" dy="42">Temperature limit</tspan><tspan x="28" dy="42">Filter and backflow</tspan><tspan x="28" dy="42">Water quality</tspan></text></g><g transform="translate(477 285)"><rect width="300" height="350" rx="25" fill="#eef2ff" stroke="#5267b7" stroke-width="3"/><text x="28" y="64" font-size="28" font-weight="700" fill="#334a9e">2 · PUMP</text><text x="28" y="115"><tspan x="28">Working / max pressure</tspan><tspan x="28" dy="42">Rated flow</tspan><tspan x="28" dy="42">Motor or engine</tspan><tspan x="28" dy="42">Unloader / relief</tspan></text></g><g transform="translate(824 285)"><rect width="300" height="350" rx="25" fill="#fff4e6" stroke="#c77700" stroke-width="3"/><text x="28" y="64" font-size="28" font-weight="700" fill="#9a5700">3 · SPRAY</text><text x="28" y="115"><tspan x="28">Hose and couplings</tspan><tspan x="28" dy="42">Gun / lance rating</tspan><tspan x="28" dy="42">Nozzle orifice / angle</tspan><tspan x="28" dy="42">Temperature rating</tspan></text></g><g transform="translate(1171 285)"><rect width="300" height="350" rx="25" fill="#fceff4" stroke="#a64d70" stroke-width="3"/><text x="28" y="64" font-size="28" font-weight="700" fill="#843956">4 · SITE</text><text x="28" y="115"><tspan x="28">Surface test</tspan><tspan x="28" dy="42">PPE / exclusion zone</tspan><tspan x="28" dy="42">Runoff and chemical</tspan><tspan x="28" dy="42">Shutdown process</tspan></text></g></g>
  <rect x="130" y="705" width="1340" height="145" rx="22" fill="#102a43"/><text x="800" y="765" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fff">Family labels do not establish cross-model compatibility</text><text x="800" y="811" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#d9e2ec">Match pressure, flow, temperature, fittings and every spray-system part number.</text></svg>
