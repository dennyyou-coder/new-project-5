<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1600" viewBox="0 0 800 1600" role="img" aria-labelledby="title desc"><title id="title">Commercial pressure washer component verification map</title><desc id="desc">Mobile verification map.</desc><rect width="800" height="1600" fill="#f3f6f8"/><rect x="38" y="35" width="724" height="1530" rx="28" fill="#fff" stroke="#cbd5df" stroke-width="3"/><text x="75" y="115" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#102a43"><tspan x="75">Pressure washer</tspan><tspan x="75" dy="46">verification map</tspan></text><text x="75" y="225" font-family="Arial,sans-serif" font-size="21" fill="#486581">Match every rated interface from inlet to site.</text>
  <g font-family="Arial,sans-serif" font-size="21" fill="#243b53"><g transform="translate(75 275)"><rect width="650" height="225" rx="22" fill="#e8f3f1" stroke="#2f7d73" stroke-width="3"/><text x="26" y="54" font-size="27" font-weight="700" fill="#145f57">1 · INLET</text><text x="26" y="102"><tspan x="26">Supply flow / pressure · temperature</tspan><tspan x="26" dy="38">Filter · backflow · water quality</tspan></text></g><g transform="translate(75 530)"><rect width="650" height="225" rx="22" fill="#eef2ff" stroke="#5267b7" stroke-width="3"/><text x="26" y="54" font-size="27" font-weight="700" fill="#334a9e">2 · PUMP</text><text x="26" y="102"><tspan x="26">Working / max pressure · rated flow</tspan><tspan x="26" dy="38">Motor / engine · unloader / relief</tspan></text></g><g transform="translate(75 785)"><rect width="650" height="225" rx="22" fill="#fff4e6" stroke="#c77700" stroke-width="3"/><text x="26" y="54" font-size="27" font-weight="700" fill="#9a5700">3 · SPRAY</text><text x="26" y="102"><tspan x="26">Hose · coupling · gun · lance rating</tspan><tspan x="26" dy="38">Nozzle orifice / angle · temperature</tspan></text></g><g transform="translate(75 1040)"><rect width="650" height="225" rx="22" fill="#fceff4" stroke="#a64d70" stroke-width="3"/><text x="26" y="54" font-size="27" font-weight="700" fill="#843956">4 · SITE</text><text x="26" y="102"><tspan x="26">Surface test · PPE · exclusion zone</tspan><tspan x="26" dy="38">Runoff · chemical · shutdown process</tspan></text></g></g>
  <rect x="75" y="1320" width="650" height="170" rx="22" fill="#102a43"/><text x="400" y="1380" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff"><tspan x="400">Family labels do not establish</tspan><tspan x="400" dy="34">cross-model compatibility</tspan></text><text x="400" y="1465" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#d9e2ec">Match every pressure, flow and fitting boundary.</text></svg>
