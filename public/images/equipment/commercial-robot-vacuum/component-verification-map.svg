<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#f4f5f8"/><rect x="70" y="70" width="1460" height="760" rx="36" fill="#fff" stroke="#dde2e8" stroke-width="3"/><text x="120" y="155" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#102a35">Commercial robot vacuum: verify pickup and autonomy</text><text x="120" y="205" font-family="Arial,sans-serif" font-size="22" fill="#4e6570">Suction pressure alone does not establish pickup, filtration or site suitability.</text><g font-family="Arial,sans-serif"><g transform="translate(120 290)"><rect width="320" height="230" rx="24" fill="#e8f4fb"/><text x="28" y="55" font-size="25" font-weight="700" fill="#2d6f96">01 FLOOR TOOL</text><text x="28" y="105" font-size="23" fill="#18333d">Brush &amp; inlet</text><text x="28" y="155" font-size="20" fill="#526b74">Surface, edge, fibres</text></g><g transform="translate(465 290)"><rect width="320" height="230" rx="24" fill="#fff3dd"/><text x="28" y="55" font-size="25" font-weight="700" fill="#936016">02 AIR PATH</text><text x="28" y="105" font-size="23" fill="#18333d">Motor, filter &amp; bin</text><text x="28" y="155" font-size="20" fill="#526b74">Flow, seals, dust class</text></g><g transform="translate(810 290)"><rect width="320" height="230" rx="24" fill="#fdecec"/><text x="28" y="55" font-size="25" font-weight="700" fill="#a13f3f">03 AUTONOMY</text><text x="28" y="105" font-size="23" fill="#18333d">Map, sensors &amp; safety</text><text x="28" y="155" font-size="20" fill="#526b74">Traffic, glass, drops</text></g><g transform="translate(1155 290)"><rect width="320" height="230" rx="24" fill="#e9f5f2"/><text x="28" y="55" font-size="25" font-weight="700" fill="#0a6154">04 SUPPORT</text><text x="28" y="105" font-size="23" fill="#18333d">Battery, dock &amp; fleet</text><text x="28" y="155" font-size="20" fill="#526b74">Runtime, data, SLA</text></g><rect x="120" y="590" width="1355" height="150" rx="26" fill="#102a35"/><text x="160" y="648" font-size="25" font-weight="700" fill="#86dbc9">BUYER RELEASE GATE</text><text x="160" y="693" font-size="25" fill="#fff">Approve the exact surface, pickup result, dust boundary and full-shift route trial.</text><text x="160" y="727" font-size="20" fill="#c8d5da">Family labels do not establish cross-model compatibility</text></g></svg>
