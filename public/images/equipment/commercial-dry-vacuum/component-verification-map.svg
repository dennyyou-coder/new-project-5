<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Commercial dry vacuum component verification map</title><desc id="desc">Pickup tool through electrical and exhaust system with buyer checks.</desc>
  <rect width="1600" height="900" fill="#f3f6f8"/><rect x="70" y="70" width="1460" height="760" rx="36" fill="#fff" stroke="#dbe3e8" stroke-width="3"/>
  <text x="120" y="150" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#102a35">Commercial dry vacuum: verify the complete air path</text>
  <text x="120" y="198" font-family="Arial,sans-serif" font-size="22" fill="#4e6570">A catalogue power figure does not prove pickup, filtration or route productivity.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(120 280)"><rect width="240" height="230" rx="24" fill="#e9f5f2"/><text x="24" y="52" font-size="25" font-weight="700" fill="#0a6154">01 PICKUP</text><text x="24" y="100" font-size="22" fill="#18333d">Floor tool</text><text x="24" y="135" font-size="22" fill="#18333d">Nozzle &amp; surface</text><text x="24" y="188" font-size="18" fill="#526b74">Check width, coupling,</text><text x="24" y="214" font-size="18" fill="#526b74">surface and result.</text></g>
    <g transform="translate(400 280)"><rect width="240" height="230" rx="24" fill="#eef2fb"/><text x="24" y="52" font-size="25" font-weight="700" fill="#39589c">02 TRANSPORT</text><text x="24" y="100" font-size="22" fill="#18333d">Hose &amp; tubes</text><text x="24" y="135" font-size="22" fill="#18333d">Cuffs &amp; seals</text><text x="24" y="188" font-size="18" fill="#526b74">Check diameter, leaks,</text><text x="24" y="214" font-size="18" fill="#526b74">length and handling.</text></g>
    <g transform="translate(680 280)"><rect width="240" height="230" rx="24" fill="#fff3dd"/><text x="24" y="52" font-size="25" font-weight="700" fill="#936016">03 COLLECTION</text><text x="24" y="100" font-size="22" fill="#18333d">Bag / container</text><text x="24" y="135" font-size="22" fill="#18333d">Closure method</text><text x="24" y="188" font-size="18" fill="#526b74">Check code, capacity,</text><text x="24" y="214" font-size="18" fill="#526b74">stock and disposal.</text></g>
    <g transform="translate(960 280)"><rect width="240" height="230" rx="24" fill="#f5eefb"/><text x="24" y="52" font-size="25" font-weight="700" fill="#71439b">04 FILTRATION</text><text x="24" y="100" font-size="22" fill="#18333d">Filters &amp; exhaust</text><text x="24" y="135" font-size="22" fill="#18333d">Seal integrity</text><text x="24" y="188" font-size="18" fill="#526b74">Check exact grade and</text><text x="24" y="214" font-size="18" fill="#526b74">delivered configuration.</text></g>
    <g transform="translate(1240 280)"><rect width="240" height="230" rx="24" fill="#fdecec"/><text x="24" y="52" font-size="25" font-weight="700" fill="#a13f3f">05 POWER</text><text x="24" y="100" font-size="22" fill="#18333d">Motor &amp; control</text><text x="24" y="135" font-size="22" fill="#18333d">Cable &amp; circuit</text><text x="24" y="188" font-size="18" fill="#526b74">Check voltage, plug,</text><text x="24" y="214" font-size="18" fill="#526b74">reach and service.</text></g>
    <path d="M360 395h40m240 0h40m240 0h40m240 0h40" stroke="#81939b" stroke-width="5" stroke-linecap="round"/>
    <rect x="120" y="590" width="1360" height="150" rx="26" fill="#102a35"/><text x="160" y="646" font-size="25" font-weight="700" fill="#86dbc9">BUYER RELEASE GATE</text><text x="160" y="690" font-size="25" fill="#fff">Approve the exact tool, hose, bag, filter, seals, cable and product number as one system.</text><text x="160" y="724" font-size="20" fill="#c8d5da">Family labels do not establish cross-model compatibility</text>
  </g>
</svg>
