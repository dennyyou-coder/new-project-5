<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Portable carpet and upholstery cleaner component verification map</title><desc id="desc">Buyer checks from approved solution through spray, hand tool, recovery and dirty tank.</desc>
  <rect width="1440" height="720" rx="32" fill="#eef2eb"/><text x="72" y="82" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#123b36">Portable extraction verification chain</text><text x="72" y="124" font-family="Arial,sans-serif" font-size="20" fill="#45625e">Verify the exact textile, formula, tool and service code before purchase.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#99aaa6" stroke-width="2"><rect x="70" y="220" width="220" height="170" rx="22"/><rect x="340" y="220" width="220" height="170" rx="22"/><rect x="610" y="220" width="220" height="170" rx="22"/><rect x="880" y="220" width="220" height="170" rx="22"/><rect x="1150" y="220" width="220" height="170" rx="22"/></g><g fill="#173f3a" font-size="22" font-weight="700"><text x="180" y="275">Solution tank</text><text x="450" y="275">Pump &amp; hose</text><text x="720" y="275">Hand tool</text><text x="990" y="275">Recovery path</text><text x="1260" y="275">Dirty tank</text></g><g fill="#536e69" font-size="17"><text x="180" y="320">formula · dilution</text><text x="180" y="348">cap · seal</text><text x="450" y="320">spray · flush</text><text x="450" y="348">hose code</text><text x="720" y="320">brush · insert</text><text x="720" y="348">textile approval</text><text x="990" y="320">nozzle seal</text><text x="990" y="348">suction trial</text><text x="1260" y="320">shutoff · foam</text><text x="1260" y="348">empty · dry</text></g></g>
  <g stroke="#cc5b2c" stroke-width="5" fill="none"><path d="M290 305h50"/><path d="M560 305h50"/><path d="M830 305h50"/><path d="M1100 305h50"/></g><rect x="72" y="514" width="1296" height="112" rx="18" fill="#163f39"/><text x="720" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">Family labels do not establish cross-model compatibility</text><text x="720" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#d4e6df">Record model, serial family, market, formula, tool and replacement-part codes.</text>
