<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1280" viewBox="0 0 760 1280" role="img" aria-labelledby="title desc"><title id="title">Portable extraction component verification map</title><desc id="desc">Mobile verification chain.</desc><rect width="760" height="1280" rx="28" fill="#eef2eb"/><text x="48" y="74" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#123b36">Portable extraction chain</text><text x="48" y="112" font-family="Arial,sans-serif" font-size="18" fill="#45625e">Verify exact model and textile.</text><g font-family="Arial,sans-serif"><g fill="#fff" stroke="#99aaa6" stroke-width="2"><rect x="48" y="170" width="664" height="135" rx="20"/><rect x="48" y="335" width="664" height="135" rx="20"/><rect x="48" y="500" width="664" height="135" rx="20"/><rect x="48" y="665" width="664" height="135" rx="20"/><rect x="48" y="830" width="664" height="135" rx="20"/></g><g fill="#173f3a" font-size="22" font-weight="700"><text x="78" y="220">1 · Solution tank</text><text x="78" y="385">2 · Pump &amp; hose</text><text x="78" y="550">3 · Hand tool</text><text x="78" y="715">4 · Recovery path</text><text x="78" y="880">5 · Dirty tank</text></g><g fill="#536e69" font-size="17"><text x="78" y="260">formula · dilution · cap · seal</text><text x="78" y="425">spray · flush · hose code</text><text x="78" y="590">brush · insert · textile approval</text><text x="78" y="755">nozzle seal · suction trial</text><text x="78" y="920">shutoff · foam · empty · dry</text></g></g><rect x="48" y="1030" width="664" height="165" rx="20" fill="#163f39"/><text x="380" y="1082" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Family labels do not establish</text><text x="380" y="1112" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">cross-model compatibility</text><text x="380" y="1160" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d4e6df">Record model, market, formula and part codes.</text></svg>
