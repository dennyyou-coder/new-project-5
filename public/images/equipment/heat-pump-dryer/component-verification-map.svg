<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Heat-pump dryer verification map</title><desc id="d">Buyer checks from load through airflow, refrigerant and condensate systems.</desc><rect width="1600" height="1000" fill="#eef2f5"/><text x="100" y="115" font-family="Arial" font-size="56" font-weight="700" fill="#223746">Verify the complete heat-pump drying system</text><g font-family="Arial" fill="#223746"><rect x="100" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="140" y="285" font-size="34" font-weight="700">01 Load</text><text x="140" y="350" font-size="25">Textile mass</text><text x="140" y="400" font-size="25">Initial moisture</text><text x="140" y="450" font-size="25">Dryness target</text><rect x="465" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="505" y="285" font-size="34" font-weight="700">02 Air</text><text x="505" y="350" font-size="25">Drum and fan</text><text x="505" y="400" font-size="25">Lint filtration</text><text x="505" y="450" font-size="25">Duct condition</text><rect x="830" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="870" y="285" font-size="34" font-weight="700">03 Pump</text><text x="870" y="350" font-size="25">Refrigerant label</text><text x="870" y="400" font-size="25">Heat exchangers</text><text x="870" y="450" font-size="25">Qualified service</text><rect x="1195" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="1235" y="285" font-size="34" font-weight="700">04 Water</text><text x="1235" y="350" font-size="25">Tank or drain</text><text x="1235" y="400" font-size="25">Sensors and control</text><text x="1235" y="450" font-size="25">Exact stacking kit</text></g><path d="M400 425h65m300 0h65m300 0h65" stroke="#e06039" stroke-width="14"/><text x="100" y="805"