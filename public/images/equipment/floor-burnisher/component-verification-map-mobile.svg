<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1600" viewBox="0 0 800 1600" role="img" aria-labelledby="title desc"><title id="title">Floor burnisher component verification map</title><desc id="desc">Mobile verification map.</desc><rect width="800" height="1600" fill="#f3f6f8"/><rect x="38" y="35" width="724" height="1530" rx="28" fill="#fff" stroke="#cbd5df" stroke-width="3"/><text x="75" y="115" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#102a43"><tspan x="75">Floor burnisher</tspan><tspan x="75" dy="46">verification map</tspan></text><text x="75" y="225" font-family="Arial,sans-serif" font-size="21" fill="#486581">Match the complete gloss-maintenance system.</text>
  <g font-family="Arial,sans-serif" font-size="21" fill="#243b53"><g transform="translate(75 275)"><rect width="650" height="225" rx="22" fill="#e8f3f1" stroke="#2f7d73" stroke-width="3"/><text x="26" y="54" font-size="27" font-weight="700" fill="#145f57">1 · POWER</text><text x="26" y="102"><tspan x="26">Cord / battery · voltage · chemistry</tspan><tspan x="26" dy="38">Charger / circuit · regional product no.</tspan></text></g><g transform="translate(75 530)"><rect width="650" height="225" rx="22" fill="#eef2ff" stroke="#5267b7" stroke-width="3"/><text x="26" y="54" font-size="27" font-weight="700" fill="#334a9e">2 · HEAD</text><text x="26" y="102"><tspan x="26">Driver interface · pad rpm</tspan><tspan x="26" dy="38">Pressure method · head / pad size</tspan></text></g><g transform="translate(75 785)"><rect width="650" height="225" rx="22" fill="#fff4e6" stroke="#c77700" stroke-width="3"/><text x="26" y="54" font-size="27" font-weight="700" fill="#9a5700">3 · FINISH</text><text x="26" y="102"><tspan x="26">Pad PN · finish approval</tspan><tspan x="26" dy="38">Cure state · measured trial result</tspan></text></g><g transform="translate(75 1040)"><rect width="650" height="225" rx="22" fill="#fceff4" stroke="#a64d70" stroke-width="3"/><text x="26" y="54" font-size="27" font-weight="700" fill="#843956">4 · DUST</text><text x="26" y="102"><tspan x="26">Skirt · seals · passive / active</tspan><tspan x="26" dy="38">Bag / filter PN · maintenance boundary</tspan></text></g></g>
  <rect x="75" y="1320" width="650" height="170" rx="22" fill="#102a43"/><text x="400" y="1380" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff"><tspan x="400">Family labels do not establish</tspan><tspan x="400" dy="34">cross-model compatibility</tspan></text><text x="400" y="1465" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#d9e2ec">Record exact machine, pad, finish and dust system.</text></svg>
