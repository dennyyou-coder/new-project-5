<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Floor burnisher component verification map</title><desc id="desc">Four verification zones for power, head, pad and dust control.</desc><rect width="1600" height="1000" fill="#f3f6f8"/><rect x="70" y="65" width="1460" height="870" rx="34" fill="#fff" stroke="#cbd5df" stroke-width="3"/><text x="130" y="155" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#102a43">Floor burnisher: verify the gloss-maintenance system</text><text x="130" y="205" font-family="Arial,sans-serif" font-size="25" fill="#486581">Pad speed is only one input—match power, pressure, finish and dust control.</text>
  <g font-family="Arial,sans-serif" font-size="23" fill="#243b53"><g transform="translate(130 285)"><rect width="300" height="350" rx="25" fill="#e8f3f1" stroke="#2f7d73" stroke-width="3"/><text x="28" y="64" font-size="28" font-weight="700" fill="#145f57">1 · POWER</text><text x="28" y="115"><tspan x="28">Cord or battery</tspan><tspan x="28" dy="42">Voltage / chemistry</tspan><tspan x="28" dy="42">Charger or circuit</tspan><tspan x="28" dy="42">Regional product no.</tspan></text></g><g transform="translate(477 285)"><rect width="300" height="350" rx="25" fill="#eef2ff" stroke="#5267b7" stroke-width="3"/><text x="28" y="64" font-size="28" font-weight="700" fill="#334a9e">2 · HEAD</text><text x="28" y="115"><tspan x="28">Driver interface</tspan><tspan x="28" dy="42">Pad rpm</tspan><tspan x="28" dy="42">Pressure method</tspan><tspan x="28" dy="42">Head / pad size</tspan></text></g><g transform="translate(824 285)"><rect width="300" height="350" rx="25" fill="#fff4e6" stroke="#c77700" stroke-width="3"/><text x="28" y="64" font-size="28" font-weight="700" fill="#9a5700">3 · FINISH</text><text x="28" y="115"><tspan x="28">Pad part number</tspan><tspan x="28" dy="42">Finish approval</tspan><tspan x="28" dy="42">Cure and condition</tspan><tspan x="28" dy="42">Trial gloss result</tspan></text></g><g transform="translate(1171 285)"><rect width="300" height="350" rx="25" fill="#fceff4" stroke="#a64d70" stroke-width="3"/><text x="28" y="64" font-size="28" font-weight="700" fill="#843956">4 · DUST</text><text x="28" y="115"><tspan x="28">Skirt and seals</tspan><tspan x="28" dy="42">Passive or active</tspan><tspan x="28" dy="42">Bag / filter PN</tspan><tspan x="28" dy="42">Maintenance boundary</tspan></text></g></g>
  <rect x="130" y="705" width="1340" height="145" rx="22" fill="#102a43"/><text x="800" y="765" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fff">Family labels do not establish cross-model compatibility</text><text x="800" y="811" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#d9e2ec">Record the exact machine, pad, finish, pressure and dust-control configuration.</text>
</svg>
