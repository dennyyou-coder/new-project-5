<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Upright commercial vacuum verification map</title><desc id="desc">Five verification zones from carpet interface to operator route.</desc><rect width="1600" height="1000" rx="40" fill="#f0f2ef"/><text x="90" y="105" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#193d3a">Verify the upright as a surface system</text><text x="90" y="160" font-family="Arial,sans-serif" font-size="25" fill="#526965">Width and watts do not establish pickup, emissions or operator fit.</text><g font-family="Arial,sans-serif"><g transform="translate(90 245)"><rect width="260" height="420" rx="26" fill="#193d3a"/><text x="28" y="65" font-size="27" font-weight="700" fill="#fff">01 Floor head</text><text x="28" y="125" font-size="22" fill="#e2eeeb">Surface approval</text><text x="28" y="166" font-size="22" fill="#e2eeeb">Head geometry</text><text x="28" y="207" font-size="22" fill="#e2eeeb">Edge result</text><text x="28" y="248" font-size="22" fill="#e2eeeb">Debris scatter</text></g><g transform="translate(380 245)"><rect width="260" height="420" rx="26" fill="#38766c"/><text x="28" y="65" font-size="27" font-weight="700" fill="#fff">02 Brush roll</text><text x="28" y="125" font-size="22" fill="#eff7f5">Material + code</text><text x="28" y="166" font-size="22" fill="#eff7f5">Height setting</text><text x="28" y="207" font-size="22" fill="#eff7f5">Drive + belt</text><text x="28" y="248" font-size="22" fill="#eff7f5">Pile response</text></g><g transform="translate(670 245)"><rect width="260" height="420" rx="26" fill="#d2a94e"/><text x="28" y="65" font-size="27" font-weight="700" fill="#193d3a">03 Air + bag</text><text x="28" y="125" font-size="22" fill="#294641">Duct blockage</text><text x="28" y="166" font-size="22" fill="#294641">Bag part number</text><text x="28" y="207" font-size="22" fill="#294641">Usable fill</text><text x="28" y="248" font-size="22" fill="#294641">Seal integrity</text></g><g transform="translate(960 245)"><rect width="260" height="420" rx="26" fill="#527b65"/><text x="28" y="65" font-size="27" font-weight="700" fill="#fff">04 Filtration</text><text x="28" y="125" font-size="22" fill="#f0f6f2">Delivered grade</text><text x="28" y="166" font-size="22" fill="#f0f6f2">Whole machine</text><text x="28" y="207" font-size="22" fill="#f0f6f2">Change method</text><text x="28" y="248" font-size="22" fill="#f0f6f2">Exhaust state</text></g><g transform="translate(1250 245)"><rect width="260" height="420" rx="26" fill="#67566e"/><text x="28" y="65" font-size="27" font-weight="700" fill="#fff">05 Operator route</text><text x="28" y="125" font-size="22" fill="#f3edf5">Handle force</text><text x="28" y="166" font-size="22" fill="#f3edf5">Turns + stairs</text><text x="28" y="207" font-size="22" fill="#f3edf5">Cord or runtime</text><text x="28" y="248" font-size="22" fill="#f3edf5">Service access</text></g><path d="M350 455h30M640 455h30M930 455h30M1220 455h30" stroke="#91a19d" stroke-width="9"/></g><rect x="90" y="735" width="1420" height="165" rx="28" fill="#fff" stroke="#ccd5d2" stroke-width="3"/><text x="130" y="800" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#193d3a">Buyer gate</text><text x="130" y="850" font-family="Arial,sans-serif" font-size="25" fill="#526965">Trial every representative carpet and hard floor with the delivered brush, bag and filter.</text><text x="800" y="945" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#6b7d7f">Family labels do not establish cross-model compatibility</text></svg>
