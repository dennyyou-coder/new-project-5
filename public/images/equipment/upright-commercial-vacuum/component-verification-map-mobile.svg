<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1600" role="img" aria-labelledby="title desc"><title id="title">Upright commercial vacuum mobile verification map</title><desc id="desc">Five stacked upright vacuum verification zones.</desc><rect width="800" height="1600" rx="36" fill="#f0f2ef"/><text x="55" y="92" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#193d3a">Verify the surface system</text><text x="55" y="140" font-family="Arial,sans-serif" font-size="21" fill="#526965">Head, brush, air path, filter, operator.</text><g font-family="Arial,sans-serif"><g transform="translate(55 205)"><rect width="690" height="205" rx="24" fill="#193d3a"/><text x="28" y="58" font-size="27" font-weight="700" fill="#fff">01 Floor head</text><text x="28" y="105" font-size="21" fill="#e2eeeb">Surface · edge · scatter</text><text x="28" y="145" font-size="21" fill="#e2eeeb">Verify the actual floor mix</text></g><g transform="translate(55 435)"><rect width="690" height="205" rx="24" fill="#38766c"/><text x="28" y="58" font-size="27" font-weight="700" fill="#fff">02 Brush roll</text><text x="28" y="105" font-size="21" fill="#eff7f5">Material · height · drive</text><text x="28" y="145" font-size="21" fill="#eff7f5">Observe pile and grooming</text></g><g transform="translate(55 665)"><rect width="690" height="205" rx="24" fill="#d2a94e"/><text x="28" y="58" font-size="27" font-weight="700" fill="#193d3a">03 Air path + bag</text><text x="28" y="105" font-size="21" fill="#294641">Duct · bag code · usable fill</text><text x="28" y="145" font-size="21" fill="#294641">Inspect blockage access</text></g><g transform="translate(55 895)"><rect width="690" height="205" rx="24" fill="#527b65"/><text x="28" y="58" font-size="27" font-weight="700" fill="#fff">04 Filtration</text><text x="28" y="105" font-size="21" fill="#f0f6f2">Delivered grade · seals</text><text x="28" y="145" font-size="21" fill="#f0f6f2">Separate filter from system claims</text></g><g transform="translate(55 1125)"><rect width="690" height="205" rx="24" fill="#67566e"/><text x="28" y="58" font-size="27" font-weight="700" fill="#fff">05 Operator route</text><text x="28" y="105" font-size="21" fill="#f3edf5">Turns · stairs · cord/runtime</text><text x="28" y="145" font-size="21" fill="#f3edf5">Include multiple operators</text></g></g><text x="400" y="1460" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193d3a">Buyer gate: trial the delivered configuration.</text><text x="400" y="1535" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#6b7d7f">Family labels do not establish cross-model compatibility</text></svg>
