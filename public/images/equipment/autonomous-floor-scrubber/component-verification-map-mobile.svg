<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1300" viewBox="0 0 900 1300" role="img"><rect width="900" height="1300" fill="#f4f5f8"/><rect x="45" y="45" width="810" height="1210" rx="32" fill="#fff" stroke="#dde2e8" stroke-width="3"/><text x="85" y="120" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#102a35">Autonomous scrubber</text><text x="85" y="165" font-family="Arial,sans-serif" font-size="22" fill="#4e6570">Verify the complete operating system</text><g font-family="Arial,sans-serif" font-size="22" fill="#18333d"><rect x="85" y="220" width="730" height="155" rx="22" fill="#e8f4fb"/><text x="120" y="275" font-weight="700">01 CLEANING — deck and recovery</text><text x="120" y="320">Brush, solution, tanks, squeegee, outcome</text><rect x="85" y="400" width="730" height="155" rx="22" fill="#fff3dd"/><text x="120" y="455" font-weight="700">02 PERCEPTION — map and navigation</text><text x="120" y="500">Sensors, routes, obstacles, recovery</text><rect x="85" y="580" width="730" height="155" rx="22" fill="#fdecec"/><text x="120" y="635" font-weight="700">03 SAFETY — site operating case</text><text x="120" y="680">Stops, traffic, training, escalation</text><rect x="85" y="760" width="730" height="155" rx="22" fill="#e9f5f2"/><text x="120" y="815" font-weight="700">04 SUPPORT — battery, dock and data</text><text x="120" y="860">Utilities, versions, reports, SLA</text><rect x="85" y="970" width="730" height="205" rx="24" fill="#102a35"/><text x="120" y="1030" font-weight="700" fill="#86dbc9">BUYER RELEASE GATE</text><text x="120" y="1080" fill="#fff">Approve site, trial, exceptions</text><text x="120" y="1115" fill="#fff">and exact configuration.</text><text x="120" y="1155" font-size="18" fill="#c8d5da">Family labels do not establish cross-model compatibility</text></g></svg>
