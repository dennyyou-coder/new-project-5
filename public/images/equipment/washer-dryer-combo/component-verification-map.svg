<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Washer-dryer combo verification map</title><desc id="d">Buyer checks from separate load limits through washing, drying and drainage.</desc><rect width="1600" height="1000" fill="#eef2f5"/><text x="100" y="115" font-family="Arial" font-size="56" font-weight="700" fill="#223746">Verify the complete wash-to-dry system</text><g font-family="Arial" fill="#223746"><rect x="100" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="140" y="285" font-size="34" font-weight="700">01 Load</text><text x="140" y="350" font-size="25">Wash capacity</text><text x="140" y="400" font-size="25">Dry capacity</text><text x="140" y="450" font-size="25">Continuous load</text><rect x="465" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="505" y="285" font-size="34" font-weight="700">02 Wash</text><text x="505" y="350" font-size="25">Supply and dosing</text><text x="505" y="400" font-size="25">Drum and drive</text><text x="505" y="450" font-size="25">Pump and filter</text><rect x="830" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="870" y="285" font-size="34" font-weight="700">03 Dry</text><text x="870" y="350" font-size="25">Fan and lint path</text><text x="870" y="400" font-size="25">Heat or heat pump</text><text x="870" y="450" font-size="25">Moisture sensing</text><rect x="1195" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="1235" y="285" font-size="34" font-weight="700">04 Route</text><text x="1235" y="350" font-size="25">Wash water</text><text x="1235" y="400" font-size="25">Condensate</text><text x="1235" y="450" font-size="25">Exact service parts</text></g><path d="M400 425h65m300 0h65m300 0h65" stroke="#e06039" stroke-width="14"/><text x="100" y="805" font-family="Arial" font-size="30" font-weight="700" fill="#223746">Buyer gate: test the continuous load, not the washing capacity alone.</text><text x="100" y="875" font-family="Arial" font-size="25" fill="#526a78">Family labels do not establish cross-model compatibility</text></svg>
