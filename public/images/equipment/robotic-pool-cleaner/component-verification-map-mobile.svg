<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1600" viewBox="0 0 800 1600" role="img" aria-labelledby="t d"><title id="t">Mobile robotic pool cleaner verification map</title><desc id="d">Four stacked buyer checks.</desc><rect width="800" height="1600" fill="#eef2f5"/><text x="60" y="100" font-family="Arial" font-size="40" font-weight="700" fill="#223746">Verify the underwater system</text><g font-family="Arial" fill="#223746"><rect x="60" y="170" width="680" height="245" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="105" y="235" font-size="32" font-weight="700">01 Power</text><text x="105" y="295" font-size="24">Supply or battery · charger · cable · cycle</text><rect x="60" y="455" width="680" height="245" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="105" y="520" font-size="32" font-weight="700">02 Mobility</text><text x="105" y="580" font-size="24">Pool · tracks · sensors · zone coverage</text><rect x="60" y="740" width="680" height="245" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="105" y="805" font-size="32" font-weight="700">03 Cleaning</text><text x="105" y="865" font-size="24">Brush · inlet · pump · filter basket</text><rect x="60" y="1025" width="680" height="245" rx="28" fill="#fff" stroke="#7390a2" stroke-width="4"/><text x="105" y="1090" font-size="32" font-weight="700">04 Retrieval</text><text x="105" y="1150" font-size="24">Bathers · drain · lift · rinse · store</text></g><text x="60" y="1390" font-family="Arial" font-size="23" fill="#526a78">Family labels do not establish cross-model compatibility</text></svg>
