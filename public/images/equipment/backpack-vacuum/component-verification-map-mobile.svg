<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc"><title id="title">Backpack vacuum mobile verification map</title><desc id="desc">Vertical operator and system checks.</desc><rect width="800" height="1200" fill="#f2f6f5"/><text x="55" y="80" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#102a35">Machine + operator + energy</text><text x="55" y="125" font-family="Arial,sans-serif" font-size="20" fill="#4e6570">Backpack vacuum buyer map</text><g font-family="Arial,sans-serif"><g fill="#fff" stroke="#dbe3e8" stroke-width="2"><rect x="55" y="180" width="690" height="125" rx="22"/><rect x="55" y="330" width="690" height="125" rx="22"/><rect x="55" y="480" width="690" height="125" rx="22"/><rect x="55" y="630" width="690" height="125" rx="22"/><rect x="55" y="780" width="690" height="125" rx="22"/></g><g font-size="22" fill="#18333d"><text x="90" y="230" font-weight="700" fill="#0a6154">01 Harness and back panel</text><text x="90" y="270">Full-load fit, movement, doffing</text><text x="90" y="380" font-weight="700" fill="#39589c">02 Tool, wand and hose</text><text x="90" y="420">Surface result, reach, snag risk</text><text x="90" y="530" font-weight="700" fill="#936016">03 Bag, filter and seals</text><text x="90" y="570">Exact codes, grade, disposal</text><text x="90" y="680" font-weight="700" fill="#71439b">04 Motor and hand control</text><text x="90" y="720">Modes, access, sound, service</text><text x="90" y="830" font-weight="700" fill="#a13f3f">05 Cable or battery system</text><text x="90" y="870">Runtime, charger, storage, reserve</text></g><rect x="55" y="950" width="690" height="170" rx="24" fill="#102a35"/><text x="88" y="1002" font-size="23" font-weight="700" fill="#86dbc9">BUYER RELEASE GATE</text><text x="88" y="1044" font-size="21" fill="#fff">Approve the full-load route and</text><text x="88" y="1076" font-size="21" fill="#fff">the exact delivered system.</text><text x="88" y="1106" font-size="18" fill="#c8d5da">Family labels do not establish cross-model compatibility</text></g></svg>
