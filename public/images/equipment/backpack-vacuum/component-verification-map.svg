<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Backpack vacuum component verification map</title><desc id="desc">Harness, airflow and power interfaces.</desc><rect width="1600" height="900" fill="#f2f6f5"/><rect x="70" y="70" width="1460" height="760" rx="36" fill="#fff" stroke="#dbe3e8" stroke-width="3"/><text x="120" y="150" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#102a35">Backpack vacuum: machine + operator + energy system</text><text x="120" y="198" font-family="Arial,sans-serif" font-size="22" fill="#4e6570">Runtime and catalogue mass do not replace full-load route trials.</text><g font-family="Arial,sans-serif">
<g transform="translate(120 280)"><rect width="260" height="230" rx="24" fill="#e9f5f2"/><text x="25" y="52" font-size="24" font-weight="700" fill="#0a6154">01 BODY FIT</text><text x="25" y="100" font-size="22" fill="#18333d">Harness &amp; back panel</text><text x="25" y="140" font-size="20" fill="#526b74">Adjustment, full load,</text><text x="25" y="174" font-size="20" fill="#526b74">movement and doffing</text></g>
<g transform="translate(400 280)"><rect width="260" height="230" rx="24" fill="#eef2fb"/><text x="25" y="52" font-size="24" font-weight="700" fill="#39589c">02 PICKUP PATH</text><text x="25" y="100" font-size="22" fill="#18333d">Tool, wand &amp; hose</text><text x="25" y="140" font-size="20" fill="#526b74">Surface result, reach,</text><text x="25" y="174" font-size="20" fill="#526b74">coupling and snag risk</text></g>
<g transform="translate(680 280)"><rect width="260" height="230" rx="24" fill="#fff3dd"/><text x="25" y="52" font-size="24" font-weight="700" fill="#936016">03 DUST PATH</text><text x="25" y="100" font-size="22" fill="#18333d">Bag, filter &amp; seals</text><text x="25" y="140" font-size="20" fill="#526b74">Exact codes, grade,</text><text x="25" y="174" font-size="20" fill="#526b74">change and disposal</text></g>
<g transform="translate(960 280)"><rect width="260" height="230" rx="24" fill="#f5eefb"/><text x="25" y="52" font-size="24" font-weight="700" fill="#71439b">04 CONTROL</text><text x="25" y="100" font-size="22" fill="#18333d">Motor &amp; hand switch</text><text x="25" y="140" font-size="20" fill="#526b74">Modes, sound, heat,</text><text x="25" y="174" font-size="20" fill="#526b74">access and service</text></g>
<g transform="translate(1240 280)"><rect width="240" height="230" rx="24" fill="#fdecec"/><text x="25" y="52" font-size="24" font-weight="700" fill="#a13f3f">05 ENERGY</text><text x="25" y="100" font-size="22" fill="#18333d">Cable or battery</text><text x="25" y="140" font-size="20" fill="#526b74">Runtime, charger,</text><text x="25" y="174" font-size="20" fill="#526b74">storage and reserve</text></g>
<rect x="120" y="590" width="1360" height="150" rx="26" fill="#102a35"/><text x="160" y="646" font-size="25" font-weight="700" fill="#86dbc9">BUYER RELEASE GATE</text><text x="160" y="690" font-size="25" fill="#fff">Approve fit, full-load route result and the exact bag, filter, battery or cable package.</text><text x="160" y="724" font-size="20" fill="#c8d5da">Family labels do not establish cross-model compatibility</text></g></svg>
