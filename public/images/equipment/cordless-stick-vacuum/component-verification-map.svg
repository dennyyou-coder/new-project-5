<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Cordless stick vacuum verification map</title><desc id="d">Battery, airflow and tool-chain procurement checks.</desc><rect width="1600" height="1000" fill="#f4f7fb"/><text x="100" y="105" font-family="Arial" font-size="52" font-weight="700" fill="#13233a">Cordless stick vacuum: verify the complete chain</text><text x="100" y="165" font-family="Arial" font-size="25" fill="#52657d">Quote the exact regional model, battery, charger, filter and cleaning-head codes.</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#5b7c99" stroke-width="4"><rect x="90" y="285" width="260" height="180" rx="28"/><rect x="400" y="285" width="260" height="180" rx="28"/><rect x="710" y="285" width="260" height="180" rx="28"/><rect x="1020" y="285" width="260" height="180" rx="28"/><rect x="1330" y="285" width="180" height="180" rx="28"/></g><g fill="#13233a" font-size="28" font-weight="700"><text x="220" y="355">Battery + charger</text><text x="530" y="355">Motor + fan</text><text x="840" y="355">Bin + filters</text><text x="1150" y="355">Wand + seals</text><text x="1420" y="355">Head + tools</text></g><g fill="#52657d" font-size="21"><text x="220" y="405">voltage · pack code</text><text x="530" y="405">mode · thermal limits</text><text x="840" y="405">capacity · filter code</text><text x="1150" y="405">latch · air leakage</text><text x="1420" y="405">surface · drive</text></g></g><g stroke="#e56b3f" stroke-width="8" fill="none"><path d="M350 375h50"/><path d="M660 375h50"/><path d="M970 375h50"/><path d="M1280 375h50"/></g><rect x="100" y="590" width="1400" height="245" rx="32" fill="#13233a"/><text x="150" y="665" font-family="Arial" font-size="30" font-weight="700" fill="#fff">Buyer evidence pack</text><text x="150" y="720" font-family="Arial" font-size="25" fill="#dbe7f2">Runtime test mode · floor and debris · battery state · included head · filtration maintenance · spare availability</text><text x="150" y="790" font-family="Arial" font-size="24" font-weight="700" fill="#ffbd8e">Family labels do not establish cross-model compatibility</text></svg>
