<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1600" viewBox="0 0 800 1600" role="img" aria-labelledby="title desc">
  <title id="title">Mobile floor scrubber component verification map</title>
  <desc id="desc">Four stacked model-specific verification zones for floor scrubber components. Family labels do not establish cross-model compatibility.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2930"/>
      <stop offset="1" stop-color="#123f43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#061c20" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="1600" rx="30" fill="#eff6f4"/>
  <rect width="800" height="220" rx="30" fill="url(#background)"/>
  <rect y="190" width="800" height="30" fill="url(#background)"/>
  <text x="50" y="58" fill="#7fe0cf" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3">WCB TECHNICAL DIAGRAM</text>
  <text x="50" y="112" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">Component verification</text>
  <text x="50" y="156" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">boundary</text>
  <text x="50" y="196" fill="#c7dcda" font-family="Arial, Helvetica, sans-serif" font-size="21">Confirm identifiers and interfaces before decisions.</text>

  <g filter="url(#shadow)" fill="#ffffff" stroke="#c7dbd7" stroke-width="2">
    <rect x="50" y="265" width="700" height="255" rx="24"/>
    <rect x="50" y="555" width="700" height="255" rx="24"/>
    <rect x="50" y="845" width="700" height="255" rx="24"/>
    <rect x="50" y="1135" width="700" height="255" rx="24"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="104" cy="326" r="32" fill="#0d766e"/>
    <text x="104" y="336" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">01</text>
    <text x="156" y="316" fill="#123846" font-size="29" font-weight="800">Deck + consumable interface</text>
    <text x="156" y="352" fill="#557076" font-size="21">Mechanical cleaning contact</text>
    <line x1="86" y1="386" x2="714" y2="386" stroke="#d5e1df" stroke-width="2"/>
    <text x="86" y="430" fill="#183b40" font-size="21" font-weight="700">CHECK</text>
    <text x="184" y="430" fill="#365960" font-size="21">deck model · width · part number</text>
    <text x="86" y="474" fill="#183b40" font-size="21" font-weight="700">VERIFY</text>
    <text x="184" y="474" fill="#365960" font-size="21">interface · material · wear limit</text>

    <circle cx="104" cy="616" r="32" fill="#0d766e"/>
    <text x="104" y="626" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">02</text>
    <text x="156" y="606" fill="#123846" font-size="29" font-weight="800">Squeegee + recovery path</text>
    <text x="156" y="642" fill="#557076" font-size="21">Liquid pickup and containment</text>
    <line x1="86" y1="676" x2="714" y2="676" stroke="#d5e1df" stroke-width="2"/>
    <text x="86" y="720" fill="#183b40" font-size="21" font-weight="700">CHECK</text>
    <text x="184" y="720" fill="#365960" font-size="21">width · blade geometry · hose path</text>
    <text x="86" y="764" fill="#183b40" font-size="21" font-weight="700">VERIFY</text>
    <text x="184" y="764" fill="#365960" font-size="21">blade ID · material · adjustment</text>

    <circle cx="104" cy="906" r="32" fill="#0d766e"/>
    <text x="104" y="916" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">03</text>
    <text x="156" y="896" fill="#123846" font-size="29" font-weight="800">Solution + recovery tanks</text>
    <text x="156" y="932" fill="#557076" font-size="21">Fluid capacity and chemistry boundary</text>
    <line x1="86" y1="966" x2="714" y2="966" stroke="#d5e1df" stroke-width="2"/>
    <text x="86" y="1010" fill="#183b40" font-size="21" font-weight="700">CHECK</text>
    <text x="184" y="1010" fill="#365960" font-size="21">volume · seals · filters · drain access</text>
    <text x="86" y="1054" fill="#183b40" font-size="21" font-weight="700">VERIFY</text>
    <text x="184" y="1054" fill="#365960" font-size="21">chemistry · dosing · procedure</text>

    <circle cx="104" cy="1196" r="32" fill="#0d766e"/>
    <text x="104" y="1206" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">04</text>
    <text x="156" y="1186" fill="#123846" font-size="29" font-weight="800">Battery + charger configuration</text>
    <text x="156" y="1222" fill="#557076" font-size="21">Electrical and duty-cycle boundary</text>
    <line x1="86" y1="1256" x2="714" y2="1256" stroke="#d5e1df" stroke-width="2"/>
    <text x="86" y="1300" fill="#183b40" font-size="21" font-weight="700">CHECK</text>
    <text x="184" y="1300" fill="#365960" font-size="21">voltage · chemistry · BMS · connector</text>
    <text x="86" y="1344" fill="#183b40" font-size="21" font-weight="700">VERIFY</text>
    <text x="184" y="1344" fill="#365960" font-size="21">battery ID · charger ID · warranty</text>
  </g>

  <rect x="50" y="1440" width="700" height="105" rx="22" fill="#dff2ee"/>
  <text x="400" y="1486" text-anchor="middle" fill="#07584f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">Family labels do not establish</text>
  <text x="400" y="1522" text-anchor="middle" fill="#07584f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">cross-model compatibility.</text>
</svg>
