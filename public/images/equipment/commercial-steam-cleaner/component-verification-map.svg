<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Commercial steam cleaner component verification map</title><desc id="desc">Water, boiler, delivery, surface method and recovery interfaces.</desc><rect width="1600" height="900" fill="#f4f5f8"/><rect x="70" y="70" width="1460" height="760" rx="36" fill="#fff" stroke="#dde2e8" stroke-width="3"/><text x="120" y="150" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#102a35">Commercial steam cleaner: verify heat, method and recovery</text><text x="120" y="198" font-family="Arial,sans-serif" font-size="22" fill="#4e6570">Boiler pressure or temperature alone does not establish cleaning or disinfection.</text><g font-family="Arial,sans-serif">
<g transform="translate(120 280)"><rect width="260" height="230" rx="24" fill="#e8f4fb"/><text x="25" y="52" font-size="24" font-weight="700" fill="#2d6f96">01 WATER</text><text x="25" y="100" font-size="22" fill="#18333d">Reservoir &amp; fill</text><text x="25" y="140" font-size="20" fill="#526b74">Quality, capacity,</text><text x="25" y="174" font-size="20" fill="#526b74">refill and descaling</text></g>
<g transform="translate(400 280)"><rect width="260" height="230" rx="24" fill="#fdecec"/><text x="25" y="52" font-size="24" font-weight="700" fill="#a13f3f">02 BOILER</text><text x="25" y="100" font-size="22" fill="#18333d">Heat &amp; pressure</text><text x="25" y="140" font-size="20" fill="#526b74">Rating, relief, load,</text><text x="25" y="174" font-size="20" fill="#526b74">inspection and service</text></g>
<g transform="translate(680 280)"><rect width="260" height="230" rx="24" fill="#fff3dd"/><text x="25" y="52" font-size="24" font-weight="700" fill="#936016">03 DELIVERY</text><text x="25" y="100" font-size="22" fill="#18333d">Hose, valve &amp; tool</text><text x="25" y="140" font-size="20" fill="#526b74">Part number, seals,</text><text x="25" y="174" font-size="20" fill="#526b74">rating and control</text></g>
<g transform="translate(960 280)"><rect width="260" height="230" rx="24" fill="#e9f5f2"/><text x="25" y="52" font-size="24" font-weight="700" fill="#0a6154">04 METHOD</text><text x="25" y="100" font-size="22" fill="#18333d">Surface interaction</text><text x="25" y="140" font-size="20" fill="#526b74">Tool, setting, speed,</text><text x="25" y="174" font-size="20" fill="#526b74">passes and moisture</text></g>
<g transform="translate(1240 280)"><rect width="240" height="230" rx="24" fill="#f5eefb"/><text x="25" y="52" font-size="24" font-weight="700" fill="#71439b">05 RECOVERY</text><text x="25" y="100" font-size="22" fill="#18333d">Vacuum &amp; tank</text><text x="25" y="140" font-size="20" fill="#526b74">Pickup, filter, drain,</text><text x="25" y="174" font-size="20" fill="#526b74">cleaning and disposal</text></g>
<rect x="120" y="590" width="1360" height="150" rx="26" fill="#102a35"/><text x="160" y="646" font-size="25" font-weight="700" fill="#86dbc9">BUYER RELEASE GATE</text><text x="160" y="690" font-size="25" fill="#fff">Approve the exact surface method, component ratings and any claimed hygiene protocol.</text><text x="160" y="724" font-size="20" fill="#c8d5da">Family labels do not establish cross-model compatibility</text></g></svg>
