<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc"><title id="title">Commercial steam cleaner mobile verification map</title><desc id="desc">Vertical heat, method and recovery checks.</desc><rect width="800" height="1200" fill="#f4f5f8"/><text x="55" y="80" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#102a35">Heat + method + recovery</text><text x="55" y="125" font-family="Arial,sans-serif" font-size="20" fill="#4e6570">Commercial steam cleaner buyer map</text><g font-family="Arial,sans-serif"><g fill="#fff" stroke="#dde2e8" stroke-width="2"><rect x="55" y="180" width="690" height="125" rx="22"/><rect x="55" y="330" width="690" height="125" rx="22"/><rect x="55" y="480" width="690" height="125" rx="22"/><rect x="55" y="630" width="690" height="125" rx="22"/><rect x="55" y="780" width="690" height="125" rx="22"/></g><g font-size="22" fill="#18333d"><text x="90" y="230" font-weight="700" fill="#2d6f96">01 Reservoir and fill</text><text x="90" y="270">Water, capacity, refill, descaling</text><text x="90" y="380" font-weight="700" fill="#a13f3f">02 Boiler and pressure control</text><text x="90" y="420">Ratings, relief, load, inspection</text><text x="90" y="530" font-weight="700" fill="#936016">03 Hose, valve and tools</text><text x="90" y="570">Part numbers, seals, control</text><text x="90" y="680" font-weight="700" fill="#0a6154">04 Surface method</text><text x="90" y="720">Setting, speed, passes, moisture</text><text x="90" y="830" font-weight="700" fill="#71439b">05 Optional recovery</text><text x="90" y="870">Pickup, filter, drain, cleaning</text></g><rect x="55" y="950" width="690" height="170" rx="24" fill="#102a35"/><text x="88" y="1002" font-size="23" font-weight="700" fill="#86dbc9">BUYER RELEASE GATE</text><text x="88" y="1044" font-size="21" fill="#fff">Approve the exact method and any</text><text x="88" y="1076" font-size="21" fill="#fff">claimed hygiene protocol.</text><text x="88" y="1106" font-size="18" fill="#c8d5da">Family labels do not establish cross-model compatibility</text></g></svg>
