<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1300" viewBox="0 0 900 1300" role="img"><rect width="900" height="1300" fill="#f4f5f8"/><rect x="45" y="45" width="810" height="1210" rx="32" fill="#fff"/><text x="85" y="120" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#102a35">Combination sweeper-scrubber</text><g font-family="Arial,sans-serif" font-size="22" fill="#18333d"><rect x="85" y="210" width="730" height="155" rx="22" fill="#e8f4fb"/><text x="120" y="270" font-weight="700">01 SWEEP</text><text x="120" y="315">Brushes, debris path and hopper</text><rect x="85" y="390" width="730" height="155" rx="22" fill="#fff3dd"/><text x="120" y="450" font-weight="700">02 DUST</text><text x="120" y="495">Filter, seals and suppression</text><rect x="85" y="570" width="730" height="155" rx="22" fill="#fdecec"/><text x="120" y="630" font-weight="700">03 SCRUB</text><text x="120" y="675">Solution, chemistry and deck</text><rect x="85" y="750" width="730" height="155" rx="22" fill="#e9f5f2"/><text x="120" y="810" font-weight="700">04 RECOVER</text><text x="120" y="855">Squeegee, tanks and powertrain</text><rect x="85" y="970" width="730" height="205" rx="24" fill="#102a35"/><text x="120" y="1030" font-weight="700" fill="#86dbc9">BUYER RELEASE GATE</text><text x="120" y="1080" fill="#fff">Approve debris, wet soil, route</text><text x="120" y="1115" fill="#fff">and the exact powertrain.</text><text x="120" y="1155" font-size="18" fill="#c8d5da">Family labels do not establish cross-model compatibility</text></g></svg>
