<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#f4f5f8"/><rect x="70" y="70" width="1460" height="760" rx="36" fill="#fff" stroke="#dde2e8" stroke-width="3"/><text x="120" y="155" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#102a35">Combination sweeper-scrubber: verify both cleaning systems</text><text x="120" y="205" font-family="Arial,sans-serif" font-size="22" fill="#4e6570">A side brush alone does not establish a full sweeping and hopper architecture.</text><g font-family="Arial,sans-serif"><g transform="translate(120 290)"><rect width="320" height="230" rx="24" fill="#e8f4fb"/><text x="28" y="55" font-size="25" font-weight="700" fill="#2d6f96">01 SWEEP</text><text x="28" y="105" font-size="23" fill="#18333d">Brushes &amp; hopper</text><text x="28" y="155" font-size="20" fill="#526b74">Debris, path, dump</text></g><g transform="translate(465 290)"><rect width="320" height="230" rx="24" fill="#fff3dd"/><text x="28" y="55" font-size="25" font-weight="700" fill="#936016">02 DUST</text><text x="28" y="105" font-size="23" fill="#18333d">Filter &amp; suppression</text><text x="28" y="155" font-size="20" fill="#526b74">Class, seals, service</text></g><g transform="translate(810 290)"><rect width="320" height="230" rx="24" fill="#fdecec"/><text x="28" y="55" font-size="25" font-weight="700" fill="#a13f3f">03 SCRUB</text><text x="28" y="105" font-size="23" fill="#18333d">Solution &amp; deck</text><text x="28" y="155" font-size="20" fill="#526b74">Chemistry, pressure, tanks</text></g><g transform="translate(1155 290)"><rect width="320" height="230" rx="24" fill="#e9f5f2"/><text x="28" y="55" font-size="25" font-weight="700" fill="#0a6154">04 RECOVER</text><text x="28" y="105" font-size="23" fill="#18333d">Squeegee &amp; power</text><text x="28" y="155" font-size="20" fill="#526b74">Pickup, turns, utilities</text></g><rect x="120" y="590" width="1355" height="150" rx="26" fill="#102a35"/><text x="160" y="648" font-size="25" font-weight="700" fill="#86dbc9">BUYER RELEASE GATE</text><text x="160" y="693" font-size="25" fill="#fff">Approve representative debris, wet soil, route geometry and the exact powertrain.</text><text x="160" y="727" font-size="20" fill="#c8d5da">Family labels do not establish cross-model compatibility</text></g></svg>
