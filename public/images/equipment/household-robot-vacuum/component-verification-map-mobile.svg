<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1600" viewBox="0 0 800 1600" role="img" aria-labelledby="t"><title id="t">Household robot vacuum verification map mobile</title><rect width="800" height="1600" fill="#f4f7fb"/><text x="60" y="95" font-family="Arial" font-size="41" font-weight="700" fill="#13233a">Verify robot, home and dock</text><text x="60" y="150" font-family="Arial" font-size="22" fill="#52657d">One connected operating system</text><g font-family="Arial" font-size="27" font-weight="700" fill="#13233a"><g fill="#fff" stroke="#5b7c99" stroke-width="4"><rect x="80" y="225" width="640" height="150" rx="24"/><rect x="80" y="420" width="640" height="150" rx="24"/><rect x="80" y="615" width="640" height="150" rx="24"/><rect x="80" y="810" width="640" height="150" rx="24"/><rect x="80" y="1005" width="640" height="150" rx="24"/></g><text x="120" y="310">1 · Sensors + map</text><text x="120" y="505">2 · Drive + control</text><text x="120" y="700">3 · Brush + airflow</text><text x="120" y="895">4 · Battery + dock</text><text x="120" y="1090">5 · App + data</text></g><rect x="80" y="1240" width="640" height="250" rx="28" fill="#13233a"/><text x="120" y="1315" font-family="Arial" font-size="28" font-weight="700" fill="#fff">Test on the actual floor plan</text><text x="120" y="1380" font-family="Arial" font-size="22" fill="#dbe7f2">Thresholds · debris · dock · data controls</text><text x="120" y="1445" font-family="Arial" font-size="21" font-weight="700" fill="#ffbd8e">Family labels do not establish</text><text x="120" y="1475" font-family="Arial" font-size="21" font-weight="700" fill="#ffbd8e">cross-model compatibility</text></svg>
