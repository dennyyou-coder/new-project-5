<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t"><title id="t">Household robot vacuum verification map</title><rect width="1600" height="1000" fill="#f4f7fb"/><text x="100" y="105" font-family="Arial" font-size="52" font-weight="700" fill="#13233a">Household robot vacuum: verify robot, home and dock</text><text x="100" y="165" font-family="Arial" font-size="25" fill="#52657d">Navigation, pickup, charging, dock automation and data controls form one operating system.</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#5b7c99" stroke-width="4"><rect x="75" y="285" width="270" height="180" rx="28"/><rect x="390" y="285" width="270" height="180" rx="28"/><rect x="705" y="285" width="270" height="180" rx="28"/><rect x="1020" y="285" width="270" height="180" rx="28"/><rect x="1335" y="285" width="190" height="180" rx="28"/></g><g fill="#13233a" font-size="27" font-weight="700"><text x="210" y="350">Sensors + map</text><text x="525" y="350">Drive + control</text><text x="840" y="350">Brush + airflow</text><text x="1155" y="350">Battery + dock</text><text x="1430" y="350">App + data</text></g><g fill="#52657d" font-size="20"><text x="210" y="405">threshold · obstacle</text><text x="525" y="405">coverage · recovery</text><text x="840" y="405">surface · debris</text><text x="1155" y="405">charge · consumables</text><text x="1430" y="405">support · privacy</text></g></g><g stroke="#e56b3f" stroke-width="8"><path d="M345 375h45"/><path d="M660 375h45"/><path d="M975 375h45"/><path d="M1290 375h45"/></g><rect x="100" y="590" width="1400" height="245" rx="32" fill="#13233a"/><text x="150" y="665" font-family="Arial" font-size="30" font-weight="700" fill="#fff">Buyer evidence pack</text><text x="150" y="720" font-family="Arial" font-size="25" fill="#dbe7f2">Floor plan trial · threshold map · debris test · dock clearance · consumables · update and privacy policy</text><text x="150" y="790"