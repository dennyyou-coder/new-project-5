<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1600" viewBox="0 0 800 1600" role="img" aria-labelledby="title desc"><title id="title">Hot-Water Pressure Washer component verification map</title><desc id="desc">Family labels do not establish cross-model compatibility. Verify five model-specific zones.</desc><rect width="800" height="1600" fill="#edf5f1"/><text x="400" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#14352f">Hot-Water Pressure Washer</text><text x="400" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#4a625d">Buyer component verification map</text><g font-family="Arial,sans-serif"><g><rect x="60" y="230" width="680" height="170" rx="24" fill="#ffffff" stroke="#c9d9d3" stroke-width="3"/><circle cx="115" cy="288" r="26" fill="#176b5b"/><text x="115" y="298" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">1</text><text x="165" y="298" font-size="31" font-weight="700" fill="#14352f">Water inlet</text><text x="165" y="342" font-size="24" fill="#4a625d">Verify exact model,</text><text x="165" y="376" font-size="24" fill="#4a625d">rating and service ID.</text></g><g><rect x="60" y="434" width="680" height="170" rx="24" fill="#ffffff" stroke="#c9d9d3" stroke-width="3"/><circle cx="115" cy="492" r="26" fill="#176b5b"/><text x="115" y="502" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">2</text><text x="165" y="502" font-size="31" font-weight="700" fill="#14352f">Pump drive</text><text x="165" y="546" font-size="24" fill="#4a625d">Verify exact model,</text><text x="165" y="580" font-size="24" fill="#4a625d">rating and service ID.</text></g><g><rect x="60" y="638" width="680" height="170" rx="24" fill="#ffffff" stroke="#c9d9d3" stroke-width="3"/><circle cx="115" cy="696" r="26" fill="#176b5b"/><text x="115" y="706" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">3</text><text x="165" y="706" font-size="31" font-weight="700" fill="#14352f">Heater</text><text x="165" y="750" font-size="24" fill="#4a625d">Verify exact model,</text><text x="165" y="784" font-size="24" fill="#4a625d">rating and service ID.</text></g><g><rect x="60" y="842" width="680" height="170" rx="24" fill="#ffffff" stroke="#c9d9d3" stroke-width="3"/><circle cx="115" cy="900" r="26" fill="#176b5b"/><text x="115" y="910" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">4</text><text x="165" y="910" font-size="31" font-weight="700" fill="#14352f">Hot-rated hose</text><text x="165" y="954" font-size="24" fill="#4a625d">Verify exact model,</text><text x="165" y="988" font-size="24" fill="#4a625d">rating and service ID.</text></g><g><rect x="60" y="1046" width="680" height="170" rx="24" fill="#ffffff" stroke="#c9d9d3" stroke-width="3"/><circle cx="115" cy="1104" r="26" fill="#176b5b"/><text x="115" y="1114" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">5</text><text x="165" y="1114" font-size="31" font-weight="700" fill="#14352f">Nozzle + runoff</text><text x="165" y="1158" font-size="24" fill="#4a625d">Verify exact model,</text><text x="165" y="1192" font-size="24" fill="#4a625d">rating and service ID.</text></g></g><rect x="55" y="1340" width="690" height="170" rx="24" fill="#14352f"/><text x="400" y="1410" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">Family labels do not establish</text><text x="400" y="1450" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">cross-model compatibility</text></svg>
