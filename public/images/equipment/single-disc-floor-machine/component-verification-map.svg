<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Single-disc floor machine component verification map</title>
  <desc id="desc">Four verification zones covering power, drive, floor tooling and task system.</desc>
  <rect width="1600" height="1000" fill="#f3f6f8"/><rect x="70" y="65" width="1460" height="870" rx="34" fill="#fff" stroke="#cbd5df" stroke-width="3"/>
  <text x="130" y="155" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#102a43">Single-disc machine: verify the complete treatment system</text>
  <text x="130" y="205" font-family="Arial,sans-serif" font-size="25" fill="#486581">Match identifiers before approving pads, brushes, tanks or chemicals.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(130 285)"><rect width="300" height="350" rx="25" fill="#e8f3f1" stroke="#2f7d73" stroke-width="3"/><text x="28" y="64" font-size="28" font-weight="700" fill="#145f57">1 · POWER</text><text x="28" y="115" font-size="23" fill="#243b53"><tspan x="28">Voltage / frequency</tspan><tspan x="28" dy="42">Plug and cord</tspan><tspan x="28" dy="42">Circuit protection</tspan><tspan x="28" dy="42">Regional product no.</tspan></text></g>
    <g transform="translate(477 285)"><rect width="300" height="350" rx="25" fill="#eef2ff" stroke="#5267b7" stroke-width="3"/><text x="28" y="64" font-size="28" font-weight="700" fill="#334a9e">2 · DRIVE</text><text x="28" y="115" font-size="23" fill="#243b53"><tspan x="28">Motor and gearbox</tspan><tspan x="28" dy="42">Nominal rpm</tspan><tspan x="28" dy="42">Hub / center lock</tspan><tspan x="28" dy="42">Head dimensions</tspan></text></g>
    <g transform="translate(824 285)"><rect width="300" height="350" rx="25" fill="#fff4e6" stroke="#c77700" stroke-width="3"/><text x="28" y="64" font-size="28" font-weight="700" fill="#9a5700">3 · TOOLING</text><text x="28" y="115" font-size="23" fill="#243b53"><tspan x="28">Driver / brush PN</tspan><tspan x="28" dy="42">Pad diameter</tspan><tspan x="28" dy="42">Speed rating</tspan><tspan x="28" dy="42">Wear and material</tspan></text></g>
    <g transform="translate(1171 285)"><rect width="300" height="350" rx="25" fill="#fceff4" stroke="#a64d70" stroke-width="3"/><text x="28" y="64" font-size="28" font-weight="700" fill="#843956">4 · TASK</text><text x="28" y="115" font-size="23" fill="#243b53"><tspan x="28">Floor / finish</tspan><tspan x="28" dy="42">Chemical and dilution</tspan><tspan x="28" dy="42">Approved method</tspan><tspan x="28" dy="42">Site trial result</tspan></text></g>
  </g>
  <rect x="130" y="705" width="1340" height="145" rx="22" fill="#102a43"/><text x="800" y="765" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fff">Family labels do not establish cross-model compatibility</text><text x="800" y="811" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#d9e2ec">Record the exact model, serial range, tooling part numbers and approved floor-care process.</text>
</svg>
