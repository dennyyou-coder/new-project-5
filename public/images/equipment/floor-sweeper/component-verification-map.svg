<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Floor sweeper component verification</title><desc id="desc">Four model-specific verification zones. Family labels do not establish cross-model compatibility.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2930"/><stop offset="1" stop-color="#123f43"/></linearGradient></defs><rect width="1600" height="1000" rx="34" fill="#eff6f4"/><rect width="1600" height="210" rx="34" fill="url(#bg)"/><rect y="176" width="1600" height="34" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="80" y="72" fill="#7fe0cf" font-size="24" font-weight="700" letter-spacing="4">WCB TECHNICAL DIAGRAM</text><text x="80" y="132" fill="#fff" font-size="44" font-weight="800">Floor sweeper component verification</text><text x="80" y="178" fill="#c7dcda" font-size="24">Confirm identifiers and interfaces before procurement or service decisions.</text><g><rect x="80" y="260" width="690" height="270" rx="26" fill="#fff" stroke="#c7dbd7" stroke-width="2"/><circle cx="140" cy="324" r="34" fill="#0d766e"/><text x="140" y="334" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">01</text><text x="196" y="316" fill="#123846" font-size="30" font-weight="800">Brush system</text><text x="196" y="356" fill="#557076" font-size="22">main + side brush</text><line x1="120" y1="392" x2="730" y2="392" stroke="#d5e1df" stroke-width="2"/><text x="120" y="442" fill="#183b40" font-size="22" font-weight="700">VERIFY</text><text x="230" y="442" fill="#365960" font-size="22">part no. · pattern · material</text><text x="120" y="486" fill="#557076" font-size="20">Exact model · configuration · market · serial range</text></g>
<g><rect x="830" y="260" width="690" height="270" rx="26" fill="#fff" stroke="#c7dbd7" stroke-width="2"/><circle cx="890" cy="324" r="34" fill="#0d766e"/><text x="890" y="334" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">02</text><text x="946" y="316" fill="#123846" font-size="30" font-weight="800">Hopper + dumping</text><text x="946" y="356" fill="#557076" font-size="22">collection and discharge</text><line x1="870" y1="392" x2="1480" y2="392" stroke="#d5e1df" stroke-width="2"/><text x="870" y="442" fill="#183b40" font-size="22" font-weight="700">VERIFY</text><text x="980" y="442" fill="#365960" font-size="22">capacity · seals · clearance</text><text x="870" y="486" fill="#557076" font-size="20">Exact model · configuration · market · serial range</text></g>
