<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1600" viewBox="0 0 800 1600" role="img" aria-labelledby="title desc"><title id="title">Mobile steam mop verification map</title><desc id="desc">Four stacked buyer checks.</desc><rect width="800" height="1600" fill="#f3f1ed"/><text x="60" y="100" font-family="Arial" font-size="42" font-weight="700" fill="#27343a">Verify the steam path</text><g font-family="Arial" fill="#27343a"><rect x="60" y="170" width="680" height="245" rx="28" fill="#fff" stroke="#8d9ca2" stroke-width="4"/><text x="105" y="235" font-size="32" font-weight="700">01 Power</text><text x="105" y="295" font-size="24">Voltage · plug · cord · protection</text><rect x="60" y="455" width="680" height="245" rx="28" fill="#fff" stroke="#8d9ca2" stroke-width="4"/><text x="105" y="520" font-size="32" font-weight="700">02 Water and heat</text><text x="105" y="580" font-size="24">Permitted water · scale · thermal controls</text><rect x="60" y="740" width="680" height="245" rx="28" fill="#fff" stroke="#8d9ca2" stroke-width="4"/><text x="105" y="805" font-size="32" font-weight="700">03 Steam delivery</text><text x="105" y="865" font-size="24">Readiness · setting · dwell · cooldown</text><rect x="60" y="1025" width="680" height="245" rx="28" fill="#fff" stroke="#8d9ca2" stroke-width="4"/><text x="105" y="1090" font-size="32" font-weight="700">04 Floor contact</text><text x="105" y="1150" font-size="24">Surface · pad · residue · slip</text></g><text x="60" y="1390" font-family="Arial" font-size="23" fill="#586970">Family labels do not establish cross-model compatibility</text></svg>
