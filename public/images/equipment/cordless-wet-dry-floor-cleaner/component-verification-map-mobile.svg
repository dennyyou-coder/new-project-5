<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1600" viewBox="0 0 800 1600" role="img" aria-labelledby="title desc"><title id="title">Mobile floor washer verification map</title><desc id="desc">Four stacked buyer checks.</desc><rect width="800" height="1600" fill="#eef5f1"/><text x="60" y="100" font-family="Arial" font-size="42" font-weight="700" fill="#17372f">Verify the wet cleaning loop</text><g font-family="Arial" fill="#17372f"><rect x="60" y="170" width="680" height="245" rx="28" fill="#fff" stroke="#6b9d8b" stroke-width="4"/><text x="105" y="235" font-size="32" font-weight="700">01 Energy</text><text x="105" y="295" font-size="24">Battery code · charger region · route runtime</text><rect x="60" y="455" width="680" height="245" rx="28" fill="#fff" stroke="#6b9d8b" stroke-width="4"/><text x="105" y="520" font-size="32" font-weight="700">02 Liquid delivery</text><text x="105" y="580" font-size="24">Clean tank · approved formula · pump and dose</text><rect x="60" y="740" width="680" height="245" rx="28" fill="#fff" stroke="#6b9d8b" stroke-width="4"/><text x="105" y="805" font-size="32" font-weight="700">03 Floor head</text><text x="105" y="865" font-size="24">Roller · scraper · surface · edge clearance</text><rect x="60" y="1025" width="680" height="245" rx="28" fill="#fff" stroke="#6b9d8b" stroke-width="4"/><text x="105" y="1090" font-size="32" font-weight="700">04 Recovery</text><text x="105" y="1150" font-size="24">Dirty tank · filter · float · rinse · drying</text></g><text x="60" y="1390" font-family="Arial" font-size="23" fill="#4a625b">Family labels do not establish cross-model compatibility</text></svg>
