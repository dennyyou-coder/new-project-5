<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Cordless wet dry floor cleaner verification map</title><desc id="desc">Buyer checks across energy, liquid delivery, floor contact and recovery.</desc>
  <rect width="1600" height="1000" fill="#eef5f1"/><text x="100" y="115" font-family="Arial" font-size="56" font-weight="700" fill="#17372f">Verify the complete wet cleaning loop</text>
  <g font-family="Arial" fill="#17372f"><rect x="100" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#6b9d8b" stroke-width="4"/><text x="140" y="285" font-size="34" font-weight="700">01 Energy</text><text x="140" y="350" font-size="25">Battery code</text><text x="140" y="400" font-size="25">Charger region</text><text x="140" y="450" font-size="25">Route runtime</text>
  <rect x="465" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#6b9d8b" stroke-width="4"/><text x="505" y="285" font-size="34" font-weight="700">02 Delivery</text><text x="505" y="350" font-size="25">Clean tank</text><text x="505" y="400" font-size="25">Approved formula</text><text x="505" y="450" font-size="25">Pump and dose</text>
  <rect x="830" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#6b9d8b" stroke-width="4"/><text x="870" y="285" font-size="34" font-weight="700">03 Floor head</text><text x="870" y="350" font-size="25">Roller and scraper</text><text x="870" y="400" font-size="25">Surface approval</text><text x="870" y="450" font-size="25">Edge clearance</text>
  <rect x="1195" y="210" width="300" height="430" rx="28" fill="#fff" stroke="#6b9d8b" stroke-width="4"/><text x="1235" y="285" font-size="34" font-weight="700">04 Recovery</text><text x="1235" y="350" font-size="25">Dirty tank</text><text x="1235" y="400" font-size="25">Filter and float</text><text x="1235" y="450" font-size="25">Rinse and drying</text></g>
  <path d="M400 425h65m300 0h65m300 0h65" stroke="#e35d36" stroke-width="14"/><text x="100" y="805" font-family="Arial" font-size="30" font-weight="700" fill="#17372f">Buyer gate: prove surface approval, route capacity, recovery and post-use service together.</text><text x="100" y="875" font-family="Arial" font-size="25" fill="#4a625b">Family labels do not establish cross-model compatibility</text>
</svg>
