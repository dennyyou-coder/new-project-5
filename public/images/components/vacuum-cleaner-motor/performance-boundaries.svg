<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vacuum motor performance measurement boundaries</title>
  <desc id="desc">WCB diagram separating electrical input, motor fan operating point, airflow, sealed vacuum, air power and actual cleaning outcome.</desc>
  <rect width="1600" height="900" rx="36" fill="#eef5f8"/>
  <text x="90" y="92" fill="#172d43" font-family="Arial, sans-serif" font-size="42" font-weight="700">Do not collapse unlike measurements into one power score</text>
  <text x="90" y="140" fill="#587086" font-family="Arial, sans-serif" font-size="24">Each value answers a different question and depends on a stated test boundary.</text>
  <g font-family="Arial, sans-serif">
    <rect x="90" y="230" width="290" height="220" rx="28" fill="#fff" stroke="#b9ceda" stroke-width="3"/>
    <text x="125" y="285" fill="#146b9c" font-size="22" font-weight="700">ELECTRICAL INPUT</text>
    <text x="125" y="340" fill="#172d43" font-size="31" font-weight="700">Watts, volts, amps</text>
    <text x="125" y="388" fill="#587086" font-size="22">Energy supplied under</text><text x="125" y="420" fill="#587086" font-size="22">the stated condition</text>
    <path d="M395 340h95" stroke="#146b9c" stroke-width="8" stroke-linecap="round"/><path d="m475 322 24 18-24 18" fill="none" stroke="#146b9c" stroke-width="8" stroke-linecap="round"/>
    <rect x="510" y="230" width="300" height="220" rx="28" fill="#ddecf4" stroke="#9bbdce" stroke-width="3"/>
    <text x="545" y="285" fill="#146b9c" font-size="22" font-weight="700">MOTOR + FAN</text>
    <text x="545" y="340" fill="#172d43" font-size="31" font-weight="700">Operating point</text>
    <text x="545" y="388" fill="#587086" font-size="22">Speed, fan stage, losses,</text><text x="545" y="420" fill="#587086" font-size="22">restriction and controls</text>
    <path d="M825 340h95" stroke="#146b9c" stroke-width="8" stroke-linecap="round"/><path d="m905 322 24 18-24 18" fill="none" stroke="#146b9c" stroke-width="8" stroke-linecap="round"/>
    <rect x="940" y="195" width="260" height="150" rx="26" fill="#fff" stroke="#b9ceda" stroke-width="3"/>
    <text x="975" y="248" fill="#146b9c" font-size="21" font-weight="700">AIRFLOW</text><text x="975" y="300" fill="#172d43" font-size="27" font-weight="700">Volume per time</text>
    <rect x="940" y="365" width="260" height="150" rx="26" fill="#fff" stroke="#b9ceda" stroke-width="3"/>
    <text x="975" y="418" fill="#146b9c" font-size="21" font-weight="700">SEALED VACUUM</text><text x="975" y="470" fill="#172d43" font-size="27" font-weight="700">Pressure potential</text>
    <path d="M1215 340h80" stroke="#146b9c" stroke-width="8" stroke-linecap="round"/><path d="m1280 322 24 18-24 18" fill="none" stroke="#146b9c" stroke-width="8" stroke-linecap="round"/>
    <rect x="1315" y="230" width="215" height="220" rx="28" fill="#172d43"/>
    <text x="1350" y="285" fill="#9ad5ef" font-size="21" font-weight="700">AIR POWER</text>
    <text x="1350" y="340" fill="#fff" font-size="29" font-weight="700">Calculated at a</text><text x="1350" y="375" fill="#fff" font-size="29" font-weight="700">stated point</text>
    <text x="1350" y="420" fill="#c6d8e2" font-size="20">Not input power</text>
    <rect x="90" y="570" width="1440" height="220" rx="30" fill="#fff" stroke="#d0dee6" stroke-width="3"/>
    <text x="130" y="630" fill="#172d43" font-size="28" font-weight="700">Actual cleaning outcome adds the whole appliance and test surface</text>
    <text x="130" y="687" fill="#587086" font-size="23">Nozzle and duct losses  •  filtration loading  •  seals  •  brush action  •  surface  •  test method  •  operator or robot behavior</text>
    <rect x="130" y="725" width="1320" height="42" rx="21" fill="#fff0cf"/>
    <text x="790" y="754" text-anchor="middle" fill="#7b5400" font-size="21" font-weight="700">Compare values only when the measurement point, restriction, units and method are aligned.</text>
  </g>
</svg>
