<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Tennant fleet buyer checks</title><desc id="desc">Five checks for professional and autonomous floor-cleaning fleets.</desc>
  <rect width="1200" height="720" fill="#102f28"/>
  <text x="80" y="96" font-family="Arial" font-size="40" font-weight="700" fill="#fff">Five checks before fleet approval</text>
  <text x="80" y="140" font-family="Arial" font-size="21" fill="#b9d8ce">Treat the machine and its operating system as one procurement program.</text>
  <g font-family="Arial">
    <g transform="translate(80 210)"><rect width="200" height="320" rx="22" fill="#fff"/><text x="28" y="58" font-size="34" font-weight="700" fill="#087f5b">01</text><text x="28" y="112" font-size="25" font-weight="700" fill="#16362b">Machine fit</text><text x="28" y="162" font-size="18" fill="#526a62">Surface</text><text x="28" y="196" font-size="18" fill="#526a62">Productivity</text><text x="28" y="230" font-size="18" fill="#526a62">Consumables</text></g>
    <g transform="translate(290 210)"><rect width="200" height="320" rx="22" fill="#dff3eb"/><text x="28" y="58" font-size="34" font-weight="700" fill="#087f5b">02</text><text x="28" y="112" font-size="25" font-weight="700" fill="#16362b">Autonomy</text><text x="28" y="162" font-size="18" fill="#526a62">Site mapping</text><text x="28" y="196" font-size="18" fill="#526a62">Safety validation</text><text x="28" y="230" font-size="18" fill="#526a62">Manual fallback</text></g>
    <g transform="translate(500 210)"><rect width="200" height="320" rx="22" fill="#fff"/><text x="28" y="58" font-size="34" font-weight="700" fill="#087f5b">03</text><text x="28" y="112" font-size="25" font-weight="700" fill="#16362b">Energy</text><text x="28" y="162" font-size="18" fill="#526a62">Battery life</text><text x="28" y="196" font-size="18" fill="#526a62">Charging</text><text x="28" y="230" font-size="18" fill="#526a62">Replacement cost</text></g>
    <g transform="translate(710 210)"><rect width="200" height="320" rx="22" fill="#dff3eb"/><text x="28" y="58" font-size="34" font-weight="700" fill="#087f5b">04</text><text x="28" y="112" font-size="25" font-weight="700" fill="#16362b">Service</text><text x="28" y="162" font-size="18" fill="#526a62">Response time</text><text x="28" y="196" font-size="18" fill="#526a62">Parts stock</text><text x="28" y="230" font-size="18" fill="#526a62">Uptime terms</text></g>
    <g transform="translate(920 210)"><rect width="200" height="320" rx="22" fill="#fff"/><text x="28" y="58" font-size="34" font-weight="700" fill="#087f5b">05</text><text x="28" y="112" font-size="25" font-weight="700" fill="#16362b">Data</text><text x="28" y="162" font-size="18" fill="#526a62">Controller</text><text x="28" y="196" font-size="18" fill="#526a62">Retention</text><text x="28" y="230" font-size="18" fill="#526a62">Cyber support</text></g>
  </g>
  <text x="600" y="622" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#d6f5e8">Require named owners and acceptance criteria for every workstream.</text>
</svg>
