<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Beko appliance model verification workflow</title>
  <desc id="desc">A model-level buyer workflow separating brand, factory, importer and warranty evidence.</desc>
  <rect width="1600" height="900" fill="#f0f5f4"/>
  <text x="105" y="110" fill="#082835" font-family="Arial, sans-serif" font-size="56" font-weight="700">Beko buyer check: four records, one accountable SKU</text>
  <text x="105" y="168" fill="#58727c" font-family="Arial, sans-serif" font-size="28">Use the unit and its documents to validate the supply chain</text>
  <g font-family="Arial, sans-serif">
    <rect x="105" y="250" width="310" height="330" rx="28" fill="#ffffff" stroke="#09a89b" stroke-width="4"/><circle cx="170" cy="320" r="34" fill="#09a89b"/><text x="170" y="332" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">1</text><text x="145" y="395" fill="#082835" font-size="33" font-weight="700">Identity</text><text x="145" y="447" fill="#58727c" font-size="24">Model, serial, rating</text><text x="145" y="484" fill="#58727c" font-size="24">plate and market.</text>
    <rect x="465" y="250" width="310" height="330" rx="28" fill="#ffffff" stroke="#09a89b" stroke-width="4"/><circle cx="530" cy="320" r="34" fill="#09a89b"/><text x="530" y="332" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">2</text><text x="505" y="395" fill="#082835" font-size="33" font-weight="700">Factory</text><text x="505" y="447" fill="#58727c" font-size="24">Declaration, maker</text><text x="505" y="484" fill="#58727c" font-size="24">and production origin.</text>
    <rect x="825" y="250" width="310" height="330" rx="28" fill="#ffffff" stroke="#09a89b" stroke-width="4"/><circle cx="890" cy="320" r="34" fill="#09a89b"/><text x="890" y="332" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">3</text><text x="865" y="395" fill="#082835" font-size="33" font-weight="700">Importer</text><text x="865" y="447" fill="#58727c" font-size="24">Invoice, local entity</text><text x="865" y="484" fill="#58727c" font-size="24">and compliance role.</text>
    <rect x="1185" y="250" width="310" height="330" rx="28" fill="#ffffff" stroke="#09a89b" stroke-width="4"/><circle cx="1250" cy="320" r="34" fill="#09a89b"/><text x="1250" y="332" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">4</text><text x="1225" y="395" fill="#082835" font-size="33" font-weight="700">Warranty</text><text x="1225" y="447" fill="#58727c" font-size="24">Named obligor, service</text><text x="1225" y="484" fill="#58727c" font-size="24">route and exclusions.</text>
  </g>
  <path d="M415 415 H465 M775 415 H825 M1135 415 H1185" stroke="#e58b42" stroke-width="8"/>
  <rect x="105" y="650" width="1390" height="140" rx="26" fill="#082835"/>
  <text x="155" y="707" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Important:</text>
  <text x="155" y="754" fill="#c6d5d9" font-family="Arial, sans-serif" font-size="26">Beko group ownership does not prove the factory or origin of a specific appliance.</text>
  <text x="105" y="855" fill="#647b82" font-family="Arial, sans-serif" font-size="22">World Clean Biz buyer verification map · reviewed 6 August 2026</text>
</svg>
