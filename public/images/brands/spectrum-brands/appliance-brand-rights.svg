<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Spectrum Brands appliance brand rights</title><desc id="desc">Most Home and Personal Care brands are owned; Black+Decker appliances and Emeril Lagasse are licensed, and Remington is a shared-use trademark. Substantially all products are made by third-party suppliers in Asia-Pacific.</desc><rect width="1600" height="900" fill="#f5f7f8"/><text x="110" y="115" fill="#202a2f" font-family="Arial,sans-serif" font-size="54" font-weight="700">Owned, licensed and shared brand rights</text><text x="110" y="170" fill="#68777e" font-family="Arial,sans-serif" font-size="25">The logo on the box does not tell you who owns the name, or who made the product.</text><rect x="110" y="240" width="430" height="330" rx="28" fill="#fff" stroke="#476f82" stroke-width="5"/><text x="150" y="300" fill="#376176" font-family="Arial,sans-serif" font-size="22" font-weight="700">OWNED</text><text x="150" y="360" fill="#202a2f" font-family="Arial,sans-serif" font-size="30" font-weight="700">Russell Hobbs</text><text x="150" y="405" fill="#202a2f" font-family="Arial,sans-serif" font-size="30" font-weight="700">George Foreman</text><text x="150" y="450" fill="#202a2f" font-family="Arial,sans-serif" font-size="30" font-weight="700">PowerXL</text><text x="150" y="495" fill="#202a2f" font-family="Arial,sans-serif" font-size="30" font-weight="700">Copper Chef</text><rect x="585" y="240" width="430" height="330" rx="28" fill="#fff" stroke="#819da9" stroke-width="5"/><text x="625" y="300" fill="#587887" font-family="Arial,sans-serif" font-size="22" font-weight="700">LICENSED</text><text x="625" y="360" fill="#202a2f" font-family="Arial,sans-serif" font-size="30" font-weight="700">Black+Decker</text><text x="625" y="395" fill="#68777e" font-family="Arial,sans-serif" font-size="21">from Stanley Black &amp; Decker,</text><text x="625" y="425" fill="#68777e" font-family="Arial,sans-serif" font-size="21">North and Latin America, to 2027</text><text x="625" y="485" fill="#202a2f" font-family="Arial,sans-serif" font-size="30" font-weight="700">Emeril Lagasse</text><text x="625" y="520" fill="#68777e" font-family="Arial,sans-serif" font-size="21">licensed, to 2027</text><rect x="1060" y="240" width="430" height="330" rx="28" fill="#fff" stroke="#819da9" stroke-width="5"/><text x="1100" y="300" fill="#587887" font-family="Arial,sans-serif" font-size="22" font-weight="700">SHARED TRADEMARK</text><text x="1100" y="360" fill="#202a2f" font-family="Arial,sans-serif" font-size="30" font-weight="700">Remington</text><text x="1100" y="395" fill="#68777e" font-family="Arial,sans-serif" font-size="21">personal care use, shared</text><text x="1100" y="425" fill="#68777e" font-family="Arial,sans-serif" font-size="21">with Remington Arms</text><rect x="110" y="620" width="1380" height="110" rx="28" fill="#263c47"/><text x="165" y="665" fill="#b9d5df" font-family="Arial,sans-serif" font-size="22" font-weight="700">MANUFACTURING</text><text x="165" y="705" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Substantially all HPC products come from third-party suppliers in Asia-Pacific</text><text x="1490" y="850" fill="#87959b" text-anchor="end" font-family="Arial,sans-serif" font-size="18">Source: Spectrum Brands fiscal 2025 Form 10-K · World Clean Biz, 21 November 2026</text></svg>
