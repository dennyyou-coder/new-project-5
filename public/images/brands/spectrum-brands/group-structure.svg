<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Spectrum Brands group structure</title><desc id="desc">Spectrum Brands Holdings has three segments. Its Home and Personal Care business trades as Empower Brands, about 73% owned by Spectrum Brands and 27% by funds managed by Oaktree since May 2026.</desc><rect width="1600" height="900" fill="#f5f7f8"/><text x="110" y="115" fill="#202a2f" font-family="Arial,sans-serif" font-size="54" font-weight="700">One listed parent, three segments</text><text x="110" y="170" fill="#68777e" font-family="Arial,sans-serif" font-size="25">The appliance brands sit in a business that Spectrum Brands no longer owns outright.</text><rect x="110" y="240" width="1380" height="115" rx="28" fill="#263c47"/><text x="165" y="288" fill="#b9d5df" font-family="Arial,sans-serif" font-size="22" font-weight="700">LISTED PARENT · NYSE: SPB · MIDDLETON, WISCONSIN</text><text x="165" y="330" fill="#fff" font-family="Arial,sans-serif" font-size="33" font-weight="700">Spectrum Brands Holdings, Inc.</text><rect x="110" y="420" width="430" height="240" rx="28" fill="#fff" stroke="#819da9" stroke-width="5"/><text x="150" y="480" fill="#587887" font-family="Arial,sans-serif" font-size="22" font-weight="700">SEGMENT</text><text x="150" y="535" fill="#202a2f" font-family="Arial,sans-serif" font-size="34" font-weight="700">Global Pet Care</text><text x="150" y="585" fill="#68777e" font-family="Arial,sans-serif" font-size="22">Tetra, Nature's Miracle,</text><text x="150" y="617" fill="#68777e" font-family="Arial,sans-serif" font-size="22">FURminator, DreamBone</text><rect x="585" y="420" width="430" height="240" rx="28" fill="#fff" stroke="#819da9" stroke-width="5"/><text x="625" y="480" fill="#587887" font-family="Arial,sans-serif" font-size="22" font-weight="700">SEGMENT</text><text x="625" y="535" fill="#202a2f" font-family="Arial,sans-serif" font-size="34" font-weight="700">Home &amp; Garden</text><text x="625" y="585" fill="#68777e" font-family="Arial,sans-serif" font-size="22">Spectracide, Cutter,</text><text x="625" y="617" fill="#68777e" font-family="Arial,sans-serif" font-size="22">Hot Shot, Rejuvenate</text><rect x="1060" y="420" width="430" height="240" rx="28" fill="#fff" stroke="#476f82" stroke-width="6"/><text x="1100" y="480" fill="#376176" font-family="Arial,sans-serif" font-size="22" font-weight="700">HOME &amp; PERSONAL CARE</text><text x="1100" y="535" fill="#202a2f" font-family="Arial,sans-serif" font-size="34" font-weight="700">Empower Brands</text><text x="1100" y="585" fill="#68777e" font-family="Arial,sans-serif" font-size="22">Spectrum about 73%</text><text x="1100" y="617" fill="#68777e" font-family="Arial,sans-serif" font-size="22">Oaktree funds about 27%</text><text x="110" y="745" fill="#68777e" font-family="Arial,sans-serif" font-size="24">Russell Hobbs, George Foreman, Remington and licensed Black+Decker appliances sit in Empower Brands.</text><text x="1490" y="850" fill="#87959b" text-anchor="end" font-family="Arial,sans-serif" font-size="18">World Clean Biz · reviewed 21 November 2026</text></svg>
