<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Fimap machine fleet and service check</title><desc id="desc">Four buyer checks for Fimap professional cleaning equipment.</desc><rect width="1200" height="675" rx="36" fill="#102a43"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="white">VERIFY THE COMPLETE CLEANING SYSTEM</text><text x="70" y="125" font-family="Arial,sans-serif" font-size="22" fill="#d9e6ef">Machine performance depends on deployment and support</text><g font-family="Arial,sans-serif"><rect x="70" y="180" width="505" height="160" rx="24" fill="#173f5f"/><text x="105" y="232" font-size="24" font-weight="700" fill="#4ec3ff">01  MACHINE</text><text x="105" y="274" font-size="19" fill="white">Exact model, battery, brushes,</text><text x="105" y="305" font-size="19" fill="white">accessories and documents</text><rect x="625" y="180" width="505" height="160" rx="24" fill="#173f5f"/><text x="660" y="232" font-size="24" font-weight="700" fill="#4ec3ff">02  SITE</text><text x="660" y="274" font-size="19" fill="white">Floor, traffic, route, obstacles</text><text x="660" y="305" font-size="19" fill="white">and real hourly output</text><rect x="70" y="380" width="505" height="160" rx="24" fill="#173f5f"/><text x="105" y="432" font-size="24" font-weight="700" fill="#4ec3ff">03  PEOPLE + DATA</text><text x="105" y="474" font-size="19" fill="white">Training, robot oversight, reports</text><text x="105" y="505" font-size="19" fill="white">and software access</text><rect x="625" y="380" width="505" height="160" rx="24" fill="#173f5f"/><text x="660" y="432" font-size="24" font-weight="700" fill="#4ec3ff">04  AFTERSALES</text><text x="660" y="474" font-size="19" fill="white">Local technicians, spare parts,</text><text x="660" y="505" font-size="19" fill="white">response and warranty</text></g><text x="70" y="615" font-family="Arial,sans-serif" font-size="20" fill="#d9e6ef">Measure the delivered result throughout the intended duty cycle.</text></svg>
