<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Fimap company brand and manufacturer boundary</title><desc id="desc">Fimap S.p.A. is distinct from model manufacturer and market service roles.</desc><rect width="1200" height="675" rx="36" fill="#f4f8fb"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#102a43">VERIFY THE ENTITY AT MODEL LEVEL</text><text x="70" y="125" font-family="Arial,sans-serif" font-size="22" fill="#52606d">One brand page can involve several legal responsibilities</text><rect x="70" y="178" width="1060" height="145" rx="24" fill="#0878bd"/><text x="105" y="235" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">FIMAP S.p.A.</text><text x="105" y="278" font-family="Arial,sans-serif" font-size="22" fill="white">Named Italian company behind the official Fimap site</text><path d="M600 323v62" stroke="#77838f" stroke-width="5"/><path d="M585 370l15 20 15-20" fill="none" stroke="#77838f" stroke-width="5"/><g font-family="Arial,sans-serif"><rect x="70" y="410" width="240" height="155" rx="22" fill="white" stroke="#cbd8e2" stroke-width="2"/><text x="100" y="462" font-size="22" font-weight="700" fill="#102a43">MODEL MAKER</text><text x="100" y="503" font-size="18" fill="#52606d">Check plate and</text><text x="100" y="533" font-size="18" fill="#52606d">declaration</text><rect x="335" y="410" width="240" height="155" rx="22" fill="white" stroke="#cbd8e2" stroke-width="2"/><text x="365" y="462" font-size="22" font-weight="700" fill="#102a43">SELLER</text><text x="365" y="503" font-size="18" fill="#52606d">Contract and</text><text x="365" y="533" font-size="18" fill="#52606d">delivery scope</text><rect x="600" y="410" width="240" height="155" rx="22" fill="white" stroke="#cbd8e2" stroke-width="2"/><text x="630" y="462" font-size="22" font-weight="700" fill="#102a43">IMPORTER</text><text x="630" y="503" font-size="18" fill="#52606d">Local compliance</text><text x="630" y="533" font-size="18" fill="#52606d">and traceability</text><rect x="865" y="410" width="265" height="155" rx="22" fill="white" stroke="#cbd8e2" stroke-width="2"/><text x="895" y="462" font-size="22" font-weight="700" fill="#102a43">WARRANTY PARTY</text><text x="895" y="503" font-size="18" fill="#52606d">Parts, labor</text><text x="895" y="533" font-size="18" fill="#52606d">and escalation</text></g><text x="70" y="625" font-family="Arial,sans-serif" font-size="18" fill="#52606d">A product document is evidence for its stated model and role, not automatic proof of ownership.</text></svg>
