<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Braun Household trademark licence boundary</title><desc id="desc">P and G trademark ownership, De Longhi household-appliance licence and separate product responsibility.</desc><rect width="1600" height="900" fill="#f5f6f6"/><text x="110" y="112" fill="#171b1d" font-family="Arial,sans-serif" font-size="54" font-weight="700">Trademark ownership and operation differ</text><text x="110" y="164" fill="#667176" font-family="Arial,sans-serif" font-size="25">Braun Household sits inside a licensed category boundary, not a universal Braun company.</text><rect x="110" y="240" width="1380" height="125" rx="28" fill="#111"/><text x="165" y="293" fill="#bfc5c8" font-family="Arial,sans-serif" font-size="22" font-weight="700">TRADEMARK HOLDER</text><text x="165" y="334" fill="#fff" font-family="Arial,sans-serif" font-size="31" font-weight="700">Procter &amp; Gamble holds the Braun trademark</text><path d="M800 365V420" stroke="#949b9e" stroke-width="6"/><polygon points="786,408 800,433 814,408" fill="#949b9e"/><rect x="110" y="430" width="1380" height="125" rx="28" fill="#fff" stroke="#111" stroke-width="5"/><text x="165" y="483" fill="#333" font-family="Arial,sans-serif" font-size="22" font-weight="700">HOUSEHOLD-APPLIANCE LICENCE</text><text x="165" y="524" fill="#171b1d" font-family="Arial,sans-serif" font-size="30" font-weight="700">Perpetual licence assigned to De’Longhi for small household appliances</text><path d="M800 555V610" stroke="#949b9e" stroke-width="6"/><polygon points="786,598 800,623 814,598" fill="#949b9e"/><rect x="110" y="620" width="1380" height="125" rx="28" fill="#fff" stroke="#949b9e" stroke-width="4"/><text x="165" y="673" fill="#586368" font-family="Arial,sans-serif" font-size="22" font-weight="700">PRODUCT AND MARKET RESPONSIBILITY</text><text x="165" y="714" fill="#171b1d" font-family="Arial,sans-serif" font-size="29" font-weight="700">Regional operator · legal maker · factory · seller · importer · warrantor</text><text x="1490" y="858" fill="#899195" text-anchor="end" font-family="Arial,sans-serif" font-size="18">World Clean Biz · reviewed 7 August 2026</text></svg>
