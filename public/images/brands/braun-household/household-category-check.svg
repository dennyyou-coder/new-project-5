<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Braun Household category check</title><desc id="desc">Household appliance categories and the separation from personal care.</desc><rect width="1600" height="900" fill="#f6f6f6"/><text x="110" y="115" fill="#16191b" font-family="Arial,sans-serif" font-size="54" font-weight="700">Keep the Braun category boundary visible</text><text x="110" y="168" fill="#687075" font-family="Arial,sans-serif" font-size="25">Household appliances and personal-care products do not share one operating chain.</text><rect x="110" y="270" width="900" height="395" rx="30" fill="#111"/><text x="165" y="338" fill="#bfc4c7" font-family="Arial,sans-serif" font-size="22" font-weight="700">BRAUN HOUSEHOLD · DE’LONGHI LICENCE</text><text x="165" y="405" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">Food preparation</text><text x="165" y="462" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">Breakfast and cooking</text><text x="165" y="519" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">Garment care</text><text x="165" y="590" fill="#bfc4c7" font-family="Arial,sans-serif" font-size="23">Confirm the exact model, maker and local warrantor.</text><rect x="1060" y="270" width="430" height="395" rx="30" fill="#fff" stroke="#92999c" stroke-width="5"/><text x="1110" y="338" fill="#555f64" font-family="Arial,sans-serif" font-size="22" font-weight="700">SEPARATE SCOPE</text><text x="1110" y="410" fill="#16191b" font-family="Arial,sans-serif" font-size="32" font-weight="700">Personal care</text><text x="1110" y="462" fill="#16191b" font-family="Arial,sans-serif" font-size="32" font-weight="700">Shavers</text><text x="1110" y="514" fill="#16191b" font-family="Arial,sans-serif" font-size="32" font-weight="700">Oral-B</text><text x="1110" y="590" fill="#687075" font-family="Arial,sans-serif" font-size="22">Do not merge entities or warranties.</text><text x="110" y="770" fill="#687075" font-family="Arial,sans-serif" font-size="24">The Braun mark alone is not evidence that a personal-care entity supports a household appliance.</text><text x="1490" y="858" fill="#899195" text-anchor="end" font-family="Arial,sans-serif" font-size="18">World Clean Biz · buyer boundary</text></svg>
