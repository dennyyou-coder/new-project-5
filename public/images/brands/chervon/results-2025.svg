<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chervon 2025 results</title>
  <desc id="desc">Chervon 2025 revenue of US$1,627.8 million down 8.2 percent, outdoor power equipment revenue up 0.1 percent and power tools revenue down 18.3 percent.</desc>
  <rect width="1600" height="900" fill="#f5f7fa"/>
  <text x="110" y="112" fill="#0e1526" font-family="Arial, sans-serif" font-size="52" font-weight="700">2025: outdoor held, tools fell</text>
  <text x="110" y="162" fill="#4a5367" font-family="Arial, sans-serif" font-size="25">Figures as reported in Chervon's Annual Report 2025 (year to 31 December 2025).</text>
  <rect x="110" y="225" width="1380" height="150" rx="26" fill="#ffffff" stroke="#c9d0dc" stroke-width="3"/>
  <text x="160" y="282" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">GROUP REVENUE</text>
  <text x="160" y="342" fill="#0e1526" font-family="Arial, sans-serif" font-size="48" font-weight="700">US$1,627.8 million <tspan font-size="30" fill="#4a5367">−8.2%</tspan></text>
  <text x="980" y="282" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">GROSS MARGIN</text>
  <text x="980" y="342" fill="#0e1526" font-family="Arial, sans-serif" font-size="48" font-weight="700">32.9% <tspan font-size="30" fill="#4a5367">−180 bps</tspan></text>
  <rect x="110" y="415" width="660" height="330" rx="26" fill="#ffffff" stroke="#3d8a1f" stroke-width="5"/>
  <text x="155" y="468" fill="#3d8a1f" font-family="Arial, sans-serif" font-size="22" font-weight="700">OUTDOOR POWER EQUIPMENT</text>
  <text x="155" y="535" fill="#0e1526" font-family="Arial, sans-serif" font-size="46" font-weight="700">Revenue +0.1%</text>
  <text x="155" y="600" fill="#4a5367" font-family="Arial, sans-serif" font-size="23">EGO recorded double-digit point-of-sale</text>
  <text x="155" y="636" fill="#4a5367" font-family="Arial, sans-serif" font-size="23">(POS) growth, the company reports</text>
  <rect x="830" y="415" width="660" height="330" rx="26" fill="#ffffff" stroke="#8a93a5" stroke-width="5"/>
  <text x="875" y="468" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">POWER TOOLS</text>
  <text x="875" y="535" fill="#0e1526" font-family="Arial, sans-serif" font-size="46" font-weight="700">Revenue −18.3%</text>
  <text x="875" y="600" fill="#4a5367" font-family="Arial, sans-serif" font-size="23">Whole group by region: North America −11.5%,</text>
  <text x="875" y="636" fill="#4a5367" font-family="Arial, sans-serif" font-size="23">China −3.8%, Europe +0.9%, rest of world +6.8%</text>
  <text x="1490" y="858" fill="#5a6378" text-anchor="end" font-family="Arial, sans-serif" font-size="18">World Clean Biz · source: Chervon Holdings Limited Annual Report 2025</text>
</svg>
