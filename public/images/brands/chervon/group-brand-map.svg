<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chervon group and brand map</title>
  <desc id="desc">Chervon Holdings Limited, its five brands EGO, FLEX, SKIL, DEVON and X-TRON, and the split between own-brand and manufacturing-for-others revenue.</desc>
  <rect width="1600" height="900" fill="#f5f7fa"/>
  <text x="110" y="112" fill="#0e1526" font-family="Arial, sans-serif" font-size="52" font-weight="700">One listed group, five brands</text>
  <text x="110" y="162" fill="#4a5367" font-family="Arial, sans-serif" font-size="25">Chervon also makes products for other brands; check which business a product comes from.</text>
  <rect x="110" y="225" width="1380" height="120" rx="26" fill="#3d8a1f"/>
  <text x="160" y="276" fill="#e3f5d8" font-family="Arial, sans-serif" font-size="22" font-weight="700">LISTED GROUP · HONG KONG STOCK EXCHANGE 2285 · HQ NANJING</text>
  <text x="160" y="318" fill="#ffffff" font-family="Arial, sans-serif" font-size="31" font-weight="700">Chervon Holdings Limited</text>
  <path d="M520 345V400" stroke="#9cc58a" stroke-width="6"/><polygon points="506,388 520,413 534,388" fill="#9cc58a"/>
  <path d="M1080 345V400" stroke="#9cc58a" stroke-width="6"/><polygon points="1066,388 1080,413 1094,388" fill="#9cc58a"/>
  <rect x="110" y="415" width="660" height="330" rx="26" fill="#ffffff" stroke="#3d8a1f" stroke-width="5"/>
  <text x="155" y="468" fill="#3d8a1f" font-family="Arial, sans-serif" font-size="22" font-weight="700">OWN BRANDS (OBM) · 76.7% OF 2025 REVENUE</text>
  <text x="155" y="525" fill="#0e1526" font-family="Arial, sans-serif" font-size="30" font-weight="700">EGO <tspan fill="#4a5367" font-size="22" font-weight="400">outdoor power equipment</tspan></text>
  <text x="155" y="575" fill="#0e1526" font-family="Arial, sans-serif" font-size="30" font-weight="700">FLEX · SKIL <tspan fill="#4a5367" font-size="22" font-weight="400">power tools</tspan></text>
  <text x="155" y="625" fill="#0e1526" font-family="Arial, sans-serif" font-size="30" font-weight="700">DEVON · X-TRON</text>
  <text x="155" y="690" fill="#4a5367" font-family="Arial, sans-serif" font-size="22">Five brands named in the 2025 annual report</text>
  <rect x="830" y="415" width="660" height="330" rx="26" fill="#ffffff" stroke="#8a93a5" stroke-width="5"/>
  <text x="875" y="468" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">ODM · MAKING PRODUCTS FOR OTHER BRANDS</text>
  <text x="875" y="525" fill="#0e1526" font-family="Arial, sans-serif" font-size="30" font-weight="700">The rest of 2025 revenue</text>
  <text x="875" y="590" fill="#4a5367" font-family="Arial, sans-serif" font-size="22">Products sold under customers' brands</text>
  <text x="875" y="626" fill="#4a5367" font-family="Arial, sans-serif" font-size="22">carry those brands, not Chervon's.</text>
  <text x="875" y="690" fill="#4a5367" font-family="Arial, sans-serif" font-size="22">Ask the seller who the legal maker is.</text>
  <text x="1490" y="858" fill="#5a6378" text-anchor="end" font-family="Arial, sans-serif" font-size="18">World Clean Biz · source: Chervon Holdings Limited Annual Report 2025</text>
</svg>
