<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Truvox Tacony company and channel boundary</title><desc id="desc">Tacony Corporation is the immediate parent of Truvox International Limited while dealer responsibilities remain local.</desc><rect width="1200" height="675" rx="36" fill="#f2fbfc"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#354144">PARENT, OPERATOR AND MARKET ROLES</text><text x="70" y="125" font-family="Arial,sans-serif" font-size="22" fill="#607277">Latest filed accounts anchor the ownership boundary</text><g font-family="Arial,sans-serif"><rect x="70" y="175" width="1060" height="112" rx="22" fill="#354144"/><text x="105" y="224" font-size="25" font-weight="700" fill="white">TACONY CORPORATION</text><text x="105" y="260" font-size="20" fill="#d8e4e6">Immediate parent; no single ultimate controlling party is reported</text><path d="M600 287v52" stroke="#6a858a" stroke-width="5"/><path d="M585 325l15 20 15-20" fill="none" stroke="#6a858a" stroke-width="5"/><rect x="70" y="360" width="1060" height="105" rx="22" fill="#00a8b0"/><text x="105" y="405" font-size="25" font-weight="700" fill="white">TRUVOX INTERNATIONAL LIMITED</text><text x="105" y="440" font-size="20" fill="white">UK operating company and commercial floorcare manufacturer</text><rect x="70" y="505" width="330" height="105" rx="20" fill="white" stroke="#bed9dc" stroke-width="2"/><text x="100" y="550" font-size="21" font-weight="700" fill="#354144">DISTRIBUTOR</text><text x="100" y="582" font-size="18" fill="#607277">Territory and supply</text><rect x="435" y="505" width="330" height="105" rx="20" fill="white" stroke="#bed9dc" stroke-width="2"/><text x="465" y="550" font-size="21" font-weight="700" fill="#354144">SELLER</text><text x="465" y="582" font-size="18" fill="#607277">Contract and delivery</text><rect x="800" y="505" width="330" height="105" rx="20" fill="white" stroke="#bed9dc" stroke-width="2"/><text x="830" y="550" font-size="21" font-weight="700" fill="#354144">SERVICE PARTY</text><text x="830" y="582" font-size="18" fill="#607277">Warranty and repair</text></g><text x="70" y="645" font-family="Arial,sans-serif" font-size="18" fill="#607277">Confirm local authorization and responsibility before purchase.</text></svg>
