<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Truvox machine and warranty buyer checks</title><desc id="desc">Four checks for Truvox product configuration seller warranty and service.</desc><rect width="1200" height="675" rx="36" fill="#354144"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="white">CONTROL THE TRUVOX PURCHASE CHAIN</text><text x="70" y="125" font-family="Arial,sans-serif" font-size="22" fill="#d0dcde">Product performance and warranty depend on exact records</text><g font-family="Arial,sans-serif"><rect x="70" y="180" width="505" height="160" rx="24" fill="#44575b"/><circle cx="120" cy="230" r="25" fill="#00a8b0"/><text x="112" y="239" font-size="24" font-weight="700" fill="white">1</text><text x="165" y="230" font-size="25" font-weight="700" fill="white">MODEL + SERIAL</text><text x="165" y="271" font-size="19" fill="#d0dcde">Exact range, accessories,</text><text x="165" y="302" font-size="19" fill="#d0dcde">market version and invoice</text><rect x="625" y="180" width="505" height="160" rx="24" fill="#44575b"/><circle cx="675" cy="230" r="25" fill="#00a8b0"/><text x="667" y="239" font-size="24" font-weight="700" fill="white">2</text><text x="720" y="230" font-size="25" font-weight="700" fill="white">AUTHORIZED SELLER</text><text x="720" y="271" font-size="19" fill="#d0dcde">Distributor status, territory</text><text x="720" y="302" font-size="19" fill="#d0dcde">and contracting entity</text><rect x="70" y="380" width="505" height="160" rx="24" fill="#44575b"/><circle cx="120" cy="430" r="25" fill="#00a8b0"/><text x="112" y="439" font-size="24" font-weight="700" fill="white">3</text><text x="165" y="430" font-size="25" font-weight="700" fill="white">WARRANTY EVIDENCE</text><text x="165" y="471" font-size="19" fill="#d0dcde">Proof of sale, serial record,</text><text x="165" y="502" font-size="19" fill="#d0dcde">period and exclusions</text><rect x="625" y="380" width="505" height="160" rx="24" fill="#44575b"/><circle cx="675" cy="430" r="25" fill="#00a8b0"/><text x="667" y="439" font-size="24" font-weight="700" fill="white">4</text><text x="720" y="430" font-size="25" font-weight="700" fill="white">SERVICE CAPACITY</text><text x="720" y="471" font-size="19" fill="#d0dcde">Parts, trained technicians,</text><text x="720" y="502" font-size="19" fill="#d0dcde">response and escalation</text></g><text x="70" y="615" font-family="Arial,sans-serif" font-size="20" fill="#d0dcde">Keep the invoice and serial number: Truvox warranty terms require both.</text></svg>
