<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dechang results</title>
  <desc id="desc">Dechang 2025 revenue CNY 4.50 billion up 9.81 percent, home appliances CNY 3.88 billion, auto parts CNY 616 million up 49.51 percent; Q3 2026 revenue CNY 1.36 billion up 11.11 percent, net profit CNY 31.3 million down 38.89 percent.</desc>
  <rect width="1600" height="900" fill="#f5f7fa"/>
  <text x="110" y="112" fill="#0e1526" font-family="Arial, sans-serif" font-size="52" font-weight="700">Sales up, margins squeezed</text>
  <text x="110" y="162" fill="#4a5367" font-family="Arial, sans-serif" font-size="25">Figures as reported. Profit is attributable net profit. Q3 = July–September 2026.</text>
  <rect x="110" y="225" width="322" height="250" rx="26" fill="#ffffff" stroke="#c9d0dc" stroke-width="3"/>
  <text x="150" y="285" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">2025 REVENUE</text>
  <text x="150" y="355" fill="#0e1526" font-family="Arial, sans-serif" font-size="48" font-weight="700">CNY 4.50 bn</text>
  <text x="150" y="405" fill="#067647" font-family="Arial, sans-serif" font-size="30" font-weight="700">+9.81%</text>
  <text x="150" y="445" fill="#4a5367" font-family="Arial, sans-serif" font-size="20">Home appliances CNY 3.88 bn</text>
  <rect x="462" y="225" width="322" height="250" rx="26" fill="#ffffff" stroke="#c9d0dc" stroke-width="3"/>
  <text x="502" y="285" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">2025 AUTO PARTS</text>
  <text x="502" y="355" fill="#0e1526" font-family="Arial, sans-serif" font-size="48" font-weight="700">CNY 616 m</text>
  <text x="502" y="405" fill="#067647" font-family="Arial, sans-serif" font-size="30" font-weight="700">+49.51%</text>
  <text x="502" y="445" fill="#4a5367" font-family="Arial, sans-serif" font-size="20">EPS motors</text>
  <rect x="814" y="225" width="322" height="250" rx="26" fill="#ffffff" stroke="#c9d0dc" stroke-width="3"/>
  <text x="854" y="285" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">Q3 2026 REVENUE</text>
  <text x="854" y="355" fill="#0e1526" font-family="Arial, sans-serif" font-size="48" font-weight="700">CNY 1.36 bn</text>
  <text x="854" y="405" fill="#067647" font-family="Arial, sans-serif" font-size="30" font-weight="700">+11.11%</text>
  <text x="854" y="445" fill="#4a5367" font-family="Arial, sans-serif" font-size="20">Third quarter</text>
  <rect x="1166" y="225" width="322" height="250" rx="26" fill="#ffffff" stroke="#c9d0dc" stroke-width="3"/>
  <text x="1206" y="285" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">Q3 2026 NET PROFIT</text>
  <text x="1206" y="355" fill="#0e1526" font-family="Arial, sans-serif" font-size="48" font-weight="700">CNY 31.3 m</text>
  <text x="1206" y="405" fill="#b42318" font-family="Arial, sans-serif" font-size="30" font-weight="700">−38.89%</text>
  <text x="1206" y="445" fill="#4a5367" font-family="Arial, sans-serif" font-size="20">Third quarter</text>
  <text x="110" y="560" fill="#4a5367" font-family="Arial, sans-serif" font-size="22">Dechang cites higher raw-material prices and US dollar exchange losses. Excluding currency effects, Q3 profit was CNY 57.7 million (−7.67%).</text>
  <text x="110" y="820" fill="#4a5367" font-family="Arial, sans-serif" font-size="22">Sources: Dechang 2025 annual report; 2026 third-quarter report.</text>
</svg>
