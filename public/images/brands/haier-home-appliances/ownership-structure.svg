<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Haier Smart Home brand portfolio map</title>
  <desc id="desc">Haier Group controls listed Haier Smart Home, whose global appliance portfolio includes Haier, Casarte, Leader, GE Appliances, Fisher and Paykel, AQUA and Candy.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06172a"/><stop offset="1" stop-color="#063a58"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#35c9ff"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="none" stroke="#17617f" stroke-width="1" opacity=".42"><path d="M0 180H1600M0 360H1600M0 540H1600M0 720H1600"/><path d="M320 0V900M640 0V900M960 0V900M1280 0V900"/></g>
  <text x="100" y="100" fill="#f2fbff" font-family="Arial, sans-serif" font-size="48" font-weight="700">Haier appliance ownership map</text>
  <text x="100" y="145" fill="#a8dced" font-family="Arial, sans-serif" font-size="24">Controlling group, listed appliance platform and brands are separate layers</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="575" y="185" width="450" height="105" rx="22" fill="#0b5272" stroke="#35c9ff" stroke-width="3"/><text x="800" y="232" text-anchor="middle" fill="#fff" font-size="34" font-weight="700">Haier Group</text><text x="800" y="266" text-anchor="middle" fill="#c9f1ff" font-size="20">Controlling corporate group</text>
    <path d="M800 290V350" stroke="#35c9ff" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="510" y="365" width="580" height="115" rx="23" fill="#083f5c" stroke="#2cb5e4" stroke-width="2"/><text x="800" y="412" text-anchor="middle" fill="#fff" font-size="32" font-weight="700">Haier Smart Home Co., Ltd.</text><text x="800" y="452" text-anchor="middle" fill="#bfeeff" font-size="21">Listed global appliance platform</text>
    <path d="M800 480V542" stroke="#35c9ff" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="95" y="575" width="190" height="115" rx="20" fill="#0a344d" stroke="#238db3" stroke-width="2"/><rect x="300" y="575" width="190" height="115" rx="20" fill="#0a344d" stroke="#238db3" stroke-width="2"/><rect x="505" y="575" width="190" height="115" rx="20" fill="#0a344d" stroke="#238db3" stroke-width="2"/><rect x="710" y="575" width="190" height="115" rx="20" fill="#0a344d" stroke="#238db3" stroke-width="2"/><rect x="915" y="575" width="250" height="115" rx="20" fill="#0a344d" stroke="#238db3" stroke-width="2"/><rect x="1180" y="575" width="150" height="115" rx="20" fill="#0a344d" stroke="#238db3" stroke-width="2"/><rect x="1345" y="575" width="160" height="115" rx="20" fill="#0a344d" stroke="#238db3" stroke-width="2"/>
    <g fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><text x="190" y="642">Haier</text><text x="395" y="642">Casarte</text><text x="600" y="642">Leader</text><text x="805" y="642">AQUA</text><text x="1040" y="628"><tspan x="1040">GE</tspan><tspan x="1040" dy="29">Appliances</tspan></text><text x="1255" y="628"><tspan x="1255">Fisher &amp;</tspan><tspan x="1255" dy="29">Paykel</tspan></text><text x="1425" y="642">Candy</text></g>
    <text x="800" y="755" text-anchor="middle" fill="#8fdcf4" font-size="21">Shared ownership does not mean one factory, one trademark owner or one warranty system</text>
  </g>
  <text x="100" y="840" fill="#83b8ca" font-family="Arial, sans-serif" font-size="20">Source basis: Haier Smart Home filings, portfolio pages and official acquisition disclosures.</text>
</svg>
