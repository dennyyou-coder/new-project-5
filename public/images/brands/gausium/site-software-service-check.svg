<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Gausium deployment checklist</title><desc id="d">A buyer checklist for site performance, software and data, channel, and service.</desc><rect width="1200" height="720" rx="36" fill="#09091c"/><text x="72" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Autonomous cleaning needs four linked checks</text><g font-family="Arial,sans-serif">
  <g transform="translate(72 175)"><rect width="240" height="330" rx="26" fill="#fff"/><text x="28" y="75" font-size="26" font-weight="700" fill="#011dd4">Site trial</text><text x="28" y="130" font-size="18" fill="#536078">Floor, traffic, edges</text><text x="28" y="164" font-size="18" fill="#536078">routes and fallback</text></g><g transform="translate(344 175)"><rect width="240" height="330" rx="26" fill="#fff"/><text x="28" y="75" font-size="26" font-weight="700" fill="#011dd4">Software</text><text x="28" y="130" font-size="18" fill="#536078">Cloud, subscription</text><text x="28" y="164" font-size="18" fill="#536078">data and security</text></g><g transform="translate(616 175)"><rect width="240" height="330" rx="26" fill="#fff"/><text x="28" y="75" font-size="26" font-weight="700" fill="#011dd4">Channel</text><text x="28" y="130" font-size="18" fill="#536078">Seller, integrator</text><text x="28" y="164" font-size="18" fill="#536078">and commissioning</text></g><g transform="translate(888 175)"><rect width="240" height="330" rx="26" fill="#fff"/><text x="28" y="75" font-size="26" font-weight="700" fill="#011dd4">Lifecycle</text><text x="28" y="130" font-size="18" fill="#536078">Parts, uptime</text><text x="28" y="164" font-size="18" fill="#536078">updates and exit</text></g><text x="72" y="605" font-size="22" fill="#cdd3ea">Accept the system only when hardware, software and service responsibilities are written down.</text></g></svg>
