<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">LionsBot robot cloud and service checklist</title><desc id="desc">A four-part checklist covering robot performance, LionsOS, site deployment and lifecycle support.</desc><rect width="1200" height="720" rx="36" fill="#13262f"/><text x="72" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Cleaning robotics is a lifecycle service</text>
  <g font-family="Arial,sans-serif"><g transform="translate(72 175)"><rect width="240" height="330" rx="26" fill="#fff"/><text x="28" y="75" font-size="26" font-weight="700" fill="#21aaca">Robot</text><text x="28" y="130" font-size="18" fill="#53636b">Scrub, vacuum,</text><text x="28" y="164" font-size="18" fill="#53636b">runtime and safety</text></g><g transform="translate(344 175)"><rect width="240" height="330" rx="26" fill="#fff"/><text x="28" y="75" font-size="26" font-weight="700" fill="#21aaca">LionsOS</text><text x="28" y="130" font-size="18" fill="#53636b">Fleet controls, data,</text><text x="28" y="164" font-size="18" fill="#53636b">security and updates</text></g><g transform="translate(616 175)"><rect width="240" height="330" rx="26" fill="#fff"/><text x="28" y="75" font-size="26" font-weight="700" fill="#21aaca">Deployment</text><text x="28" y="130" font-size="18" fill="#53636b">Mapping, training,</text><text x="28" y="164" font-size="18" fill="#53636b">dock and acceptance</text></g><g transform="translate(888 175)"><rect width="240" height="330" rx="26" fill="#fff"/><text x="28" y="75" font-size="26" font-weight="700" fill="#21aaca">Support</text><text x="28" y="130" font-size="18" fill="#53636b">Dealer technicians,</text><text x="28" y="164" font-size="18" fill="#53636b">parts and warranty</text></g><text x="72" y="605" font-size="22" fill="#d7e5eb">Pilot results should become written uptime, response and service commitments.</text></g>
</svg>
