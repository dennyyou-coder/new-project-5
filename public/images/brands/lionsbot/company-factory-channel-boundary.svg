<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">LionsBot company factory and channel boundary</title><desc id="desc">LionsBot International connects its Singapore factory to regional offices and trained dealers while contracting and warranty roles require verification.</desc><rect width="1200" height="720" rx="36" fill="#f2f8fb"/><text x="72" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#15232b">Company, factory and service channel</text>
  <g font-family="Arial,sans-serif"><rect x="72" y="175" width="300" height="180" rx="26" fill="#35b9dc"/><text x="222" y="238" text-anchor="middle" font-size="25" font-weight="700" fill="#10232c">LionsBot International</text><text x="222" y="282" text-anchor="middle" font-size="19" fill="#173a46">Singapore company</text><path d="M372 265h85" stroke="#35b9dc" stroke-width="8"/><rect x="457" y="175" width="290" height="180" rx="26" fill="#fff" stroke="#bad2dc" stroke-width="3"/><text x="602" y="238" text-anchor="middle" font-size="24" font-weight="700" fill="#15232b">Singapore factory</text><text x="602" y="282" text-anchor="middle" font-size="19" fill="#53636b">Assembly, test and R&amp;D</text><path d="M747 265h85" stroke="#35b9dc" stroke-width="8"/><rect x="832" y="175" width="296" height="180" rx="26" fill="#fff" stroke="#bad2dc" stroke-width="3"/><text x="980" y="238" text-anchor="middle" font-size="24" font-weight="700" fill="#15232b">Regional delivery</text><text x="980" y="282" text-anchor="middle" font-size="19" fill="#53636b">Office, dealer and technician</text>
  <rect x="72" y="425" width="1056" height="195" rx="28" fill="#15232b"/><text x="110" y="486" font-size="24" font-weight="700" fill="#fff">Buyer contract must still identify</text><text x="110" y="545" font-size="20" fill="#d7e5eb">Seller and importer</text><text x="380" y="545" font-size="20" fill="#d7e5eb">Commissioning team</text><text x="670" y="545" font-size="20" fill="#d7e5eb">Cloud and data terms</text><text x="940" y="545" font-size="20" fill="#d7e5eb">Warranty</text></g>
</svg>
