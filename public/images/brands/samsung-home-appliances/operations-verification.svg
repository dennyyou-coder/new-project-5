<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Samsung appliance buyer verification chain</title>
  <desc id="desc">A five-step chain shows how buyers move from the Samsung brand to the local seller, exact model, manufacturing evidence and warranty or software responsibility.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#142f4a"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#67c2ff"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="100" y="110" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="700">Do not stop at the Samsung logo</text>
  <text x="100" y="157" fill="#aacce8" font-family="Arial, sans-serif" font-size="24">Five evidence steps for sourcing, compliance and after-sales</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(90 285)"><rect width="245" height="250" rx="24" fill="#0c3152" stroke="#3e8cc5" stroke-width="2"/><circle cx="50" cy="52" r="28" fill="#58b9ff"/><text x="50" y="62" text-anchor="middle" fill="#071426" font-size="28" font-weight="700">1</text><text x="32" y="112" fill="#fff" font-size="28" font-weight="700">Brand</text><text x="32" y="155" fill="#bfe1ff" font-size="20">Samsung identifies</text><text x="32" y="185" fill="#bfe1ff" font-size="20">the commercial offer,</text><text x="32" y="215" fill="#bfe1ff" font-size="20">not one factory.</text></g>
    <path d="M350 410H395" stroke="#67c2ff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(400 285)"><rect width="245" height="250" rx="24" fill="#0c3152" stroke="#3e8cc5" stroke-width="2"/><circle cx="50" cy="52" r="28" fill="#58b9ff"/><text x="50" y="62" text-anchor="middle" fill="#071426" font-size="28" font-weight="700">2</text><text x="32" y="112" fill="#fff" font-size="28" font-weight="700">Local party</text><text x="32" y="155" fill="#bfe1ff" font-size="20">Verify seller, importer</text><text x="32" y="185" fill="#bfe1ff" font-size="20">and website or invoice</text><text x="32" y="215" fill="#bfe1ff" font-size="20">legal entity.</text></g>
    <path d="M660 410H705" stroke="#67c2ff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(710 285)"><rect width="245" height="250" rx="24" fill="#0c3152" stroke="#3e8cc5" stroke-width="2"/><circle cx="50" cy="52" r="28" fill="#58b9ff"/><text x="50" y="62" text-anchor="middle" fill="#071426" font-size="28" font-weight="700">3</text><text x="32" y="112" fill="#fff" font-size="28" font-weight="700">Exact model</text><text x="32" y="155" fill="#bfe1ff" font-size="20">Match model code,</text><text x="32" y="185" fill="#bfe1ff" font-size="20">serial range, manual</text><text x="32" y="215" fill="#bfe1ff" font-size="20">and rating plate.</text></g>
    <path d="M970 410H1015" stroke="#67c2ff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(1020 285)"><rect width="245" height="250" rx="24" fill="#0c3152" stroke="#3e8cc5" stroke-width="2"/><circle cx="50" cy="52" r="28" fill="#58b9ff"/><text x="50" y="62" text-anchor="middle" fill="#071426" font-size="28" font-weight="700">4</text><text x="32" y="112" fill="#fff" font-size="28" font-weight="700">Origin</text><text x="32" y="155" fill="#bfe1ff" font-size="20">Use label, customs</text><text x="32" y="185" fill="#bfe1ff" font-size="20">or factory evidence for</text><text x="32" y="215" fill="#bfe1ff" font-size="20">that product.</text></g>
    <path d="M1280 410H1325" stroke="#67c2ff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(1330 285)"><rect width="180" height="250" rx="24" fill="#0c3152" stroke="#3e8cc5" stroke-width="2"/><circle cx="48" cy="52" r="28" fill="#58b9ff"/><text x="48" y="62" text-anchor="middle" fill="#071426" font-size="28" font-weight="700">5</text><text x="28" y="112" fill="#fff" font-size="27" font-weight="700">Support</text><text x="28" y="155" fill="#bfe1ff" font-size="19">Warranty, parts,</text><text x="28" y="185" fill="#bfe1ff" font-size="19">software and</text><text x="28" y="215" fill="#bfe1ff" font-size="19">service region.</text></g>
    <rect x="250" y="650" width="1100" height="100" rx="22" fill="#102a43" stroke="#58b9ff" stroke-width="2"/>
    <text x="800" y="694" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">The reliable answer is model + market + date</text>
    <text x="800" y="728" text-anchor="middle" fill="#bfe1ff" font-size="21">One factory announcement or warranty headline cannot cover the complete global catalogue.</text>
  </g>
</svg>
