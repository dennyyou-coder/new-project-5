<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hotpoint regional brand responsibility</title>
  <desc id="desc">Hotpoint operates through separate European and Americas structures, requiring market-specific buyer checks.</desc>
  <rect width="1600" height="900" fill="#f7f4ef"/>
  <text x="110" y="112" fill="#211d1a" font-family="Arial, sans-serif" font-size="54" font-weight="700">One brand name, separate regional responsibilities</text>
  <text x="110" y="164" fill="#675f58" font-family="Arial, sans-serif" font-size="25">Hotpoint evidence must be read by market, not combined into one global operator.</text>
  <rect x="110" y="235" width="650" height="420" rx="34" fill="#ffffff" stroke="#e85d22" stroke-width="5"/>
  <rect x="840" y="235" width="650" height="420" rx="34" fill="#ffffff" stroke="#294c60" stroke-width="5"/>
  <text x="165" y="315" fill="#e85d22" font-family="Arial, sans-serif" font-size="35" font-weight="700">Europe</text>
  <text x="895" y="315" fill="#294c60" font-family="Arial, sans-serif" font-size="35" font-weight="700">United States / Americas</text>
  <text x="165" y="382" fill="#211d1a" font-family="Arial, sans-serif" font-size="30" font-weight="700">Beko Europe portfolio</text>
  <text x="165" y="435" fill="#514a45" font-family="Arial, sans-serif" font-size="24">Current official European materials place</text>
  <text x="165" y="470" fill="#514a45" font-family="Arial, sans-serif" font-size="24">Hotpoint within Beko Europe.</text>
  <text x="165" y="536" fill="#211d1a" font-family="Arial, sans-serif" font-size="25" font-weight="700">Check locally</text>
  <text x="165" y="578" fill="#514a45" font-family="Arial, sans-serif" font-size="23">Seller · importer · service · warranty</text>
  <text x="895" y="382" fill="#211d1a" font-family="Arial, sans-serif" font-size="30" font-weight="700">GE Appliances structure</text>
  <text x="895" y="435" fill="#514a45" font-family="Arial, sans-serif" font-size="24">Official US support, registration and factory</text>
  <text x="895" y="470" fill="#514a45" font-family="Arial, sans-serif" font-size="24">evidence points to GE Appliances.</text>
  <text x="895" y="536" fill="#211d1a" font-family="Arial, sans-serif" font-size="25" font-weight="700">Check locally</text>
  <text x="895" y="578" fill="#514a45" font-family="Arial, sans-serif" font-size="23">Model · maker · origin · warrantor</text>
  <rect x="110" y="716" width="1380" height="92" rx="22" fill="#211d1a"/>
  <text x="800" y="772" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700">Do not transfer evidence from one Hotpoint region to another.</text>
  <text x="1490" y="858" fill="#81766d" text-anchor="end" font-family="Arial, sans-serif" font-size="18">World Clean Biz · reviewed 6 August 2026</text>
</svg>
