<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Oertzen brand, former company and current Hako operating boundary</title>
  <desc id="desc">The Oertzen brand moved into Hako's waterjet portfolio after Hako reported a 2023 merger with von Oertzen GmbH. Hako GmbH is within the Possehl Group.</desc>
  <rect width="1200" height="720" rx="38" fill="#f6f7f8"/>
  <text x="70" y="82" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#20242b">Oertzen: preserve the brand, update the operator boundary</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="90" y="150" width="300" height="115" rx="22" fill="#eb001b"/><text x="240" y="205" font-size="34" font-weight="700" fill="#fff">OERTZEN</text><text x="240" y="238" font-size="20" fill="#fff">waterjet brand</text>
    <path d="M390 208H505" stroke="#808a97" stroke-width="6"/>
    <rect x="505" y="130" width="600" height="155" rx="22" fill="#fff" stroke="#808a97" stroke-width="4"/><text x="805" y="185" font-size="26" font-weight="700" fill="#20242b">Historic materials</text><text x="805" y="225" font-size="30" fill="#596477">von Oertzen GmbH</text><text x="805" y="258" font-size="19" fill="#596477">Ammersbek operation</text>
    <path d="M805 285V365" stroke="#808a97" stroke-width="6" marker-end="url(#arrow)"/>
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#808a97"/></marker></defs>
    <rect x="290" y="380" width="620" height="135" rx="24" fill="#243752"/><text x="600" y="432" font-size="28" font-weight="700" fill="#fff">Hako reports a 2023 merger</text><text x="600" y="472" font-size="24" fill="#d9e2ef">Hako GmbH now markets and supports the Oertzen range</text>
    <path d="M600 515V570" stroke="#808a97" stroke-width="6"/>
    <rect x="375" y="570" width="450" height="90" rx="22" fill="#172033"/><text x="600" y="625" font-size="27" font-weight="700" fill="#fff">Possehl Group ownership</text>
  </g>
</svg>
