<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Gorenje portfolio and buyer check</title>
  <desc id="desc">Gorenje major appliance, small appliance, floorcare and model verification steps.</desc>
  <rect width="1600" height="900" fill="#f2f8f7"/>
  <text x="110" y="112" fill="#172033" font-family="Arial, sans-serif" font-size="54" font-weight="700">Broad portfolio, market-specific evidence</text>
  <text x="110" y="164" fill="#5f6878" font-family="Arial, sans-serif" font-size="25">Confirm that the exact category and model are current in the destination country.</text>
  <g font-family="Arial, sans-serif">
    <rect x="110" y="255" width="430" height="210" rx="28" fill="#04a89d"/><text x="155" y="316" fill="#d3fffb" font-size="22" font-weight="700">MAJOR APPLIANCES</text><text x="155" y="367" fill="#fff" font-size="29" font-weight="700">Cooling · cooking · laundry</text><text x="155" y="410" fill="#e3fffd" font-size="20">Dishwashing and installation-led products</text>
    <rect x="585" y="255" width="430" height="210" rx="28" fill="#ffffff" stroke="#04a89d" stroke-width="4"/><text x="630" y="316" fill="#04877f" font-size="22" font-weight="700">SMALL APPLIANCES</text><text x="630" y="367" fill="#172033" font-size="29" font-weight="700">Food prep · irons · air care</text><text x="630" y="410" fill="#5f6878" font-size="20">Local assortment and voltage vary</text>
    <rect x="1060" y="255" width="430" height="210" rx="28" fill="#ffffff" stroke="#6fa8a4" stroke-width="4"/><text x="1105" y="316" fill="#477f7a" font-size="22" font-weight="700">FLOORCARE</text><text x="1105" y="367" fill="#172033" font-size="29" font-weight="700">Vacuums · sticks · floor cleaner</text><text x="1105" y="410" fill="#5f6878" font-size="20">Dry and wet-and-dry offers</text>
  </g>
  <path d="M800 500V565" stroke="#75cbc5" stroke-width="6"/><polygon points="786,553 800,578 814,553" fill="#75cbc5"/>
  <rect x="110" y="585" width="1380" height="165" rx="28" fill="#172033"/>
  <text x="160" y="640" fill="#9ef1eb" font-family="Arial, sans-serif" font-size="21" font-weight="700">BUYER EVIDENCE CHAIN</text>
  <text x="160" y="690" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Country page → model label → responsible operator → factory/origin → invoice → warranty</text>
  <text x="1490" y="858" fill="#748293" text-anchor="end" font-family="Arial, sans-serif" font-size="18">World Clean Biz · reviewed 7 August 2026</text>
</svg>
