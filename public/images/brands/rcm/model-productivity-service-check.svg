<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RCM floor cleaning machine procurement checks</title>
  <desc id="desc">A model-level checklist for realistic productivity, machine evidence and after-sales service.</desc>
  <rect width="1200" height="720" rx="38" fill="#242a33"/>
  <text x="70" y="84" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#fff">Test productivity in the buyer's real environment</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="145" width="330" height="220" rx="26" fill="#e31b23"/><text x="105" y="200" font-size="27" font-weight="700" fill="#fff">Site variables</text><text x="105" y="247" font-size="21" fill="#fff">floor and debris</text><text x="105" y="285" font-size="21" fill="#fff">aisles and gradients</text><text x="105" y="323" font-size="21" fill="#fff">operator and shift pattern</text>
    <rect x="435" y="145" width="330" height="220" rx="26" fill="#46505f"/><text x="470" y="200" font-size="27" font-weight="700" fill="#fff">Machine proof</text><text x="470" y="247" font-size="21" fill="#e1e5ea">model and serial</text><text x="470" y="285" font-size="21" fill="#e1e5ea">battery and runtime</text><text x="470" y="323" font-size="21" fill="#e1e5ea">origin and conformity</text>
    <rect x="800" y="145" width="330" height="220" rx="26" fill="#46505f"/><text x="835" y="200" font-size="27" font-weight="700" fill="#fff">Support proof</text><text x="835" y="247" font-size="21" fill="#e1e5ea">commissioning plan</text><text x="835" y="285" font-size="21" fill="#e1e5ea">parts availability</text><text x="835" y="323" font-size="21" fill="#e1e5ea">response and warranty</text>
    <rect x="70" y="415" width="1060" height="140" rx="28" fill="#f7f7f7"/><text x="110" y="472" font-size="27" font-weight="700" fill="#222">Use a documented acceptance test</text><text x="110" y="518" font-size="22" fill="#626b77">Measure cleaned area, result quality, refill time, energy use and operator interventions.</text>
  </g>
  <text x="600" y="640" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#dfe3e8">Catalogue productivity is a starting point, not a site guarantee.</text>
</svg>
