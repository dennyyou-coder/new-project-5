<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RCM company and distribution channel boundary</title>
  <desc id="desc">RCM S.p.A. is the family-owned Italian manufacturer. Dealers, distributors, importers and service partners remain separate transaction roles.</desc>
  <rect width="1200" height="720" rx="38" fill="#f7f7f7"/>
  <text x="70" y="82" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#222">RCM: manufacturer identity is not the whole supply chain</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="95" y="155" width="360" height="155" rx="27" fill="#e31b23"/><text x="275" y="214" font-size="34" font-weight="700" fill="#fff">RCM S.p.A.</text><text x="275" y="258" font-size="21" fill="#fff">family-owned Italian manufacturer</text>
    <path d="M455 232H565" stroke="#7e858e" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="565" y="155" width="270" height="155" rx="27" fill="#343c48"/><text x="700" y="214" font-size="29" font-weight="700" fill="#fff">Dealer network</text><text x="700" y="258" font-size="20" fill="#dfe3e8">sales, training, support</text>
    <path d="M835 232H945" stroke="#7e858e" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="945" y="155" width="170" height="155" rx="27" fill="#555f6d"/><text x="1030" y="214" font-size="27" font-weight="700" fill="#fff">Buyer</text><text x="1030" y="258" font-size="19" fill="#dfe3e8">local contract</text>
    <rect x="135" y="400" width="930" height="165" rx="28" fill="#fff" stroke="#a9afb7" stroke-width="4"/><text x="600" y="455" font-size="27" font-weight="700" fill="#222">Map responsibility for the actual destination</text><text x="600" y="501" font-size="22" fill="#626b77">quote • import • commissioning • warranty • parts • field service</text><text x="600" y="538" font-size="20" fill="#626b77">The official network model does not make every intermediary RCM S.p.A.</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7e858e"/></marker></defs>
</svg>
