<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">IPC product responsibility checklist</title><desc id="d">A four-step product, entity, channel and service verification sequence.</desc><rect width="1200" height="720" rx="36" fill="#25342a"/><text x="72" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">One brand, multiple product responsibility paths</text><g font-family="Arial,sans-serif"><g transform="translate(72 175)"><rect width="240" height="330" rx="26" fill="#fff"/><circle cx="48" cy="52" r="25" fill="#5bcf37"/><text x="48" y="61" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2c25">1</text><text x="28" y="120" font-size="25" font-weight="700" fill="#1f2c25">Product line</text><text x="28" y="168" font-size="18" fill="#536158">Machine, vacuum,</text><text x="28" y="200" font-size="18" fill="#536158">pressure or tools</text></g><g transform="translate(344 175)"><rect width="240" height="330" rx="26" fill="#fff"/><circle cx="48" cy="52" r="25" fill="#5bcf37"/><text x="48" y="61" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2c25">2</text><text x="28" y="120" font-size="25" font-weight="700" fill="#1f2c25">Legal entity</text><text x="28" y="168" font-size="18" fill="#536158">Manufacturer and</text><text x="28" y="200" font-size="18" fill="#536158">origin evidence</text></g><g transform="translate(616 175)"><rect width="240" height="330" rx="26" fill="#fff"/><circle cx="48" cy="52" r="25" fill="#5bcf37"/><text x="48" y="61" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2c25">3</text><text x="28" y="120" font-size="25" font-weight="700" fill="#1f2c25">Local channel</text><text x="28" y="168" font-size="18" fill="#536158">Authorization, seller</text><text x="28" y="200" font-size="18" fill="#536158">and importer</text></g><g transform="translate(888 175)"><rect width="240" height="330" rx="26" fill="#fff"/><circle cx="48" cy="52" r="25" fill="#5bcf37"/><text x="48" y="61" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2c25">4</text><text x="28" y="120" font-size="25" font-weight="700" fill="#1f2c25">Support</text><text x="28" y="168" font-size="18" fill="#536158">Parts, technicians</text><text x="28" y="200" font-size="18" fill="#536158">and warranty</text></g><text x="72" y="605" font-size="22" fill="#d4ddd7">Do not use group ownership as a substitute for SKU-level evidence.</text></g></svg>
