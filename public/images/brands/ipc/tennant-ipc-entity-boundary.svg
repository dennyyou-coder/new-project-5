<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Tennant and IPC entity boundary</title><desc id="d">Tennant owns IPC while IPC product lines, Italian operating entities and regional sellers have distinct roles.</desc><rect width="1200" height="720" rx="36" fill="#f2f6f3"/><text x="72" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#1f2c25">Ownership does not collapse operating roles</text><g font-family="Arial,sans-serif"><rect x="72" y="175" width="250" height="170" rx="26" fill="#28372d"/><text x="197" y="240" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Tennant Company</text><text x="197" y="283" text-anchor="middle" font-size="19" fill="#d6dfd9">Group owner</text><path d="M322 260h95" stroke="#5bcf37" stroke-width="9"/><rect x="417" y="175" width="250" height="170" rx="26" fill="#5bcf37"/><text x="542" y="240" text-anchor="middle" font-size="32" font-weight="700" fill="#1d2a21">IPC</text><text x="542" y="283" text-anchor="middle" font-size="19" fill="#243328">Brand and portfolio</text><path d="M667 260h95" stroke="#5bcf37" stroke-width="9"/><rect x="762" y="175" width="366" height="170" rx="26" fill="#fff" stroke="#c7d3ca" stroke-width="3"/><text x="945" y="235" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2c25">Named operating entities</text><text x="945" y="278" text-anchor="middle" font-size="18" fill="#536158">IP Cleaning S.r.l. · IPC Tools S.p.A.</text>
  <rect x="72" y="425" width="1056" height="195" rx="28" fill="#fff" stroke="#c7d3ca" stroke-width="3"/><text x="110" y="486" font-size="24" font-weight="700" fill="#1f2c25">The purchase order must identify</text><text x="110" y="545" font-size="20" fill="#536158">Manufacturer</text><text x="340" y="545" font-size="20" fill="#536158">Importer and seller</text><text x="625" y="545" font-size="20" fill="#536158">Parts and service</text><text x="885" y="545" font-size="20" fill="#536158">Warranty entity</text></g></svg>
