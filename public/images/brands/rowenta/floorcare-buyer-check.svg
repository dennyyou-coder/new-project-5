<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Rowenta floorcare buyer verification</title>
  <desc id="desc">Five checks for a Rowenta floorcare product in its destination market.</desc>
  <rect width="1600" height="900" fill="#fbf5f4"/>
  <text x="110" y="112" fill="#201b24" font-family="Arial, sans-serif" font-size="54" font-weight="700">Verify the reference, not just the logo</text>
  <text x="110" y="164" fill="#6f6269" font-family="Arial, sans-serif" font-size="25">Use the exact model code to connect product, factory, channel and support evidence.</text>
  <g font-family="Arial, sans-serif">
    <rect x="110" y="270" width="250" height="360" rx="28" fill="#9e1628"/><text x="150" y="332" fill="#ffd9de" font-size="23" font-weight="700">01</text><text x="150" y="385" fill="#fff" font-size="28" font-weight="700">Reference</text><text x="150" y="438" fill="#ffe7ea" font-size="20">Model code</text><text x="150" y="470" fill="#ffe7ea" font-size="20">Market suffix</text><text x="150" y="502" fill="#ffe7ea" font-size="20">Configuration</text>
    <rect x="392" y="270" width="250" height="360" rx="28" fill="#fff" stroke="#9e1628" stroke-width="4"/><text x="432" y="332" fill="#9e1628" font-size="23" font-weight="700">02</text><text x="432" y="385" fill="#201b24" font-size="28" font-weight="700">Declaration</text><text x="432" y="438" fill="#6f6269" font-size="20">Legal maker</text><text x="432" y="470" fill="#6f6269" font-size="20">Standards</text><text x="432" y="502" fill="#6f6269" font-size="20">Responsible party</text>
    <rect x="674" y="270" width="250" height="360" rx="28" fill="#fff" stroke="#9e1628" stroke-width="4"/><text x="714" y="332" fill="#9e1628" font-size="23" font-weight="700">03</text><text x="714" y="385" fill="#201b24" font-size="28" font-weight="700">Production</text><text x="714" y="438" fill="#6f6269" font-size="20">Factory</text><text x="714" y="470" fill="#6f6269" font-size="20">Origin</text><text x="714" y="502" fill="#6f6269" font-size="20">Quality record</text>
    <rect x="956" y="270" width="250" height="360" rx="28" fill="#fff" stroke="#ba7c86" stroke-width="4"/><text x="996" y="332" fill="#8d505b" font-size="23" font-weight="700">04</text><text x="996" y="385" fill="#201b24" font-size="28" font-weight="700">Channel</text><text x="996" y="438" fill="#6f6269" font-size="20">Seller</text><text x="996" y="470" fill="#6f6269" font-size="20">Importer</text><text x="996" y="502" fill="#6f6269" font-size="20">Authorization</text>
    <rect x="1238" y="270" width="250" height="360" rx="28" fill="#fff" stroke="#ba7c86" stroke-width="4"/><text x="1278" y="332" fill="#8d505b" font-size="23" font-weight="700">05</text><text x="1278" y="385" fill="#201b24" font-size="28" font-weight="700">After-sales</text><text x="1278" y="438" fill="#6f6269" font-size="20">Warrantor</text><text x="1278" y="470" fill="#6f6269" font-size="20">Parts</text><text x="1278" y="502" fill="#6f6269" font-size="20">Repair route</text>
  </g>
  <rect x="110" y="704" width="1378" height="86" rx="22" fill="#201b24"/>
  <text x="799" y="758" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700">Keep the local product page, declaration, invoice and warranty terms in one evidence pack.</text>
  <text x="1490" y="858" fill="#897a81" text-anchor="end" font-family="Arial, sans-serif" font-size="18">World Clean Biz · reviewed 7 August 2026</text>
</svg>
