<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Stanley Black &amp; Decker 2025 results and 2026 moves</title>
  <desc id="desc">2025 net sales of 15.130 billion dollars down 2 percent, Tools and Outdoor sales of 13.2 billion dollars down 1 percent, and 2026 announcements on Excel Industries and US investment.</desc>
  <rect width="1600" height="900" fill="#f5f7fa"/>
  <text x="110" y="112" fill="#0e1526" font-family="Arial, sans-serif" font-size="52" font-weight="700">2025 sales dipped; 2026 reshaped outdoor</text>
  <text x="110" y="162" fill="#4a5367" font-family="Arial, sans-serif" font-size="25">Figures from the Form 10-K for fiscal 2025 and 2026 company announcements.</text>
  <rect x="110" y="225" width="1380" height="150" rx="26" fill="#ffffff" stroke="#c9d0dc" stroke-width="3"/>
  <text x="160" y="282" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">NET SALES 2025</text>
  <text x="160" y="342" fill="#0e1526" font-family="Arial, sans-serif" font-size="48" font-weight="700">$15.130 billion <tspan font-size="30" fill="#4a5367">−2%</tspan></text>
  <text x="900" y="282" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">TOOLS &amp; OUTDOOR 2025</text>
  <text x="900" y="342" fill="#0e1526" font-family="Arial, sans-serif" font-size="48" font-weight="700">$13.2 billion <tspan font-size="30" fill="#4a5367">−1%</tspan></text>
  <rect x="110" y="415" width="660" height="330" rx="26" fill="#ffffff" stroke="#d4a900" stroke-width="5"/>
  <text x="155" y="468" fill="#8a6d00" font-family="Arial, sans-serif" font-size="22" font-weight="700">4 SEPTEMBER 2026</text>
  <text x="155" y="530" fill="#0e1526" font-family="Arial, sans-serif" font-size="34" font-weight="700">Agreement to sell Excel</text>
  <text x="155" y="580" fill="#0e1526" font-family="Arial, sans-serif" font-size="34" font-weight="700">Industries (Hustler)</text>
  <text x="155" y="640" fill="#4a5367" font-family="Arial, sans-serif" font-size="23">Buyer: Bad Boy Mowers. Cub Cadet and</text>
  <text x="155" y="676" fill="#4a5367" font-family="Arial, sans-serif" font-size="23">electric outdoor products stay a focus.</text>
  <rect x="830" y="415" width="660" height="330" rx="26" fill="#ffffff" stroke="#8a93a5" stroke-width="5"/>
  <text x="875" y="468" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">12 AUGUST 2026</text>
  <text x="875" y="530" fill="#0e1526" font-family="Arial, sans-serif" font-size="34" font-weight="700">$1 billion in the U.S.</text>
  <text x="875" y="580" fill="#0e1526" font-family="Arial, sans-serif" font-size="34" font-weight="700">through 2028</text>
  <text x="875" y="640" fill="#4a5367" font-family="Arial, sans-serif" font-size="23">About half for R&amp;D, half for U.S.</text>
  <text x="875" y="676" fill="#4a5367" font-family="Arial, sans-serif" font-size="23">manufacturing and product investment.</text>
  <text x="1490" y="858" fill="#5a6378" text-anchor="end" font-family="Arial, sans-serif" font-size="18">World Clean Biz · sources: Form 10-K fiscal 2025; company press releases, Aug and Sep 2026</text>
</svg>
