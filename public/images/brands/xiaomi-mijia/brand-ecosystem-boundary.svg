<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Xiaomi and Mijia brand ecosystem boundary</title><desc id="desc">Brand, listed group, ecosystem participants and product responsibility layers.</desc>
  <rect width="1600" height="900" fill="#fff7f0"/><text x="110" y="112" fill="#211b18" font-family="Arial,sans-serif" font-size="54" font-weight="700">An ecosystem is not one manufacturer</text><text x="110" y="164" fill="#75665f" font-family="Arial,sans-serif" font-size="25">Xiaomi and Mijia identify a consumer ecosystem; each product still has its own legal chain.</text>
  <rect x="110" y="245" width="1380" height="125" rx="28" fill="#ff6900"/><text x="165" y="298" fill="#ffe4d1" font-family="Arial,sans-serif" font-size="22" font-weight="700">CONSUMER IDENTITIES</text><text x="165" y="339" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="700">Xiaomi · Mijia / MIJIA · Xiaomi Home platform</text>
  <path d="M800 370V425" stroke="#efab7d" stroke-width="6"/><polygon points="786,413 800,438 814,413" fill="#efab7d"/><rect x="110" y="435" width="1380" height="125" rx="28" fill="#fff" stroke="#ff6900" stroke-width="5"/><text x="165" y="488" fill="#d95800" font-family="Arial,sans-serif" font-size="22" font-weight="700">GROUP AND ECOSYSTEM</text><text x="165" y="529" fill="#211b18" font-family="Arial,sans-serif" font-size="30" font-weight="700">Xiaomi Corporation · regional operators · ecosystem companies</text>
  <path d="M800 560V615" stroke="#efab7d" stroke-width="6"/><polygon points="786,603 800,628 814,603" fill="#efab7d"/><rect x="110" y="625" width="1380" height="125" rx="28" fill="#fff" stroke="#d9a27d" stroke-width="4"/><text x="165" y="678" fill="#a56338" font-family="Arial,sans-serif" font-size="22" font-weight="700">MODEL AND MARKET RESPONSIBILITY</text><text x="165" y="719" fill="#211b18" font-family="Arial,sans-serif" font-size="29" font-weight="700">Legal maker · factory · origin · importer · seller · warrantor</text><text x="1490" y="858" fill="#8d7c72" text-anchor="end" font-family="Arial,sans-serif" font-size="18">World Clean Biz · reviewed 7 August 2026</text>
</svg>
