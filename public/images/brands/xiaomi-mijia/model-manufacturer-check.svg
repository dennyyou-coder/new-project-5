<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Xiaomi Mijia model verification</title><desc id="desc">Buyer workflow from exact model to manufacturer and after-sales evidence.</desc><rect width="1600" height="900" fill="#f5f7f8"/><text x="110" y="115" fill="#182126" font-family="Arial,sans-serif" font-size="54" font-weight="700">Verify the product, not the ecosystem story</text><text x="110" y="168" fill="#637078" font-family="Arial,sans-serif" font-size="25">Use the exact destination-market SKU to connect four evidence layers.</text><g font-family="Arial,sans-serif"><rect x="105" y="290" width="310" height="330" rx="28" fill="#ff6900"/><text x="150" y="360" fill="#fff" font-size="23" font-weight="700">01 · MODEL</text><text x="150" y="425" fill="#fff" font-size="30" font-weight="700">Reference code</text><text x="150" y="470" fill="#ffe2cd" font-size="23">Voltage · app region</text><rect x="465" y="290" width="310" height="330" rx="28" fill="#fff" stroke="#ff6900" stroke-width="4"/><text x="510" y="360" fill="#d95800" font-size="23" font-weight="700">02 · COMPLIANCE</text><text x="510" y="425" fill="#182126" font-size="30" font-weight="700">Declaration</text><text x="510" y="470" fill="#637078" font-size="23">Legal maker · standards</text><rect x="825" y="290" width="310" height="330" rx="28" fill="#fff" stroke="#d1a17f" stroke-width="4"/><text x="870" y="360" fill="#a56338" font-size="23" font-weight="700">03 · SUPPLY</text><text x="870" y="425" fill="#182126" font-size="30" font-weight="700">Factory and origin</text><text x="870" y="470" fill="#637078" font-size="23">Importer · seller</text><rect x="1185" y="290" width="310" height="330" rx="28" fill="#182126"/><text x="1230" y="360" fill="#ffc7a0" font-size="23" font-weight="700">04 · SUPPORT</text><text x="1230" y="425" fill="#fff" font-size="30" font-weight="700">Local warranty</text><text x="1230" y="470" fill="#cad1d5" font-size="23">Parts · repair · data</text></g><text x="110" y="760" fill="#5f6c73" font-family="Arial,sans-serif" font-size="25">Do not apply one ecosystem company's factory or identity to another Xiaomi- or Mijia-branded model.</text><text x="1490" y="858" fill="#879198" text-anchor="end" font-family="Arial,sans-serif" font-size="18">World Clean Biz · procurement check</text></svg>
