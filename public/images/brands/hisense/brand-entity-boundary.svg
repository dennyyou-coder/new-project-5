<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hisense brand and entity boundary</title>
  <desc id="desc">Hisense group brand, appliance business, regional operator and model-level product responsibility.</desc>
  <rect width="1600" height="900" fill="#f2f8f7"/>
  <text x="110" y="112" fill="#172033" font-family="Arial, sans-serif" font-size="54" font-weight="700">One brand, several responsibility layers</text>
  <text x="110" y="164" fill="#5f6878" font-family="Arial, sans-serif" font-size="25">Group affiliation does not identify the maker or warrantor of every Hisense SKU.</text>
  <rect x="110" y="245" width="1380" height="125" rx="28" fill="#008f83"/>
  <text x="165" y="298" fill="#c7fff7" font-family="Arial, sans-serif" font-size="22" font-weight="700">BRAND AND GROUP LEVEL</text>
  <text x="165" y="339" fill="#ffffff" font-family="Arial, sans-serif" font-size="31" font-weight="700">Hisense · Hisense Group Holdings and affiliated companies</text>
  <path d="M800 370V425" stroke="#63bdb5" stroke-width="6"/><polygon points="786,413 800,438 814,413" fill="#63bdb5"/>
  <rect x="110" y="435" width="1380" height="125" rx="28" fill="#ffffff" stroke="#008f83" stroke-width="5"/>
  <text x="165" y="488" fill="#008f83" font-family="Arial, sans-serif" font-size="22" font-weight="700">BUSINESS AND REGIONAL LEVEL</text>
  <text x="165" y="529" fill="#172033" font-family="Arial, sans-serif" font-size="30" font-weight="700">Appliance group · regional operator · distributor or retailer</text>
  <path d="M800 560V615" stroke="#63bdb5" stroke-width="6"/><polygon points="786,603 800,628 814,603" fill="#63bdb5"/>
  <rect x="110" y="625" width="1380" height="125" rx="28" fill="#ffffff" stroke="#72aaa5" stroke-width="4"/>
  <text x="165" y="678" fill="#477f7a" font-family="Arial, sans-serif" font-size="22" font-weight="700">MODEL AND MARKET LEVEL</text>
  <text x="165" y="719" fill="#172033" font-family="Arial, sans-serif" font-size="29" font-weight="700">Legal maker · factory · importer · seller · warrantor · service route</text>
  <text x="1490" y="858" fill="#748293" text-anchor="end" font-family="Arial, sans-serif" font-size="18">World Clean Biz · reviewed 6 August 2026</text>
</svg>
