<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Dulevo machine market and service checklist</title><desc id="desc">A four-step verification sequence for application, machine configuration, compliance and lifecycle service.</desc><rect width="1200" height="720" rx="36" fill="#292d31"/><text x="72" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Specify the machine around the operating duty</text>
  <g font-family="Arial,sans-serif"><g transform="translate(72 175)"><rect width="240" height="330" rx="26" fill="#fff"/><text x="28" y="75" font-size="26" font-weight="700" fill="#d9272e">Application</text><text x="28" y="130" font-size="18" fill="#62676a">Indoor, industrial,</text><text x="28" y="164" font-size="18" fill="#62676a">street or municipal</text></g><g transform="translate(344 175)"><rect width="240" height="330" rx="26" fill="#fff"/><text x="28" y="75" font-size="26" font-weight="700" fill="#d9272e">Configuration</text><text x="28" y="130" font-size="18" fill="#62676a">Powertrain, brushes,</text><text x="28" y="164" font-size="18" fill="#62676a">filter and options</text></g><g transform="translate(616 175)"><rect width="240" height="330" rx="26" fill="#fff"/><text x="28" y="75" font-size="26" font-weight="700" fill="#d9272e">Compliance</text><text x="28" y="130" font-size="18" fill="#62676a">Road approval, noise,</text><text x="28" y="164" font-size="18" fill="#62676a">emissions and safety</text></g><g transform="translate(888 175)"><rect width="240" height="330" rx="26" fill="#fff"/><text x="28" y="75" font-size="26" font-weight="700" fill="#d9272e">Lifecycle</text><text x="28" y="130" font-size="18" fill="#62676a">Training, parts,</text><text x="28" y="164" font-size="18" fill="#62676a">service and uptime</text></g><text x="72" y="605" font-size="22" fill="#e2e4e5">Group and model pages begin the review; the tender and serial-number file complete it.</text></g>
</svg>
