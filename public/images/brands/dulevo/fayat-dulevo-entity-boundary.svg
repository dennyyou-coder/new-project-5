<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FAYAT and Dulevo entity boundary</title><desc id="desc">FAYAT Group owns Dulevo while Dulevo International, regional companies and dealers retain distinct operating roles.</desc><rect width="1200" height="720" rx="36" fill="#f7f5f4"/><text x="72" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#24272a">Ownership does not replace operating evidence</text>
  <g font-family="Arial,sans-serif"><rect x="72" y="175" width="250" height="180" rx="26" fill="#2c3034"/><text x="197" y="240" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">FAYAT Group</text><text x="197" y="284" text-anchor="middle" font-size="19" fill="#e0e2e3">Group owner</text><path d="M322 265h90" stroke="#e02b2f" stroke-width="8"/><rect x="412" y="175" width="345" height="180" rx="26" fill="#e02b2f"/><text x="584" y="236" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">Dulevo International S.p.A.</text><text x="584" y="282" text-anchor="middle" font-size="19" fill="#ffe5e5">Italian operating company</text><path d="M757 265h90" stroke="#e02b2f" stroke-width="8"/><rect x="847" y="175" width="281" height="180" rx="26" fill="#fff" stroke="#d2c7c6" stroke-width="3"/><text x="988" y="236" text-anchor="middle" font-size="24" font-weight="700" fill="#24272a">Local route</text><text x="988" y="282" text-anchor="middle" font-size="19" fill="#62676a">Company, dealer or service</text>
  <rect x="72" y="425" width="1056" height="195" rx="28" fill="#fff" stroke="#d2c7c6" stroke-width="3"/><text x="110" y="486" font-size="24" font-weight="700" fill="#24272a">Verify at machine and market level</text><text x="110" y="545" font-size="20" fill="#62676a">Manufacturer</text><text x="350" y="545" font-size="20" fill="#62676a">Homologation and origin</text><text x="680" y="545" font-size="20" fill="#62676a">Dealer and parts</text><text x="930" y="545" font-size="20" fill="#62676a">Warranty</text></g>
</svg>
