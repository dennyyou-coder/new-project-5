<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Russell Hobbs brand and operating-company boundary</title><desc id="desc">Russell Hobbs is an owned Spectrum Brands consumer brand operated through different legal companies by market.</desc><rect width="1600" height="900" fill="#f5f7fa"/><text x="110" y="115" fill="#172638" font-family="Arial,sans-serif" font-size="54" font-weight="700">Owned brand does not mean one global seller</text><text x="110" y="170" fill="#667385" font-family="Arial,sans-serif" font-size="25">Separate the listed parent, operating companies, consumer brand and local transaction.</text><rect x="110" y="250" width="1380" height="118" rx="28" fill="#101f34"/><text x="165" y="299" fill="#b9c9dd" font-family="Arial,sans-serif" font-size="22" font-weight="700">LISTED PARENT</text><text x="165" y="342" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">Spectrum Brands Holdings, Inc.</text><rect x="110" y="435" width="650" height="220" rx="28" fill="#fff" stroke="#e31b23" stroke-width="5"/><text x="160" y="500" fill="#c41820" font-family="Arial,sans-serif" font-size="22" font-weight="700">OWNED CONSUMER BRAND</text><text x="160" y="558" fill="#172638" font-family="Arial,sans-serif" font-size="35" font-weight="700">Russell Hobbs</text><text x="160" y="610" fill="#667385" font-family="Arial,sans-serif" font-size="22">Kitchen, cooking and garment care</text><rect x="840" y="435" width="650" height="220" rx="28" fill="#fff" stroke="#71839b" stroke-width="5"/><text x="890" y="500" fill="#50667f" font-family="Arial,sans-serif" font-size="22" font-weight="700">REGIONAL LEGAL ENTITIES</text><text x="890" y="558" fill="#172638" font-family="Arial,sans-serif" font-size="31" font-weight="700">UK · Germany · Australia · others</text><text x="890" y="610" fill="#667385" font-family="Arial,sans-serif" font-size="22">Seller, manufacturer and warranty roles vary</text><text x="110" y="760" fill="#667385" font-family="Arial,sans-serif" font-size="24">Use local terms, product labels and warranty documents to establish responsibility.</text><text x="1490" y="850" fill="#8794a3" text-anchor="end" font-family="Arial,sans-serif" font-size="18">World Clean Biz · reviewed 7 August 2026</text></svg>
