<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Russell Hobbs supplier and market verification</title><desc id="desc">Spectrum Brands reports outsourced Home and Personal Care manufacturing, requiring model and market checks.</desc><rect width="1600" height="900" fill="#fff8f8"/><text x="110" y="115" fill="#22262c" font-family="Arial,sans-serif" font-size="54" font-weight="700">Outsourced production needs four controls</text><text x="110" y="170" fill="#737982" font-family="Arial,sans-serif" font-size="25">The fiscal 2025 filing does not provide a Russell Hobbs model-to-factory map.</text><g font-family="Arial,sans-serif"><rect x="110" y="285" width="300" height="250" rx="28" fill="#e31b23"/><text x="155" y="350" fill="#ffd9db" font-size="21" font-weight="700">01 · PRODUCT</text><text x="155" y="420" fill="#fff" font-size="34" font-weight="700">Exact model</text><text x="155" y="470" fill="#fff" font-size="23">Suffix + revision</text><rect x="470" y="285" width="300" height="250" rx="28" fill="#172638"/><text x="515" y="350" fill="#c7d3e2" font-size="21" font-weight="700">02 · SUPPLIER</text><text x="515" y="420" fill="#fff" font-size="34" font-weight="700">Approved plant</text><text x="515" y="470" fill="#fff" font-size="23">Origin + inspection</text><rect x="830" y="285" width="300" height="250" rx="28" fill="#50667f"/><text x="875" y="350" fill="#e5ebf1" font-size="21" font-weight="700">03 · MARKET</text><text x="875" y="420" fill="#fff" font-size="34" font-weight="700">Local entity</text><text x="875" y="470" fill="#fff" font-size="23">Seller + importer</text><rect x="1190" y="285" width="300" height="250" rx="28" fill="#8b98a8"/><text x="1235" y="350" fill="#fff" font-size="21" font-weight="700">04 · SUPPORT</text><text x="1235" y="420" fill="#fff" font-size="34" font-weight="700">Warranty</text><text x="1235" y="470" fill="#fff" font-size="23">Parts + service</text></g><path d="M410 410h60M770 410h60M1130 410h60" stroke="#e31b23" stroke-width="8"/><text x="110" y="685" fill="#22262c" font-family="Arial,sans-serif" font-size="31" font-weight="700">Do not substitute group-scale evidence for a SKU file</text><text x="110" y="735" fill="#737982" font-family="Arial,sans-serif" font-size="23">Keep compliance, factory, origin, seller and warranty evidence tied to the purchase contract.</text><text x="1490" y="850" fill="#9c9395" text-anchor="end" font-family="Arial,sans-serif" font-size="18">World Clean Biz · reviewed 7 August 2026</text></svg>
