<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TTI 2025 results by segment</title>
  <desc id="desc">TTI 2025 revenue of US$15,260 million, Power Equipment sales of US$14.4 billion up 5.3 percent, and Floorcare and Cleaning sales down 9.7 percent.</desc>
  <rect width="1600" height="900" fill="#f5f7fa"/>
  <text x="110" y="112" fill="#0e1526" font-family="Arial, sans-serif" font-size="52" font-weight="700">2025: tools grew, floorcare shrank</text>
  <text x="110" y="162" fill="#4a5367" font-family="Arial, sans-serif" font-size="25">Figures as reported in TTI's Annual Report 2025 (year to 31 December 2025).</text>
  <rect x="110" y="225" width="1380" height="150" rx="26" fill="#ffffff" stroke="#c9d0dc" stroke-width="3"/>
  <text x="160" y="282" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">GROUP REVENUE</text>
  <text x="160" y="342" fill="#0e1526" font-family="Arial, sans-serif" font-size="48" font-weight="700">US$15,260 million <tspan font-size="30" fill="#4a5367">+4.4%</tspan></text>
  <text x="900" y="282" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">PROFIT ATTRIBUTABLE TO OWNERS</text>
  <text x="900" y="342" fill="#0e1526" font-family="Arial, sans-serif" font-size="48" font-weight="700">US$1,198 million <tspan font-size="30" fill="#4a5367">+6.8%</tspan></text>
  <rect x="110" y="415" width="660" height="330" rx="26" fill="#ffffff" stroke="#2b50c8" stroke-width="5"/>
  <text x="155" y="468" fill="#2b50c8" font-family="Arial, sans-serif" font-size="22" font-weight="700">POWER EQUIPMENT</text>
  <text x="155" y="535" fill="#0e1526" font-family="Arial, sans-serif" font-size="46" font-weight="700">US$14.4 billion</text>
  <text x="155" y="582" fill="#0e1526" font-family="Arial, sans-serif" font-size="28" font-weight="700">+5.3% reported · +5.0% local currency</text>
  <text x="155" y="640" fill="#4a5367" font-family="Arial, sans-serif" font-size="23">MILWAUKEE +7.9% and RYOBI +5.4%</text>
  <text x="155" y="676" fill="#4a5367" font-family="Arial, sans-serif" font-size="23">in local currency</text>
  <rect x="830" y="415" width="660" height="330" rx="26" fill="#ffffff" stroke="#0f8a8a" stroke-width="5"/>
  <text x="875" y="468" fill="#0f8a8a" font-family="Arial, sans-serif" font-size="22" font-weight="700">FLOORCARE &amp; CLEANING</text>
  <text x="875" y="535" fill="#0e1526" font-family="Arial, sans-serif" font-size="46" font-weight="700">Sales −9.7%</text>
  <text x="875" y="582" fill="#0e1526" font-family="Arial, sans-serif" font-size="24" font-weight="700">HOOVER, DIRT DEVIL, ORECK and VAX weaker</text>
  <text x="875" y="640" fill="#4a5367" font-family="Arial, sans-serif" font-size="23">Reorganised into one global business;</text>
  <text x="875" y="676" fill="#4a5367" font-family="Arial, sans-serif" font-size="23">Charlotte, NC site closed, combined in Anderson, SC</text>
  <text x="1490" y="858" fill="#5a6378" text-anchor="end" font-family="Arial, sans-serif" font-size="18">World Clean Biz · source: TTI Annual Report 2025 and its Management Discussion and Analysis</text>
</svg>
