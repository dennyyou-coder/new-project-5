<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TTI group and brand map</title>
  <desc id="desc">Techtronic Industries Company Limited, its Power Equipment brands and its Floorcare and Cleaning brands, with licensed and regional brands marked.</desc>
  <rect width="1600" height="900" fill="#f5f7fa"/>
  <text x="110" y="112" fill="#0e1526" font-family="Arial, sans-serif" font-size="52" font-weight="700">One listed group, two brand families</text>
  <text x="110" y="162" fill="#4a5367" font-family="Arial, sans-serif" font-size="25">Start with Techtronic Industries, then the brand, then the entity responsible for the product in your market.</text>
  <rect x="110" y="225" width="1380" height="120" rx="26" fill="#2b50c8"/>
  <text x="160" y="276" fill="#dfe7ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">LISTED GROUP · HONG KONG STOCK EXCHANGE 669</text>
  <text x="160" y="318" fill="#ffffff" font-family="Arial, sans-serif" font-size="31" font-weight="700">Techtronic Industries Company Limited (TTI)</text>
  <path d="M520 345V400" stroke="#8aa3e6" stroke-width="6"/><polygon points="506,388 520,413 534,388" fill="#8aa3e6"/>
  <path d="M1080 345V400" stroke="#8aa3e6" stroke-width="6"/><polygon points="1066,388 1080,413 1094,388" fill="#8aa3e6"/>
  <rect x="110" y="415" width="660" height="330" rx="26" fill="#ffffff" stroke="#2b50c8" stroke-width="5"/>
  <text x="155" y="468" fill="#2b50c8" font-family="Arial, sans-serif" font-size="22" font-weight="700">POWER EQUIPMENT</text>
  <text x="155" y="520" fill="#0e1526" font-family="Arial, sans-serif" font-size="30" font-weight="700">MILWAUKEE</text>
  <text x="155" y="566" fill="#0e1526" font-family="Arial, sans-serif" font-size="30" font-weight="700">RYOBI <tspan fill="#4a5367" font-size="22" font-weight="400">brand licence</tspan></text>
  <text x="155" y="612" fill="#0e1526" font-family="Arial, sans-serif" font-size="30" font-weight="700">AEG <tspan fill="#4a5367" font-size="22" font-weight="400">brand licence</tspan></text>
  <text x="155" y="658" fill="#0e1526" font-family="Arial, sans-serif" font-size="30" font-weight="700">HOMELITE · EMPIRE</text>
  <text x="155" y="704" fill="#4a5367" font-family="Arial, sans-serif" font-size="22">Also Imperial Blades and STILETTO</text>
  <rect x="830" y="415" width="660" height="330" rx="26" fill="#ffffff" stroke="#0f8a8a" stroke-width="5"/>
  <text x="875" y="468" fill="#0f8a8a" font-family="Arial, sans-serif" font-size="22" font-weight="700">FLOORCARE &amp; CLEANING</text>
  <text x="875" y="520" fill="#0e1526" font-family="Arial, sans-serif" font-size="30" font-weight="700">HOOVER <tspan fill="#4a5367" font-size="22" font-weight="400">North America</tspan></text>
  <text x="875" y="566" fill="#0e1526" font-family="Arial, sans-serif" font-size="30" font-weight="700">DIRT DEVIL</text>
  <text x="875" y="612" fill="#0e1526" font-family="Arial, sans-serif" font-size="30" font-weight="700">ORECK</text>
  <text x="875" y="658" fill="#0e1526" font-family="Arial, sans-serif" font-size="30" font-weight="700">VAX</text>
  <text x="875" y="704" fill="#4a5367" font-family="Arial, sans-serif" font-size="22">Hoover in Europe belongs to Haier, not TTI</text>
  <text x="1490" y="858" fill="#5a6378" text-anchor="end" font-family="Arial, sans-serif" font-size="18">World Clean Biz · sources: TTI company and history pages, Annual Report 2025</text>
</svg>
