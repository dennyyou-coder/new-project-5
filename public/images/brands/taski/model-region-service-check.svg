<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TASKI model region and service check</title><desc id="desc">Four procurement gates for TASKI professional cleaning equipment.</desc>
  <rect width="1200" height="720" fill="#202b35"/>
  <text x="80" y="92" font-family="Arial" font-size="39" font-weight="700" fill="#fff">Four gates for TASKI procurement</text>
  <text x="80" y="136" font-family="Arial" font-size="21" fill="#cbd3d8">Swiss evidence can be strong and still apply only to a named model or operation.</text>
  <g font-family="Arial">
    <g transform="translate(80 215)"><rect width="245" height="320" rx="24" fill="#fff"/><circle cx="52" cy="58" r="25" fill="#e66b18"/><text x="44" y="67" font-size="24" font-weight="700" fill="#fff">1</text><text x="35" y="125" font-size="27" font-weight="700" fill="#202b35">Model</text><text x="35" y="178" font-size="19" fill="#5f6b73">Exact SKU</text><text x="35" y="215" font-size="19" fill="#5f6b73">Serial range</text><text x="35" y="252" font-size="19" fill="#5f6b73">Country of origin</text></g>
    <g transform="translate(345 215)"><rect width="245" height="320" rx="24" fill="#fff0e5"/><circle cx="52" cy="58" r="25" fill="#e66b18"/><text x="44" y="67" font-size="24" font-weight="700" fill="#fff">2</text><text x="35" y="125" font-size="27" font-weight="700" fill="#202b35">Market</text><text x="35" y="178" font-size="19" fill="#5f6b73">Legal seller</text><text x="35" y="215" font-size="19" fill="#5f6b73">Importer</text><text x="35" y="252" font-size="19" fill="#5f6b73">Compliance file</text></g>
    <g transform="translate(610 215)"><rect width="245" height="320" rx="24" fill="#fff"/><circle cx="52" cy="58" r="25" fill="#e66b18"/><text x="44" y="67" font-size="24" font-weight="700" fill="#fff">3</text><text x="35" y="125" font-size="27" font-weight="700" fill="#202b35">Service</text><text x="35" y="178" font-size="19" fill="#5f6b73">Technicians</text><text x="35" y="215" font-size="19" fill="#5f6b73">Response time</text><text x="35" y="252" font-size="19" fill="#5f6b73">Parts stock</text></g>
    <g transform="translate(875 215)"><rect width="245" height="320" rx="24" fill="#fff0e5"/><circle cx="52" cy="58" r="25" fill="#e66b18"/><text x="44" y="67" font-size="24" font-weight="700" fill="#fff">4</text><text x="35" y="125" font-size="27" font-weight="700" fill="#202b35">Connected</text><text x="35" y="178" font-size="19" fill="#5f6b73">Software owner</text><text x="35" y="215" font-size="19" fill="#5f6b73">Data terms</text><text x="35" y="252" font-size="19" fill="#5f6b73">Manual fallback</text></g>
  </g>
  <text x="600" y="626" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffd6b8">Close every gate before multi-site rollout.</text>
</svg>
