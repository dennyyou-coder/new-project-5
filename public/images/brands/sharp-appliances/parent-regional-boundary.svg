<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Sharp parent and regional appliance boundary</title><desc id="desc">Hon Hai is Sharp Corporation's disclosed parent, while the Sharp consumer brand and regional appliance operators have different roles.</desc><rect width="1600" height="900" fill="#f5f6f7"/><text x="110" y="115" fill="#252a2d" font-family="Arial,sans-serif" font-size="54" font-weight="700">One brand, several levels of responsibility</text><text x="110" y="170" fill="#69747a" font-family="Arial,sans-serif" font-size="25">Ownership does not identify the operator, factory or warrantor for every appliance.</text><rect x="110" y="250" width="1380" height="118" rx="28" fill="#d71920"/><text x="165" y="299" fill="#ffdadd" font-family="Arial,sans-serif" font-size="22" font-weight="700">PARENT UNDER SHARP'S JAPANESE-LAW DISCLOSURE</text><text x="165" y="342" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">Hon Hai Precision Industry Co., Ltd.</text><rect x="110" y="435" width="650" height="220" rx="28" fill="#fff" stroke="#d71920" stroke-width="5"/><text x="160" y="500" fill="#b5131a" font-family="Arial,sans-serif" font-size="22" font-weight="700">LISTED BRAND COMPANY</text><text x="160" y="558" fill="#252a2d" font-family="Arial,sans-serif" font-size="35" font-weight="700">Sharp Corporation</text><text x="160" y="610" fill="#69747a" font-family="Arial,sans-serif" font-size="22">Corporate, technology and group role</text><rect x="840" y="435" width="650" height="220" rx="28" fill="#fff" stroke="#8c969b" stroke-width="5"/><text x="890" y="500" fill="#59676e" font-family="Arial,sans-serif" font-size="22" font-weight="700">BRAND AND MARKET EXECUTION</text><text x="890" y="558" fill="#252a2d" font-family="Arial,sans-serif" font-size="35" font-weight="700">SHARP consumer brand</text><text x="890" y="610" fill="#69747a" font-family="Arial,sans-serif" font-size="22">Regional Sharp and Vestel operators differ</text><text x="110" y="760" fill="#69747a" font-family="Arial,sans-serif" font-size="24">Verify the exact model, country operator, seller, importer, factory and warranty document.</text><text x="1490" y="850" fill="#8b9499" text-anchor="end" font-family="Arial,sans-serif" font-size="18">World Clean Biz · reviewed 7 August 2026</text></svg>
