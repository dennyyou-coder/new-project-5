<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">LawnMaster brand, trademark and regional operating boundary</title><desc id="d">LawnMaster is a Cleva brand with a trademark owner and separate regional operating companies.</desc><rect width="1200" height="720" rx="36" fill="#171411"/><text x="72" y="92" font-family="Arial" font-size="38" font-weight="700" fill="#fff">The brand is one layer in a regional operating chain</text><g font-family="Arial"><rect x="72" y="160" width="300" height="170" rx="26" fill="#f47b20"/><text x="108" y="220" font-size="29" font-weight="700" fill="#171411">LawnMaster</text><text x="108" y="268" font-size="20" fill="#392416">Product-facing brand</text><rect x="450" y="160" width="300" height="170" rx="26" fill="#302a25"/><text x="486" y="215" font-size="24" font-weight="700" fill="#fff">Suzhou Cleva</text><text x="486" y="254" font-size="20" fill="#ddd">Reviewed U.S.</text><text x="486" y="282" font-size="20" fill="#ddd">trademark owner</text><rect x="828" y="160" width="300" height="170" rx="26" fill="#302a25"/><text x="864" y="215" font-size="24" font-weight="700" fill="#fff">Regional Cleva</text><text x="864" y="254" font-size="20" fill="#ddd">Sales, support and</text><text x="864" y="282" font-size="20" fill="#ddd">warranty scope</text></g><path d="M372 245h78M750 245h78" stroke="#f47b20" stroke-width="8"/><rect x="72" y="420" width="1056" height="190" rx="28" fill="#24201c"/><text x="110" y="478" font-family="Arial" font-size="25" font-weight="700" fill="#fff">Buyer evidence still required</text><text x="110" y="526" font-family="Arial" font-size="21" fill="#e7ded6">Exact model • legal manufacturer • factory/origin • importer • seller • destination-market warrantor</text></svg>
