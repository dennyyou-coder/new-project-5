<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Wetrok model origin and service buyer checks</title><desc id="desc">Four checks for buying a Wetrok professional cleaning system.</desc><rect width="1200" height="675" rx="36" fill="#002a5b"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="white">VERIFY THE DELIVERED WETROK SYSTEM</text><text x="70" y="125" font-family="Arial,sans-serif" font-size="22" fill="#c7d8e7">Company-level Swiss claims still need model-level control</text><g font-family="Arial,sans-serif"><rect x="70" y="180" width="505" height="160" rx="24" fill="#0b3b70"/><circle cx="120" cy="230" r="25" fill="#00a7c8"/><text x="112" y="239" font-size="24" font-weight="700" fill="white">1</text><text x="165" y="230" font-size="25" font-weight="700" fill="white">MODEL + ORIGIN</text><text x="165" y="271" font-size="19" fill="#c7d8e7">Manufacturer plate, serial, site</text><text x="165" y="302" font-size="19" fill="#c7d8e7">and country of origin</text><rect x="625" y="180" width="505" height="160" rx="24" fill="#0b3b70"/><circle cx="675" cy="230" r="25" fill="#00a7c8"/><text x="667" y="239" font-size="24" font-weight="700" fill="white">2</text><text x="720" y="230" font-size="25" font-weight="700" fill="white">APPLICATION FIT</text><text x="720" y="271" font-size="19" fill="#c7d8e7">Floor, chemical, accessories</text><text x="720" y="302" font-size="19" fill="#c7d8e7">and measured productivity</text><rect x="70" y="380" width="505" height="160" rx="24" fill="#0b3b70"/><circle cx="120" cy="430" r="25" fill="#00a7c8"/><text x="112" y="439" font-size="24" font-weight="700" fill="white">3</text><text x="165" y="430" font-size="25" font-weight="700" fill="white">MARKET ENTITY</text><text x="165" y="471" font-size="19" fill="#c7d8e7">Seller, importer, compliance</text><text x="165" y="502" font-size="19" fill="#c7d8e7">and warranty issuer</text><rect x="625" y="380" width="505" height="160" rx="24" fill="#0b3b70"/><circle cx="675" cy="430" r="25" fill="#00a7c8"/><text x="667" y="439" font-size="24" font-weight="700" fill="white">4</text><text x="720" y="430" font-size="25" font-weight="700" fill="white">LIFECYCLE SUPPORT</text><text x="720" y="471" font-size="19" fill="#c7d8e7">Parts, technician coverage,</text><text x="720" y="502" font-size="19" fill="#c7d8e7">response time and training</text></g><text x="70" y="615" font-family="Arial,sans-serif" font-size="20" fill="#c7d8e7">Procure a verified operating result, not a headquarters claim.</text></svg>
