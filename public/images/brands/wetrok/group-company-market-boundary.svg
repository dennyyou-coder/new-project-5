<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Wetrok group company and market responsibility boundary</title><desc id="desc">Diethelm Keller Group includes Wetrok while regional sales and service responsibilities vary.</desc><rect width="1200" height="675" rx="36" fill="#f3f7fb"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#002a5b">GROUP OWNERSHIP IS NOT EVERY MARKET ROLE</text><text x="70" y="125" font-family="Arial,sans-serif" font-size="22" fill="#536477">Evidence-backed entity and channel boundary</text><g font-family="Arial,sans-serif"><rect x="70" y="175" width="1060" height="112" rx="22" fill="#002a5b"/><text x="105" y="224" font-size="25" font-weight="700" fill="white">DIETHELM KELLER GROUP</text><text x="105" y="260" font-size="20" fill="#d7e5f2">Wetrok has been part of the Swiss family-owned group since 1955</text><path d="M600 287v52" stroke="#71859a" stroke-width="5"/><path d="M585 325l15 20 15-20" fill="none" stroke="#71859a" stroke-width="5"/><rect x="70" y="360" width="1060" height="105" rx="22" fill="#00a7c8"/><text x="105" y="405" font-size="25" font-weight="700" fill="white">WETROK AG</text><text x="105" y="440" font-size="20" fill="white">Swiss operating company for professional machines, chemicals and systems</text><rect x="70" y="505" width="330" height="105" rx="20" fill="white" stroke="#bfd1e1" stroke-width="2"/><text x="100" y="550" font-size="21" font-weight="700" fill="#002a5b">REGIONAL ENTITY</text><text x="100" y="582" font-size="18" fill="#536477">Contract and compliance</text><rect x="435" y="505" width="330" height="105" rx="20" fill="white" stroke="#bfd1e1" stroke-width="2"/><text x="465" y="550" font-size="21" font-weight="700" fill="#002a5b">AUTHORIZED DEALER</text><text x="465" y="582" font-size="18" fill="#536477">Territory and delivery</text><rect x="800" y="505" width="330" height="105" rx="20" fill="white" stroke="#bfd1e1" stroke-width="2"/><text x="830" y="550" font-size="21" font-weight="700" fill="#002a5b">SERVICE PARTY</text><text x="830" y="582" font-size="18" fill="#536477">Parts, repair and warranty</text></g><text x="70" y="645" font-family="Arial,sans-serif" font-size="18" fill="#536477">Confirm the named entity for each destination-market responsibility.</text></svg>
