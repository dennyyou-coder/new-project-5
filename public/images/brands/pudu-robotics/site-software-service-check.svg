<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PUDU Robotics deployment verification checklist</title><desc id="desc">A four-step checklist for site performance, configuration, digital services and local lifecycle support.</desc><rect width="1200" height="720" rx="36" fill="#14242a"/><text x="72" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Approve the deployment, not just the robot</text>
  <g font-family="Arial,sans-serif"><g transform="translate(72 175)"><rect width="240" height="330" rx="26" fill="#fff"/><text x="28" y="75" font-size="26" font-weight="700" fill="#0cae9f">Site trial</text><text x="28" y="130" font-size="18" fill="#53636b">Floor types, traffic,</text><text x="28" y="164" font-size="18" fill="#53636b">edges and elevators</text></g><g transform="translate(344 175)"><rect width="240" height="330" rx="26" fill="#fff"/><text x="28" y="75" font-size="26" font-weight="700" fill="#0cae9f">Configuration</text><text x="28" y="130" font-size="18" fill="#53636b">Model, dock, water,</text><text x="28" y="164" font-size="18" fill="#53636b">network and safety</text></g><g transform="translate(616 175)"><rect width="240" height="330" rx="26" fill="#fff"/><text x="28" y="75" font-size="26" font-weight="700" fill="#0cae9f">Digital terms</text><text x="28" y="130" font-size="18" fill="#53636b">Cloud, data location,</text><text x="28" y="164" font-size="18" fill="#53636b">access and updates</text></g><g transform="translate(888 175)"><rect width="240" height="330" rx="26" fill="#fff"/><text x="28" y="75" font-size="26" font-weight="700" fill="#0cae9f">Lifecycle</text><text x="28" y="130" font-size="18" fill="#53636b">Parts, response time,</text><text x="28" y="164" font-size="18" fill="#53636b">warranty and exit</text></g><text x="72" y="605" font-size="22" fill="#d4e2e4">Record the responsible entity and acceptance criteria for every site.</text></g>
</svg>
