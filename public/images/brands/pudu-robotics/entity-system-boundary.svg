<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PUDU Robotics entity and system boundary</title><desc id="desc">The PUDU Robotics brand connects to Shenzhen Pudu Technology, robot hardware and digital services, while regional contracts remain separate.</desc>
  <rect width="1200" height="720" rx="36" fill="#f3f7f8"/><text x="72" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17242a">Brand, legal entity and deployment system</text>
  <g font-family="Arial,sans-serif"><rect x="72" y="175" width="245" height="180" rx="26" fill="#17c6b4"/><text x="194" y="240" text-anchor="middle" font-size="31" font-weight="700" fill="#102228">PUDU</text><text x="194" y="284" text-anchor="middle" font-size="19" fill="#163a3d">Commercial brand</text><path d="M317 265h85" stroke="#17c6b4" stroke-width="8"/><rect x="402" y="175" width="365" height="180" rx="26" fill="#fff" stroke="#b9cdd0" stroke-width="3"/><text x="584" y="235" text-anchor="middle" font-size="23" font-weight="700" fill="#17242a">Shenzhen Pudu Technology</text><text x="584" y="278" text-anchor="middle" font-size="19" fill="#53636b">Named company and affiliates</text><path d="M767 265h85" stroke="#17c6b4" stroke-width="8"/><rect x="852" y="175" width="276" height="180" rx="26" fill="#fff" stroke="#b9cdd0" stroke-width="3"/><text x="990" y="235" text-anchor="middle" font-size="23" font-weight="700" fill="#17242a">Regional contract</text><text x="990" y="278" text-anchor="middle" font-size="19" fill="#53636b">Seller, service and data terms</text>
  <rect x="72" y="425" width="1056" height="195" rx="28" fill="#17242a"/><text x="110" y="486" font-size="24" font-weight="700" fill="#fff">The purchased system can include</text><text x="110" y="545" font-size="20" fill="#d4e2e4">Robot hardware</text><text x="345" y="545" font-size="20" fill="#d4e2e4">Dock and utilities</text><text x="620" y="545" font-size="20" fill="#d4e2e4">PUDU Link and cloud</text><text x="900" y="545" font-size="20" fill="#d4e2e4">Local support</text></g>
</svg>
