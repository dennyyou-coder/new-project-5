<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">De'Longhi portfolio and channel verification</title>
  <desc id="desc">A buyer workflow from De'Longhi product category through model, channel and after-sales evidence.</desc>
  <rect width="1600" height="900" fill="#f5f6fa"/>
  <text x="110" y="112" fill="#172033" font-family="Arial, sans-serif" font-size="54" font-weight="700">Build the evidence chain from the model outward</text>
  <text x="110" y="164" fill="#5f6878" font-family="Arial, sans-serif" font-size="25">A global portfolio describes the brand; procurement depends on the local offer.</text>
  <g font-family="Arial, sans-serif">
    <rect x="110" y="270" width="250" height="360" rx="28" fill="#1d2e63"/><text x="150" y="332" fill="#ccd8ff" font-size="23" font-weight="700">01</text><text x="150" y="385" fill="#fff" font-size="28" font-weight="700">Category</text><text x="150" y="438" fill="#e1e7ff" font-size="20">Coffee</text><text x="150" y="470" fill="#e1e7ff" font-size="20">Kitchen</text><text x="150" y="502" fill="#e1e7ff" font-size="20">Comfort</text>
    <rect x="392" y="270" width="250" height="360" rx="28" fill="#ffffff" stroke="#1d2e63" stroke-width="4"/><text x="432" y="332" fill="#1d2e63" font-size="23" font-weight="700">02</text><text x="432" y="385" fill="#172033" font-size="28" font-weight="700">Model</text><text x="432" y="438" fill="#5f6878" font-size="20">Exact code</text><text x="432" y="470" fill="#5f6878" font-size="20">Voltage</text><text x="432" y="502" fill="#5f6878" font-size="20">Accessories</text>
    <rect x="674" y="270" width="250" height="360" rx="28" fill="#ffffff" stroke="#1d2e63" stroke-width="4"/><text x="714" y="332" fill="#1d2e63" font-size="23" font-weight="700">03</text><text x="714" y="385" fill="#172033" font-size="28" font-weight="700">Responsibility</text><text x="714" y="438" fill="#5f6878" font-size="20">Legal maker</text><text x="714" y="470" fill="#5f6878" font-size="20">Factory or partner</text><text x="714" y="502" fill="#5f6878" font-size="20">Origin</text>
    <rect x="956" y="270" width="250" height="360" rx="28" fill="#ffffff" stroke="#8290b6" stroke-width="4"/><text x="996" y="332" fill="#59688f" font-size="23" font-weight="700">04</text><text x="996" y="385" fill="#172033" font-size="28" font-weight="700">Channel</text><text x="996" y="438" fill="#5f6878" font-size="20">Country listing</text><text x="996" y="470" fill="#5f6878" font-size="20">Dealer status</text><text x="996" y="502" fill="#5f6878" font-size="20">Invoice seller</text>
    <rect x="1238" y="270" width="250" height="360" rx="28" fill="#ffffff" stroke="#8290b6" stroke-width="4"/><text x="1278" y="332" fill="#59688f" font-size="23" font-weight="700">05</text><text x="1278" y="385" fill="#172033" font-size="28" font-weight="700">After-sales</text><text x="1278" y="438" fill="#5f6878" font-size="20">Warrantor</text><text x="1278" y="470" fill="#5f6878" font-size="20">Parts</text><text x="1278" y="502" fill="#5f6878" font-size="20">Service route</text>
  </g>
  <rect x="110" y="704" width="1378" height="86" rx="22" fill="#172033"/>
  <text x="799" y="758" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700">Do not transfer specifications, warranty or dealer status between countries.</text>
  <text x="1490" y="858" fill="#748293" text-anchor="end" font-family="Arial, sans-serif" font-size="18">World Clean Biz · reviewed 6 August 2026</text>
</svg>
