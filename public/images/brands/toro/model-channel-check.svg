<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Toro model and channel check</title><desc id="d">Toro products span categories and channels, requiring model-level verification.</desc><rect width="1200" height="720" rx="36" fill="#f7f4f2"/><text x="72" y="92" font-family="Arial" font-size="38" font-weight="700" fill="#222">Portfolio breadth creates different supply paths</text><g font-family="Arial"><rect x="72" y="165" width="320" height="170" rx="24" fill="#fff" stroke="#dbcac6"/><text x="106" y="222" font-size="25" font-weight="700">Residential</text><text x="106" y="268" font-size="20">Mowers and snow</text><rect x="440" y="165" width="320" height="170" rx="24" fill="#fff" stroke="#dbcac6"/><text x="474" y="222" font-size="25" font-weight="700">Professional</text><text x="474" y="268" font-size="20">Turf and golf</text><rect x="808" y="165" width="320" height="170" rx="24" fill="#fff" stroke="#dbcac6"/><text x="842" y="222" font-size="25" font-weight="700">Connected</text><text x="842" y="268" font-size="20">Robotic mowing</text></g><path d="M232 335v87M600 335v87M968 335v87" stroke="#d71920" stroke-width="7"/><rect x="72" y="422" width="1056" height="190" rx="28" fill="#242424"/><text x="112" y="480" font-family="Arial" font-size="25" font-weight="700" fill="#fff">Check before ordering</text><text x="112" y="528" font-family="Arial" font-size="21" fill="#eee">Model • power source • factory/origin • authorized channel • installation • warranty and parts</text></svg>
