<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Toro brand and company boundary</title><desc id="d">Toro is a consumer and professional equipment brand of The Toro Company.</desc><rect width="1200" height="720" rx="36" fill="#171717"/><text x="72" y="92" font-family="Arial" font-size="38" font-weight="700" fill="#fff">One name, two distinct identity layers</text><rect x="72" y="160" width="470" height="210" rx="28" fill="#d71920"/><text x="112" y="232" font-family="Arial" font-size="34" font-weight="700" fill="#fff">Toro</text><text x="112" y="285" font-family="Arial" font-size="22" fill="#fff">Equipment brand on products</text><rect x="658" y="160" width="470" height="210" rx="28" fill="#292929" stroke="#686868"/><text x="698" y="232" font-family="Arial" font-size="31" font-weight="700" fill="#fff">The Toro Company</text><text x="698" y="285" font-family="Arial" font-size="22" fill="#ddd">Publicly listed company</text><path d="M542 265h116" stroke="#d71920" stroke-width="9"/><rect x="72" y="445" width="1056" height="170" rx="26" fill="#222"/><text x="108" y="500" font-family="Arial" font-size="24" font-weight="700" fill="#fff">Procurement boundary</text><text x="108" y="548" font-family="Arial" font-size="21" fill="#ddd">Confirm the product legal manufacturer, plant, seller, dealer and warranty route for the exact model and market.</text></svg>
