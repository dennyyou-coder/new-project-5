<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Cleanfix company trademark and channel boundary</title><desc id="desc">Cleanfix Reinigungssysteme AG owns the Cleanfix trademark while market channel roles vary.</desc><rect width="1200" height="675" rx="36" fill="#fff7f7"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#241f20">BRAND OWNER IS NOT EVERY MARKET ROLE</text><text x="70" y="125" font-family="Arial,sans-serif" font-size="22" fill="#62585a">Separate the Swiss company from destination-market responsibilities</text><rect x="70" y="178" width="1060" height="145" rx="24" fill="#e0001b"/><text x="105" y="235" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">CLEANFIX REINIGUNGSSYSTEME AG</text><text x="105" y="278" font-family="Arial,sans-serif" font-size="22" fill="white">Swiss company and owner of the Cleanfix name and logo</text><path d="M600 323v62" stroke="#8b7f81" stroke-width="5"/><path d="M585 370l15 20 15-20" fill="none" stroke="#8b7f81" stroke-width="5"/><g font-family="Arial,sans-serif"><rect x="70" y="410" width="240" height="155" rx="22" fill="white" stroke="#e4cfd2" stroke-width="2"/><text x="100" y="462" font-size="22" font-weight="700" fill="#241f20">DEALER</text><text x="100" y="503" font-size="18" fill="#62585a">Authorization</text><text x="100" y="533" font-size="18" fill="#62585a">and territory</text><rect x="335" y="410" width="240" height="155" rx="22" fill="white" stroke="#e4cfd2" stroke-width="2"/><text x="365" y="462" font-size="22" font-weight="700" fill="#241f20">IMPORTER</text><text x="365" y="503" font-size="18" fill="#62585a">Market entry</text><text x="365" y="533" font-size="18" fill="#62585a">and compliance</text><rect x="600" y="410" width="240" height="155" rx="22" fill="white" stroke="#e4cfd2" stroke-width="2"/><text x="630" y="462" font-size="22" font-weight="700" fill="#241f20">SELLER</text><text x="630" y="503" font-size="18" fill="#62585a">Contract and</text><text x="630" y="533" font-size="18" fill="#62585a">delivery</text><rect x="865" y="410" width="265" height="155" rx="22" fill="white" stroke="#e4cfd2" stroke-width="2"/><text x="895" y="462" font-size="22" font-weight="700" fill="#241f20">SERVICE PARTY</text><text x="895" y="503" font-size="18" fill="#62585a">Repair, parts</text><text x="895" y="533" font-size="18" fill="#62585a">and warranty</text></g><text x="70" y="625" font-family="Arial,sans-serif" font-size="18" fill="#62585a">Record the named legal entity for each responsibility before ordering.</text></svg>
