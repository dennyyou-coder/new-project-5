<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Cleanfix machine origin and service check</title><desc id="desc">Four buyer checks for Cleanfix machine origin, configuration, channel and support.</desc><rect width="1200" height="675" rx="36" fill="#2a2324"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="white">TURN SWISS QUALITY INTO CONTRACT PROOF</text><text x="70" y="125" font-family="Arial,sans-serif" font-size="22" fill="#dfd7d8">Verify the exact machine and its local support route</text><g font-family="Arial,sans-serif"><rect x="70" y="180" width="505" height="160" rx="24" fill="#3a3032"/><text x="105" y="232" font-size="24" font-weight="700" fill="#ff5365">01  ORIGIN</text><text x="105" y="274" font-size="19" fill="white">Manufacturer plate, assembly site,</text><text x="105" y="305" font-size="19" fill="white">serial number and documents</text><rect x="625" y="180" width="505" height="160" rx="24" fill="#3a3032"/><text x="660" y="232" font-size="24" font-weight="700" fill="#ff5365">02  CONFIGURATION</text><text x="660" y="274" font-size="19" fill="white">Battery, brushes, accessories,</text><text x="660" y="305" font-size="19" fill="white">chemicals and duty cycle</text><rect x="70" y="380" width="505" height="160" rx="24" fill="#3a3032"/><text x="105" y="432" font-size="24" font-weight="700" fill="#ff5365">03  CHANNEL</text><text x="105" y="474" font-size="19" fill="white">Authorized seller, importer</text><text x="105" y="505" font-size="19" fill="white">and delivery responsibility</text><rect x="625" y="380" width="505" height="160" rx="24" fill="#3a3032"/><text x="660" y="432" font-size="23" font-weight="700" fill="#ff5365">04  SWISS 10-YEAR SUPPORT</text><text x="660" y="474" font-size="19" fill="white">Published for Switzerland;</text><text x="660" y="505" font-size="19" fill="white">verify local terms elsewhere</text></g><text x="70" y="615" font-family="Arial,sans-serif" font-size="20" fill="#dfd7d8">Company statements become buyer protection only when the local contract names the terms.</text></svg>
