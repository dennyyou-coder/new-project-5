<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Vestel group, company and consumer-brand boundary</title><desc id="desc">Zorlu Holding controls Vestel Elektronik, which has separate manufacturing and sales subsidiaries behind the Vestel consumer brand.</desc><rect width="1600" height="900" fill="#f8f7f5"/><text x="110" y="115" fill="#282625" font-family="Arial,sans-serif" font-size="54" font-weight="700">Vestel appears in ownership, production and retail</text><text x="110" y="170" fill="#736f6c" font-family="Arial,sans-serif" font-size="25">Each layer answers a different procurement question.</text><rect x="110" y="240" width="1380" height="105" rx="26" fill="#dd1c27"/><text x="165" y="282" fill="#ffdcdf" font-family="Arial,sans-serif" font-size="21" font-weight="700">CONTROLLING SHAREHOLDER · 52.77%</text><text x="165" y="324" fill="#fff" font-family="Arial,sans-serif" font-size="33" font-weight="700">Zorlu Holding AŞ</text><rect x="110" y="395" width="1380" height="105" rx="26" fill="#353231"/><text x="165" y="437" fill="#d9d5d2" font-family="Arial,sans-serif" font-size="21" font-weight="700">LISTED CORE COMPANY</text><text x="165" y="479" fill="#fff" font-family="Arial,sans-serif" font-size="33" font-weight="700">Vestel Elektronik Sanayi ve Ticaret A.Ş.</text><rect x="110" y="555" width="430" height="170" rx="26" fill="#fff" stroke="#dd1c27" stroke-width="5"/><text x="150" y="610" fill="#bc151e" font-family="Arial,sans-serif" font-size="20" font-weight="700">MANUFACTURING</text><text x="150" y="660" fill="#282625" font-family="Arial,sans-serif" font-size="27" font-weight="700">Vestel Beyaz Eşya</text><text x="150" y="700" fill="#736f6c" font-family="Arial,sans-serif" font-size="20">77.3% subsidiary in 2024</text><rect x="585" y="555" width="430" height="170" rx="26" fill="#fff" stroke="#77716d" stroke-width="5"/><text x="625" y="610" fill="#5f5955" font-family="Arial,sans-serif" font-size="20" font-weight="700">SALES AND MARKETING</text><text x="625" y="660" fill="#282625" font-family="Arial,sans-serif" font-size="27" font-weight="700">Vestel Ticaret A.Ş.</text><text x="625" y="700" fill="#736f6c" font-family="Arial,sans-serif" font-size="20">Wholly owned subsidiary</text><rect x="1060" y="555" width="430" height="170" rx="26" fill="#fff" stroke="#a9a39f" stroke-width="5"/><text x="1100" y="610" fill="#77716d" font-family="Arial,sans-serif" font-size="20" font-weight="700">CONSUMER IDENTITY</text><text x="1100" y="660" fill="#282625" font-family="Arial,sans-serif" font-size="29" font-weight="700">Vestel brand</text><text x="1100" y="700" fill="#736f6c" font-family="Arial,sans-serif" font-size="20">Not a universal legal entity</text><text x="1490" y="850" fill="#938e8a" text-anchor="end" font-family="Arial,sans-serif" font-size="18">World Clean Biz · reviewed 7 August 2026</text></svg>
