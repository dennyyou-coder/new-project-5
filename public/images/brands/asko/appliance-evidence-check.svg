<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ASKO appliance evidence check</title><desc id="desc">A workflow linking ASKO product categories to the exact model, responsible entity, production evidence and service plan.</desc><rect width="1600" height="900" fill="#f7f4ef"/><text x="110" y="115" fill="#243034" font-family="Arial,sans-serif" font-size="54" font-weight="700">From premium portfolio to verified order</text><text x="110" y="170" fill="#697579" font-family="Arial,sans-serif" font-size="25">Laundry · dishwashing · cooking · cooling · wine care</text><g font-family="Arial,sans-serif"><rect x="110" y="270" width="315" height="270" rx="28" fill="#1f5962"/><text x="155" y="340" fill="#bfe4e9" font-size="21" font-weight="700">01 · REFERENCE</text><text x="155" y="405" fill="#fff" font-size="34" font-weight="700">Exact model</text><text x="155" y="455" fill="#e0f0f2" font-size="22">Suffix · voltage</text><text x="155" y="490" fill="#e0f0f2" font-size="22">dimensions · duty</text><rect x="465" y="270" width="315" height="270" rx="28" fill="#fff" stroke="#477b83" stroke-width="5"/><text x="510" y="340" fill="#2f6872" font-size="21" font-weight="700">02 · ENTITY</text><text x="510" y="405" fill="#243034" font-size="34" font-weight="700">Responsible roles</text><text x="510" y="455" fill="#697579" font-size="22">Maker · importer</text><text x="510" y="490" fill="#697579" font-size="22">seller · warrantor</text><rect x="820" y="270" width="315" height="270" rx="28" fill="#fff" stroke="#7d989d" stroke-width="5"/><text x="865" y="340" fill="#58767b" font-size="21" font-weight="700">03 · PRODUCTION</text><text x="865" y="405" fill="#243034" font-size="34" font-weight="700">Factory evidence</text><text x="865" y="455" fill="#697579" font-size="22">Plant · origin</text><text x="865" y="490" fill="#697579" font-size="22">declaration · QC</text><rect x="1175" y="270" width="315" height="270" rx="28" fill="#243034"/><text x="1220" y="340" fill="#bfe4e9" font-size="21" font-weight="700">04 · SUPPORT</text><text x="1220" y="405" fill="#fff" font-size="34" font-weight="700">Service plan</text><text x="1220" y="455" fill="#e0f0f2" font-size="22">Parts · warranty</text><text x="1220" y="490" fill="#e0f0f2" font-size="22">local response</text></g><rect x="110" y="625" width="1380" height="95" rx="24" fill="#e3ecec"/><text x="800" y="684" fill="#243034" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700">Accept the order only when all four records describe the same destination-market model.</text><text x="1490" y="850" fill="#879193" text-anchor="end" font-family="Arial,sans-serif" font-size="18">World Clean Biz · reviewed 7 August 2026</text></svg>
