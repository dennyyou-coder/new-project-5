<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Groupe SEB industrial and channel verification</title>
  <desc id="desc">Five evidence checks from portfolio brand through production, channel and after-sales.</desc>
  <rect width="1600" height="900" fill="#f7f5f4"/>
  <text x="110" y="112" fill="#172033" font-family="Arial, sans-serif" font-size="54" font-weight="700">Trace the SKU through the group network</text>
  <text x="110" y="164" fill="#5f6878" font-family="Arial, sans-serif" font-size="25">Group-scale production and sourcing evidence cannot assign every model to a plant.</text>
  <g font-family="Arial, sans-serif">
    <rect x="110" y="270" width="250" height="360" rx="28" fill="#c92d38"/><text x="150" y="332" fill="#ffe4e6" font-size="23" font-weight="700">01</text><text x="150" y="385" fill="#fff" font-size="28" font-weight="700">Brand</text><text x="150" y="438" fill="#fff0f1" font-size="20">Trademark</text><text x="150" y="470" fill="#fff0f1" font-size="20">Category</text><text x="150" y="502" fill="#fff0f1" font-size="20">Market owner</text>
    <rect x="392" y="270" width="250" height="360" rx="28" fill="#ffffff" stroke="#c92d38" stroke-width="4"/><text x="432" y="332" fill="#c92d38" font-size="23" font-weight="700">02</text><text x="432" y="385" fill="#172033" font-size="28" font-weight="700">Model</text><text x="432" y="438" fill="#5f6878" font-size="20">Exact code</text><text x="432" y="470" fill="#5f6878" font-size="20">Specification</text><text x="432" y="502" fill="#5f6878" font-size="20">Compliance</text>
    <rect x="674" y="270" width="250" height="360" rx="28" fill="#ffffff" stroke="#c92d38" stroke-width="4"/><text x="714" y="332" fill="#c92d38" font-size="23" font-weight="700">03</text><text x="714" y="385" fill="#172033" font-size="28" font-weight="700">Production</text><text x="714" y="438" fill="#5f6878" font-size="20">Legal maker</text><text x="714" y="470" fill="#5f6878" font-size="20">Plant or source</text><text x="714" y="502" fill="#5f6878" font-size="20">Origin</text>
    <rect x="956" y="270" width="250" height="360" rx="28" fill="#ffffff" stroke="#b58b8f" stroke-width="4"/><text x="996" y="332" fill="#8c5d62" font-size="23" font-weight="700">04</text><text x="996" y="385" fill="#172033" font-size="28" font-weight="700">Channel</text><text x="996" y="438" fill="#5f6878" font-size="20">Subsidiary</text><text x="996" y="470" fill="#5f6878" font-size="20">Distributor</text><text x="996" y="502" fill="#5f6878" font-size="20">Invoice seller</text>
    <rect x="1238" y="270" width="250" height="360" rx="28" fill="#ffffff" stroke="#b58b8f" stroke-width="4"/><text x="1278" y="332" fill="#8c5d62" font-size="23" font-weight="700">05</text><text x="1278" y="385" fill="#172033" font-size="28" font-weight="700">After-sales</text><text x="1278" y="438" fill="#5f6878" font-size="20">Warrantor</text><text x="1278" y="470" fill="#5f6878" font-size="20">Repair route</text><text x="1278" y="502" fill="#5f6878" font-size="20">Parts supply</text>
