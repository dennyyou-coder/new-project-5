  <rect x="110" y="704" width="1378" height="86" rx="22" fill="#172033"/>
  <text x="799" y="758" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700">Confirm every role for the named brand, model, destination and contract date.</text>
  <text x="1490" y="858" fill="#748293" text-anchor="end" font-family="Arial, sans-serif" font-size="18">World Clean Biz · reviewed 6 August 2026</text>
