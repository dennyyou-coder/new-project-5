<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PowerBoss ownership and legal-name evidence boundary</title>
  <desc id="desc">PowerBoss is under Minuteman International and Hako Group. Current manuals use PowerBoss Inc while a Hako sustainability report uses Minuteman PowerBoss Corp, so buyers must verify the contracting entity.</desc>
  <rect width="1200" height="720" rx="38" fill="#f7f7f6"/>
  <text x="70" y="80" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#20242b">PowerBoss: ownership is clear; the document name still matters</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="110" y="135" width="300" height="110" rx="22" fill="#172033"/><text x="260" y="199" font-size="28" font-weight="700" fill="#fff">Hako Group</text>
    <path d="M410 190H490" stroke="#8d949e" stroke-width="6"/>
    <rect x="490" y="135" width="430" height="110" rx="22" fill="#930039"/><text x="705" y="183" font-size="27" font-weight="700" fill="#fff">Minuteman International</text><text x="705" y="217" font-size="20" fill="#ffe8f0">immediate parent</text>
    <path d="M705 245V315" stroke="#8d949e" stroke-width="6"/>
    <rect x="410" y="315" width="590" height="120" rx="22" fill="#ef431e"/><text x="705" y="370" font-size="34" font-weight="700" fill="#fff">PowerBoss</text><text x="705" y="407" font-size="21" fill="#fff">industrial cleaning business</text>
    <rect x="85" y="505" width="470" height="115" rx="22" fill="#fff" stroke="#ef431e" stroke-width="4"/><text x="320" y="552" font-size="25" font-weight="700" fill="#20242b">Current group page and manual</text><text x="320" y="590" font-size="27" fill="#d83a1c">PowerBoss Inc.</text>
    <rect x="645" y="505" width="470" height="115" rx="22" fill="#fff" stroke="#7d8797" stroke-width="4"/><text x="880" y="552" font-size="25" font-weight="700" fill="#20242b">2024 group sustainability report</text><text x="880" y="590" font-size="27" fill="#596477">Minuteman PowerBoss Corp.</text>
  </g>
  <text x="600" y="672" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20242b">Use the quote, W-9, invoice and warranty to confirm the exact contracting entity.</text>
</svg>
