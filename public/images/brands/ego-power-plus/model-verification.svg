<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">EGO model verification workflow</title><desc id="d">A four-step buyer check for EGO products.</desc><rect width="1200" height="720" rx="36" fill="#f3f7f1"/><text x="70" y="92" font-family="Arial" font-size="38" font-weight="700" fill="#162018">Verify the SKU, not only the platform</text><g font-family="Arial"><rect x="70" y="168" width="240" height="350" rx="26" fill="#fff" stroke="#bed0bd"/><text x="102" y="225" font-size="24" font-weight="700">1  Model</text><text x="102" y="278" font-size="19" fill="#455248">Nameplate and kit</text><rect x="345" y="168" width="240" height="350" rx="26" fill="#fff" stroke="#bed0bd"/><text x="377" y="225" font-size="24" font-weight="700">2  Battery</text><text x="377" y="278" font-size="19" fill="#455248">Voltage and included pack</text><rect x="620" y="168" width="240" height="350" rx="26" fill="#fff" stroke="#bed0bd"/><text x="652" y="225" font-size="24" font-weight="700">3  Supply</text><text x="652" y="278" font-size="19" fill="#455248">Factory, origin, importer</text><rect x="895" y="168" width="235" height="350" rx="26" fill="#172019"/><text x="927" y="225" font-size="24" font-weight="700" fill="#8bd600">4  Support</text><text x="927" y="278" font-size="19" fill="#fff">Dealer and warrantor</text></g><path d="M310 343h35M585 343h35M860 343h35" stroke="#8bd600" stroke-width="8"/><text x="70" y="612" font-family="Arial" font-size="22" fill="#455248">A shared 56V system does not prove one factory, origin or warranty term for every product.</text></svg>
