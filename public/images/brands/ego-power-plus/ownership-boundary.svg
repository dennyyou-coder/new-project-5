<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">EGO Power+ ownership and operating boundary</title><desc id="d">EGO is a Chervon brand, while regional sales, factories and warranty entities have separate responsibilities.</desc>
  <rect width="1200" height="720" rx="36" fill="#101611"/><text x="72" y="92" fill="#fff" font-family="Arial" font-size="38" font-weight="700">Brand is not the whole operating chain</text>
  <g font-family="Arial"><rect x="72" y="150" width="310" height="150" rx="24" fill="#8BD600"/><text x="102" y="208" font-size="28" font-weight="700" fill="#101611">EGO Power+</text><text x="102" y="248" font-size="20" fill="#213016">Consumer brand</text></g>
  <path d="M382 225H455" stroke="#8BD600" stroke-width="8"/><rect x="455" y="150" width="310" height="150" rx="24" fill="#253126"/><text x="487" y="208" font-family="Arial" font-size="28" font-weight="700" fill="#fff">Chervon group</text><text x="487" y="248" font-family="Arial" font-size="20" fill="#c9d5ca">Brand and group context</text>
  <path d="M765 225H838" stroke="#8BD600" stroke-width="8"/><rect x="838" y="150" width="290" height="150" rx="24" fill="#253126"/><text x="870" y="205" font-family="Arial" font-size="25" font-weight="700" fill="#fff">Regional operator</text><text x="870" y="246" font-family="Arial" font-size="19" fill="#c9d5ca">Market-specific sales</text>
  <rect x="72" y="380" width="1056" height="230" rx="28" fill="#182019" stroke="#3e5140"/><text x="108" y="440" font-family="Arial" font-size="26" font-weight="700" fill="#fff">Buyer evidence must still identify</text>
  <g font-family="Arial" font-size="21" fill="#dbe5dc"><text x="108" y="500">• Exact model and battery platform</text><text x="108" y="548">• Legal manufacturer and factory</text><text x="620" y="500">• Importer and invoice issuer</text><text x="620" y="548">• Destination-market warranty provider</text></g>
</svg>
