<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SUPOR portfolio and supply verification</title>
  <desc id="desc">SUPOR product categories and the buyer evidence chain for a specific product.</desc>
  <rect width="1600" height="900" fill="#fff8f1"/>
  <text x="110" y="112" fill="#202127" font-family="Arial, sans-serif" font-size="54" font-weight="700">Portfolio breadth does not prove one supply chain</text>
  <text x="110" y="164" fill="#666873" font-family="Arial, sans-serif" font-size="25">Start with the category, then verify the exact model and destination-market responsibilities.</text>
  <g font-family="Arial, sans-serif">
    <rect x="110" y="255" width="315" height="220" rx="28" fill="#ed6a1c"/><text x="150" y="315" fill="#ffe4d2" font-size="21" font-weight="700">COOKWARE</text><text x="150" y="365" fill="#fff" font-size="27" font-weight="700">Woks · pots</text><text x="150" y="405" fill="#fff" font-size="27" font-weight="700">Pressure cookers</text>
    <rect x="465" y="255" width="315" height="220" rx="28" fill="#fff" stroke="#ed6a1c" stroke-width="4"/><text x="505" y="315" fill="#c75110" font-size="21" font-weight="700">SMALL APPLIANCES</text><text x="505" y="365" fill="#202127" font-size="27" font-weight="700">Rice cookers</text><text x="505" y="405" fill="#202127" font-size="27" font-weight="700">Kettles · fryers</text>
    <rect x="820" y="255" width="315" height="220" rx="28" fill="#fff" stroke="#d09a73" stroke-width="4"/><text x="860" y="315" fill="#a86232" font-size="21" font-weight="700">HOME ENVIRONMENT</text><text x="860" y="365" fill="#202127" font-size="27" font-weight="700">Vacuum cleaners</text><text x="860" y="405" fill="#202127" font-size="27" font-weight="700">Air and garment care</text>
    <rect x="1175" y="255" width="315" height="220" rx="28" fill="#fff" stroke="#d09a73" stroke-width="4"/><text x="1215" y="315" fill="#a86232" font-size="21" font-weight="700">LARGE KITCHEN</text><text x="1215" y="365" fill="#202127" font-size="27" font-weight="700">Installation-led</text><text x="1215" y="405" fill="#202127" font-size="27" font-weight="700">appliances</text>
  </g>
  <path d="M800 500V565" stroke="#e6a477" stroke-width="6"/><polygon points="786,553 800,578 814,553" fill="#e6a477"/>
  <rect x="110" y="585" width="1380" height="165" rx="28" fill="#202127"/>
  <text x="160" y="640" fill="#ffb888" font-family="Arial, sans-serif" font-size="21" font-weight="700">MODEL-LEVEL BUYER CHECK</text>
  <text x="160" y="690" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Legal maker → factory/origin → exporter → importer/seller → compliance → warranty</text>
  <text x="1490" y="858" fill="#86766c" text-anchor="end" font-family="Arial, sans-serif" font-size="18">World Clean Biz · reviewed 7 August 2026</text>
</svg>
