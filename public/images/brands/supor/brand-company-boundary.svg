<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SUPOR brand and company boundary</title>
  <desc id="desc">SUPOR brand, listed operating company, direct parent and ultimate parent layers.</desc>
  <rect width="1600" height="900" fill="#fff8f1"/>
  <text x="110" y="112" fill="#202127" font-family="Arial, sans-serif" font-size="54" font-weight="700">Four identity layers, different roles</text>
  <text x="110" y="164" fill="#666873" font-family="Arial, sans-serif" font-size="25">Ownership evidence must stay separate from the contracting and manufacturing evidence.</text>
  <rect x="110" y="238" width="1380" height="105" rx="26" fill="#ed6a1c"/>
  <text x="165" y="282" fill="#ffe4d2" font-family="Arial, sans-serif" font-size="21" font-weight="700">CONSUMER BRAND</text>
  <text x="165" y="320" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">SUPOR · cookware · kitchen appliances · home-environment products</text>
  <rect x="110" y="380" width="1380" height="105" rx="26" fill="#ffffff" stroke="#ed6a1c" stroke-width="5"/>
  <text x="165" y="424" fill="#c75110" font-family="Arial, sans-serif" font-size="21" font-weight="700">LISTED OPERATING COMPANY</text>
  <text x="165" y="462" fill="#202127" font-family="Arial, sans-serif" font-size="30" font-weight="700">Zhejiang Supor Co., Ltd. and consolidated subsidiaries</text>
  <rect x="110" y="522" width="660" height="135" rx="26" fill="#202127"/>
  <text x="155" y="572" fill="#ffb888" font-family="Arial, sans-serif" font-size="21" font-weight="700">DIRECT PARENT</text>
  <text x="155" y="616" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">SEB INTERNATIONALE S.A.S.</text>
  <rect x="830" y="522" width="660" height="135" rx="26" fill="#ffffff" stroke="#d09a73" stroke-width="4"/>
  <text x="875" y="572" fill="#a86232" font-family="Arial, sans-serif" font-size="21" font-weight="700">ULTIMATE PARENT</text>
  <text x="875" y="616" fill="#202127" font-family="Arial, sans-serif" font-size="28" font-weight="700">SEB S.A. · Groupe SEB</text>
  <rect x="110" y="705" width="1380" height="70" rx="20" fill="#f3d9c6"/>
  <text x="800" y="750" fill="#6f3a18" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">A product contract still needs its own maker, factory, exporter, importer and warrantor.</text>
  <text x="1490" y="858" fill="#86766c" text-anchor="end" font-family="Arial, sans-serif" font-size="18">World Clean Biz · reviewed 7 August 2026</text>
</svg>
