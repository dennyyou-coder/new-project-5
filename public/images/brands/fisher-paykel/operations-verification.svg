<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Fisher and Paykel manufacturing and market responsibility map</title>
  <desc id="desc">The disclosed international manufacturing network is separated from model-level factory, seller, importer, compliance and warranty checks.</desc>
  <defs><linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151b1d"/><stop offset="1" stop-color="#315249"/></linearGradient><filter id="ms"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".22"/></filter><marker id="ma" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d7a766"/></marker></defs>
  <rect width="1600" height="900" fill="url(#mbg)"/>
  <text x="95" y="90" fill="#fffaf2" font-family="Arial, sans-serif" font-size="49" font-weight="700">Manufacturing network first; exact model evidence second</text>
  <text x="95" y="140" fill="#c0d1cb" font-family="Arial, sans-serif" font-size="24">Current group material names four countries, not one universal factory.</text>

  <rect x="95" y="205" width="1410" height="210" rx="28" fill="#f5f0e7" filter="url(#ms)"/>
  <text x="140" y="260" fill="#18342f" font-family="Arial, sans-serif" font-size="29" font-weight="700">Disclosed manufacturing network</text>
  <g font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">
    <rect x="140" y="300" width="290" height="74" rx="18" fill="#dce8e2"/><text x="285" y="347" fill="#24483f">Thailand</text>
    <rect x="480" y="300" width="290" height="74" rx="18" fill="#dce8e2"/><text x="625" y="347" fill="#24483f">China</text>
    <rect x="820" y="300" width="290" height="74" rx="18" fill="#dce8e2"/><text x="965" y="347" fill="#24483f">Italy</text>
    <rect x="1160" y="300" width="300" height="74" rx="18" fill="#dce8e2"/><text x="1310" y="347" fill="#24483f">Mexico</text>
  </g>

  <path d="M800 430V485" stroke="#d7a766" stroke-width="7" marker-end="url(#ma)"/>
  <rect x="95" y="505" width="1410" height="245" rx="28" fill="#102f2b" stroke="#52766d" stroke-width="2" filter="url(#ms)"/>
  <text x="140" y="560" fill="#fff" font-family="Arial, sans-serif" font-size="29" font-weight="700">Before assigning responsibility to a shipment</text>
  <g font-family="Arial, sans-serif">
    <text x="150" y="625" fill="#f2d39f" font-size="22" font-weight="700">MODEL</text><text x="150" y="660" fill="#deece8" font-size="21">SKU and serial range</text>
    <text x="405" y="625" fill="#f2d39f" font-size="22" font-weight="700">FACTORY</text><text x="405" y="660" fill="#deece8" font-size="21">Group site or supplier</text>
    <text x="675" y="625" fill="#f2d39f" font-size="22" font-weight="700">ORIGIN</text><text x="675" y="660" fill="#deece8" font-size="21">Unit and carton marking</text>
    <text x="925" y="625" fill="#f2d39f" font-size="22" font-weight="700">MARKET ENTITY</text><text x="925" y="660" fill="#deece8" font-size="21">Seller and importer</text>
    <text x="1235" y="625" fill="#f2d39f" font-size="22" font-weight="700">AFTER-SALES</text><text x="1235" y="660" fill="#deece8" font-size="21">Warranty and parts</text>
  </g>
  <path d="M300 642H380M565 642H650M820 642H900M1110 642H1210" stroke="#d7a766" stroke-width="4" marker-end="url(#ma)"/>

  <rect x="95" y="800" width="1410" height="58" rx="18" fill="#d7a766"/>
  <text x="800" y="838" text-anchor="middle" fill="#19312d" font-family="Arial, sans-serif" font-size="23" font-weight="700">New Zealand heritage and Haier ownership are context—not model-level origin evidence.</text>
</svg>
