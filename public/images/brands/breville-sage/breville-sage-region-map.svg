<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Breville and Sage regional brand boundary</title><desc id="desc">BRG uses Breville in most markets and Sage for its premium products in the United Kingdom and Europe.</desc><rect width="1600" height="900" fill="#faf6f8"/><text x="110" y="115" fill="#2a1721" font-family="Arial,sans-serif" font-size="54" font-weight="700">One group, two regional consumer marks</text><text x="110" y="168" fill="#725f69" font-family="Arial,sans-serif" font-size="25">The name on the product depends on market; the contracting company can differ again.</text><rect x="110" y="270" width="1380" height="120" rx="28" fill="#532238"/><text x="165" y="320" fill="#e8cad7" font-family="Arial,sans-serif" font-size="22" font-weight="700">LISTED GROUP</text><text x="165" y="360" fill="#fff" font-family="Arial,sans-serif" font-size="31" font-weight="700">Breville Group Limited / BRG Group</text><rect x="110" y="460" width="650" height="220" rx="28" fill="#fff" stroke="#532238" stroke-width="5"/><text x="160" y="525" fill="#7b2f50" font-family="Arial,sans-serif" font-size="22" font-weight="700">MOST REVIEWED MARKETS</text><text x="160" y="585" fill="#2a1721" font-family="Arial,sans-serif" font-size="38" font-weight="700">Breville</text><text x="160" y="630" fill="#725f69" font-family="Arial,sans-serif" font-size="23">Confirm the local seller and warrantor.</text><rect x="840" y="460" width="650" height="220" rx="28" fill="#fff" stroke="#aa718a" stroke-width="5"/><text x="890" y="525" fill="#8c506a" font-family="Arial,sans-serif" font-size="22" font-weight="700">UNITED KINGDOM AND EUROPE</text><text x="890" y="585" fill="#2a1721" font-family="Arial,sans-serif" font-size="38" font-weight="700">Sage</text><text x="890" y="630" fill="#725f69" font-family="Arial,sans-serif" font-size="23">BRG says it does not own Breville® there.</text><text x="110" y="770" fill="#725f69" font-family="Arial,sans-serif" font-size="24">Regional brand rights do not by themselves identify the legal manufacturer, importer or warranty provider.</text><text x="1490" y="858" fill="#8f7d86" text-anchor="end" font-family="Arial,sans-serif" font-size="18">World Clean Biz · reviewed 7 August 2026</text></svg>
