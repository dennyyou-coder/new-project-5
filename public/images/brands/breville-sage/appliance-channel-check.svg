<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Breville Sage appliance channel check</title><desc id="desc">Four-step procurement check for brand, model, channel and after-sales.</desc><rect width="1600" height="900" fill="#f7f7f5"/><text x="110" y="115" fill="#201b1e" font-family="Arial,sans-serif" font-size="54" font-weight="700">Build a market-specific evidence chain</text><text x="110" y="168" fill="#666064" font-family="Arial,sans-serif" font-size="25">The same premium platform can carry different marks and service entities.</text><g font-family="Arial,sans-serif"><rect x="110" y="285" width="315" height="350" rx="28" fill="#532238"/><text x="155" y="355" fill="#e8cad7" font-size="23" font-weight="700">01 · MARKET</text><text x="155" y="420" fill="#fff" font-size="31" font-weight="700">Breville or Sage?</text><text x="155" y="470" fill="#e5d9de" font-size="22">Destination rights</text><rect x="465" y="285" width="315" height="350" rx="28" fill="#fff" stroke="#532238" stroke-width="4"/><text x="510" y="355" fill="#7b2f50" font-size="23" font-weight="700">02 · MODEL</text><text x="510" y="420" fill="#201b1e" font-size="31" font-weight="700">Exact reference</text><text x="510" y="470" fill="#666064" font-size="22">Voltage · certification</text><rect x="820" y="285" width="315" height="350" rx="28" fill="#fff" stroke="#aa718a" stroke-width="4"/><text x="865" y="355" fill="#8c506a" font-size="23" font-weight="700">03 · CHANNEL</text><text x="865" y="420" fill="#201b1e" font-size="31" font-weight="700">Seller and invoice</text><text x="865" y="470" fill="#666064" font-size="22">Authorization · importer</text><rect x="1175" y="285" width="315" height="350" rx="28" fill="#201b1e"/><text x="1220" y="355" fill="#dcb2c5" font-size="23" font-weight="700">04 · SUPPORT</text><text x="1220" y="420" fill="#fff" font-size="31" font-weight="700">Local warranty</text><text x="1220" y="470" fill="#d7d2d5" font-size="22">Parts · repair · use limits</text></g><text x="1490" y="858" fill="#898286" text-anchor="end" font-family="Arial,sans-serif" font-size="18">World Clean Biz · procurement check</text></svg>
