<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Hamilton Beach sourcing and channel check</title><desc id="desc">A workflow for model, factory, channel and warranty verification for Hamilton Beach products.</desc><rect width="1600" height="900" fill="#f8f6f2"/><text x="110" y="115" fill="#242a2d" font-family="Arial,sans-serif" font-size="54" font-weight="700">A broad catalogue needs a narrow evidence trail</text><text x="110" y="170" fill="#6c7478" font-family="Arial,sans-serif" font-size="25">Household, commercial and licensed lines can follow different routes.</text><g font-family="Arial,sans-serif"><rect x="110" y="270" width="315" height="275" rx="28" fill="#294b5c"/><text x="155" y="340" fill="#c4dfeb" font-size="21" font-weight="700">01 · MODEL</text><text x="155" y="405" fill="#fff" font-size="34" font-weight="700">Product identity</text><text x="155" y="455" fill="#e4f0f5" font-size="22">Consumer or</text><text x="155" y="490" fill="#e4f0f5" font-size="22">commercial line?</text><rect x="465" y="270" width="315" height="275" rx="28" fill="#fff" stroke="#476f82" stroke-width="5"/><text x="510" y="340" fill="#376176" font-size="21" font-weight="700">02 · SOURCE</text><text x="510" y="405" fill="#242a2d" font-size="34" font-weight="700">Factory file</text><text x="510" y="455" fill="#6c7478" font-size="22">Maker · plant</text><text x="510" y="490" fill="#6c7478" font-size="22">origin · QC</text><rect x="820" y="270" width="315" height="275" rx="28" fill="#fff" stroke="#879da7" stroke-width="5"/><text x="865" y="340" fill="#5d7986" font-size="21" font-weight="700">03 · CHANNEL</text><text x="865" y="405" fill="#242a2d" font-size="34" font-weight="700">Transaction chain</text><text x="865" y="455" fill="#6c7478" font-size="22">Seller · importer</text><text x="865" y="490" fill="#6c7478" font-size="22">authorized dealer</text><rect x="1175" y="270" width="315" height="275" rx="28" fill="#242a2d"/><text x="1220" y="340" fill="#c4dfeb" font-size="21" font-weight="700">04 · WARRANTY</text><text x="1220" y="405" fill="#fff" font-size="34" font-weight="700">Local coverage</text><text x="1220" y="455" fill="#e4eaed" font-size="22">Country · use</text><text x="1220" y="490" fill="#e4eaed" font-size="22">parts · service</text></g><rect x="110" y="630" width="1380" height="95" rx="24" fill="#e4e8e9"/><text x="800" y="690" fill="#242a2d" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700">Do not extend consolidated sourcing statements to an individual SKU without documents.</text><text x="1490" y="850" fill="#899194" text-anchor="end" font-family="Arial,sans-serif" font-size="18">World Clean Biz · reviewed 7 August 2026</text></svg>
