<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">Numatic company and channel boundary</title><desc id="d">Numatic International Limited connects to regional subsidiaries and distributors, while the buyer verifies the contracting and warranty entity.</desc>
  <rect width="1200" height="720" rx="36" fill="#f5f7f9"/><text x="72" y="88" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17212b">Company and channel boundary</text>
  <rect x="72" y="160" width="330" height="180" rx="24" fill="#222"/><text x="237" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">Numatic International</text><text x="237" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#ddd">UK operating company</text>
  <path d="M402 250h120" stroke="#c71f2d" stroke-width="8"/><path d="m510 235 22 15-22 15" fill="none" stroke="#c71f2d" stroke-width="8"/>
  <rect x="532" y="160" width="280" height="180" rx="24" fill="#fff" stroke="#cbd3da" stroke-width="3"/><text x="672" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17212b">Regional route</text><text x="672" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#51606d">Subsidiary or distributor</text>
  <path d="M812 250h100" stroke="#c71f2d" stroke-width="8"/><path d="m900 235 22 15-22 15" fill="none" stroke="#c71f2d" stroke-width="8"/>
  <rect x="922" y="160" width="206" height="180" rx="24" fill="#fff" stroke="#cbd3da" stroke-width="3"/><text x="1025" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17212b">Buyer</text><text x="1025" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#51606d">Verify the contract</text>
  <rect x="72" y="410" width="1056" height="220" rx="28" fill="#fff" stroke="#dce2e7" stroke-width="3"/><text x="110" y="475" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17212b">Keep four roles separate</text><text x="110" y="525" font-family="Arial,sans-serif" font-size="21" fill="#51606d">Brand and manufacturer</text><text x="390" y="525" font-family="Arial,sans-serif" font-size="21" fill="#51606d">Seller and importer</text><text x="650" y="525" font-family="Arial,sans-serif" font-size="21" fill="#51606d">Service organization</text><text x="910" y="525" font-family="Arial,sans-serif" font-size="21" fill="#51606d">Warranty provider</text>
</svg>
