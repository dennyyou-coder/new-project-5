<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Numatic buyer verification workflow</title><desc id="d">A four-step workflow covering model, origin, seller and service.</desc><rect width="1200" height="720" rx="36" fill="#171c21"/><text x="72" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">From UK manufacturing evidence to order-level proof</text>
  <g font-family="Arial,sans-serif"><g transform="translate(72 175)"><rect width="240" height="330" rx="26" fill="#fff"/><circle cx="50" cy="55" r="26" fill="#c71f2d"/><text x="50" y="64" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><text x="28" y="125" font-size="25" font-weight="700" fill="#17212b">Model</text><text x="28" y="170" font-size="18" fill="#55616c">SKU, battery, filters</text><text x="28" y="202" font-size="18" fill="#55616c">and accessories</text></g><g transform="translate(344 175)"><rect width="240" height="330" rx="26" fill="#fff"/><circle cx="50" cy="55" r="26" fill="#c71f2d"/><text x="50" y="64" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text><text x="28" y="125" font-size="25" font-weight="700" fill="#17212b">Origin</text><text x="28" y="170" font-size="18" fill="#55616c">Factory, serial range</text><text x="28" y="202" font-size="18" fill="#55616c">and compliance files</text></g><g transform="translate(616 175)"><rect width="240" height="330" rx="26" fill="#fff"/><circle cx="50" cy="55" r="26" fill="#c71f2d"/><text x="50" y="64" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text><text x="28" y="125" font-size="25" font-weight="700" fill="#17212b">Seller</text><text x="28" y="170" font-size="18" fill="#55616c">Authorization, invoice</text><text x="28" y="202" font-size="18" fill="#55616c">and import role</text></g><g transform="translate(888 175)"><rect width="240" height="330" rx="26" fill="#fff"/><circle cx="50" cy="55" r="26" fill="#c71f2d"/><text x="50" y="64" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">4</text><text x="28" y="125" font-size="25" font-weight="700" fill="#17212b">Service</text><text x="28" y="170" font-size="18" fill="#55616c">Parts, response time</text><text x="28" y="202" font-size="18" fill="#55616c">and warranty owner</text></g><text x="72" y="600" font-size="22" fill="#ccd3d9">Company-level evidence starts the review; the purchase order finishes it.</text></g></svg>
