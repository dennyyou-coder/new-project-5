<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">KitchenAid model verification workflow</title>
  <desc id="desc">A workflow for checking KitchenAid model category, seller, manufacturer, origin and warranty.</desc>
  <rect width="1600" height="900" fill="#f5f0e8"/>
  <text x="105" y="112" fill="#281d1e" font-family="Arial, sans-serif" font-size="56" font-weight="700">KitchenAid sourcing: trace the exact model</text>
  <text x="105" y="170" fill="#6b5d5d" font-family="Arial, sans-serif" font-size="28">Five records turn a famous brand into a verifiable procurement file</text>
  <g font-family="Arial, sans-serif">
    <rect x="105" y="240" width="260" height="360" rx="26" fill="#ffffff" stroke="#cb3138" stroke-width="3"/><text x="145" y="300" fill="#cb3138" font-size="24" font-weight="700">01 · CATEGORY</text><text x="145" y="365" fill="#281d1e" font-size="31" font-weight="700">What is it?</text><text x="145" y="425" fill="#6b5d5d" font-size="23">Countertop, major</text><text x="145" y="460" fill="#6b5d5d" font-size="23">appliance or licensed</text><text x="145" y="495" fill="#6b5d5d" font-size="23">adjacent category?</text>
    <rect x="388" y="240" width="260" height="360" rx="26" fill="#ffffff" stroke="#cb3138" stroke-width="3"/><text x="428" y="300" fill="#cb3138" font-size="24" font-weight="700">02 · SELLER</text><text x="428" y="365" fill="#281d1e" font-size="31" font-weight="700">Who invoices?</text><text x="428" y="425" fill="#6b5d5d" font-size="23">Match the legal seller</text><text x="428" y="460" fill="#6b5d5d" font-size="23">to the market and</text><text x="428" y="495" fill="#6b5d5d" font-size="23">authorised channel.</text>
    <rect x="671" y="240" width="260" height="360" rx="26" fill="#ffffff" stroke="#cb3138" stroke-width="3"/><text x="711" y="300" fill="#cb3138" font-size="24" font-weight="700">03 · MAKER</text><text x="711" y="365" fill="#281d1e" font-size="31" font-weight="700">Who declares?</text><text x="711" y="425" fill="#6b5d5d" font-size="23">Use rating labels and</text><text x="711" y="460" fill="#6b5d5d" font-size="23">compliance documents,</text><text x="711" y="495" fill="#6b5d5d" font-size="23">not group inference.</text>
    <rect x="954" y="240" width="260" height="360" rx="26" fill="#ffffff" stroke="#cb3138" stroke-width="3"/><text x="994" y="300" fill="#cb3138" font-size="24" font-weight="700">04 · ORIGIN</text><text x="994" y="365" fill="#281d1e" font-size="31" font-weight="700">Where made?</text><text x="994" y="425" fill="#6b5d5d" font-size="23">Check exact unit, lot</text><text x="994" y="460" fill="#6b5d5d" font-size="23">and production period.</text><text x="994" y="495" fill="#6b5d5d" font-size="23">Do not generalise.</text>
    <rect x="1237" y="240" width="260" height="360" rx="26" fill="#ffffff" stroke="#cb3138" stroke-width="3"/><text x="1277" y="300" fill="#cb3138" font-size="24" font-weight="700">05 · SUPPORT</text><text x="1277" y="365" fill="#281d1e" font-size="31" font-weight="700">Who warrants?</text><text x="1277" y="425" fill="#6b5d5d" font-size="23">Record the warranty</text><text x="1277" y="460" fill="#6b5d5d" font-size="23">issuer, service route</text><text x="1277" y="495" fill="#6b5d5d" font-size="23">and exclusions.</text>
  </g>
  <rect x="105" y="665" width="1392" height="125" rx="24" fill="#281d1e"/>
  <text x="150" y="718" fill="#ffffff" font-family="Arial, sans-serif" font-size="29" font-weight="700">Evidence packet:</text>
  <text x="150" y="758" fill="#dfd4d0" font-family="Arial, sans-serif" font-size="25">rating plate · declaration · invoice · importer record · warranty terms</text>
  <text x="105" y="855" fill="#746b68" font-family="Arial, sans-serif" font-size="22">World Clean Biz buyer verification map · reviewed 6 August 2026</text>
</svg>
