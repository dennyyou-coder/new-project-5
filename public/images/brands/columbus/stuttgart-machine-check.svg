<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Columbus Stuttgart machine verification checklist</title><desc id="desc">Four checks for Columbus machine origin configuration productivity and service.</desc><rect width="1200" height="675" rx="36" fill="#151d5a"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="white">FROM MADE IN GERMANY TO SITE PROOF</text><text x="70" y="125" font-family="Arial,sans-serif" font-size="22" fill="#cbd0ec">Verify the exact Columbus machine and contract</text><g font-family="Arial,sans-serif"><rect x="70" y="180" width="505" height="160" rx="24" fill="#242d73"/><circle cx="120" cy="230" r="25" fill="#ed1c24"/><text x="112" y="239" font-size="24" font-weight="700" fill="white">1</text><text x="165" y="230" font-size="25" font-weight="700" fill="white">SERIAL + ORIGIN</text><text x="165" y="271" font-size="19" fill="#cbd0ec">Model plate, production site</text><text x="165" y="302" font-size="19" fill="#cbd0ec">and country-of-origin record</text><rect x="625" y="180" width="505" height="160" rx="24" fill="#242d73"/><circle cx="675" cy="230" r="25" fill="#ed1c24"/><text x="667" y="239" font-size="24" font-weight="700" fill="white">2</text><text x="720" y="230" font-size="25" font-weight="700" fill="white">CONFIGURATION</text><text x="720" y="271" font-size="19" fill="#cbd0ec">Battery, brush, dosing,</text><text x="720" y="302" font-size="19" fill="#cbd0ec">charger and safety options</text><rect x="70" y="380" width="505" height="160" rx="24" fill="#242d73"/><circle cx="120" cy="430" r="25" fill="#ed1c24"/><text x="112" y="439" font-size="24" font-weight="700" fill="white">3</text><text x="165" y="430" font-size="25" font-weight="700" fill="white">REAL PRODUCTIVITY</text><text x="165" y="471" font-size="19" fill="#cbd0ec">Actual floor, traffic, refill</text><text x="165" y="502" font-size="19" fill="#cbd0ec">and operator conditions</text><rect x="625" y="380" width="505" height="160" rx="24" fill="#242d73"/><circle cx="675" cy="430" r="25" fill="#ed1c24"/><text x="667" y="439" font-size="24" font-weight="700" fill="white">4</text><text x="720" y="430" font-size="25" font-weight="700" fill="white">LOCAL SERVICE</text><text x="720" y="471" font-size="19" fill="#cbd0ec">Technicians, parts, uptime</text><text x="720" y="502" font-size="19" fill="#cbd0ec">and warranty response</text></g><text x="70" y="615" font-family="Arial,sans-serif" font-size="20" fill="#cbd0ec">Convert brand promises into measurable acceptance criteria.</text></svg>
