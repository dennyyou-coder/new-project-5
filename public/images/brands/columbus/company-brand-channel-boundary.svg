<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Columbus company brand and channel boundary</title><desc id="desc">G. Staehle GmbH u. Co. KG operates Columbus while market service roles require verification.</desc><rect width="1200" height="675" rx="36" fill="#fff5f5"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#151d5a">ONE COMPANY, SEVERAL BUYER ROLES</text><text x="70" y="125" font-family="Arial,sans-serif" font-size="22" fill="#60657b">Keep the Stuttgart operator separate from local obligations</text><g font-family="Arial,sans-serif"><rect x="70" y="178" width="1060" height="145" rx="24" fill="#ed1c24"/><text x="105" y="235" font-size="25" font-weight="700" fill="white">G. STAEHLE GMBH U. CO. KG</text><text x="105" y="278" font-size="21" fill="white">Named legal operator behind the Columbus cleaning-machine business</text><path d="M600 323v62" stroke="#8e7f82" stroke-width="5"/><path d="M585 370l15 20 15-20" fill="none" stroke="#8e7f82" stroke-width="5"/><rect x="70" y="410" width="240" height="155" rx="22" fill="white" stroke="#e6c9cd" stroke-width="2"/><text x="100" y="462" font-size="22" font-weight="700" fill="#151d5a">COLUMBUS</text><text x="100" y="503" font-size="18" fill="#60657b">Machine brand</text><text x="100" y="533" font-size="18" fill="#60657b">and portfolio</text><rect x="335" y="410" width="240" height="155" rx="22" fill="white" stroke="#e6c9cd" stroke-width="2"/><text x="365" y="462" font-size="22" font-weight="700" fill="#151d5a">DEALER</text><text x="365" y="503" font-size="18" fill="#60657b">Authorization</text><text x="365" y="533" font-size="18" fill="#60657b">and territory</text><rect x="600" y="410" width="240" height="155" rx="22" fill="white" stroke="#e6c9cd" stroke-width="2"/><text x="630" y="462" font-size="22" font-weight="700" fill="#151d5a">IMPORTER</text><text x="630" y="503" font-size="18" fill="#60657b">Compliance and</text><text x="630" y="533" font-size="18" fill="#60657b">market entry</text><rect x="865" y="410" width="265" height="155" rx="22" fill="white" stroke="#e6c9cd" stroke-width="2"/><text x="895" y="462" font-size="22" font-weight="700" fill="#151d5a">SERVICE PARTY</text><text x="895" y="503" font-size="18" fill="#60657b">Repair, parts</text><text x="895" y="533" font-size="18" fill="#60657b">and warranty</text></g><text x="70" y="625" font-family="Arial,sans-serif" font-size="18" fill="#60657b">Owner-managed does not disclose the exact family shareholding chain.</text></svg>
