<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GE Appliances manufacturing and model verification map</title>
  <desc id="desc">Examples of GE Appliances U.S. production locations lead to a model-level verification chain for factory, origin, importer and warranty.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#153849"/></linearGradient>
    <filter id="s2"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".22"/></filter>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef7a63"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="90" y="88" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="700">A U.S. factory network does not settle every model's origin</text>
  <text x="90" y="138" fill="#a9c7d5" font-family="Arial, sans-serif" font-size="24">Published sites show capability. Product documents establish responsibility.</text>

  <rect x="90" y="200" width="610" height="540" rx="28" fill="#f3f7f8" filter="url(#s2)"/>
  <text x="135" y="255" fill="#0d2d3d" font-family="Arial, sans-serif" font-size="30" font-weight="700">Selected U.S. manufacturing roles</text>
  <g font-family="Arial, sans-serif">
    <circle cx="150" cy="325" r="10" fill="#c74942"/><text x="180" y="334" fill="#173b4e" font-size="25" font-weight="700">Louisville, Kentucky</text><text x="180" y="368" fill="#496878" font-size="20">Laundry, dishwashing, refrigeration, components</text>
    <circle cx="150" cy="425" r="10" fill="#c74942"/><text x="180" y="434" fill="#173b4e" font-size="25" font-weight="700">Decatur, Alabama</text><text x="180" y="468" fill="#496878" font-size="20">Top-freezer refrigeration</text>
    <circle cx="150" cy="525" r="10" fill="#c74942"/><text x="180" y="534" fill="#173b4e" font-size="25" font-weight="700">LaFayette, Georgia</text><text x="180" y="568" fill="#496878" font-size="20">Ranges, cooktops and wall ovens</text>
    <circle cx="150" cy="625" r="10" fill="#c74942"/><text x="180" y="634" fill="#173b4e" font-size="25" font-weight="700">Selmer, Tennessee</text><text x="180" y="668" fill="#496878" font-size="20">Selected premium refrigeration and air products</text>
  </g>
  <text x="135" y="710" fill="#6a7f89" font-family="Arial, sans-serif" font-size="19">Other sites and assignments can change over time.</text>

  <path d="M725 470H790" stroke="#ef7a63" stroke-width="7" marker-end="url(#a2)"/>

  <rect x="820" y="200" width="690" height="540" rx="28" fill="#0e2c3d" stroke="#3a6172" stroke-width="2" filter="url(#s2)"/>
  <text x="865" y="255" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Verify the exact appliance</text>
  <g font-family="Arial, sans-serif">
    <rect x="865" y="300" width="600" height="66" rx="15" fill="#18465b"/><text x="900" y="341" fill="#e9f8fb" font-size="23"><tspan font-weight="700">1  Model and serial:</tspan> exact SKU and production range</text>
    <rect x="865" y="385" width="600" height="66" rx="15" fill="#18465b"/><text x="900" y="426" fill="#e9f8fb" font-size="23"><tspan font-weight="700">2  Factory evidence:</tspan> site making that model</text>
    <rect x="865" y="470" width="600" height="66" rx="15" fill="#18465b"/><text x="900" y="511" fill="#e9f8fb" font-size="23"><tspan font-weight="700">3  Origin marking:</tspan> unit and carton documentation</text>
    <rect x="865" y="555" width="600" height="66" rx="15" fill="#18465b"/><text x="900" y="596" fill="#e9f8fb" font-size="23"><tspan font-weight="700">4  Market entity:</tspan> seller, importer and signatory</text>
    <rect x="865" y="640" width="600" height="66" rx="15" fill="#18465b"/><text x="900" y="681" fill="#e9f8fb" font-size="23"><tspan font-weight="700">5  After-sales:</tspan> warranty and parts provider</text>
  </g>

  <rect x="90" y="790" width="1420" height="62" rx="18" fill="#c74942"/>
  <text x="800" y="830" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700">Parent-company nationality is not a country-of-origin certificate.</text>
</svg>
