<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Comac company and channel responsibility boundary</title><desc id="desc">Comac S.p.A. is distinct from the distributor, importer, seller and warranty provider.</desc>
  <rect width="1200" height="675" rx="36" fill="#f6f8fb"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#17202a">WHO DOES WHAT?</text><text x="70" y="125" font-family="Arial,sans-serif" font-size="22" fill="#52606d">Confirm the legal role behind every Comac order</text>
  <rect x="70" y="178" width="1060" height="145" rx="24" fill="#c8102e"/><text x="105" y="235" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">COMAC S.p.A.</text><text x="105" y="278" font-family="Arial,sans-serif" font-size="22" fill="white">Named Italian company and official product source</text>
  <path d="M600 323v62" stroke="#77838f" stroke-width="5"/><path d="M585 370l15 20 15-20" fill="none" stroke="#77838f" stroke-width="5"/>
  <g font-family="Arial,sans-serif"><rect x="70" y="410" width="240" height="155" rx="22" fill="white" stroke="#d5dae0" stroke-width="2"/><text x="100" y="462" font-size="22" font-weight="700" fill="#17202a">DISTRIBUTOR</text><text x="100" y="503" font-size="18" fill="#52606d">Authorization</text><text x="100" y="533" font-size="18" fill="#52606d">and territory</text><rect x="335" y="410" width="240" height="155" rx="22" fill="white" stroke="#d5dae0" stroke-width="2"/><text x="365" y="462" font-size="22" font-weight="700" fill="#17202a">IMPORTER</text><text x="365" y="503" font-size="18" fill="#52606d">Customs and</text><text x="365" y="533" font-size="18" fill="#52606d">market compliance</text><rect x="600" y="410" width="240" height="155" rx="22" fill="white" stroke="#d5dae0" stroke-width="2"/><text x="630" y="462" font-size="22" font-weight="700" fill="#17202a">SELLER</text><text x="630" y="503" font-size="18" fill="#52606d">Contract, price</text><text x="630" y="533" font-size="18" fill="#52606d">and delivery</text><rect x="865" y="410" width="265" height="155" rx="22" fill="white" stroke="#d5dae0" stroke-width="2"/><text x="895" y="462" font-size="22" font-weight="700" fill="#17202a">SERVICE PARTY</text><text x="895" y="503" font-size="18" fill="#52606d">Warranty, parts</text><text x="895" y="533" font-size="18" fill="#52606d">and response time</text></g>
  <text x="70" y="625" font-family="Arial,sans-serif" font-size="18" fill="#52606d">A shared brand does not make these responsibilities interchangeable.</text>
</svg>
