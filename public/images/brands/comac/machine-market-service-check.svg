<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Comac machine market and service check</title><desc id="desc">Four buyer checks for a Comac cleaning-machine project.</desc><rect width="1200" height="675" rx="36" fill="#1b2230"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="white">FROM MODEL NAME TO WORKING SYSTEM</text><text x="70" y="125" font-family="Arial,sans-serif" font-size="22" fill="#c9d1dc">Four checks before a Comac machine is accepted</text><g font-family="Arial,sans-serif"><rect x="70" y="180" width="505" height="160" rx="24" fill="#293346"/><circle cx="120" cy="230" r="25" fill="#c8102e"/><text x="112" y="239" font-size="24" font-weight="700" fill="white">1</text><text x="165" y="230" font-size="25" font-weight="700" fill="white">MODEL + CONFIGURATION</text><text x="165" y="271" font-size="19" fill="#c9d1dc">Battery, brushes, options, software</text><text x="165" y="302" font-size="19" fill="#c9d1dc">and destination-market version</text><rect x="625" y="180" width="505" height="160" rx="24" fill="#293346"/><circle cx="675" cy="230" r="25" fill="#c8102e"/><text x="667" y="239" font-size="24" font-weight="700" fill="white">2</text><text x="720" y="230" font-size="25" font-weight="700" fill="white">SITE PROOF</text><text x="720" y="271" font-size="19" fill="#c9d1dc">Real floors, traffic, obstacles</text><text x="720" y="302" font-size="19" fill="#c9d1dc">and measured productivity</text><rect x="70" y="380" width="505" height="160" rx="24" fill="#293346"/><circle cx="120" cy="430" r="25" fill="#c8102e"/><text x="112" y="439" font-size="24" font-weight="700" fill="white">3</text><text x="165" y="430" font-size="25" font-weight="700" fill="white">COMPLIANCE</text><text x="165" y="471" font-size="19" fill="#c9d1dc">Manufacturer plate, declaration,</text><text x="165" y="502" font-size="19" fill="#c9d1dc">manual and importer</text><rect x="625" y="380" width="505" height="160" rx="24" fill="#293346"/><circle cx="675" cy="430" r="25" fill="#c8102e"/><text x="667" y="439" font-size="24" font-weight="700" fill="white">4</text><text x="720" y="430" font-size="25" font-weight="700" fill="white">LIFECYCLE SUPPORT</text><text x="720" y="471" font-size="19" fill="#c9d1dc">Parts, technicians, uptime,</text><text x="720" y="502" font-size="19" fill="#c9d1dc">warranty and software terms</text></g><text x="70" y="615" font-family="Arial,sans-serif" font-size="20" fill="#c9d1dc">Buy the verified operating outcome, not only the machine badge.</text></svg>
