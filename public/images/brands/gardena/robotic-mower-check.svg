<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">GARDENA robotic mower buyer check</title><desc id="d">A buyer workflow for GARDENA smart robotic mowers.</desc><rect width="1200" height="720" rx="36" fill="#f1f8f8"/><text x="72" y="92" font-family="Arial" font-size="38" font-weight="700" fill="#073b46">Connected mower procurement has six checks</text><g font-family="Arial" font-size="22" font-weight="700"><rect x="72" y="165" width="320" height="145" rx="24" fill="#fff" stroke="#aad4d8"/><text x="106" y="225">Model and lawn area</text><rect x="440" y="165" width="320" height="145" rx="24" fill="#fff" stroke="#aad4d8"/><text x="474" y="225">Boundary system</text><rect x="808" y="165" width="320" height="145" rx="24" fill="#fff" stroke="#aad4d8"/><text x="842" y="225">App and account region</text><rect x="72" y="365" width="320" height="145" rx="24" fill="#fff" stroke="#aad4d8"/><text x="106" y="425">Factory and origin</text><rect x="440" y="365" width="320" height="145" rx="24" fill="#fff" stroke="#aad4d8"/><text x="474" y="425">Installer and service</text><rect x="808" y="365" width="320" height="145" rx="24" fill="#073b46"/><text x="842" y="425" fill="#fff">Warranty provider</text></g><text x="72" y="615" font-family="Arial" font-size="21" fill="#45636a">A division-level manufacturing statement is not a model-to-factory certificate.</text></svg>
