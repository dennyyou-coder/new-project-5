<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">GARDENA group, division and entity boundary</title><desc id="d">GARDENA is a brand and division within Husqvarna Group with market-specific legal entities.</desc><rect width="1200" height="720" rx="36" fill="#052d37"/><text x="72" y="92" font-family="Arial" font-size="38" font-weight="700" fill="#fff">Group, division, brand and seller are not interchangeable</text><g font-family="Arial"><rect x="72" y="170" width="245" height="160" rx="24" fill="#0b7385"/><text x="102" y="225" font-size="25" font-weight="700" fill="#fff">Husqvarna AB</text><text x="102" y="270" font-size="19" fill="#d9f4f6">Listed parent</text><rect x="340" y="170" width="245" height="160" rx="24" fill="#1596a8"/><text x="370" y="225" font-size="25" font-weight="700" fill="#fff">Gardena Division</text><text x="370" y="270" font-size="19" fill="#e8fbfc">Reporting segment</text><rect x="608" y="170" width="245" height="160" rx="24" fill="#19b5c7"/><text x="638" y="225" font-size="25" font-weight="700" fill="#052d37">GARDENA</text><text x="638" y="270" font-size="19" fill="#073a43">Consumer brand</text><rect x="876" y="170" width="252" height="160" rx="24" fill="#fff"/><text x="906" y="225" font-size="23" font-weight="700" fill="#052d37">Regional entity</text><text x="906" y="270" font-size="18" fill="#36545a">Seller / service scope</text></g><path d="M317 250h23M585 250h23M853 250h23" stroke="#fff" stroke-width="7"/><rect x="72" y="415" width="1056" height="190" rx="28" fill="#073b46"/><text x="110" y="474" font-family="Arial" font-size="25" font-weight="700" fill="#fff">Buyer action</text><text x="110" y="524" font-family="Arial" font-size="21" fill="#dff7f8">Match the exact model to its manufacturer, factory, importer, seller, app region and warranty entity.</text></svg>
