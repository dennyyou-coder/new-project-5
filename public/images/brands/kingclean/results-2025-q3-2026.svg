<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Kingclean results</title>
  <desc id="desc">Kingclean 2025 revenue CNY 9.87 billion up 1.05 percent, net profit CNY 799 million down 35.04 percent; Q3 2026 revenue CNY 2.41 billion down 4.73 percent, net profit CNY 92.1 million down 52.38 percent.</desc>
  <rect width="1600" height="900" fill="#f5f7fa"/>
  <text x="110" y="112" fill="#0e1526" font-family="Arial, sans-serif" font-size="52" font-weight="700">Currency losses hit profit</text>
  <text x="110" y="162" fill="#4a5367" font-family="Arial, sans-serif" font-size="25">Figures as reported. Profit is attributable net profit. Q3 = July–September 2026.</text>
  <rect x="110" y="225" width="322" height="250" rx="26" fill="#ffffff" stroke="#c9d0dc" stroke-width="3"/>
  <text x="150" y="285" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">2025 REVENUE</text>
  <text x="150" y="355" fill="#0e1526" font-family="Arial, sans-serif" font-size="48" font-weight="700">CNY 9.87 bn</text>
  <text x="150" y="405" fill="#067647" font-family="Arial, sans-serif" font-size="30" font-weight="700">+1.05%</text>
  <text x="150" y="445" fill="#4a5367" font-family="Arial, sans-serif" font-size="20">Full year 2025</text>
  <rect x="462" y="225" width="322" height="250" rx="26" fill="#ffffff" stroke="#c9d0dc" stroke-width="3"/>
  <text x="502" y="285" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">2025 NET PROFIT</text>
  <text x="502" y="355" fill="#0e1526" font-family="Arial, sans-serif" font-size="48" font-weight="700">CNY 799 m</text>
  <text x="502" y="405" fill="#b42318" font-family="Arial, sans-serif" font-size="30" font-weight="700">−35.04%</text>
  <text x="502" y="445" fill="#4a5367" font-family="Arial, sans-serif" font-size="20">Full year 2025</text>
  <rect x="814" y="225" width="322" height="250" rx="26" fill="#ffffff" stroke="#c9d0dc" stroke-width="3"/>
  <text x="854" y="285" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">Q3 2026 REVENUE</text>
  <text x="854" y="355" fill="#0e1526" font-family="Arial, sans-serif" font-size="48" font-weight="700">CNY 2.41 bn</text>
  <text x="854" y="405" fill="#b42318" font-family="Arial, sans-serif" font-size="30" font-weight="700">−4.73%</text>
  <text x="854" y="445" fill="#4a5367" font-family="Arial, sans-serif" font-size="20">Third quarter</text>
  <rect x="1166" y="225" width="322" height="250" rx="26" fill="#ffffff" stroke="#c9d0dc" stroke-width="3"/>
  <text x="1206" y="285" fill="#4a5367" font-family="Arial, sans-serif" font-size="22" font-weight="700">Q3 2026 NET PROFIT</text>
  <text x="1206" y="355" fill="#0e1526" font-family="Arial, sans-serif" font-size="48" font-weight="700">CNY 92.1 m</text>
  <text x="1206" y="405" fill="#b42318" font-family="Arial, sans-serif" font-size="30" font-weight="700">−52.38%</text>
  <text x="1206" y="445" fill="#4a5367" font-family="Arial, sans-serif" font-size="20">Third quarter</text>
  <text x="110" y="560" fill="#4a5367" font-family="Arial, sans-serif" font-size="22">First nine months of 2026: currency losses of CNY 510.5 million (CNY 55.8 million a year earlier) as the US dollar fell.</text>
  <text x="110" y="820" fill="#4a5367" font-family="Arial, sans-serif" font-size="22">Sources: Kingclean 2025 annual report; 2026 third-quarter report.</text>
</svg>
