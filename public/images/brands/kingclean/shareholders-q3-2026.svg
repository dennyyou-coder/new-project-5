<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Kingclean largest shareholders</title>
  <desc id="desc">Kingclean Electric Investment Group 35.86 percent, GOLDVAC TRADING LIMITED 27.42 percent, Ni Zugen 15.99 percent at 30 September 2026.</desc>
  <rect width="1600" height="900" fill="#f5f7fa"/>
  <text x="110" y="112" fill="#0e1526" font-family="Arial, sans-serif" font-size="52" font-weight="700">Who owns Kingclean</text>
  <text x="110" y="162" fill="#4a5367" font-family="Arial, sans-serif" font-size="25">Largest shareholders at 30 September 2026 (Kingclean third-quarter report). Actual controller: founder Ni Zugen.</text>
  <text x="110" y="260" fill="#0e1526" font-family="Arial, sans-serif" font-size="28" font-weight="700">Kingclean Electric Investment Group</text>
  <rect x="110" y="278" width="896" height="44" rx="10" fill="#2f5bd3"/>
  <text x="1026" y="312" fill="#0e1526" font-family="Arial, sans-serif" font-size="30" font-weight="700">35.86%<tspan font-size="22" font-weight="400" fill="#4a5367">  </tspan></text>
  <text x="110" y="385" fill="#0e1526" font-family="Arial, sans-serif" font-size="28" font-weight="700">GOLDVAC TRADING LIMITED</text>
  <rect x="110" y="403" width="685" height="44" rx="10" fill="#2f5bd3"/>
  <text x="815" y="437" fill="#0e1526" font-family="Arial, sans-serif" font-size="30" font-weight="700">27.42%<tspan font-size="22" font-weight="400" fill="#4a5367">  </tspan></text>
  <text x="110" y="510" fill="#0e1526" font-family="Arial, sans-serif" font-size="28" font-weight="700">Ni Zugen (founder)</text>
  <rect x="110" y="528" width="399" height="44" rx="10" fill="#2f5bd3"/>
  <text x="529" y="562" fill="#0e1526" font-family="Arial, sans-serif" font-size="30" font-weight="700">15.99%<tspan font-size="22" font-weight="400" fill="#4a5367">  </tspan></text>
  <text x="110" y="700" fill="#4a5367" font-family="Arial, sans-serif" font-size="22">Shanghai Stock Exchange: 603355. Founded in Suzhou in 1994.</text>
</svg>
