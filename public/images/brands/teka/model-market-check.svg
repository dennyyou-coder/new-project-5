<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Teka model and market verification</title><desc id="desc">A four-part buyer check for Teka product reference, factory evidence, destination entity and after-sales support.</desc><rect width="1600" height="900" fill="#f5f6f6"/><text x="110" y="115" fill="#262626" font-family="Arial,sans-serif" font-size="54" font-weight="700">Group scale must resolve to one SKU file</text><text x="110" y="170" fill="#6d6f70" font-family="Arial,sans-serif" font-size="25">Appliances · sinks · taps · small appliances require different evidence.</text><g font-family="Arial,sans-serif"><rect x="110" y="270" width="315" height="275" rx="28" fill="#d71920"/><text x="155" y="340" fill="#ffd8d9" font-size="21" font-weight="700">01 · PRODUCT</text><text x="155" y="405" fill="#fff" font-size="34" font-weight="700">Exact reference</text><text x="155" y="455" fill="#fff2f2" font-size="22">Full suffix · market</text><text x="155" y="490" fill="#fff2f2" font-size="22">installation class</text><rect x="465" y="270" width="315" height="275" rx="28" fill="#fff" stroke="#d71920" stroke-width="5"/><text x="510" y="340" fill="#b51016" font-size="21" font-weight="700">02 · FACTORY</text><text x="510" y="405" fill="#262626" font-size="34" font-weight="700">Production proof</text><text x="510" y="455" fill="#6d6f70" font-size="22">Maker · plant</text><text x="510" y="490" fill="#6d6f70" font-size="22">origin · declaration</text><rect x="820" y="270" width="315" height="275" rx="28" fill="#fff" stroke="#8c8d8e" stroke-width="5"/><text x="865" y="340" fill="#5f6061" font-size="21" font-weight="700">03 · MARKET</text><text x="865" y="405" fill="#262626" font-size="34" font-weight="700">Local entities</text><text x="865" y="455" fill="#6d6f70" font-size="22">Seller · importer</text><text x="865" y="490" fill="#6d6f70" font-size="22">invoice issuer</text><rect x="1175" y="270" width="315" height="275" rx="28" fill="#2f2f2f"/><text x="1220" y="340" fill="#ffc9cb" font-size="21" font-weight="700">04 · SUPPORT</text><text x="1220" y="405" fill="#fff" font-size="34" font-weight="700">Warranty route</text><text x="1220" y="455" fill="#e2e2e2" font-size="22">Parts · repair</text><text x="1220" y="490" fill="#e2e2e2" font-size="22">response time</text></g><rect x="110" y="630" width="1380" height="95" rx="24" fill="#e6e7e7"/><text x="800" y="690" fill="#262626" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700">For Russia-related supply, add a separate ownership and authorization review.</text><text x="1490" y="850" fill="#8b8c8d" text-anchor="end" font-family="Arial,sans-serif" font-size="18">World Clean Biz · reviewed 7 August 2026</text></svg>
