<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Midea acquisition scope for Teka</title><desc id="desc">Midea completed the acquisition of Teka Group in April 2025, expressly excluding Teka Rus LLC.</desc><rect width="1600" height="900" fill="#f8f5f2"/><text x="110" y="115" fill="#282522" font-family="Arial,sans-serif" font-size="54" font-weight="700">The 2025 transaction has an explicit boundary</text><text x="110" y="170" fill="#726c67" font-family="Arial,sans-serif" font-size="25">The acquired Teka Group perimeter does not include every similarly named entity.</text><rect x="110" y="265" width="1380" height="120" rx="28" fill="#d71920"/><text x="165" y="315" fill="#ffd8d9" font-family="Arial,sans-serif" font-size="22" font-weight="700">COMPLETED 30 APRIL 2025</text><text x="165" y="360" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">Midea Group acquires Teka Group</text><rect x="110" y="455" width="830" height="225" rx="28" fill="#fff" stroke="#d71920" stroke-width="5"/><text x="160" y="520" fill="#b51016" font-family="Arial,sans-serif" font-size="22" font-weight="700">INSIDE DISCLOSED PERIMETER</text><text x="160" y="580" fill="#282522" font-family="Arial,sans-serif" font-size="36" font-weight="700">Teka Group and acquired brand business</text><text x="160" y="630" fill="#726c67" font-family="Arial,sans-serif" font-size="22">Still verify the entity behind each local transaction.</text><rect x="995" y="455" width="495" height="225" rx="28" fill="#3a3633"/><text x="1045" y="520" fill="#ffc9cb" font-family="Arial,sans-serif" font-size="22" font-weight="700">EXPRESSLY EXCLUDED</text><text x="1045" y="580" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">Teka Rus LLC</text><text x="1045" y="630" fill="#ded8d3" font-family="Arial,sans-serif" font-size="22">Separate rights check required</text><text x="110" y="770" fill="#726c67" font-family="Arial,sans-serif" font-size="24">Acquisition scope does not by itself prove a model's trademark owner, factory, importer or warrantor.</text><text x="1490" y="850" fill="#8d8782" text-anchor="end" font-family="Arial,sans-serif" font-size="18">World Clean Biz · reviewed 7 August 2026</text></svg>
